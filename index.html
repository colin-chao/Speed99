            state.lastGroundLane = state.playerLane;
          }
          state.playerLane = PLAYER_LANE_CENTER;
        } else if (prevSpeed > 0) {
          const baseLane = state.playerLane !== PLAYER_LANE_CENTER ? state.playerLane : (state.lastGroundLane || PLAYER_LANE_RIGHT);
          state.playerLane = baseLane > 0 ? PLAYER_LANE_LEFT : PLAYER_LANE_RIGHT;
          state.lastGroundLane = state.playerLane;
        }
        resolveTrafficCar(true);

        qAnswerSlot.classList.add('correct');
        showSpeedDeltaFeedback(true);
        triggerBoostVisual();
        // 答對時：若由 0->25 播放發動聲；否則升頻至下一階固定頻率並持續發出排氣轟隆聲
        try {
          sound.shiftUpEngine(prevSpeed, state.targetSpeed);
        } catch (err) {
          console.error('[Speed99] shiftUp sound error:', err);
        }

        // 玩家答對加速的聲音，嚇到附近約 30 米內的路人，並讓 30 米內的腳踏車跌倒掉進山右邊的溝裡
        triggerBystanderReactionToAcceleration();

        setTimeout(() => {
          if (state.phase === 'RACING') {
            generateQuestion();
          }
        }, 120);
      }

      function handleWrongOrTimeout(isTimeout = false) {
        if (typeof clearHandwritingCanvas === 'function') {
          clearHandwritingCanvas();
        }
        state.inputLocked = true;
        state.wrongCount++;
        state.combo = 0;

        const prevSpeed = state.targetSpeed;
        const isAlreadyAtZero = prevSpeed <= 0;
        const wasFlying = prevSpeed >= 300 || state.hoverFactor > 0.35;
        state.targetSpeed = Math.max(BASE_MIN_SPEED, prevSpeed - SPEED_STEP);
        state.brakeTimer = 0.65;
        state.nitroTimer = 0;
        if (wasFlying) {
          state.airLeakTimer = 0.85;
        }

        // 答錯或超時：路人車加速往前衝，2 秒內消失在馬路遠方盡頭
        resolveTrafficCar(false);

        // 若原本在空中正中間，因扣速降至 300 以下而降落回地面，則回到前方路人車所在車道 (或原地面車道)
        if (state.targetSpeed < 300 && state.playerLane === PLAYER_LANE_CENTER) {
          const activeCar = state.trafficCars.find(
            (c) => c.mode === 'approach' || c.mode === 'rush_to_3_cars' || c.mode === 'escape_to_horizon'
          );
          state.playerLane =
            activeCar && activeCar.lane !== PLAYER_LANE_CENTER
              ? activeCar.lane
              : (state.lastGroundLane || PLAYER_LANE_RIGHT);
        }

        // 超時字樣不出現在題目欄位裡；僅在答錯時顯示玩家輸入的錯誤數字
        if (!isTimeout) {
          qAnswerSlot.textContent = state.currentInput;
        }
        qAnswerSlot.classList.add('wrong');

        if (isAlreadyAtZero) {
          // 速度降至 0 之後，答錯或超時不再顯示煞車痕、不顯示 -25 字樣、也不播放煞車音與引擎音，改顯示「請加油！」
          showCheerFeedback();
        } else if (wasFlying) {
          // 300 公里起飛後答錯或超時：不留地面煞車痕、不播輪胎煞車聲，改播噴氣漏氣聲並觸發周圍噴氣暫停漏氣動畫
          showSpeedDeltaFeedback(false);
          try {
            sound.playAirLeakSound(state.targetSpeed);
            sound.shiftDownEngine(prevSpeed, state.targetSpeed);
          } catch (err) {
            console.error('[Speed99] air leak/downshift sound error:', err);
          }
        } else {
          // 地面尚有車速時，答錯與超時皆在車子正上方顯示紅色震撼 -25 km/h、留下煞車痕、播放煞車音並伴隨引擎降頻聲 (降至 0 時停止排氣聲)
          showSpeedDeltaFeedback(false);
          spawnSkidMarks();
          try {
            sound.playBrakeWarning();
            sound.shiftDownEngine(prevSpeed, state.targetSpeed);
          } catch (err) {
            console.error('[Speed99] brake/downshift sound error:', err);
          }
        }

        triggerDamageVisual();

        setTimeout(() => {
          if (state.phase === 'RACING') {
            generateQuestion();
          }
        }, 190);
      }

      function handleDigitInput(digitStr) {
        if (state.phase !== 'RACING' || state.inputLocked) return;

        sound.playKeyClick(digitStr);
        state.currentInput += digitStr;
        qAnswerSlot.textContent = state.currentInput;

        const requiredDigits = state.expectedAnswer.length;
        if (state.currentInput.length >= requiredDigits) {
          if (state.currentInput === state.expectedAnswer) {
            handleCorrectAnswer();
          } else {
            handleWrongOrTimeout(false);
          }
        }
      }

      function handleClearInput() {
        if (state.phase !== 'RACING' || state.inputLocked) return;
        sound.playKeyClick(0);
        state.currentInput = '';
        qAnswerSlot.textContent = '?';
      }

      // ======================== 繪圖引擎 (100% 還原參考圖片之海岸夕陽與彎曲單車道) ========================

      // ======================== 海面上隨機遠景海鷗群 (優雅展翅、平滑淡入淡出、零破圖) ========================
      const seagulls = [
        { x: 0.08, y: 0.16, size: 16, vx: 0.015, vy: 0.002, flapSpeed: 4.8, flapPhase: 0.2, swayAmp: 0.008, swayFreq: 1.3 },
        { x: 0.16, y: 0.13, size: 13, vx: 0.018, vy: -0.0015, flapSpeed: 5.6, flapPhase: 1.8, swayAmp: 0.006, swayFreq: 1.6 },
        { x: 0.24, y: 0.19, size: 15, vx: 0.013, vy: 0.0025, flapSpeed: 4.4, flapPhase: 3.4, swayAmp: 0.009, swayFreq: 1.2 },
        { x: 0.05, y: 0.22, size: 18, vx: 0.017, vy: -0.002, flapSpeed: 4.2, flapPhase: 5.0, swayAmp: 0.010, swayFreq: 1.1 }
      ];

      // 繪製白色系海鷗（帶黑色翅膀末端與黃喙特徵，邊界平滑透明度淡入淡出，絕不切邊破圖）
      function drawSingleSeagull(x, y, size, flapPhase, tilt, alpha) {
        if (alpha <= 0.01) return;
        ctx.save();
        ctx.translate(x, y);
        if (tilt) ctx.rotate(tilt);
        ctx.globalAlpha = Math.max(0, Math.min(1, alpha));

        const w = size;
        const h = size * 0.44;
        const flap = Math.sin(flapPhase) * h * 0.42;

        // 海鳥羽翼色彩：兩端黑羽末端、中央純白身軀
        const birdGrad = ctx.createLinearGradient(-w * 0.5, 0, w * 0.5, 0);
        birdGrad.addColorStop(0.00, '#111317'); // 左翼尖黑
        birdGrad.addColorStop(0.16, '#181b22'); // 左翼尖黑收邊
        birdGrad.addColorStop(0.24, '#e2e8f0'); // 漸變過渡
        birdGrad.addColorStop(0.35, '#ffffff'); // 主翼純白
        birdGrad.addColorStop(0.50, '#ffffff'); // 軀幹純白
        birdGrad.addColorStop(0.65, '#ffffff'); // 主翼純白
        birdGrad.addColorStop(0.76, '#e2e8f0'); // 漸變過渡
        birdGrad.addColorStop(0.84, '#181b22'); // 右翼尖黑收邊
        birdGrad.addColorStop(1.00, '#111317'); // 右翼尖黑

        ctx.fillStyle = birdGrad;
        ctx.beginPath();
        // 中央頂部凹折起點
        ctx.moveTo(0, 0);

        // 左翼上緣：自中央經拱弧高峰延伸至左翼尖
        ctx.bezierCurveTo(-w * 0.18, -h * 0.72 - flap, -w * 0.38, -h * 0.52 - flap * 0.55, -w * 0.50, -flap * 0.2);
        // 左翼下緣：自左翼尖弧形收回至中央底部收尖
        ctx.bezierCurveTo(-w * 0.36, -h * 0.18 - flap * 0.25, -w * 0.16, h * 0.24, 0, h * 0.30);
        // 右翼下緣：自中央底部弧形延伸至右翼尖
        ctx.bezierCurveTo(w * 0.16, h * 0.24, w * 0.36, -h * 0.18 - flap * 0.25, w * 0.50, -flap * 0.2);
        // 右翼上緣：自右翼尖經拱弧高峰收回至中央頂部起點
        ctx.bezierCurveTo(w * 0.38, -h * 0.52 - flap * 0.55, w * 0.18, -h * 0.72 - flap, 0, 0);

        ctx.closePath();

        // 柔和微陰影，讓白色海鳥在金色夕陽或海面上都極清晰立體
        ctx.shadowColor = 'rgba(15, 20, 28, 0.42)';
        ctx.shadowBlur = 2.0;
        ctx.shadowOffsetY = 0.8;
        ctx.fill();

        // 纖細外緣輪廓
        ctx.shadowColor = 'transparent';
        ctx.strokeStyle = 'rgba(30, 38, 50, 0.40)';
        ctx.lineWidth = 0.5;
        ctx.stroke();

        // 中央微小海鳥黃喙特徵點
        ctx.fillStyle = '#f59e0b';
        ctx.beginPath();
        ctx.arc(0, -h * 0.08, Math.max(0.6, w * 0.032), 0, Math.PI * 2);
        ctx.fill();

        ctx.restore();
      }

      // 更新並繪製海面上空優雅翱翔的海鷗群 (飛於夕陽天空與海面上空，邊緣自動平滑淡入淡出)
      function updateAndDrawSeagulls(dt) {
        const effectiveDt = dt || 0.016;
        const nowSec = performance.now() * 0.001;

        for (let i = 0; i < seagulls.length; i++) {
          const bird = seagulls[i];
          bird.x += bird.vx * effectiveDt;
          bird.y += bird.vy * effectiveDt;
          bird.flapPhase += bird.flapSpeed * effectiveDt;

          // 翱翔時隨微風起伏與傾斜
          const swayY = Math.sin(nowSec * bird.swayFreq + bird.flapPhase * 0.5) * (ch * bird.swayAmp);
          const tilt = Math.cos(nowSec * bird.swayFreq + bird.flapPhase * 0.5) * 0.08;

          // 保持在左側夕陽天空範圍 (x: 0.02 ~ 0.32)
          if (bird.x > 0.32) {
            bird.x = 0.03;
            bird.y = 0.11 + Math.random() * 0.12;
            bird.size = 13 + Math.random() * 6;
          } else if (bird.x < 0.02) {
            bird.x = 0.31;
          }

          // 垂直活動高度保持在海面以上夕陽天空 (y: 0.10 ~ 0.24，不切入山壁或遮蔽路牌)
          if (bird.y < 0.10) bird.vy = Math.abs(bird.vy);
          if (bird.y > 0.23) bird.vy = -Math.abs(bird.vy);

          // 核心防破圖機制：左邊界與右邊界平滑透明度漸變，進入/離開時如霧般自然消隱，絕不被畫面邊界裁切！
          let alpha = 1.0;
          if (bird.x < 0.07) {
            alpha = Math.max(0, (bird.x - 0.03) / 0.04);
          } else if (bird.x > 0.26) {
            alpha = Math.max(0, (0.32 - bird.x) / 0.06);
          }

          const posX = bird.x * cw;
          const posY = bird.y * ch + swayY;

          drawSingleSeagull(posX, posY, bird.size, bird.flapPhase, tilt, alpha);
        }
      }

      // 1. 繪製夕陽天空、左側落日、海面波光倒影與右側翠綠立體海岸山脈
      function drawCoastalSunsetEnvironment(dt) {
        const horizonY = ch * 0.255;

        // (A) 夕陽暖橘紅至金黃漸層天空 (乾淨細緻，無破圖瑕疵)
        const skyGrad = ctx.createLinearGradient(0, 0, 0, horizonY);
        skyGrad.addColorStop(0.00, '#e35526');
        skyGrad.addColorStop(0.38, '#f07428');
        skyGrad.addColorStop(0.72, '#f79c34');
        skyGrad.addColorStop(1.00, '#fcc949');
        ctx.fillStyle = skyGrad;
        ctx.fillRect(0, 0, cw, horizonY + 2);

        // 自然柔和的夕陽晚霞水平雲帶 (完整保持在畫布內，左右平滑圓角收邊，絕不突刺貼邊)
        ctx.fillStyle = 'rgba(214, 75, 42, 0.36)';
        ctx.beginPath();
        ctx.ellipse(cw * 0.20, horizonY * 0.38, cw * 0.14, 3.8, 0, 0, Math.PI * 2);
        ctx.fill();

        ctx.fillStyle = 'rgba(222, 85, 45, 0.30)';
        ctx.beginPath();
        ctx.ellipse(cw * 0.62, horizonY * 0.46, cw * 0.18, 3.6, 0, 0, Math.PI * 2);
        ctx.fill();

        ctx.fillStyle = 'rgba(244, 145, 50, 0.32)';
        ctx.beginPath();
        ctx.ellipse(cw * 0.24, horizonY * 0.64, cw * 0.16, 3.2, 0, 0, Math.PI * 2);
        ctx.fill();

        ctx.beginPath();
        ctx.ellipse(cw * 0.56, horizonY * 0.58, cw * 0.15, 3.0, 0, 0, Math.PI * 2);
        ctx.fill();

        // (B) 左側海平線巨大橘紅落日半圓
        const sunX = cw * 0.215;
        const sunY = horizonY;
        const sunRadius = cw * 0.105;

        ctx.save();
        ctx.beginPath();
        ctx.rect(0, 0, cw, horizonY);
        ctx.clip();

        const sunGrad = ctx.createLinearGradient(sunX, sunY - sunRadius, sunX, sunY);
        sunGrad.addColorStop(0.0, '#f05a22');
        sunGrad.addColorStop(0.6, '#f57629');
        sunGrad.addColorStop(1.0, '#f99536');
        ctx.fillStyle = sunGrad;
        ctx.beginPath();
        ctx.arc(sunX, sunY, sunRadius, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();

        // (C) 左側深藍海洋與金色夕陽波光倒影 (重疊 1px 消除亞像素拼接縫隙)
        const seaGrad = ctx.createLinearGradient(0, horizonY - 1, cw * 0.55, ch);
        seaGrad.addColorStop(0.0, '#446380');
        seaGrad.addColorStop(0.45, '#3b5a78');
        seaGrad.addColorStop(1.0, '#2e4963');
        ctx.fillStyle = seaGrad;
        ctx.fillRect(0, horizonY - 1, cw, ch - horizonY + 2);

        // 海面金色鋸齒波光倒影 (v1.0 完美還原，隨時間微幅波光粼粼)
        const shimmerWave = Math.sin(performance.now() * 0.003) * 2.5;
        const reflectGrad = ctx.createLinearGradient(sunX, horizonY, sunX, horizonY + ch * 0.14);
        reflectGrad.addColorStop(0.0, '#fbbd47');
        reflectGrad.addColorStop(0.6, '#f69e3c');
        reflectGrad.addColorStop(1.0, 'rgba(246, 158, 60, 0)');
        ctx.fillStyle = reflectGrad;

        ctx.beginPath();
        const rTopY = horizonY + 1;
        ctx.moveTo(sunX - sunRadius * 0.95, rTopY);
        ctx.lineTo(sunX + sunRadius * 0.95, rTopY);
        ctx.lineTo(sunX + sunRadius * 0.55 + shimmerWave, rTopY + ch * 0.018);
        ctx.lineTo(sunX + sunRadius * 0.88 - shimmerWave, rTopY + ch * 0.032);
        ctx.lineTo(sunX + sunRadius * 0.42 + shimmerWave, rTopY + ch * 0.048);
        ctx.lineTo(sunX + sunRadius * 0.92 - shimmerWave, rTopY + ch * 0.064);
        ctx.lineTo(sunX + sunRadius * 0.18 + shimmerWave, rTopY + ch * 0.082);
        ctx.lineTo(sunX + sunRadius * 0.48, rTopY + ch * 0.098);
        ctx.lineTo(sunX - sunRadius * 0.25, rTopY + ch * 0.112);
        ctx.lineTo(sunX - sunRadius * 0.05, rTopY + ch * 0.085);
        ctx.lineTo(sunX - sunRadius * 0.82 - shimmerWave, rTopY + ch * 0.068);
        ctx.lineTo(sunX - sunRadius * 0.35 + shimmerWave, rTopY + ch * 0.050);
        ctx.lineTo(sunX - sunRadius * 0.92 + shimmerWave, rTopY + ch * 0.034);
        ctx.lineTo(sunX - sunRadius * 0.48 - shimmerWave, rTopY + ch * 0.018);
        ctx.closePath();
        ctx.fill();

        // 餘暉上的細膩海面白色微浪漣漪線條 (如水面微浪反光，自然靈動)
        ctx.save();
        ctx.strokeStyle = 'rgba(255, 255, 248, 0.75)';
        ctx.lineWidth = 1.2;
        ctx.lineCap = 'round';
        const nowMs = performance.now();
        const rippleLines = [
          { dy: ch * 0.018, w: sunRadius * 0.72, ox: 0.02 },
          { dy: ch * 0.033, w: sunRadius * 0.95, ox: -0.05 },
          { dy: ch * 0.050, w: sunRadius * 0.70, ox: 0.04 },
          { dy: ch * 0.067, w: sunRadius * 0.82, ox: -0.03 },
          { dy: ch * 0.084, w: sunRadius * 0.46, ox: 0.05 },
          { dy: ch * 0.100, w: sunRadius * 0.30, ox: -0.02 }
        ];
        rippleLines.forEach((rl, idx) => {
          const ry = rTopY + rl.dy;
          const rx = sunX + rl.ox * sunRadius + Math.sin(nowMs * 0.003 + idx * 1.8) * 1.8;
          const rw = rl.w;
          const rAlpha = 0.55 + 0.35 * Math.sin(nowMs * 0.004 + idx * 1.4);
          ctx.globalAlpha = Math.max(0, Math.min(1, rAlpha));
          ctx.beginPath();
          ctx.moveTo(rx - rw * 0.5, ry);
          ctx.quadraticCurveTo(rx, ry - 0.9, rx + rw * 0.5, ry);
          ctx.stroke();
        });
        ctx.restore();

        // 海面微細白色波浪線條 (精準落於開闊海面中央，不貼左緣邊線)
        ctx.strokeStyle = 'rgba(215, 232, 248, 0.38)';
        ctx.lineWidth = 1.3;
        const seaLines = [
          { x: 0.07, y: 0.35, len: 0.07 },
          { x: 0.06, y: 0.42, len: 0.09 },
          { x: 0.08, y: 0.50, len: 0.06 },
          { x: 0.17, y: 0.38, len: 0.06 }
        ];
        seaLines.forEach((wl) => {
          ctx.beginPath();
          ctx.moveTo(wl.x * cw, wl.y * ch);
          ctx.quadraticCurveTo((wl.x + wl.len * 0.5) * cw, (wl.y - 0.008) * ch, (wl.x + wl.len) * cw, wl.y * ch);
          ctx.stroke();
        });

        // (D) 海面上方夕陽天空遠景隨機翱翔海鷗群 (v1.0 完美復原，平滑羽翼、零切邊破圖)
        updateAndDrawSeagulls(dt);
      }

      // 2. 繪製海岸岩石、白色浪花、翠綠山坡與直線雙車道公路
      function drawWindingCoastalRoadAndCliffs() {
        const horizonY = ch * 0.255;
        const steps = 64;
        const leftPoints = [];
        const rightPoints = [];
        const centerPoints = [];

        for (let i = 0; i <= steps; i++) {
          const z = i / steps;
          const pLeft = projectRoad(z, -1);
          const pRight = projectRoad(z, 1);
          const pCenter = projectRoad(z, 0);
          leftPoints.push(pLeft);
          rightPoints.push(pRight);
          centerPoints.push(pCenter);
        }

        // (A) 公路左側：金黃色陽光沙灘與草坡路肩
        // 外側受夕陽照耀的亮金黃色沙灘灣岸 (隨車子前進而向後退)
        const outerBeachGrad = ctx.createLinearGradient(0, horizonY, cw * 0.45, ch);
        outerBeachGrad.addColorStop(0.0, '#fde078');
        outerBeachGrad.addColorStop(0.5, '#f6c453');
        outerBeachGrad.addColorStop(1.0, '#eab042');
        ctx.fillStyle = outerBeachGrad;
        ctx.beginPath();
        ctx.moveTo(leftPoints[0].x, horizonY);
        for (let i = 0; i <= steps; i++) {
          const z = i / steps;
          const p = leftPoints[i];
          const waveJut = Math.sin(z * 18 - state.roadScroll * 2.2) * (8 * p.scale);
          const beachWidth = (18 + 72 * Math.pow(z, 1.1)) + waveJut;
          ctx.lineTo(p.x - beachWidth - 5 * p.scale, p.y);
        }
        ctx.lineTo(leftPoints[steps].x, ch + 10);
        ctx.lineTo(leftPoints[0].x, horizonY);
        ctx.closePath();
        ctx.fill();

        // 內側暖金黃色沙灘坡面 (與外側亮金沙灘交織出自然海岸沙灘層次)
        const innerBeachGrad = ctx.createLinearGradient(cw * 0.15, horizonY, cw * 0.48, ch);
        innerBeachGrad.addColorStop(0.0, '#f4be52');
        innerBeachGrad.addColorStop(0.5, '#e8a93f');
        innerBeachGrad.addColorStop(1.0, '#d89632');
        ctx.fillStyle = innerBeachGrad;
        ctx.beginPath();
        ctx.moveTo(leftPoints[0].x, horizonY);
        for (let i = 0; i <= steps; i++) {
          const z = i / steps;
          const p = leftPoints[i];
          const rockJut = Math.sin(z * 14) * (8 * p.scale);
          const cliffWidth = (14 + 56 * Math.pow(z, 1.1)) + rockJut;
          ctx.lineTo(p.x - cliffWidth, p.y);
        }
        ctx.lineTo(leftPoints[steps].x, ch + 10);
        ctx.lineTo(leftPoints[0].x, horizonY);
        ctx.closePath();
        ctx.fill();

        // 左側翠綠草坡路肩 (緊貼直線公路左緣)
        ctx.fillStyle = '#569434';
        ctx.beginPath();
        ctx.moveTo(leftPoints[0].x, horizonY);
        for (let i = 0; i <= steps; i++) {
          const z = i / steps;
          const p = leftPoints[i];
          const grassW = 8 + 26 * Math.pow(z, 1.2);
          ctx.lineTo(p.x - grassW, p.y);
        }
        for (let i = steps; i >= 0; i--) {
          ctx.lineTo(leftPoints[i].x, leftPoints[i].y);
        }
        ctx.closePath();
        ctx.fill();

        // (B) 公路右側：高聳翠綠海岸山脈與陡峭山壁 (配合直線公路右側山形佈局)
        ctx.fillStyle = '#3d7927';
        ctx.beginPath();
        ctx.moveTo(rightPoints[0].x, horizonY);
        ctx.lineTo(cw * 0.58, horizonY * 0.78);
        ctx.lineTo(cw * 0.72, horizonY * 0.55);
        ctx.lineTo(cw * 0.86, horizonY * 0.28);
        ctx.lineTo(cw * 0.98, 0);
        ctx.lineTo(cw, 0);
        ctx.lineTo(cw, ch);
        ctx.lineTo(rightPoints[steps].x, ch);
        for (let i = steps; i >= 0; i--) {
          ctx.lineTo(rightPoints[i].x, rightPoints[i].y);
        }
        ctx.closePath();
        ctx.fill();

        // 山脈受光亮綠坡面與深綠背光稜線多邊形 (配合直線公路右側山形佈局)
        const ridgeFacets = [
          // 遠處海岬山脊亮面
          {
            color: '#5ca138',
            pts: [[0.515, 0.255], [0.58, 0.20], [0.65, 0.225], [0.58, 0.255]]
          },
          // 中景山脊亮面
          {
            color: '#4e8f30',
            pts: [[0.64, 0.225], [0.73, 0.14], [0.83, 0.185], [0.72, 0.29]]
          },
          // 右上主峰深綠背光陡坡
          {
            color: '#2a5a1a',
            pts: [[0.73, 0.14], [0.98, 0.0], [1.0, 0.0], [1.0, 0.42], [0.85, 0.33]]
          },
          // 右側中段受光亮綠山脊
          {
            color: '#529632',
            pts: [[0.82, 0.31], [1.0, 0.15], [1.0, 0.56], [0.88, 0.49]]
          },
          // 右側近景深綠峽谷陰影面
          {
            color: '#234c15',
            pts: [[0.84, 0.44], [1.0, 0.36], [1.0, 0.78], [0.91, 0.72]]
          },
          // 右下近景亮綠斜坡
          {
            color: '#4b8c2e',
            pts: [[0.90, 0.65], [1.0, 0.52], [1.0, 0.95], [0.96, 0.92]]
          }
        ];

        ridgeFacets.forEach((facet) => {
          ctx.fillStyle = facet.color;
          ctx.beginPath();
          facet.pts.forEach(([px, py], idx) => {
            if (idx === 0) ctx.moveTo(px * cw, py * ch);
            else ctx.lineTo(px * cw, py * ch);
          });
          ctx.closePath();
          ctx.fill();
        });

        // 右側緊貼公路的翠綠草坡路肩
        ctx.fillStyle = '#5ca138';
        ctx.beginPath();
        for (let i = 0; i <= steps; i++) {
          const p = rightPoints[i];
          if (i === 0) ctx.moveTo(p.x, p.y);
          else ctx.lineTo(p.x, p.y);
        }
        for (let i = steps; i >= 0; i--) {
          const z = i / steps;
          const p = rightPoints[i];
          const grassW = 6 + 22 * Math.pow(z, 1.2);
          ctx.lineTo(p.x + grassW, p.y);
        }
        ctx.closePath();
        ctx.fill();

        // 山腳右側邊溝 / 排水溝 (緊靠山壁與草坡之間，深凹陷水溝，腳踏車摔入之處)
        ctx.fillStyle = '#261e16';
        ctx.beginPath();
        for (let i = 0; i <= steps; i++) {
          const z = i / steps;
          const p = rightPoints[i];
          const grassW = 6 + 22 * Math.pow(z, 1.2);
          if (i === 0) ctx.moveTo(p.x + grassW, p.y);
          else ctx.lineTo(p.x + grassW, p.y);
        }
        for (let i = steps; i >= 0; i--) {
          const z = i / steps;
          const p = rightPoints[i];
          const ditchW = 10 + 38 * Math.pow(z, 1.2);
          ctx.lineTo(p.x + ditchW, p.y + 3 * p.scale);
        }
        ctx.closePath();
        ctx.fill();

        // 邊溝深處暗色邊界陰影
        ctx.strokeStyle = '#18120b';
        ctx.lineWidth = 1.6;
        ctx.beginPath();
        for (let i = 0; i <= steps; i++) {
          const z = i / steps;
          const p = rightPoints[i];
          const grassW = 6 + 22 * Math.pow(z, 1.2);
          if (i === 0) ctx.moveTo(p.x + grassW, p.y);
          else ctx.lineTo(p.x + grassW, p.y);
        }
        ctx.stroke();

        // (C) 繪製彎曲單車道柏油路面主體
        ctx.beginPath();
        for (let i = 0; i <= steps; i++) {
          const p = leftPoints[i];
          if (i === 0) ctx.moveTo(p.x, p.y);
          else ctx.lineTo(p.x, p.y);
        }
        for (let i = steps; i >= 0; i--) {
          const p = rightPoints[i];
          ctx.lineTo(p.x, p.y);
        }
        ctx.closePath();

        // 夕陽映照下的暖灰柏油路漸層 (左側受夕陽暖光，右側偏冷灰)
        const roadGrad = ctx.createLinearGradient(cw * 0.25, horizonY, cw * 0.75, ch);
        roadGrad.addColorStop(0.0, '#9e8d88');
        roadGrad.addColorStop(0.45, '#8a8589');
        roadGrad.addColorStop(1.0, '#757880');
        ctx.fillStyle = roadGrad;
        ctx.fill();

        // (D) 隨車速向後流動 (由遠方往畫面下方移動) 的路面橫向明暗速度帶與路肩反光柱
        for (let i = 0; i < steps; i++) {
          // 使用 i - state.roadScroll，使條紋隨 roadScroll 增加而往 i 變大處 (畫面下方) 移動，呈現馬路往後跑、車子往前衝的正確視覺！
          const scrollOffset = state.roadScroll * 18;
          const phase = Math.floor(((i - scrollOffset) % 2 + 2) % 2);

          if (phase === 0) {
            ctx.fillStyle = 'rgba(255, 245, 235, 0.055)';
            ctx.beginPath();
            ctx.moveTo(leftPoints[i].x, leftPoints[i].y);
            ctx.lineTo(rightPoints[i].x, rightPoints[i].y);
            ctx.lineTo(rightPoints[i + 1].x, rightPoints[i + 1].y);
            ctx.lineTo(leftPoints[i + 1].x, leftPoints[i + 1].y);
            ctx.closePath();
            ctx.fill();
          }

          // 路肩滾動反光柱 (同樣由遠方往畫面下方後退)
          const postPhase = Math.floor(((i - scrollOffset) % 4 + 4) % 4);
          if (postPhase === 0 && i >= 1) {
            const s = leftPoints[i].roadWidth / (cw * 0.728);
            const postW = Math.max(0.45, 4.5 * s);
            const postH = Math.max(1.0, 11 * s);
            ctx.fillStyle = '#f8fafc';
            ctx.fillRect(leftPoints[i].x - postW * 2.2, leftPoints[i].y - postH, postW, postH);
            ctx.fillRect(rightPoints[i].x + postW * 1.2, rightPoints[i].y - postH, postW, postH);
            ctx.fillStyle = '#fb923c';
            ctx.fillRect(leftPoints[i].x - postW * 2.2, leftPoints[i].y - postH, postW, postH * 0.35);
            ctx.fillRect(rightPoints[i].x + postW * 1.2, rightPoints[i].y - postH, postW, postH * 0.35);
          }
        }

        // 雙車道左右兩側白色實線路邊界
        [-0.92, 0.92].forEach((edgeOffset) => {
          ctx.beginPath();
          for (let i = 0; i <= steps; i++) {
            const z = i / steps;
            const p = projectRoad(z, edgeOffset);
            if (i === 0) ctx.moveTo(p.x, p.y);
            else ctx.lineTo(p.x, p.y);
          }
          ctx.strokeStyle = 'rgba(245, 248, 255, 0.92)';
          ctx.lineWidth = 2.4;
          ctx.stroke();
        });

        // 雙車道中央分道線 (經典 1 號公路暖金/純白分道虛線，隨車速向後流動，分隔左車道與右車道)
        for (let i = 1; i < steps; i++) {
          const scrollOffset = state.roadScroll * 18;
          const dashPhase = Math.floor(((i - scrollOffset) % 4 + 4) % 4);
          if (dashPhase < 2) {
            const p1 = projectRoad(i / steps, 0);
            const p2 = projectRoad((i + 1) / steps, 0);
            ctx.strokeStyle = '#fef08a';
            ctx.lineWidth = Math.max(1.6, 3.6 * p2.scale);
            ctx.beginPath();
            ctx.moveTo(p1.x, p1.y);
            ctx.lineTo(p2.x, p2.y);
            ctx.stroke();
          }
        }

        // (E) 繪製緊急煞車時的黑色輪胎煞車痕 (貼合右側車道車輛雙輪痕跡)
        for (const skid of state.skidMarks) {
          const skidLane = typeof skid.lane === 'number' ? skid.lane : PLAYER_LANE_RIGHT;
          const pStart = projectRoad(Math.max(0.02, skid.z - skid.length), skidLane);
          const pEnd = projectRoad(Math.min(1.0, skid.z), skidLane);
          const tireOffset1 = 38 * pStart.scale * 1.12;
          const tireOffset2 = 38 * pEnd.scale * 1.12;
          const tireW = Math.max(2, 5.5 * pEnd.scale);

          ctx.strokeStyle = `rgba(20, 22, 26, ${skid.alpha})`;
          ctx.lineWidth = tireW;
          [-1, 1].forEach((side) => {
            ctx.beginPath();
            ctx.moveTo(pStart.x + side * tireOffset1, pStart.y);
            ctx.lineTo(pEnd.x + side * tireOffset2, pEnd.y);
            ctx.stroke();
          });
        }

        // (F) 在靠海岸的路邊（左側草坡路肩），間隔固定距離繪製隨車速往後移動的棕櫚樹
        drawCoastalPalmTrees();

        // (G) 在馬路右側草坡隨機繪製 1 號公路經典盾牌路牌
        drawRoadSigns();

        // (H) 在靠海邊的路上隨機繪製路人走路/跑步
        drawCoastalPedestrians();

        // (I) 在馬路右邊繪製騎腳踏車的人 (畫面中隨時維持 2-4 台，有遠有近)
        drawRoadCyclists();

        // (J) 繪製腳踏車摔進水溝時揚起的小土霧顆粒
        drawDitchPuffs();
      }

      // 繪製靠海岸路邊的棕櫚樹列（由遠至近排列，與路面滾動完全同步）
      function getRoadsideObjectScale(z) {
        const clampedZ = Math.max(0.001, Math.min(1.05, z));
        return 0.068 + 0.932 * Math.pow(clampedZ, 1.18);
      }

      function drawCoastalPalmTrees() {
        const treeSpacing = 0.285;
        const totalSlots = 4;
        const cycleSpan = treeSpacing * totalSlots;
        const scrollZ = state.roadScroll * (18 / 64);
        const treeZList = [];

        for (let k = 0; k < totalSlots; k++) {
          const rawZ = (((k * treeSpacing + scrollZ) % cycleSpan) + cycleSpan) % cycleSpan;
          const z = 0.003 + rawZ;
          if (z <= 1.02) {
            treeZList.push({ z, seed: k });
          }
        }

        treeZList.sort((a, b) => a.z - b.z);

        for (const item of treeZList) {
          drawSinglePalmTree(item.z, item.seed);
        }
      }

      // ======================== 馬路右側腳踏車手 & 靠海邊路人 ========================

      // 繪製馬路右側騎腳踏車的人 (含正常行駛與嚇到跌倒掉進山邊水溝動畫)
      const CYCLIST_OUTFIT_PALETTE = [
        { shirt: '#ef4444', stripe: '#fef08a', shorts: '#1e293b', helmet: '#f8fafc' },
        { shirt: '#0284c7', stripe: '#38bdf8', shorts: '#0f172a', helmet: '#e0f2fe' },
        { shirt: '#10b981', stripe: '#ecfdf5', shorts: '#1f2937', helmet: '#34d399' },
        { shirt: '#f97316', stripe: '#fde047', shorts: '#27272a', helmet: '#ffedd5' },
        { shirt: '#8b5cf6', stripe: '#f472b6', shorts: '#1e1b4b', helmet: '#ede9fe' },
        { shirt: '#eab308', stripe: '#1e293b', shorts: '#18181b', helmet: '#fef08a' },
        { shirt: '#ec4899', stripe: '#ffffff', shorts: '#1f2937', helmet: '#fce7f3' },
        { shirt: '#06b6d4', stripe: '#fde047', shorts: '#0f172a', helmet: '#cffafe' },
        { shirt: '#3b524d', stripe: '#e2a58b', shorts: '#263632', helmet: '#42281a' }
      ];

      const JOGGER_OUTFIT_PALETTE = [
        { shirt: '#f43f5e', shorts: '#1e293b' },
        { shirt: '#3b82f6', shorts: '#f8fafc' },
        { shirt: '#10b981', shorts: '#1f2937' },
        { shirt: '#f59e0b', shorts: '#1e3a8a' },
        { shirt: '#a855f7', shorts: '#18181b' },
        { shirt: '#06b6d4', shorts: '#334155' },
        { shirt: '#ec4899', shorts: '#f1f5f9' },
        { shirt: '#84cc16', shorts: '#1e293b' }
      ];

      const COUPLE_OUTFIT_PALETTE = [
        { mShirt: '#2563eb', mPants: '#1e293b', fDress: '#f43f5e' },
        { mShirt: '#10b981', mPants: '#334155', fDress: '#fbbf24' },
        { mShirt: '#f97316', mPants: '#1f2937', fDress: '#38bdf8' },
        { mShirt: '#8b5cf6', mPants: '#18181b', fDress: '#f472b6' },
        { mShirt: '#ec4899', mPants: '#1e293b', fDress: '#a78bfa' },
        { mShirt: '#06b6d4', mPants: '#374151', fDress: '#fb7185' },
        { mShirt: '#eab308', mPants: '#27272a', fDress: '#34d399' },
        { mShirt: '#ef4444', mPants: '#1f2937', fDress: '#fde047' }
      ];

      function pickRandomCyclistStyle() {
        return CYCLIST_OUTFIT_PALETTE[Math.floor(Math.random() * CYCLIST_OUTFIT_PALETTE.length)];
      }

      function pickRandomPedestrianStyle(type) {
        if (type === 'jogger') {
          const st = JOGGER_OUTFIT_PALETTE[Math.floor(Math.random() * JOGGER_OUTFIT_PALETTE.length)];
          return { shirt: st.shirt, shorts: st.shorts };
        } else {
          const st = COUPLE_OUTFIT_PALETTE[Math.floor(Math.random() * COUPLE_OUTFIT_PALETTE.length)];
          return { mShirt: st.mShirt, mPants: st.mPants, fDress: st.fDress };
        }
      }

      function drawSingleCyclist(z, lateralOffset, pedalPhase, shirtColor, stripeColor, shortsColor, helmetColor, isFalling, fallAngle, ditchY, fallTimer) {
        if (z < 0.001 || z > 1.02) return;
        const proj = projectRoad(z, lateralOffset);
        const s = getRoadsideObjectScale(z) * 1.25;
        if (s < 0.015 || isNaN(proj.x) || isNaN(proj.y) || !isFinite(proj.x) || !isFinite(proj.y)) return;

        const groundX = proj.x;
        const groundY = proj.y + (ditchY || 0) * s;
        const h = 50 * s;
        const w = 21 * s;
        const legCycle = isFalling ? Math.sin((fallTimer || 0) * 28) : Math.sin(pedalPhase);

        ctx.save();
        ctx.translate(groundX, groundY);

        // 摔倒時整台車與騎士向右傾倒 (摔入山邊溝內)
        if (isFalling && fallAngle) {
          ctx.rotate(fallAngle);
        }

        // 1. 地面柔和陰影
        ctx.fillStyle = 'rgba(25, 38, 24, 0.42)';
        ctx.beginPath();
        ctx.ellipse(0, 0, w * 0.42, 2.4 * s, 0, 0, Math.PI * 2);
        ctx.fill();

        // 2. 腳踏車後輪
        const wheelR = 8.5 * s;
        ctx.fillStyle = '#181a1d';
        ctx.fillRect(-1.4 * s, -wheelR * 2, 2.8 * s, wheelR * 2);

        // 3. 車架後叉與座管
        ctx.strokeStyle = '#c4c8d0';
        ctx.lineWidth = Math.max(0.35, 1.8 * s);
        ctx.beginPath();
        ctx.moveTo(0, -wheelR);
        ctx.lineTo(0, -h * 0.44);
        ctx.stroke();

        // 車座墊
        ctx.fillStyle = '#1a1c20';
        ctx.fillRect(-3.2 * s, -h * 0.46, 6.4 * s, 2.2 * s);

        // 4. 車把手
        ctx.strokeStyle = '#22252a';
        ctx.lineWidth = Math.max(0.4, 2.2 * s);
        ctx.beginPath();
        ctx.moveTo(-w * 0.48, -h * 0.58);
        ctx.lineTo(w * 0.48, -h * 0.58);
        ctx.stroke();

        // 5. 雙腿 (隨踩踏週期交替踩動；摔倒時慌亂蹬腿)
        const leftLegY = -h * 0.42 + legCycle * (5.5 * s);
        const rightLegY = -h * 0.42 - legCycle * (5.5 * s);
        ctx.fillStyle = '#96603d'; // 曬黑健康膚色
        ctx.fillRect(-w * 0.28, leftLegY, 3.2 * s, 9.5 * s);
        ctx.fillRect(w * 0.14, rightLegY, 3.2 * s, 9.5 * s);

        // 短褲 (深墨綠/灰)
        ctx.fillStyle = shortsColor || '#263632';
        ctx.fillRect(-w * 0.32, -h * 0.46, w * 0.64, 8.5 * s);

        // 6. 軀幹背心 (深色主色)
        ctx.fillStyle = shirtColor || '#3b524d';
        ctx.fillRect(-w * 0.36, -h * 0.72, w * 0.72, 13 * s);

        // 參考圖特徵：背心上的亮色橫向條紋
        ctx.fillStyle = stripeColor || '#e2a58b';
        ctx.fillRect(-w * 0.36, -h * 0.66, w * 0.72, 3.2 * s);

        // 7. 手臂
        ctx.fillStyle = '#96603d';
        if (isFalling) {
          // 跌倒時單手慌亂揮舞
          ctx.fillRect(-w * 0.58, -h * 0.82, 3.5 * s, 9.5 * s);
          ctx.fillRect(w * 0.36, -h * 0.68, 3.5 * s, 9.5 * s);
        } else {
          ctx.fillRect(-w * 0.48, -h * 0.72, 3.5 * s, 9.5 * s);
          ctx.fillRect(w * 0.34, -h * 0.72, 3.5 * s, 9.5 * s);
        }

        // 8. 頭部與安全帽
        ctx.fillStyle = '#42281a';
        ctx.beginPath();
        ctx.arc(0, -h * 0.84, 5.0 * s, 0, Math.PI * 2);
        ctx.fill();
        if (helmetColor) {
          ctx.fillStyle = helmetColor;
          ctx.beginPath();
          ctx.arc(0, -h * 0.855, 5.2 * s, Math.PI, 0);
          ctx.fill();
        }

        // 9. 摔倒跌入水溝時的漫畫風驚嘆號與飛濺汗珠
        if (isFalling) {
          ctx.save();
          ctx.rotate(-(fallAngle || 0)); // 保持驚嘆符號水平
          ctx.fillStyle = '#fef08a';
          ctx.strokeStyle = '#dc2626';
          ctx.lineWidth = Math.max(1.2, 1.6 * s);
          ctx.beginPath();
          ctx.ellipse(w * 0.50, -h * 0.98, 7.5 * s, 9.5 * s, 0, 0, Math.PI * 2);
          ctx.fill();
          ctx.stroke();

          ctx.fillStyle = '#b91c1c';
          ctx.font = `900 ${Math.max(11, Math.round(12 * s))}px Arial, sans-serif`;
          ctx.textAlign = 'center';
          ctx.textBaseline = 'middle';
          ctx.fillText('!', w * 0.50, -h * 0.98);

          // 噴濺的小汗珠
          ctx.fillStyle = '#38bdf8';
          ctx.beginPath();
          ctx.arc(-w * 0.45, -h * 0.90, 2.5 * s, 0, Math.PI * 2);
          ctx.arc(w * 0.95, -h * 0.78, 2.2 * s, 0, Math.PI * 2);
          ctx.fill();
          ctx.restore();
        }

        ctx.restore();
      }

      function drawRoadCyclists() {
        if (!state.cyclists || state.cyclists.length === 0) return;
        const sorted = state.cyclists.slice().sort((a, b) => a.z - b.z);
        sorted.forEach(bike => {
          drawSingleCyclist(bike.z, bike.lateralOffset, bike.pedalPhase, bike.shirt, bike.stripe, bike.shorts, bike.helmet, bike.falling, bike.fallAngle, bike.ditchY, bike.fallTimer);
        });
      }

      // 繪製靠海邊路上跑步的人 (含被加速聲嚇到時驚跳與舉手姿勢)
      function drawSingleJogger(z, lateralOffset, stridePhase, scaredTimer, shirtColor, shortsColor) {
        if (z < 0.001 || z > 1.02) return;
        const pEdge = projectRoad(z, -1);
        const s = getRoadsideObjectScale(z) * 1.25;
        if (s < 0.015 || isNaN(pEdge.x) || isNaN(pEdge.y) || !isFinite(pEdge.x) || !isFinite(pEdge.y)) return;
        const extraOut = Math.max(0, (-lateralOffset - 1.0)) * (pEdge.roadWidth * 0.5);
        const proj = { x: pEdge.x - (5 + 14 * Math.pow(z, 1.15)) - extraOut * 0.65, y: pEdge.y };

        const isScared = (scaredTimer || 0) > 0;
        let jumpY = 0;
        let jitterX = 0;
        if (isScared) {
          const tHop = Math.min(1, (1.2 - scaredTimer) / 0.35);
          jumpY = -Math.sin(tHop * Math.PI) * 20 * s;
          jitterX = Math.sin(scaredTimer * 48) * 2.2 * s;
        }

        const groundX = proj.x + jitterX;
        const groundY = proj.y + jumpY;
        const h = 42 * s;
        const w = 14 * s;
        const stride = Math.sin(stridePhase);

        ctx.save();
        ctx.translate(groundX, groundY);

        ctx.fillStyle = 'rgba(30, 45, 20, 0.38)';
        ctx.beginPath();
        ctx.ellipse(0, 0, w * 0.5, 2.0 * s, 0, 0, Math.PI * 2);
        ctx.fill();

        ctx.fillStyle = '#8a5435';
        ctx.fillRect(-w * 0.25 - stride * 2.8 * s, -h * 0.45, 2.5 * s, 11 * s);
        ctx.fillRect(w * 0.10 + stride * 2.8 * s, -h * 0.45, 2.5 * s, 11 * s);

        ctx.fillStyle = shortsColor || '#2c3e3a';
        ctx.fillRect(-w * 0.32, -h * 0.48, w * 0.64, 6.5 * s);

        ctx.fillStyle = shirtColor || '#d06d44'; // 橘紅運動背心
        ctx.fillRect(-w * 0.34, -h * 0.76, w * 0.68, 11.5 * s);

        ctx.fillStyle = '#8a5435';
        if (isScared) {
          // 嚇到時雙手高舉投降狀！
          ctx.fillRect(-w * 0.52, -h * 1.02, 2.6 * s, 10.5 * s);
          ctx.fillRect(w * 0.36, -h * 1.02, 2.6 * s, 10.5 * s);
        } else {
          ctx.fillRect(-w * 0.46 + stride * 2.8 * s, -h * 0.74, 2.5 * s, 7.5 * s);
          ctx.fillRect(w * 0.32 - stride * 2.8 * s, -h * 0.74, 2.5 * s, 7.5 * s);
        }

        ctx.fillStyle = '#322018';
        ctx.beginPath();
        ctx.arc(0, -h * 0.88, 4.0 * s, 0, Math.PI * 2);
        ctx.fill();

        // 嚇到時跳出亮黃色驚嘆號氣泡與藍色汗滴
        if (isScared) {
          ctx.fillStyle = '#fef08a';
          ctx.strokeStyle = '#ea580c';
          ctx.lineWidth = Math.max(1.2, 1.5 * s);
          ctx.beginPath();
          ctx.ellipse(w * 0.40, -h * 1.10, 6.5 * s, 8.5 * s, 0, 0, Math.PI * 2);
          ctx.fill();
          ctx.stroke();

          ctx.fillStyle = '#c2410c';
          ctx.font = `900 ${Math.max(10, Math.round(11 * s))}px Arial, sans-serif`;
          ctx.textAlign = 'center';
          ctx.textBaseline = 'middle';
          ctx.fillText('!', w * 0.40, -h * 1.10);

          ctx.fillStyle = '#38bdf8';
          ctx.beginPath();
          ctx.arc(-w * 0.52, -h * 0.96, 2.2 * s, 0, Math.PI * 2);
          ctx.fill();
        }

        ctx.restore();
      }

      // 繪製靠海邊散步的行人/情侶 (含被加速聲嚇到時雙人驚嚇反應)
      function drawSingleCouple(z, lateralOffset, walkPhase, scaredTimer, mShirtColor, mPantsColor, fDressColor) {
        if (z < 0.001 || z > 1.02) return;
        const pEdge = projectRoad(z, -1);
        const s = getRoadsideObjectScale(z) * 1.25;
        if (s < 0.015 || isNaN(pEdge.x) || isNaN(pEdge.y) || !isFinite(pEdge.x) || !isFinite(pEdge.y)) return;
        const extraOut = Math.max(0, (-lateralOffset - 1.0)) * (pEdge.roadWidth * 0.5);
        const proj = { x: pEdge.x - (6 + 15 * Math.pow(z, 1.15)) - extraOut * 0.65, y: pEdge.y };

        const isScared = (scaredTimer || 0) > 0;
        let jumpY = 0;
        let jitterX = 0;
        if (isScared) {
          const tHop = Math.min(1, (1.2 - scaredTimer) / 0.38);
          jumpY = -Math.sin(tHop * Math.PI) * 17 * s;
          jitterX = Math.sin(scaredTimer * 44) * 2.0 * s;
        }

        const groundX = proj.x + jitterX;
        const groundY = proj.y + jumpY;
        const h = 40 * s;
        const w = 24 * s;

        ctx.save();
        ctx.translate(groundX, groundY);

        ctx.fillStyle = 'rgba(30, 45, 20, 0.38)';
        ctx.beginPath();
        ctx.ellipse(0, 0, w * 0.6, 2.2 * s, 0, 0, Math.PI * 2);
        ctx.fill();

        // 男生 (左)
        const stepSwing = Math.sin(walkPhase || 0) * 1.6 * s;
        const mX = -w * 0.26;
        ctx.fillStyle = mPantsColor || '#282422';
        ctx.fillRect(mX - 2.5 * s, -h * 0.46 + stepSwing, 2.4 * s, 10.5 * s);
        ctx.fillRect(mX + 0.5 * s, -h * 0.46 - stepSwing, 2.4 * s, 10.5 * s);

        ctx.fillStyle = mShirtColor || '#3a2b22';
        ctx.fillRect(mX - 3.8 * s, -h * 0.78, 7.6 * s, 12.5 * s);

        ctx.fillStyle = '#261b15';
        ctx.beginPath();
        ctx.arc(mX, -h * 0.88, 3.8 * s, 0, Math.PI * 2);
        ctx.fill();

        // 女生 (右，洋裝)
        const fX = w * 0.24;
        ctx.fillStyle = '#9e684a';
        ctx.fillRect(fX - 2.0 * s, -h * 0.38 - stepSwing * 0.8, 2.0 * s, 8.5 * s);
        ctx.fillRect(fX + 0.5 * s, -h * 0.38 + stepSwing * 0.8, 2.0 * s, 8.5 * s);

        ctx.fillStyle = fDressColor || '#d48f68';
        ctx.beginPath();
        ctx.moveTo(fX, -h * 0.74);
        ctx.lineTo(fX + 3.8 * s, -h * 0.42);
        ctx.lineTo(fX - 3.8 * s, -h * 0.42);
        ctx.closePath();
        ctx.fill();

        ctx.fillStyle = '#221814';
        ctx.beginPath();
        ctx.arc(fX, -h * 0.85, 3.6 * s, 0, Math.PI * 2);
        ctx.fill();
        ctx.fillRect(fX - 2.8 * s, -h * 0.85, 5.6 * s, 5.5 * s);

        // 嚇到時兩人頭頂跳出驚嘆號與汗滴！
        if (isScared) {
          ctx.fillStyle = '#fef08a';
          ctx.strokeStyle = '#ea580c';
          ctx.lineWidth = Math.max(1.2, 1.5 * s);

          ctx.beginPath();
          ctx.ellipse(mX, -h * 1.10, 5.8 * s, 7.5 * s, 0, 0, Math.PI * 2);
          ctx.fill();
          ctx.stroke();

          ctx.beginPath();
          ctx.ellipse(fX, -h * 1.08, 5.8 * s, 7.5 * s, 0, 0, Math.PI * 2);
          ctx.fill();
          ctx.stroke();

          ctx.fillStyle = '#c2410c';
          ctx.font = `900 ${Math.max(9, Math.round(10 * s))}px Arial, sans-serif`;
          ctx.textAlign = 'center';
          ctx.textBaseline = 'middle';
          ctx.fillText('!', mX, -h * 1.10);
          ctx.fillText('!', fX, -h * 1.08);

          ctx.fillStyle = '#38bdf8';
          ctx.beginPath();
          ctx.arc(mX - 5.5 * s, -h * 0.98, 2.0 * s, 0, Math.PI * 2);
          ctx.arc(fX + 5.5 * s, -h * 0.96, 2.0 * s, 0, Math.PI * 2);
          ctx.fill();
        }

        ctx.restore();
      }

      function drawCoastalPedestrians() {
        if (!state.pedestrians || state.pedestrians.length === 0) return;
        const sorted = state.pedestrians.slice().sort((a, b) => a.z - b.z);
        sorted.forEach(ped => {
          if (ped.type === 'jogger') {
            drawSingleJogger(ped.z, ped.lateralOffset, ped.walkPhase, ped.scaredTimer, ped.shirt, ped.shorts);
          } else {
            drawSingleCouple(ped.z, ped.lateralOffset, ped.walkPhase, ped.scaredTimer, ped.mShirt, ped.mPants, ped.fDress);
          }
        });
      }

      // 玩家答對加速時觸發：嚇到 30 米內的路人，並讓 30 米內的腳踏車跌倒掉進山右邊的溝裡
      function triggerBystanderReactionToAcceleration() {
        const NEAR_DIST = 0.26; // PLAYER_Z = 0.72，深度差約 0.26 相當於約 30 米視覺距離
        let scaredPedCount = 0;
        let crashedBikeCount = 0;

        // 1. 嚇到 30 米內路人
        if (state.pedestrians && state.pedestrians.length > 0) {
          state.pedestrians.forEach(ped => {
            if (Math.abs(ped.z - PLAYER_Z) <= NEAR_DIST) {
              ped.scaredTimer = 1.2;
              scaredPedCount++;
            }
          });
        }

        // 2. 讓 30 米內的腳踏車跌倒，向右滑落掉進山腳溝裡
        if (state.cyclists && state.cyclists.length > 0) {
          state.cyclists.forEach(bike => {
            if (Math.abs(bike.z - PLAYER_Z) <= NEAR_DIST) {
              if (!bike.falling) {
                bike.falling = true;
                bike.fallTimer = 0;
                bike.startOffset = bike.lateralOffset;
                bike.targetOffset = 1.48; // 滑入山邊排水溝深度
                bike.hitDitch = false;
                crashedBikeCount++;
              }
            }
          });
        }

        // 視覺動畫維持觸發，不播放音效
      }

      // 產生腳踏車摔進水溝時的小土塵顆粒
      function spawnDitchDust(z, lateralOffset) {
        if (!state.ditchPuffs) state.ditchPuffs = [];
        for (let i = 0; i < 6; i++) {
          state.ditchPuffs.push({
            z: z,
            lateralOffset: lateralOffset + (Math.random() - 0.5) * 0.10,
            yOffset: -Math.random() * 6,
            vy: -12 - Math.random() * 18,
            r: 4.5 + Math.random() * 6.5,
            life: 0.55,
            maxLife: 0.55
          });
        }
      }

      // 繪製水溝土塵顆粒
      function drawDitchPuffs() {
        if (!state.ditchPuffs || state.ditchPuffs.length === 0) return;
        for (let i = 0; i < state.ditchPuffs.length; i++) {
          const p = state.ditchPuffs[i];
          if (p.z > 1.02) continue;
          const proj = projectRoad(p.z, p.lateralOffset);
          const s = proj.scale;
          if (s < 0.08 || isNaN(proj.x) || isNaN(proj.y)) continue;
          const alpha = (p.life / p.maxLife) * 0.55;
          ctx.save();
          ctx.fillStyle = 'rgba(125, 95, 70, ' + alpha + ')';
          ctx.beginPath();
          ctx.arc(proj.x, proj.y + p.yOffset * s, p.r * s, 0, Math.PI * 2);
          ctx.fill();
          ctx.restore();
        }
      }

      function initCyclists() {
        const zList = [0.015, 0.36, 0.72];
        const offsets = [1.02, 1.05, 0.99];
        const phases = [0.5, 2.1, 4.3];
        const shuffled = CYCLIST_OUTFIT_PALETTE.slice().sort(() => Math.random() - 0.5);
        state.cyclists = zList.map((z, idx) => {
          const st = shuffled[idx % shuffled.length];
          return {
            z,
            lateralOffset: offsets[idx],
            pedalPhase: phases[idx],
            shirt: st.shirt,
            stripe: st.stripe,
            shorts: st.shorts,
            helmet: st.helmet
          };
        });
      }

      function initPedestrians() {
        const count = 6;
        state.pedestrians = [];
        const shuffledJoggers = JOGGER_OUTFIT_PALETTE.slice().sort(() => Math.random() - 0.5);
        const shuffledCouples = COUPLE_OUTFIT_PALETTE.slice().sort(() => Math.random() - 0.5);
        for (let i = 0; i < count; i++) {
          const isJogger = (i % 2 === 0);
          const type = isJogger ? 'jogger' : 'couple';
          const jSt = shuffledJoggers[i % shuffledJoggers.length];
          const cSt = shuffledCouples[i % shuffledCouples.length];
          state.pedestrians.push({
            z: 0.012 + (i / count) * 0.95 + Math.random() * 0.02,
            lateralOffset: -1.22 - Math.random() * 0.12,
            type,
            walkPhase: Math.random() * Math.PI * 2,
            shirt: jSt.shirt,
            shorts: jSt.shorts,
            mShirt: cSt.mShirt,
            mPants: cSt.mPants,
            fDress: cSt.fDress
          });
        }
      }

      function initRoadSigns() {
        state.roadSigns = [
          { z: 0.28, lateralOffset: 1.24, number: 1 }
        ];
        state.distSinceLastSign = 0.28 * (64 / 18);
        state.nextSignDistance = 7.11;
      }

      function drawSingleRoadSign(z, lateralOffset, number) {
        if (z < 0.001 || z > 1.02) return;
        const pRight = projectRoad(z, 1);
        const s = getRoadsideObjectScale(z);
        if (s < 0.015 || isNaN(pRight.x) || isNaN(pRight.y) || !isFinite(pRight.x) || !isFinite(pRight.y)) return;

        const grassOffset = (4.5 + 16 * Math.pow(z, 1.18)) + Math.max(0, lateralOffset - 1.20) * (pRight.roadWidth * 0.35);
        const groundX = pRight.x + grassOffset;
        const groundY = pRight.y;

        const signW = 34 * s;
        const signH = 38 * s;
        const postW = Math.max(0.4, 4.4 * s);
        const postH = 50 * s;
        const shieldCenterY = groundY - postH - signH * 0.42;

        ctx.save();

        // 1. 地面右下方低多邊形斜向陰影 (如參考圖)
        ctx.save();
        ctx.fillStyle = 'rgba(20, 42, 24, 0.45)';
        ctx.beginPath();
        ctx.moveTo(groundX - postW * 0.5, groundY);
        ctx.lineTo(groundX + postW * 0.5, groundY);
        ctx.lineTo(groundX + postW * 0.5 + postH * 0.45, groundY + postH * 0.38);
        ctx.lineTo(groundX - postW * 0.5 + postH * 0.45, groundY + postH * 0.38);
        ctx.closePath();
        ctx.fill();
        ctx.restore();

        // 2. 木質立桿 (左右分色立體光影)
        ctx.fillStyle = '#4a3321';
        ctx.fillRect(groundX - postW * 0.5, groundY - postH, postW * 0.5, postH);
        ctx.fillStyle = '#322013';
        ctx.fillRect(groundX, groundY - postH, postW * 0.5, postH);

        // 3. 鏟形/加州 1 號公路經典綠色盾牌
        ctx.save();
        ctx.translate(groundX, shieldCenterY);

        function buildShieldPath(ctx, w, h) {
          ctx.beginPath();
          // 頂端微尖 (鏟形頂點)
          ctx.moveTo(0, -h * 0.5);
          // 右側拱肩
          ctx.bezierCurveTo(w * 0.28, -h * 0.44, w * 0.50, -h * 0.18, w * 0.50, h * 0.12);
          // 右下圓弧
          ctx.bezierCurveTo(w * 0.50, h * 0.38, w * 0.28, h * 0.48, 0, h * 0.44);
          // 左下圓弧
          ctx.bezierCurveTo(-w * 0.28, h * 0.48, -w * 0.50, h * 0.38, -w * 0.50, h * 0.12);
          // 左側拱肩回到頂點
          ctx.bezierCurveTo(-w * 0.50, -h * 0.18, -w * 0.28, -h * 0.44, 0, -h * 0.5);
          ctx.closePath();
        }

        // (A) 填滿公路經典森林綠 (左側向光亮綠 #3c754d、右側背光暗綠 #285434，還原參考圖立體稜角)
        ctx.save();
        buildShieldPath(ctx, signW, signH);
        ctx.clip();
        ctx.fillStyle = '#3c754d';
        ctx.fillRect(-signW, -signH, signW, signH * 2);
        ctx.fillStyle = '#285434';
        ctx.fillRect(0, -signH, signW, signH * 2);
        ctx.restore();

        // (B) 厚實純白圓角外框
        buildShieldPath(ctx, signW, signH);
        ctx.strokeStyle = '#ffffff';
        ctx.lineWidth = Math.max(0.4, 3.2 * s);
        ctx.lineJoin = 'round';
        ctx.stroke();

        const fontSize = Math.max(1.8, 22 * s);
        ctx.font = `900 ${fontSize}px 'Arial Black', 'Impact', sans-serif`;
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillStyle = '#ffffff';
        ctx.fillText(String(number || 1), 0, signH * 0.02);

        ctx.restore();
        ctx.restore();
      }

      function drawRoadSigns() {
        if (!state.roadSigns || state.roadSigns.length === 0) return;
        const sortedSigns = state.roadSigns.slice().sort((a, b) => a.z - b.z);
        sortedSigns.forEach(sign => {
          drawSingleRoadSign(sign.z, sign.lateralOffset, sign.number);
        });
      }

      function drawSinglePalmTree(z, seed) {
        if (z < 0.001 || z > 1.02) return;
        const pLeft = projectRoad(z, -1);
        const s = getRoadsideObjectScale(z);
        if (s < 0.015 || isNaN(pLeft.x) || isNaN(pLeft.y) || !isFinite(pLeft.x) || !isFinite(pLeft.y)) return;

        const grassOffset = 4.5 + 22 * Math.pow(z, 1.18);
        const baseX = pLeft.x - grassOffset;
        const baseY = pLeft.y + 2 * s;

        const trunkH = 118 * s;
        const trunkBaseW = 9.5 * s;
        const trunkTopW = 4.2 * s;

        // 樹幹自然向海風微彎的頂點座標
        const leanX = -14 * s + Math.sin(seed * 2.1) * 4 * s;
        const crownX = baseX + leanX;
        const crownY = baseY - trunkH;
        const ctrlX = baseX + leanX * 0.35;
        const ctrlY = baseY - trunkH * 0.52;

        ctx.save();

        // 1. 夕陽照射在路肩草坡上的棕櫚樹斜長暗影
        ctx.fillStyle = 'rgba(28, 48, 18, 0.38)';
        ctx.beginPath();
        ctx.ellipse(baseX + 12 * s, baseY + 2 * s, 16 * s, 4.5 * s, 0.15, 0, Math.PI * 2);
        ctx.fill();

        // 2. 彎曲棕櫚樹幹 (左側帶夕陽暖金亮邊，右側深棕立體陰影)
        ctx.beginPath();
        ctx.moveTo(baseX - trunkBaseW * 0.5, baseY);
        ctx.quadraticCurveTo(ctrlX - trunkTopW * 0.7, ctrlY, crownX - trunkTopW * 0.5, crownY);
        ctx.lineTo(crownX + trunkTopW * 0.5, crownY);
        ctx.quadraticCurveTo(ctrlX + trunkTopW * 0.7, ctrlY, baseX + trunkBaseW * 0.5, baseY);
        ctx.closePath();

        const trunkGrad = ctx.createLinearGradient(baseX - trunkBaseW, crownY, baseX + trunkBaseW, baseY);
        trunkGrad.addColorStop(0, '#d98a4e'); // 左側夕陽金棕受光面
        trunkGrad.addColorStop(0.45, '#8c5332');
        trunkGrad.addColorStop(1, '#4a2a18'); // 右側背光深褐
        ctx.fillStyle = trunkGrad;
        ctx.fill();

        // 樹幹環狀紋理節點
        ctx.strokeStyle = 'rgba(42, 22, 10, 0.45)';
        ctx.lineWidth = Math.max(0.25, 1.4 * s);
        for (let t = 0.15; t <= 0.88; t += 0.14) {
          const mt = 1 - t;
          const tx = mt * mt * baseX + 2 * mt * t * ctrlX + t * t * crownX;
          const ty = mt * mt * baseY + 2 * mt * t * ctrlY + t * t * crownY;
          const tw = (trunkBaseW * mt + trunkTopW * t) * 0.52;
          ctx.beginPath();
          ctx.moveTo(tx - tw, ty);
          ctx.lineTo(tx + tw, ty + 1.2 * s);
          ctx.stroke();
        }

        // 3. 樹冠頂部椰子果實
        ctx.fillStyle = '#4e2e16';
        [-3.2 * s, 2.5 * s, 0].forEach((ox, idx) => {
          ctx.beginPath();
          ctx.arc(crownX + ox, crownY + (2 + idx * 1.2) * s, 3.2 * s, 0, Math.PI * 2);
          ctx.fill();
        });

        // 4. 放射狀熱帶羽狀棕櫚葉 (7 片展開的弧形大葉片，受夕陽暖綠光澤映照)
        const fronds = [
          { angle: -2.65, len: 52, drop: 18, color: '#4d9129' },
          { angle: -2.15, len: 58, drop: 14, color: '#68ab38' },
          { angle: -1.55, len: 48, drop: 10, color: '#7bc043' },
          { angle: -0.85, len: 54, drop: 13, color: '#589c2f' },
          { angle: -0.25, len: 58, drop: 17, color: '#3b7520' },
          { angle:  0.28, len: 46, drop: 22, color: '#2d5e17' },
          { angle: -3.05, len: 44, drop: 24, color: '#3f7c22' }
        ];

        fronds.forEach((f) => {
          const rad = f.angle;
          const endX = crownX + Math.cos(rad) * f.len * s;
          const endY = crownY + Math.sin(rad) * f.len * 0.65 * s + f.drop * s;
          const midX = crownX + Math.cos(rad) * f.len * 0.52 * s;
          const midY = crownY + Math.sin(rad) * f.len * 0.42 * s - 9 * s;

          // 棕櫚葉受光羽片面
          ctx.fillStyle = f.color;
          ctx.beginPath();
          ctx.moveTo(crownX, crownY);
          ctx.quadraticCurveTo(midX, midY - 7 * s, endX, endY);
          ctx.quadraticCurveTo(midX, midY + 6 * s, crownX, crownY + 2 * s);
          ctx.closePath();
          ctx.fill();

          // 葉脈亮邊
          ctx.strokeStyle = 'rgba(210, 235, 130, 0.45)';
          ctx.lineWidth = Math.max(0.25, 1.3 * s);
          ctx.beginPath();
          ctx.moveTo(crownX, crownY);
          ctx.quadraticCurveTo(midX, midY - 1 * s, endX, endY);
          ctx.stroke();
        });

        ctx.restore();
      }

      // 繪製時速 >= 300 時車底 6 處噴射出的高壓濃密白煙（完全還原參考圖片：車身中段左右斜噴、後輪拱左右斜噴、車尾底部雙管直噴）
      // 當 state.airLeakTimer > 0 (空中答錯/超時) 時，原本穩定的噴射氣流暫停並呈現斷續漏氣噴散動畫
      function drawUnderbodyHoverWhiteSmoke(w, h, s, hoverAlpha) {
        if (hoverAlpha <= 0.01 && state.airLeakTimer <= 0.01) return;
        const nowSec = performance.now() * 0.001;

        // 定義與參考圖片完全對應的 6 組車底白煙噴嘴
        const nozzles = [
          // 1. 左、右車身中段側向斜噴白煙 (由前葉子板後方車底斜向後外方噴射)
          { x0: -w * 0.42, y0: -h * 0.56, dx: -w * 0.64, dy: h * 0.54, baseR: 7 * s, endR: 24 * s, coreLen: 0.38 },
          { x0:  w * 0.42, y0: -h * 0.56, dx:  w * 0.64, dy: h * 0.54, baseR: 7 * s, endR: 24 * s, coreLen: 0.38 },
          // 2. 左、右後輪拱側向斜噴白煙 (由後葉子板下方斜向外後方噴射)
          { x0: -w * 0.45, y0: -h * 0.27, dx: -w * 0.62, dy: h * 0.36, baseR: 8 * s, endR: 25 * s, coreLen: 0.40 },
          { x0:  w * 0.45, y0: -h * 0.27, dx:  w * 0.62, dy: h * 0.36, baseR: 8 * s, endR: 25 * s, coreLen: 0.40 },
          // 3. 車尾底部擴散器左右雙管向下直噴濃烈白煙
          { x0: -w * 0.23, y0: -h * 0.05, dx: -w * 0.05, dy: h * 0.62, baseR: 8.5 * s, endR: 22 * s, coreLen: 0.45 },
          { x0:  w * 0.23, y0: -h * 0.05, dx:  w * 0.05, dy: h * 0.62, baseR: 8.5 * s, endR: 22 * s, coreLen: 0.45 }
        ];

        // 漏氣動畫進度：airLeakTimer 由 0.85 遞減至 0
        // 前段 (0.85 -> 0.22) 主噴氣流暫停並改為噴口斷續漏氣白霧團；尾段 (0.22 -> 0) 主噴氣流逐漸恢復
        const isLeaking = state.airLeakTimer > 0.01;
        const leakProgress = isLeaking ? 1 - Math.min(1, state.airLeakTimer / 0.85) : 1;
        const jetRestoreFactor = !isLeaking
          ? 1.0
          : state.airLeakTimer > 0.25
          ? 0.06
          : 1.0 - (state.airLeakTimer / 0.25) * 0.94;
        const effectiveJetAlpha = hoverAlpha * jetRestoreFactor;
        const effectiveLenScale = !isLeaking
          ? 1.0
          : state.airLeakTimer > 0.25
          ? 0.22
          : 0.22 + (1 - state.airLeakTimer / 0.25) * 0.78;

        ctx.save();

        nozzles.forEach((nz, idx) => {
          const dxScaled = nz.dx * effectiveLenScale;
          const dyScaled = nz.dy * effectiveLenScale;
          const len = Math.hypot(nz.dx, nz.dy);
          const ux = nz.dx / len;
          const uy = nz.dy / len;
          // 法向量 (垂直於噴射方向)
          const nx = -uy;
          const ny = ux;

          if (effectiveJetAlpha > 0.01) {
            const x1 = nz.x0 + dxScaled;
            const y1 = nz.y0 + dyScaled;

            // (A) 外層柔和擴散白霧錐體
            const plumeGrad = ctx.createLinearGradient(nz.x0, nz.y0, x1, y1);
            plumeGrad.addColorStop(0.00, `rgba(255, 255, 255, ${0.92 * effectiveJetAlpha})`);
            plumeGrad.addColorStop(0.32, `rgba(236, 243, 252, ${0.68 * effectiveJetAlpha})`);
            plumeGrad.addColorStop(0.70, `rgba(210, 222, 238, ${0.32 * effectiveJetAlpha})`);
            plumeGrad.addColorStop(1.00, 'rgba(195, 210, 230, 0)');

            const flutter = Math.sin(nowSec * 22 + idx * 1.7) * 2.5 * s;
            ctx.fillStyle = plumeGrad;
            ctx.beginPath();
            ctx.moveTo(nz.x0 - nx * nz.baseR * 0.6, nz.y0 - ny * nz.baseR * 0.6);
            ctx.quadraticCurveTo(
              nz.x0 + dxScaled * 0.5 - nx * (nz.endR * 0.65 * effectiveLenScale) + flutter,
              nz.y0 + dyScaled * 0.5 - ny * (nz.endR * 0.65 * effectiveLenScale),
              x1 - nx * nz.endR * effectiveLenScale + flutter,
              y1 - ny * nz.endR * effectiveLenScale
            );
            ctx.lineTo(x1 + nx * nz.endR * effectiveLenScale + flutter, y1 + ny * nz.endR * effectiveLenScale);
            ctx.quadraticCurveTo(
              nz.x0 + dxScaled * 0.5 + nx * (nz.endR * 0.65 * effectiveLenScale) + flutter,
              nz.y0 + dyScaled * 0.5 + ny * (nz.endR * 0.65 * effectiveLenScale),
              nz.x0 + nx * nz.baseR * 0.6,
              nz.y0 + ny * nz.baseR * 0.6
            );
            ctx.closePath();
            ctx.fill();

            // (B) 高速流動的翻騰白煙雲團粒子 (營造真實噴射氣流白煙質感)
            const puffCount = 6;
            for (let p = 0; p < puffCount; p++) {
              const prog = ((nowSec * 3.8 + p / puffCount + idx * 0.19) % 1);
              const px = nz.x0 + dxScaled * prog + nx * Math.sin(prog * 9 + nowSec * 14 + idx) * (3.5 * s * prog);
              const py = nz.y0 + dyScaled * prog + ny * Math.cos(prog * 8 + nowSec * 12) * (2.0 * s * prog);
              const pr = (nz.baseR * (1 - prog * 0.2) + nz.endR * prog * 0.95) * effectiveLenScale;
              const pAlpha = (1 - prog) * (0.58 * effectiveJetAlpha);

              const puffGrad = ctx.createRadialGradient(px, py, pr * 0.1, px, py, pr);
              puffGrad.addColorStop(0.0, `rgba(255, 255, 255, ${pAlpha})`);
              puffGrad.addColorStop(0.55, `rgba(232, 240, 250, ${pAlpha * 0.55})`);
              puffGrad.addColorStop(1.0, 'rgba(210, 224, 240, 0)');

              ctx.fillStyle = puffGrad;
              ctx.beginPath();
              ctx.arc(px, py, pr, 0, Math.PI * 2);
              ctx.fill();
            }

            // (C) 噴嘴出口處的高亮度純白高壓氣柱核心 (如圖片噴口處刺眼白光核心)
            const coreEndX = nz.x0 + dxScaled * nz.coreLen;
            const coreEndY = nz.y0 + dyScaled * nz.coreLen;
            const coreGrad = ctx.createLinearGradient(nz.x0, nz.y0, coreEndX, coreEndY);
            coreGrad.addColorStop(0.0, `rgba(255, 255, 255, ${0.98 * effectiveJetAlpha})`);
            coreGrad.addColorStop(0.6, `rgba(248, 252, 255, ${0.75 * effectiveJetAlpha})`);
            coreGrad.addColorStop(1.0, 'rgba(255, 255, 255, 0)');

            ctx.fillStyle = coreGrad;
            ctx.beginPath();
            ctx.moveTo(nz.x0 - nx * nz.baseR * 0.48, nz.y0 - ny * nz.baseR * 0.48);
            ctx.lineTo(coreEndX - nx * nz.baseR * 0.95, coreEndY - ny * nz.baseR * 0.95);
            ctx.lineTo(coreEndX + nx * nz.baseR * 0.95, coreEndY + ny * nz.baseR * 0.95);
            ctx.lineTo(nz.x0 + nx * nz.baseR * 0.48, nz.y0 + ny * nz.baseR * 0.48);
            ctx.closePath();
            ctx.fill();
          }

          // (D) 當處於漏氣狀態 (isLeaking) 時，在噴嘴四周繪製斷續失壓噴出的散逸漏氣白霧團與細碎氣流線
          if (isLeaking) {
            const leakEnv = Math.sin(leakProgress * Math.PI); // 0 -> 1 -> 0
            // 3 波斷續噴出的失壓白煙團 (噗—嗤—嗤—消散感)
            for (let b = 0; b < 3; b++) {
              const burstStart = b * 0.22 + (idx % 2) * 0.05;
              const localT = (leakProgress - burstStart) / 0.48;
              if (localT > 0 && localT < 1) {
                const spreadDist = (0.18 + localT * 0.95) * len * 0.65;
                const sideJitter = Math.sin(idx * 2.3 + b * 4.1) * (10 * s * localT);
                const bx = nz.x0 + ux * spreadDist + nx * sideJitter;
                const by = nz.y0 + uy * spreadDist + ny * sideJitter - localT * 8 * s;
                const br = nz.baseR * 0.9 + localT * nz.endR * 1.15;
                const bAlpha = (1 - localT) * (0.82 * Math.max(0.45, hoverAlpha));

                const leakGrad = ctx.createRadialGradient(bx, by, br * 0.08, bx, by, br);
                leakGrad.addColorStop(0.0, `rgba(255, 255, 255, ${bAlpha})`);
                leakGrad.addColorStop(0.45, `rgba(226, 236, 248, ${bAlpha * 0.62})`);
                leakGrad.addColorStop(1.0, 'rgba(200, 215, 235, 0)');

                ctx.fillStyle = leakGrad;
                ctx.beginPath();
                ctx.arc(bx, by, br, 0, Math.PI * 2);
                ctx.fill();
              }
            }

            // 噴嘴口微弱閃爍的殘餘漏氣小氣流絲
            const sputterOn = Math.sin(nowSec * 55 + idx * 3.1) > -0.15;
            if (sputterOn && leakProgress < 0.85) {
              const hissingAlpha = (1 - leakProgress) * 0.85;
              ctx.strokeStyle = `rgba(245, 250, 255, ${hissingAlpha})`;
              ctx.lineWidth = 2.0 * s;
              ctx.beginPath();
              ctx.moveTo(nz.x0, nz.y0);
              ctx.lineTo(
                nz.x0 + ux * (14 * s) + nx * Math.sin(nowSec * 40 + idx) * 5 * s,
                nz.y0 + uy * (14 * s) + ny * Math.cos(nowSec * 40 + idx) * 4 * s
              );
              ctx.stroke();
            }
          }
        });

        ctx.restore();
      }

      // ======================== 玩家座駕繪製 (使用者特調之左道 / 右道專屬模型) ========================
      function drawPlayerSilverSportsCar() {
        const proj = projectRoad(PLAYER_Z, state.playerLaneX);
        const s = proj.scale * 1.12;

        // 當車速為 0 時完全靜止，不產生引擎晃動
        const engineVibe =
          state.currentSpeed <= 0.5
            ? 0
            : 0;

        // 當 hoverFactor > 0 (車速 >= 300) 時，車體向上抬升離開路面約 5 米 (視覺高度約 72*s 並帶輕微氣流懸浮浮動與飛越路人車上空弧線)
        // 若處於空中答錯漏氣狀態 (airLeakTimer > 0)，車身會因噴氣暫停失壓而瞬間往下頓挫下沉並輕微晃動，強化漏氣感
        const hoverBob = Math.sin(performance.now() * 0.0065) * 4.5 * s * state.hoverFactor;

            ? Math.sin((state.nitroTimer / 0.85) * Math.PI) * 14 * s * state.hoverFactor

        const leakDipY =
          state.airLeakTimer > 0
            ? -Math.sin((state.airLeakTimer / 0.85) * Math.PI) * 16 * s * Math.max(0.35, state.hoverFactor) +
              Math.sin(performance.now() * 0.045) * 2.8 * s * (state.airLeakTimer / 0.85)
            : 0;
        const hoverLiftY = Math.max(0, 72 * s * state.hoverFactor + hoverBob + flyOverSurge + leakDipY);

        const x = proj.x;
        const groundY = proj.y + engineVibe * (1 - state.hoverFactor * 0.5);
