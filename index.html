<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>極速九九：海岸夕陽超跑賽 v0.8 (Sunset Coastal 9x9 Racing v0.8)</title>
  <style>
    :root {
      --cabinet-max-w: 480px;
      --neon-red: #ff1e42;
      --neon-cyan: #00f0ff;
      --neon-amber: #ffaa00;
      --neon-green: #00e676;
      --metal-dark: #141619;
      --metal-mid: #22262c;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
      -webkit-touch-callout: none;
      touch-action: manipulation;
    }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: radial-gradient(circle at 50% 25%, #2b1d28 0%, #12131a 60%, #07080c 100%);
      font-family: 'Segoe UI', 'Roboto', 'PingFang TC', 'Microsoft JhengHei', sans-serif;
      color: #ffffff;
      display: flex;
      justify-content: center;
      align-items: flex-start;
    }

    /* 街機直向容器：設定為 9:16.5 長寬比、高度 97.5dvh 置頂對齊，讓遊戲畫面放大 10% 且鍵盤下方留有安全邊距不碰觸網址列 */
    .arcade-cabinet {
      position: relative;
      width: 100%;
      max-width: min(var(--cabinet-max-w), calc(97.5dvh * 9 / 16.5));
      aspect-ratio: 9 / 16.5;
      height: 97.5dvh;
      max-height: 97.5dvh;
      display: flex;
      flex-direction: column;
      background: #0a0b0e;
      box-shadow:
        0 0 60px rgba(0, 0, 0, 0.95),
        0 0 25px rgba(255, 110, 40, 0.2),
        inset 0 0 2px rgba(255, 255, 255, 0.18);
      overflow: hidden;
    }

    @media (min-width: 500px) {
      html, body {
        align-items: center;
      }
      .arcade-cabinet {
        max-width: min(var(--cabinet-max-w), calc(97.5dvh * 9 / 16.5));
        max-height: 97.5dvh;
        border-left: 3px solid #282c37;
        border-right: 3px solid #282c37;
      }
    }

    /* ================= 上半部：海岸夕陽彎道賽道區 (放大 10% 遊戲畫面高度) ================= */
    .viewport-section {
      position: relative;
      width: 100%;
      height: 62.5%;
      flex-shrink: 0;
      overflow: hidden;
      background: #e8682a;
    }

    #raceCanvas {
      width: 100%;
      height: 100%;
      display: block;
    }

    /* 答錯或超時紅光閃爍警示遮罩 */
    .damage-flash {
      position: absolute;
      inset: 0;
      pointer-events: none;
      background: radial-gradient(circle, rgba(255, 0, 35, 0) 40%, rgba(255, 0, 45, 0.65) 100%);
      opacity: 0;
      transition: opacity 0.15s ease-out;
      z-index: 6;
    }
    .damage-flash.active {
      opacity: 1;
    }

    /* 答對加速暖金/青光外框 */
    .boost-flash {
      position: absolute;
      inset: 0;
      pointer-events: none;
      background: radial-gradient(circle, rgba(255, 200, 80, 0) 50%, rgba(255, 190, 50, 0.36) 100%);
      opacity: 0;
      transition: opacity 0.2s ease-out;
      z-index: 6;
    }
    .boost-flash.active {
      opacity: 1;
    }

    /* ================= HUD 儀表板：右上角時速表 & 題目左上角剩餘時間 ================= */
    .hud-speedometer {
      position: absolute;
      top: 44px;
      right: 16px;
      z-index: 14;
      pointer-events: none;
      display: flex;
      flex-direction: column;
      align-items: flex-end;
      padding: 6px 12px 4px 36px;
      transition: opacity 0.22s ease, transform 0.22s ease;
    }

    .hud-speedometer.hidden,
    .hud-time-badge.hidden {
      opacity: 0;
      pointer-events: none;
    }

    /* 時速表後方半透明轉速弧線與左側速度線 SVG (隨字體放大並同步向下移，避免頂部邊緣裁切) */
    .speedo-bg-svg {
      position: absolute;
      top: -6px;
      right: -6px;
      width: 280px;
      height: 158px;
      pointer-events: none;
      z-index: 0;
      overflow: visible;
    }

    .speedo-main-row {
      position: relative;
      z-index: 1;
      display: flex;
      align-items: baseline;
      justify-content: flex-end;
    }

    .hud-value.speed-val {
      font-family: 'Consolas', 'Courier New', 'Orbitron', monospace;
      font-size: clamp(81px, 21.5vw, 108px);
      font-weight: 900;
      font-style: italic;
      line-height: 0.9;
      letter-spacing: 2px;
      color: #fde047;
      transform: skewX(-6deg);
      paint-order: stroke fill;
      -webkit-text-stroke: 2px #b91c1c;
      text-shadow:
        0 0 10px #ff2a00,
        0 0 22px #dc2626,
        0 0 36px rgba(220, 38, 38, 0.88),
        0 5px 10px rgba(0, 0, 0, 0.7);
    }

    .speedo-unit {
      position: relative;
      z-index: 1;
      margin-top: 4px;
      margin-right: 4px;
      font-family: 'Consolas', 'Courier New', monospace;
      font-size: clamp(20px, 5.2vw, 27px);
      font-weight: 900;
      font-style: italic;
      letter-spacing: 1.5px;
      color: #fde047;
      transform: skewX(-6deg);
      paint-order: stroke fill;
      -webkit-text-stroke: 1px #b91c1c;
      text-shadow:
        0 0 8px #ff2a00,
        0 0 16px #dc2626,
        0 2px 6px rgba(0, 0, 0, 0.75);
    }

    /* 畫面左上角：剩餘時間膠囊框 (字體放大、清晰易讀且對稱於右上角時速表) */
    .hud-time-badge {
      position: absolute;
      top: 26px;
      left: 16px;
      z-index: 15;
      pointer-events: none;
      background: linear-gradient(180deg, rgba(20, 24, 34, 0.95) 0%, rgba(10, 12, 18, 0.98) 100%);
      border: 2px solid rgba(255, 255, 255, 0.22);
      border-top: 2px solid rgba(255, 255, 255, 0.38);
      border-radius: 12px;
      padding: 6px 14px;
      box-shadow:
        0 8px 22px rgba(0, 0, 0, 0.85),
        0 0 14px rgba(163, 230, 53, 0.25),
        inset 0 1px 2px rgba(255, 255, 255, 0.25);
      display: flex;
      align-items: baseline;
      gap: 7px;
      transition: opacity 0.22s ease, transform 0.22s ease;
    }

    .time-badge-label {
      font-family: 'Segoe UI', 'Arial Narrow', sans-serif;
      font-size: clamp(18px, 4.8vw, 24px);
      font-weight: 900;
      letter-spacing: 1px;
      color: #fde047;
      text-shadow: 0 0 10px rgba(250, 204, 21, 0.55);
    }

    .hud-value.time-val {
      display: inline-block;
      transform-origin: center center;
      font-family: 'Consolas', 'Courier New', monospace;
      font-size: clamp(26px, 6.8vw, 34px);
      font-weight: 900;
      line-height: 1;
      letter-spacing: 1.5px;
      color: #a3e635;
      text-shadow:
        0 0 12px rgba(132, 204, 22, 0.9),
        0 0 24px rgba(101, 163, 13, 0.5);
    }

    .hud-value.time-val.urgent {
      color: #ff3b5c;
      text-shadow: 0 0 16px rgba(255, 30, 66, 0.95);
      animation: pulseText 0.45s infinite alternate;
    }

    /* 最後 3 秒倒數：伴隨 321 音效時間數字瞬間放大 50% (scale 1.5) 再縮回 */
    @keyframes timePopAnim {
      0% {
        transform: scale(1.5);
        color: #ff2a4b;
        text-shadow:
          0 0 22px rgba(255, 42, 75, 1),
          0 0 38px rgba(255, 42, 75, 0.85);
      }
      50% {
        transform: scale(1.15);
      }
      100% {
        transform: scale(1);
      }
    }

    .hud-value.time-val.time-pop,
    .hud-value.time-val.urgent.time-pop {
      animation: timePopAnim 0.45s cubic-bezier(0.18, 0.89, 0.32, 1.28) forwards;
    }

    .hud-unit {
      font-family: 'Consolas', 'Courier New', sans-serif;
      font-size: clamp(18px, 4.8vw, 24px);
      font-weight: 900;
      color: #86efac;
      text-shadow: 0 0 10px rgba(134, 239, 172, 0.7);
    }

    /* 題目與 5 秒倒數動態進度條區：置於畫面中間、緊鄰下方數字鍵盤上方，放大且高對比顯眼 */
    .question-cockpit {
      position: absolute;
      bottom: 6px;
      left: 50%;
      transform: translateX(-50%);
      width: calc(100% - 24px);
      max-width: 430px;
      z-index: 14;
      pointer-events: none;
      background: linear-gradient(180deg, rgba(15, 18, 30, 0.92) 0%, rgba(7, 9, 16, 0.96) 100%);
      border: 2px solid rgba(255, 215, 0, 0.82);
      border-radius: 14px;
      padding: 6px 16px 8px;
      box-shadow:
        0 10px 28px rgba(0, 0, 0, 0.85),
        0 0 22px rgba(255, 190, 0, 0.35),
        inset 0 1px 2px rgba(255, 255, 255, 0.35);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 5px;
      transition: opacity 0.18s ease, transform 0.18s ease;
    }

    .question-cockpit.hidden {
      opacity: 0;
      transform: translateX(-50%) scale(0.92);
      pointer-events: none;
    }

    .question-display {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      font-family: 'Consolas', 'Courier New', monospace;
      font-size: clamp(32px, 8.5vw, 44px);
      font-weight: 900;
      letter-spacing: 2px;
      color: #fffbeb;
      text-shadow:
        0 0 16px rgba(255, 210, 60, 0.75),
        0 4px 10px rgba(0, 0, 0, 0.95);
    }

    .question-display .op-sign {
      color: #ffaa00;
    }

    .answer-slot {
      min-width: 82px;
      padding: 1px 14px;
      border-radius: 10px;
      background: rgba(0, 240, 255, 0.18);
      border: 2.5px solid #00f0ff;
      color: #00f0ff;
      text-align: center;
      box-shadow: 0 0 18px rgba(0, 240, 255, 0.45), inset 0 0 10px rgba(0, 240, 255, 0.25);
      transition: transform 0.1s ease, border-color 0.15s ease, color 0.15s ease;
    }

    .answer-slot.correct {
      border-color: #00e676;
      color: #00e676;
      background: rgba(0, 230, 118, 0.18);
      transform: scale(1.08);
    }

    .answer-slot.wrong {
      border-color: #ff1e42;
      color: #ff1e42;
      background: rgba(255, 30, 66, 0.2);
      animation: shakeSlot 0.25s ease;
    }

    /* 5秒變色倒數進度條 (不顯示秒數文字) */
    .q-timer-wrap {
      width: 100%;
      display: flex;
      align-items: center;
    }

    .q-timer-track {
      width: 100%;
      height: 10px;
      background: rgba(255, 255, 255, 0.14);
      border-radius: 999px;
      overflow: hidden;
      box-shadow: inset 0 1px 4px rgba(0, 0, 0, 0.9);
      padding: 1px;
    }

    .q-timer-bar {
      height: 100%;
      width: 100%;
      border-radius: 999px;
      background: linear-gradient(90deg, #00e676 0%, #69f0ae 100%);
      box-shadow: 0 0 12px rgba(0, 230, 118, 0.85);
      transform-origin: left center;
      transition: background 0.15s linear, box-shadow 0.15s linear;
    }

    /* 汽車正上方震撼速度增減提示 (+25 km/h 綠色 / -25 km/h 紅色) */
    .floating-feedback {
      position: absolute;
      left: 50%;
      top: 42%;
      transform: translate(-50%, -50%);
      display: flex;
      align-items: baseline;
      justify-content: center;
      gap: 6px;
      font-family: 'Segoe UI', 'Impact', 'Arial Black', sans-serif;
      font-weight: 900;
      font-style: italic;
      white-space: nowrap;
      pointer-events: none;
      opacity: 0;
      z-index: 18;
    }

    .floating-feedback .fb-num {
      font-size: clamp(46px, 12vw, 64px);
      line-height: 1;
      letter-spacing: 1px;
    }

    .floating-feedback .fb-unit {
      font-size: clamp(16px, 4.2vw, 22px);
      font-weight: 800;
      letter-spacing: 0.5px;
    }

    /* 答對：震撼亮綠色 +25 km/h (顯示時間延長至 1 秒) */
    .floating-feedback.show-boost {
      color: #00ff88;
      -webkit-text-stroke: 2px #004d26;
      text-shadow:
        0 0 18px rgba(0, 230, 118, 0.95),
        0 0 34px rgba(0, 200, 83, 0.75),
        0 6px 14px rgba(0, 0, 0, 0.95);
      animation: impactPop 1.0s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }

    /* 答錯或超時：震撼亮紅色 -25 km/h 或 請加油！ (顯示時間延長至 1 秒) */
    .floating-feedback.show-slow {
      color: #ff2a4b;
      -webkit-text-stroke: 2px #5a000e;
      text-shadow:
        0 0 18px rgba(255, 23, 68, 0.98),
        0 0 36px rgba(255, 0, 43, 0.8),
        0 6px 14px rgba(0, 0, 0, 0.95);
      animation: impactPop 1.0s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }

    /* 「請加油！」三字等距排列樣式（使用與 -25 完全相同粗細的邊框與陰影） */
    .floating-feedback .fb-cheer {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-family: "Arial Black", "Microsoft JhengHei", "PingFang TC", "Noto Sans TC", sans-serif;
      font-size: clamp(44px, 11.5vw, 60px);
      font-weight: 900;
      font-style: normal;
      line-height: 1;
      color: #ff2a4b;
      -webkit-text-stroke: 2px #5a000e;
      text-shadow:
        0 0 18px rgba(255, 23, 68, 0.98),
        0 0 36px rgba(255, 0, 43, 0.8),
        0 6px 14px rgba(0, 0, 0, 0.95);
    }

    .floating-feedback .fb-cheer .cheer-char {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 1.18em;
      text-align: center;
    }

    /* 「請」與「加」距離拉近 5%，並消除首字左側多餘留白以利整體水平置中 */
    .floating-feedback .fb-cheer .cheer-char-first {
      margin-left: -0.09em;
      margin-right: -0.06em;
    }

    .floating-feedback .fb-cheer .cheer-char-mid {
      transform: translateX(0.06em);
    }

    /* 驚嘆號緊貼著「油」字，不佔用多餘寬度，確保「請加油!」整個字串精準水平置中 */
    .floating-feedback .fb-cheer .cheer-excl {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: auto;
      margin-left: -0.08em;
      text-align: center;
    }

    /* ================= 下半部：控制面板區 (佔容器 37.5% 高度，放大按鍵與鍵盤間距，且底部不碰觸網址列) ================= */
    .control-section {
      position: relative;
      width: 100%;
      height: 37.5%;
      min-height: 0;
      background:
        repeating-linear-gradient(
          45deg,
          #14171f 0px,
          #14171f 6px,
          #10131a 6px,
          #10131a 12px
        );
      padding: 10px 12px 10px;
      display: flex;
      flex-direction: column;
      justify-content: flex-start;
      box-shadow: inset 0 6px 16px rgba(0, 0, 0, 0.85);
      z-index: 10;
    }

    /* 機械立體數字鍵盤 (稍微放大按鍵並加大按鍵間隔，下方保留安全距離不碰觸網址列) */
    .numpad-grid {
      flex: 1;
      min-height: 0;
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      grid-template-rows: repeat(4, minmax(0, 1fr));
      gap: 10px;
      width: 100%;
    }

    .mech-key {
      position: relative;
      min-height: 0;
      border: none;
      outline: none;
      border-radius: 12px;
      cursor: pointer;
      background: linear-gradient(180deg, #353c4b 0%, #242934 65%, #1b1f28 100%);
      color: #f1f5f9;
      font-family: 'Segoe UI', 'Roboto', monospace;
      font-size: clamp(25px, 6.8vw, 35px);
      line-height: 1;
      font-weight: 900;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      box-shadow:
        0 5px 0 #0d0f14,
        0 7px 12px rgba(0, 0, 0, 0.7),
        inset 0 1px 1px rgba(255, 255, 255, 0.28),
        inset 0 -2px 4px rgba(0, 0, 0, 0.45);
      border: 1px solid #434c5e;
      transition: transform 0.05s ease, box-shadow 0.05s ease, background 0.1s ease;
      -webkit-tap-highlight-color: transparent;
    }

    /* 機械鍵帽頂部金屬高光面 */
    .mech-key::before {
      content: '';
      position: absolute;
      inset: 3px 5px 6px 5px;
      border-radius: 8px;
      background: linear-gradient(180deg, rgba(255, 255, 255, 0.07) 0%, rgba(255, 255, 255, 0) 100%);
      pointer-events: none;
    }

    .mech-key span {
      position: relative;
      z-index: 1;
      text-shadow: 0 2px 4px rgba(0, 0, 0, 0.75);
    }

    .mech-key.key-zero {
      grid-column: 1 / -1;
    }

    /* 按下狀態 (滑鼠點擊、觸控、或實體鍵盤觸發) */
    .mech-key:active,
    .mech-key.pressed {
      transform: translateY(4px);
      background: linear-gradient(180deg, #1e2430 0%, #293140 100%);
      border-color: #00f0ff;
      color: #00f0ff;
      box-shadow:
        0 1px 0 #0d0f14,
        0 2px 5px rgba(0, 0, 0, 0.6),
        0 0 15px rgba(0, 240, 255, 0.45),
        inset 0 2px 6px rgba(0, 0, 0, 0.75);
    }

    /* ================= 起跑與結算彈窗遮罩 ================= */
    .modal-backdrop {
      position: absolute;
      inset: 0;
      z-index: 30;
      background: radial-gradient(circle at 50% 35%, rgba(16, 20, 32, 0.84) 0%, rgba(6, 8, 12, 0.94) 100%);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      padding: 24px;
      text-align: center;
      transition: opacity 0.3s ease;
    }

    .modal-backdrop.hidden {
      opacity: 0;
      pointer-events: none;
    }

    .race-card {
      width: 100%;
      max-width: 390px;
      background: linear-gradient(165deg, #1b202e 0%, #10131c 100%);
      border: 1px solid rgba(255, 255, 255, 0.16);
      border-top: 2px solid var(--neon-red);
      border-radius: 18px;
      padding: 24px 20px;
      box-shadow:
        0 20px 50px rgba(0, 0, 0, 0.85),
        0 0 30px rgba(255, 30, 66, 0.2);
    }

    .badge-tag {
      display: inline-block;
      padding: 4px 12px;
      font-size: 11px;
      font-weight: 800;
      letter-spacing: 2px;
      text-transform: uppercase;
      color: #ffaa00;
      background: rgba(255, 170, 0, 0.14);
      border: 1px solid rgba(255, 170, 0, 0.4);
      border-radius: 999px;
      margin-bottom: 10px;
    }

    .race-title {
      font-size: 28px;
      font-weight: 900;
      font-style: italic;
      letter-spacing: 1px;
      background: linear-gradient(90deg, #ffffff 0%, #fde047 50%, #fb923c 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-bottom: 10px;
    }

    .race-desc {
      font-size: 13.5px;
      line-height: 1.6;
      color: #cbd5e1;
      margin-bottom: 18px;
      text-align: left;
      background: rgba(0, 0, 0, 0.35);
      padding: 12px 14px;
      border-radius: 10px;
      border-left: 3px solid #f97316;
    }

    .race-desc li {
      margin-left: 16px;
      margin-bottom: 4px;
    }

    .cta-btn {
      width: 100%;
      padding: 13px 20px;
      border: none;
      border-radius: 14px;
      cursor: pointer;
      font-size: clamp(25px, 6.8vw, 30px);
      font-weight: 900;
      font-style: italic;
      letter-spacing: 2px;
      color: #ffffff;
      background: linear-gradient(180deg, #ff5722 0%, #d90429 100%);
      box-shadow:
        0 6px 0 #7a0016,
        0 12px 26px rgba(255, 60, 40, 0.6),
        inset 0 1px 1px rgba(255, 255, 255, 0.45);
      transition: transform 0.08s ease, box-shadow 0.08s ease;
    }

    .cta-btn:active {
      transform: translateY(4px);
      box-shadow: 0 1px 0 #7a0016, 0 4px 10px rgba(255, 30, 66, 0.4);
    }

    /* 起跑號誌燈 3-2-1-GO */
    .traffic-lights {
      display: flex;
      justify-content: center;
      gap: 14px;
      margin: 14px 0 18px;
      padding: 10px 18px;
      background: #090b10;
      border-radius: 999px;
      border: 1px solid #2e3440;
      box-shadow: inset 0 2px 6px rgba(0,0,0,0.9);
    }

    .light-bulb {
      width: 24px;
      height: 24px;
      border-radius: 50%;
      background: #222630;
      border: 2px solid #14171f;
      transition: background 0.15s ease, box-shadow 0.15s ease;
    }
    .light-bulb.red {
      background: #ff1e42;
      box-shadow: 0 0 16px #ff1e42;
    }
    .light-bulb.amber {
      background: #ffaa00;
      box-shadow: 0 0 16px #ffaa00;
    }
    .light-bulb.green {
      background: #00e676;
      box-shadow: 0 0 18px #00e676;
    }

    /* 畫面中央倒數大字 (321 放大 50% 且使用醒目紅色系；START! 放大 30%) */
    .countdown-banner {
      position: absolute;
      inset: 0;
      z-index: 25;
      display: flex;
      justify-content: center;
      align-items: center;
      pointer-events: none;
      font-family: 'Consolas', 'Impact', 'Segoe UI Black', sans-serif;
      font-size: clamp(96px, 26vw, 126px);
      font-weight: 900;
      font-style: italic;
      color: #ff2a4b;
      paint-order: stroke fill;
      -webkit-text-stroke: 3.5px #50000d;
      text-shadow:
        0 0 22px #ff1744,
        0 0 45px rgba(255, 23, 68, 0.95),
        0 0 75px rgba(220, 0, 40, 0.8),
        0 8px 24px rgba(0, 0, 0, 0.95);
      letter-spacing: 2px;
      opacity: 0;
      text-align: center;
    }

    /* 3, 2, 1 倒數大字：醒目紅色系，字體放大 50% (76px * 1.5 = 114px) */
    .countdown-banner.num-countdown {
      font-size: clamp(96px, 26vw, 126px);
      color: #ff2a4b;
      paint-order: stroke fill;
      -webkit-text-stroke: 3.5px #50000d;
      text-shadow:
        0 0 22px #ff1744,
        0 0 45px rgba(255, 23, 68, 0.95),
        0 0 75px rgba(220, 0, 40, 0.8),
        0 8px 24px rgba(0, 0, 0, 0.95);
    }

    /* START! 正式起跑大字：字體放大 30% (76px * 1.3 = 99px) */
    .countdown-banner.start-go {
      font-size: clamp(75px, 20vw, 102px);
      color: #ffffff;
      paint-order: stroke fill;
      -webkit-text-stroke: 3.5px #047857;
      text-shadow:
        0 0 25px #00e676,
        0 0 50px rgba(0, 230, 118, 0.92),
        0 0 75px rgba(0, 200, 83, 0.75),
        0 8px 24px rgba(0, 0, 0, 0.95);
      letter-spacing: 3px;
    }

    .countdown-banner.pop {
      animation: countPop 0.85s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }

    /* 賽後結算排行榜表格 */
    .stats-board {
      display: flex;
      flex-direction: column;
      gap: 10px;
      margin: 16px 0 22px;
    }

    /* 通關結算畫面：保留輕量淺灰色半透明覆蓋與卡片，讓後方遊戲畫面清晰可見 */
    #resultModal.modal-backdrop {
      background: rgba(180, 188, 200, 0.24);
      backdrop-filter: none;
      -webkit-backdrop-filter: none;
    }

    #resultModal .race-card {
      background: rgba(110, 118, 132, 0.34);
      border: 1px solid rgba(255, 255, 255, 0.38);
      border-top: 2px solid rgba(255, 255, 255, 0.55);
      box-shadow: 0 10px 28px rgba(0, 0, 0, 0.22);
      padding: 22px 20px;
    }

    /* 起始畫面：移除後方半透明區塊，標題位於地平線與汽車中間不遮太陽，按鈕稍微上移居中 */
    #startModal.modal-backdrop {
      position: absolute;
      inset: 0;
      background: none;
      backdrop-filter: none;
      -webkit-backdrop-filter: none;
      pointer-events: none;
      overflow: hidden;
      padding: 0;
    }

    #startModal .race-card {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      max-width: 100%;
      background: none;
      border: none;
      box-shadow: none;
      padding: 0;
      pointer-events: none;
    }

    /* 遊戲標題：往上一點，字體剛好貼齊太陽與地平線下方，且與下方汽車保持舒適距離 */
    #startModal .title-logo-wrap {
      position: absolute;
      top: 21%;
      left: 50%;
      transform: translateX(-50%);
      width: 95%;
      max-width: 530px; /* 標題放大 50% */
      margin: 0;
      display: flex;
      justify-content: center;
      align-items: center;
      filter: drop-shadow(0 10px 22px rgba(0, 0, 0, 0.85));
      pointer-events: none;
      z-index: 5;
    }

    #startModal .title-logo-svg {
      width: 100%;
      max-width: 530px;
      height: auto;
      overflow: visible;
      display: block;
    }

    /* 開始競速按鈕：稍微往上一點，居中於車子與下方數字鍵盤中間，字體放大 50% */
    #startModal #startRaceBtn {
      position: absolute;
      bottom: clamp(18px, 4.5%, 28px);
      left: 50%;
      transform: translateX(-50%);
      width: calc(100% - 28px);
      max-width: 380px;
      padding: 13px 20px;
      font-size: clamp(25px, 6.8vw, 30px); /* 字體放大 50% */
      letter-spacing: 2px;
      border-radius: 14px;
      pointer-events: auto;
      z-index: 10;
      box-shadow:
        0 6px 0 #7a0016,
        0 12px 26px rgba(255, 60, 40, 0.6),
        inset 0 1px 1px rgba(255, 255, 255, 0.45);
    }

    #startModal #startRaceBtn:active {
      transform: translate(-50%, 4px);
      box-shadow: 0 1px 0 #7a0016, 0 4px 10px rgba(255, 30, 66, 0.4);
    }

    .title-logo-wrap {
      width: 100%;
      margin: -4px 0 14px;
      display: flex;
      justify-content: center;
      align-items: center;
      filter: drop-shadow(0 8px 16px rgba(0, 0, 0, 0.65));
    }

    .title-logo-svg {
      width: 100%;
      max-width: 370px;
      height: auto;
      overflow: visible;
      display: block;
    }

    #resultModal .stats-board {
      margin: 0 0 16px;
    }

    #resultModal .stat-row {
      background: rgba(45, 52, 64, 0.36);
      border: 1px solid rgba(255, 255, 255, 0.24);
      padding: 14px 18px;
    }

    #resultModal .stat-name {
      font-size: clamp(22px, 5.8vw, 27px);
      font-weight: 900;
      color: #ffea00;
      paint-order: stroke fill;
      -webkit-text-stroke: 4px #0f172a;
      text-shadow: 0 2px 6px rgba(0, 0, 0, 0.95);
      letter-spacing: 1px;
    }

    #resultModal .stat-num {
      font-size: clamp(28px, 7.2vw, 34px);
      font-weight: 900;
      paint-order: stroke fill;
      -webkit-text-stroke: 4px #0f172a;
      text-shadow: 0 2px 6px rgba(0, 0, 0, 0.95);
    }

    /* 重新開始按鈕：字體大小、字重、傾斜與陰影完全貼齊開始遊戲按鈕 */
    #resultModal #replayBtn {
      font-size: clamp(25px, 6.8vw, 30px);
      font-weight: 900;
      font-style: italic;
      letter-spacing: 2px;
      padding: 13px 20px;
      border-radius: 14px;
    }

    .stat-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.1);
      padding: 12px 16px;
      border-radius: 10px;
    }

    .stat-name {
      font-size: 14px;
      font-weight: 700;
      color: #cbd5e1;
    }

    .stat-num {
      font-family: 'Consolas', monospace;
      font-size: 22px;
      font-weight: 900;
    }

    .stat-num.green { color: #00e676; text-shadow: 0 0 10px rgba(0, 230, 118, 0.4); }
    .stat-num.red   { color: #ff4769; text-shadow: 0 0 10px rgba(255, 71, 105, 0.4); }
    .stat-num.cyan  { color: #00f0ff; text-shadow: 0 0 10px rgba(0, 240, 255, 0.4); }

    @keyframes pulseText {
      from { transform: scale(1); }
      to   { transform: scale(1.1); }
    }

    @keyframes shakeSlot {
      0%, 100% { transform: translateX(0); }
      25% { transform: translateX(-6px); }
      75% { transform: translateX(6px); }
    }

    @keyframes impactPop {
      0%   { opacity: 0; transform: translate(-50%, -40%) scale(2.2); }
      16%  { opacity: 1; transform: translate(-50%, -50%) scale(0.95); }
      28%  { opacity: 1; transform: translate(-50%, -52%) scale(1.08); }
      82%  { opacity: 1; transform: translate(-50%, -60%) scale(1.02); }
      100% { opacity: 0; transform: translate(-50%, -88%) scale(0.92); }
    }

    @keyframes countPop {
      0%   { opacity: 0; transform: scale(2.1); }
      25%  { opacity: 1; transform: scale(1); }
      80%  { opacity: 1; transform: scale(0.96); }
      100% { opacity: 0; transform: scale(0.75); }
    }
  </style>
</head>
<body>
  <main class="arcade-cabinet">
    <!-- ================= 上半部：海岸夕陽彎道賽道區 (佔 60% 高度) ================= -->
    <section class="viewport-section">
      <canvas id="raceCanvas"></canvas>
      <div id="damageFlash" class="damage-flash"></div>
      <div id="boostFlash" class="boost-flash"></div>
      <div id="floatingFeedback" class="floating-feedback"></div>
      <div id="countdownBanner" class="countdown-banner"></div>

      <!-- 右上角汽車時速表 (起始畫面隱藏，按下開始競速進入倒數時顯示) -->
      <div id="hudSpeedometer" class="hud-speedometer hidden">
        <svg class="speedo-bg-svg" viewBox="0 0 210 115" xmlns="http://www.w3.org/2000/svg">
          <!-- 左側水平速度流線 -->
          <line x1="6" y1="30" x2="78" y2="30" stroke="rgba(255, 235, 180, 0.45)" stroke-width="2" stroke-linecap="round" />
          <line x1="22" y1="42" x2="74" y2="42" stroke="rgba(255, 235, 180, 0.35)" stroke-width="1.6" stroke-linecap="round" />
          <line x1="12" y1="53" x2="70" y2="53" stroke="rgba(255, 235, 180, 0.4)" stroke-width="1.8" stroke-linecap="round" />
          <line x1="34" y1="64" x2="68" y2="64" stroke="rgba(255, 235, 180, 0.3)" stroke-width="1.5" stroke-linecap="round" />
          <!-- 右上外圈半透明轉速錶弧線與刻度 -->
          <path d="M 122 14 A 48 48 0 0 1 196 76" fill="none" stroke="rgba(255, 255, 255, 0.28)" stroke-width="7" stroke-linecap="round" />
          <path d="M 116 8 A 56 56 0 0 1 204 80" fill="none" stroke="rgba(255, 255, 255, 0.38)" stroke-width="2" />
          <line x1="145" y1="15" x2="142" y2="23" stroke="rgba(255, 255, 255, 0.42)" stroke-width="2" />
          <line x1="172" y1="24" x2="166" y2="31" stroke="rgba(255, 255, 255, 0.42)" stroke-width="2" />
          <line x1="191" y1="44" x2="183" y2="48" stroke="rgba(255, 255, 255, 0.42)" stroke-width="2" />
          <line x1="197" y1="68" x2="188" y2="68" stroke="rgba(255, 255, 255, 0.42)" stroke-width="2" />
        </svg>
        <div class="speedo-main-row">
          <span id="speedVal" class="hud-value speed-val">125</span>
        </div>
        <div class="speedo-unit">KM/H</div>
      </div>

      <!-- 畫面左上角：剩餘時間 (起始畫面隱藏，按下開始競速進入倒數時顯示) -->
      <div id="hudTimeBadge" class="hud-time-badge hidden">
        <span class="time-badge-label">TIME:</span>
        <span id="raceTimeVal" class="hud-value time-val">30.0</span>
        <span class="hud-unit">s</span>
      </div>

      <!-- 當前九九乘法題目與變色倒數進度條 (不顯示秒數文字，起跑倒數時隱藏) -->
      <div id="questionCockpit" class="question-cockpit hidden">
        <div class="question-display">
          <span id="qFactorA">7</span>
          <span class="op-sign">×</span>
          <span id="qFactorB">8</span>
          <span class="op-sign">=</span>
          <span id="qAnswerSlot" class="answer-slot">?</span>
        </div>
        <div class="q-timer-wrap">
          <div class="q-timer-track">
            <div id="qTimerBar" class="q-timer-bar"></div>
          </div>
        </div>
      </div>

      <!-- 起跑畫面 Modal (立體黑金漸層競速徽章標題、無遊戲說明、半透明底色可見遊戲畫面) -->
      <div id="startModal" class="modal-backdrop">
        <div class="race-card">
          <div class="title-logo-wrap" aria-label="極速99 海岸公路賽">
            <svg class="title-logo-svg" viewBox="0 0 680 182" xmlns="http://www.w3.org/2000/svg">
              <defs>
                <!-- 字體主體高對比電光青藍/冰白漸層：與背景夕陽暖色形成極強烈對比，清晰醒目 -->
                <linearGradient id="titleFillGrad" x1="0%" y1="0%" x2="0%" y2="100%">
                  <stop offset="0%" stop-color="#ffffff" />
                  <stop offset="20%" stop-color="#e0f7ff" />
                  <stop offset="48%" stop-color="#38bdf8" />
                  <stop offset="75%" stop-color="#00f0ff" />
                  <stop offset="100%" stop-color="#0284c7" />
                </linearGradient>

                <!-- 99 特大數字專屬高光電光青藍漸層 -->
                <linearGradient id="num99FillGrad" x1="0%" y1="0%" x2="0%" y2="100%">
                  <stop offset="0%" stop-color="#ffffff" />
                  <stop offset="25%" stop-color="#cffafe" />
                  <stop offset="55%" stop-color="#22d3ee" />
                  <stop offset="85%" stop-color="#06b6d4" />
                  <stop offset="100%" stop-color="#0284c7" />
                </linearGradient>

                <!-- 徽章外框電光青金屬金屬漸層 -->
                <linearGradient id="rimCyanGrad" x1="0%" y1="0%" x2="0%" y2="100%">
                  <stop offset="0%" stop-color="#f0fdff" />
                  <stop offset="45%" stop-color="#00f0ff" />
                  <stop offset="100%" stop-color="#0369a1" />
                </linearGradient>

                <!-- 背景速度光條漸層 (電光青藍速度流線) -->
                <linearGradient id="sparkGrad" x1="0%" y1="0%" x2="100%" y2="0%">
                  <stop offset="0%" stop-color="#0284c7" stop-opacity="0" />
                  <stop offset="50%" stop-color="#00f0ff" stop-opacity="0.95" />
                  <stop offset="100%" stop-color="#ffffff" stop-opacity="1" />
                </linearGradient>
              </defs>

              <!-- 1. 背景斜向與橫向電光青藍速度光條 (與夕陽背景形成鮮明視覺對比) -->
              <g>
                <!-- 左側速度流線 -->
                <polygon points="2,64 68,60 64,68 2,70" fill="url(#sparkGrad)" opacity="0.9" />
                <polygon points="10,88 62,84 58,92 10,93" fill="url(#sparkGrad)" opacity="0.8" />
                <polygon points="0,112 58,106 54,117 0,120" fill="url(#sparkGrad)" opacity="0.95" />
                <!-- 左下斜飛光芒 -->
                <polygon points="96,170 158,126 168,132 102,174" fill="#38bdf8" opacity="0.9" />
                <polygon points="122,168 175,130 182,135 128,172" fill="#00f0ff" opacity="0.95" />
                <!-- 右上斜飛速度光芒與火花 -->
                <polygon points="505,46 598,4 606,12 518,52" fill="#0284c7" opacity="0.9" />
                <polygon points="532,48 626,12 632,19 542,54" fill="#00f0ff" opacity="0.95" />
                <polygon points="565,52 648,22 652,28 572,56" fill="#38bdf8" opacity="0.9" />
                <circle cx="562" cy="14" r="3.2" fill="#ffffff" />
                <circle cx="638" cy="28" r="2.8" fill="#67e8f9" />
                <!-- 右側速度流線 -->
                <polygon points="615,78 675,74 675,80 612,84" fill="#00f0ff" opacity="0.85" />
                <polygon points="608,118 672,114 672,122 604,126" fill="#38bdf8" opacity="0.9" />
              </g>

              <!-- 2. 底層黑青斜角競速護盾底板 (連成一體的深黑金屬底框與電光青外緣) -->
              <path
                d="M 52 46
                   L 188 46
                   Q 202 18 238 18
                   L 304 18
                   Q 325 18 328 44
                   L 660 44
                   L 636 86
                   L 648 92
                   L 622 138
                   L 312 138
                   Q 298 158 265 158
                   L 196 158
                   Q 174 158 170 138
                   L 36 138
                   Z"
                fill="#080c14"
                stroke="url(#rimCyanGrad)"
                stroke-width="6.5"
                stroke-linejoin="round"
              />

              <!-- 護盾內部微細電光青金屬內框線 -->
              <path
                d="M 57 52
                   L 192 52
                   Q 206 25 238 25
                   L 300 25
                   Q 319 25 322 50
                   L 647 50
                   L 628 85
                   L 639 91
                   L 616 131
                   L 308 131
                   Q 294 151 264 151
                   L 198 151
                   Q 179 151 175 131
                   L 44 131
                   Z"
                fill="#0a0f1a"
                stroke="rgba(0, 240, 255, 0.45)"
                stroke-width="1.8"
                stroke-linejoin="round"
              />

              <!-- 3. 左側「極速」與右側「海岸公路賽」多層圓角描邊與電光青藍漸層字體 -->
              <g
                font-family="'Microsoft JhengHei', 'PingFang TC', 'Noto Sans TC', 'Heiti TC', sans-serif"
                font-weight="900"
                font-size="62"
                letter-spacing="2"
                transform="translate(0, 0) skewX(-10)"
              >
                <!-- 厚黑外緣層 (消除任何毛刺，與護盾自然融合) -->
                <text x="68" y="114" stroke="#050a12" stroke-width="16" stroke-linejoin="round" stroke-linecap="round" fill="none">極速</text>
                <text x="336" y="114" stroke="#050a12" stroke-width="16" stroke-linejoin="round" stroke-linecap="round" fill="none">海岸公路賽</text>

                <!-- 深藍立體內緣層 -->
                <text x="68" y="114" stroke="#031930" stroke-width="6" stroke-linejoin="round" stroke-linecap="round" fill="none">極速</text>
                <text x="336" y="114" stroke="#031930" stroke-width="6" stroke-linejoin="round" stroke-linecap="round" fill="none">海岸公路賽</text>

                <!-- 主體亮純白至電光青藍漸層填充 -->
                <text x="68" y="114" fill="url(#titleFillGrad)">極速</text>
                <text x="336" y="114" fill="url(#titleFillGrad)">海岸公路賽</text>
              </g>

              <!-- 4. 中央特大號「99」超跑徽章字體 (突出於護盾上下緣，帶競速斜切刻痕) -->
              <g
                font-family="'Impact', 'Arial Black', 'Segoe UI Black', sans-serif"
                font-weight="900"
                font-size="114"
                letter-spacing="-2"
                transform="translate(0, 0) skewX(-12)"
              >
                <!-- 電光青外框護邊 -->
                <text x="208" y="132" stroke="url(#rimCyanGrad)" stroke-width="24" stroke-linejoin="round" stroke-linecap="round" fill="none">99</text>
                <!-- 濃黑立體厚邊 -->
                <text x="208" y="132" stroke="#050a12" stroke-width="15" stroke-linejoin="round" stroke-linecap="round" fill="none">99</text>
                <!-- 深藍內描邊 -->
                <text x="208" y="132" stroke="#031930" stroke-width="5" stroke-linejoin="round" fill="none">99</text>
                <!-- 99 主體亮純白至電光青藍漸層 -->
                <text x="208" y="132" fill="url(#num99FillGrad)">99</text>
              </g>

              <!-- 99 底部競速斜切裝飾線 (重現圖片中 99 下方的速度刻線細節) -->
              <g fill="#080b11">
                <polygon points="188,136 196,120 201,120 193,136" />
                <polygon points="196,136 204,120 209,120 201,136" />
                <polygon points="246,136 254,120 259,120 251,136" />
              </g>

              <!-- 5. 「海岸公路賽」右下角版本號 v0.8 (與主標題相同漸層色、無黑邊、字體放大2倍) -->
              <g
                font-family="'Consolas', 'Segoe UI', 'Arial', sans-serif"
                font-weight="900"
                font-style="italic"
                font-size="44"
                letter-spacing="1"
              >
                <text
                  x="626"
                  y="174"
                  text-anchor="end"
                  fill="url(#titleFillGrad)"
                >v0.8</text>
              </g>
            </svg>
          </div>
          <button id="startRaceBtn" class="cta-btn">開始競速</button>
        </div>
      </div>

      <!-- 賽後結算面板 Modal (移除上方標題文字，僅顯示答對、答錯(含逾時)、極速與重新開始按鈕) -->
      <div id="resultModal" class="modal-backdrop hidden">
        <div class="race-card">
          <div class="stats-board">
            <div class="stat-row">
              <span class="stat-name">答對</span>
              <span id="resCorrect" class="stat-num green">0 題</span>
            </div>
            <div class="stat-row">
              <span class="stat-name">答錯</span>
              <span id="resWrong" class="stat-num red">0 題</span>
            </div>
            <div class="stat-row">
              <span class="stat-name">極速</span>
              <span id="resTopSpeed" class="stat-num cyan">120 km/h</span>
            </div>
          </div>
          <button id="replayBtn" class="cta-btn">重新開始</button>
        </div>
      </div>
    </section>

    <!-- ================= 下半部：控制面板區 ================= -->
    <section class="control-section">
      <div class="numpad-grid" id="numpadGrid">
        <button type="button" class="mech-key" data-digit="1"><span>1</span></button>
        <button type="button" class="mech-key" data-digit="2"><span>2</span></button>

  <script>
    (() => {
      'use strict';

      // ======================== Web Audio API 擬真合成音效引擎 + 內嵌 MIDI 自動合成播放器 ========================
      class SoundEngine {
        constructor() {
          this.ctx = null;
          this.enabled = true;
          this.distortionCurve = null;

          // 遊戲整體音量總線 (開始前與結束後降為 50%，倒數完恢復 100%；倒數提示音獨立維持 100%)
          this.gameBusGain = null;

          // 內嵌 MIDI 背景音樂 (BGM) 狀態與元素控制 (從頭到尾維持 20% / 0.2)
          this.bgmAudio = document.getElementById('bgmAudio');
          this.bgmVolumeRatio = 0.2;
          this.bgmFadeTimer = null;
          this.bgmReplayTimeoutId = null;
          this.bgmWaitingReplay = false;
          this.setupMidiBgm();

          // 持續排氣轟隆聲 (Continuous Exhaust Rumble) 狀態與節點
          this.engineRunning = false;
          this.engineMasterGain = null;
          this.mufflerFilter = null;
          this.exhaustNoiseFilter = null;
          this.chugLfo = null;
          this.chugFilterGain = null;
          this.engineOscs = [];

          // 時速 >= 300 升空時的持續「噗噗」氣流噴射聲節點
          this.hoverJetGain = null;
          this.hoverJetBand = null;
          this.hoverSizzleBand = null;
          this.hoverPuffLfo = null;
        }

        // 解析內嵌的 Standard MIDI File (.mid) Base64 資料並即時合成高品質 WAV 音訊供 <audio> 播放
        setupMidiBgm() {
          if (!this.bgmAudio) return;
          this.bgmAudio.loop = false; // 手動控制播完間隔 2 秒後重新播放
          this.bgmAudio.volume = 0.2;

          const midiEl = document.getElementById('bgmMidiBase64');
          if (midiEl && midiEl.textContent) {
            try {
              const wavBlob = this.synthesizeMidiToWavBlob(midiEl.textContent.trim());
              if (wavBlob) {
                this.bgmAudio.src = URL.createObjectURL(wavBlob);
              }
            } catch (err) {
              console.error('MIDI synthesis error:', err);
            }
          }

          this.bgmAudio.addEventListener('ended', () => {
            if (this.bgmReplayTimeoutId) clearTimeout(this.bgmReplayTimeoutId);
            this.bgmWaitingReplay = true;
            // 音樂播完，間隔 2 秒，重新播放
            this.bgmReplayTimeoutId = setTimeout(() => {
              this.bgmWaitingReplay = false;
              if (!this.bgmAudio) return;
              this.bgmAudio.currentTime = 0;
              this.bgmAudio.volume = this.bgmVolumeRatio;
              this.tryPlayBgm();
            }, 2000);
          });
        }

        // 將 Base64 編碼的 .mid 檔案解析為音符事件並高速合成為 PCM WAV Blob
        synthesizeMidiToWavBlob(base64Str) {
          const binStr = atob(base64Str);
          const len = binStr.length;
          const bytes = new Uint8Array(len);
          for (let i = 0; i < len; i++) {
            bytes[i] = binStr.charCodeAt(i);
          }

          // 解析 MIDI Header (MThd)
          const division = (bytes[12] << 8) | bytes[13];
          const secPerTick = 0.625 / division; // 96 BPM (每拍 0.625 秒)
          let pos = 14;
          let trackIdx = 0;
          const allNotes = [];
          let maxEndTime = 0;

          while (pos < len) {
            const chunkLen =
              ((bytes[pos + 4] << 24) >>> 0) +
              (bytes[pos + 5] << 16) +
              (bytes[pos + 6] << 8) +
              bytes[pos + 7];
            const tEnd = pos + 8 + chunkLen;
            let p = pos + 8;
            let runningStatus = 0;
            let ticks = 0;
            const active = new Map();

            while (p < tEnd) {
              let dt = 0;
              while (p < tEnd) {
                const b = bytes[p++];
                dt = (dt << 7) | (b & 0x7f);
                if ((b & 0x80) === 0) break;
              }
              ticks += dt;

              let st = bytes[p];
              if (st >= 0x80) {
                p++;
                if (st < 0xf0) runningStatus = st;
              } else {
                st = runningStatus;
              }

              if (st === 0xff) {
                p++; // meta type
                let mLen = 0;
                while (p < tEnd) {
                  const b = bytes[p++];
                  mLen = (mLen << 7) | (b & 0x7f);
                  if ((b & 0x80) === 0) break;
                }
                p += mLen;
              } else if (st === 0xf0 || st === 0xf7) {
                let sLen = 0;
                while (p < tEnd) {
                  const b = bytes[p++];
                  sLen = (sLen << 7) | (b & 0x7f);
                  if ((b & 0x80) === 0) break;
                }
                p += sLen;
              } else {
                const hi = st & 0xf0;
                if (hi === 0x80 || hi === 0x90 || hi === 0xa0 || hi === 0xb0 || hi === 0xe0) {
                  const d1 = bytes[p++];
                  const d2 = bytes[p++];
                  if (hi === 0x90 && d2 > 0) {
                    if (active.has(d1)) {
                      const prev = active.get(d1);
                      if (ticks > prev.t) {
                        const startSec = prev.t * secPerTick;
                        const durSec = (ticks - prev.t) * secPerTick;
                        allNotes.push({ trk: trackIdx, pitch: d1, vel: prev.v, start: startSec, dur: durSec });
                        if (startSec + durSec > maxEndTime) maxEndTime = startSec + durSec;
                      }
                    }
                    active.set(d1, { t: ticks, v: d2 });
                  } else if (hi === 0x80 || (hi === 0x90 && d2 === 0)) {
                    if (active.has(d1)) {
                      const prev = active.get(d1);
                      active.delete(d1);
                      if (ticks > prev.t) {
                        const startSec = prev.t * secPerTick;
                        const durSec = (ticks - prev.t) * secPerTick;
                        allNotes.push({ trk: trackIdx, pitch: d1, vel: prev.v, start: startSec, dur: durSec });
                        if (startSec + durSec > maxEndTime) maxEndTime = startSec + durSec;
                      }
                    }
                  }
                } else if (hi === 0xc0 || hi === 0xd0) {
                  p++;
                }
              }
            }
            pos = tEnd;
            trackIdx++;
          }

          const sr = 22050;
          const totalSamples = Math.ceil((maxEndTime + 0.6) * sr);
          const mix = new Float32Array(totalSamples);

          // 預先合成鼓組樣本 (Tracks 0~5)
          const drumCache = new Map();
          const getDrumWave = (trk, pitch) => {
            const key = `${trk}_${pitch}`;
            if (drumCache.has(key)) return drumCache.get(key);
            let dur = 0.22;
            if (trk === 1) dur = pitch === 42 ? 0.065 : 0.28;
            else if (trk === 3) dur = 0.28;
            else if (trk === 4) dur = 0.52;
            const n = Math.floor(dur * sr);
            const buf = new Float32Array(n);
            let phase = 0;

            for (let i = 0; i < n; i++) {
              const t = i / sr;
              const noise = Math.random() * 2 - 1;
              if (trk === 2) {
                // Bass Drum (Kick)
                const f = 44 + 115 * Math.exp(-t * 36);
                phase += (2 * Math.PI * f) / sr;
                const click = Math.exp(-t * 140) * 0.45 * noise;
                buf[i] = (Math.sin(phase) * 0.95 + click) * Math.exp(-t * 13);
              } else if (trk === 0) {
                // Snare Drum
                const f = 115 + 95 * Math.exp(-t * 28);
                phase += (2 * Math.PI * f) / sr;
                const body = Math.sin(phase) * 0.55 * Math.exp(-t * 24);
                const snare = noise * 0.75 * Math.exp(-t * 17);
                buf[i] = body + snare;
              } else if (trk === 5) {
                // Toms
                const baseF = pitch === 41 ? 88 : pitch === 45 ? 118 : 155;
                const f = baseF * (1 + 0.55 * Math.exp(-t * 22));
                phase += (2 * Math.PI * f) / sr;
                buf[i] = Math.sin(phase) * 0.85 * Math.exp(-t * 12);
              } else {
                // Hi-Hat / Ride / Crash Cymbal
                const m1 = Math.sin(2 * Math.PI * 820 * t) * Math.sin(2 * Math.PI * 1340 * t);
                const m2 = Math.sin(2 * Math.PI * 2180 * t) * Math.sin(2 * Math.PI * 3410 * t);
                const decay = trk === 1 && pitch === 42 ? 48 : trk === 3 ? 12 : 6.8;
                const level = trk === 4 ? 0.34 : trk === 1 && pitch !== 42 ? 0.32 : 0.38;
                buf[i] = (noise * 0.65 + (m1 + m2) * 0.35) * Math.exp(-t * decay) * level;
              }
            }
            drumCache.set(key, buf);
            return buf;
          };

          // 建立各樂器單週期雙波表 (Attack 亮音波表 + Sustain 延音波表，長度 2048)
          const TABLE_LEN = 2048;
          const TABLE_MASK = TABLE_LEN - 1;
          const buildWave = (amps, clip = 1.0) => {
            const tbl = new Float32Array(TABLE_LEN);
            let maxV = 0.001;
            for (let i = 0; i < TABLE_LEN; i++) {
              const th = (2 * Math.PI * i) / TABLE_LEN;
              let s = 0;
              for (let h = 0; h < amps.length; h++) {
                if (amps[h] !== 0) s += amps[h] * Math.sin((h + 1) * th);
              }
              if (clip > 1.0) s = Math.tanh(s * clip);
              tbl[i] = s;
              if (Math.abs(s) > maxV) maxV = Math.abs(s);
            }
            for (let i = 0; i < TABLE_LEN; i++) tbl[i] /= maxV;
            return tbl;
          };

          const instTables = {
            // Track 6: Saxophone (主唱旋律音色)
            6: {
              atk: buildWave([1.0, 0.72, 0.65, 0.42, 0.28, 0.18, 0.12, 0.06], 1.3),
              sus: buildWave([1.0, 0.60, 0.48, 0.26, 0.14, 0.06], 1.15),
              gain: 0.32
            },
            // Track 7: Flute (和聲旋律音色)
            7: {
              atk: buildWave([1.0, 0.38, 0.16, 0.05], 1.0),
              sus: buildWave([1.0, 0.24, 0.08], 1.0),
              gain: 0.24
            },
            // Track 8: Bass Guitar (Fingered Electric Bass)
            8: {
              atk: buildWave([1.0, 0.88, 0.65, 0.42, 0.25, 0.14, 0.08], 1.45),
              sus: buildWave([1.0, 0.62, 0.28, 0.08], 1.25),
              gain: 0.48
            },
            // Track 9 & 12: Clean/Crunch Electric Guitar (清脆彈撥電吉他與 Solo)
            9: {
              atk: buildWave([1.0, 0.85, 0.78, 0.62, 0.50, 0.38, 0.26, 0.18, 0.12, 0.08], 1.55),
              sus: buildWave([1.0, 0.65, 0.48, 0.25, 0.12, 0.06], 1.25),
              gain: 0.25
            },
            // Track 10 & 11: Distortion Guitar (Overdrive Power Chords)
            10: {
              atk: buildWave([1.0, 0.90, 0.85, 0.72, 0.64, 0.52, 0.40, 0.30, 0.22, 0.15, 0.10], 2.4),
              sus: buildWave([1.0, 0.82, 0.74, 0.56, 0.42, 0.28, 0.18, 0.10], 2.1),
              gain: 0.20
            }
          };
          instTables[11] = instTables[10];
          instTables[12] = instTables[9];

          // 混音所有音符事件
          for (let idx = 0; idx < allNotes.length; idx++) {
            const ev = allNotes[idx];
            const startSample = Math.floor(ev.start * sr);
            if (startSample >= totalSamples) continue;
            const velNorm = Math.min(1.25, ev.vel / 38);

            if (ev.trk <= 5) {
              const dBuf = getDrumWave(ev.trk, ev.pitch);
              const dLen = Math.min(dBuf.length, totalSamples - startSample);
              const amp = velNorm * 0.48;
              for (let i = 0; i < dLen; i++) {
                mix[startSample + i] += dBuf[i] * amp;
              }
            } else {
              const spec = instTables[ev.trk] || instTables[9];
              const freq = 440 * Math.pow(2, (ev.pitch - 69) / 12);
              const releaseSec = ev.trk === 8 ? 0.04 : 0.065;
              const noteSamples = Math.min(
                Math.floor((ev.dur + releaseSec) * sr),
                totalSamples - startSample
              );
              const durSamples = Math.floor(ev.dur * sr);
              const atkSamples = Math.max(1, Math.floor(0.008 * sr));
              const pluckFadeSamples = Math.max(1, Math.floor(0.085 * sr));
              const relSamples = Math.max(1, noteSamples - durSamples);

              const baseStep = (freq * TABLE_LEN) / sr;
              const amp = velNorm * spec.gain;
              const atkTbl = spec.atk;
              const susTbl = spec.sus;
              const isGuitarOrBass = ev.trk === 8 || ev.trk === 9 || ev.trk === 12;
              const useVibrato = ev.trk === 6 || ev.trk === 7;
              let phase = 0;

              for (let i = 0; i < noteSamples; i++) {
                let env = 1.0;
                if (i < atkSamples) {
                  env = i / atkSamples;
                } else if (i > durSamples) {
                  env = 1.0 - (i - durSamples) / relSamples;
                }
                if (isGuitarOrBass) {
                  env *= Math.exp(-i / (sr * (ev.trk === 8 ? 0.95 : 1.15)));
                }

                const pIdx = (phase | 0) & TABLE_MASK;
                let sampleVal;
                if (i < pluckFadeSamples) {
                  const w = i / pluckFadeSamples;
                  sampleVal = atkTbl[pIdx] * (1 - w) + susTbl[pIdx] * w;
                } else {
                  sampleVal = susTbl[pIdx];
                }

                mix[startSample + i] += sampleVal * env * amp;

                if (useVibrato && i > 2600) {
                  phase += baseStep * (1 + 0.0045 * Math.sin(i * 0.00155));
                } else {
                  phase += baseStep;
                }
              }
            }
          }

          // 封裝為標準 16-bit PCM WAV 檔案
          const wavByteLen = 44 + totalSamples * 2;
          const wavBuf = new ArrayBuffer(wavByteLen);
          const view = new DataView(wavBuf);
          const writeStr = (offset, str) => {
            for (let i = 0; i < str.length; i++) view.setUint8(offset + i, str.charCodeAt(i));
          };

          writeStr(0, 'RIFF');
          view.setUint32(4, wavByteLen - 8, true);
          writeStr(8, 'WAVE');
          writeStr(12, 'fmt ');
          view.setUint32(16, 16, true);
          view.setUint16(20, 1, true);
          view.setUint16(22, 1, true);
          view.setUint32(24, sr, true);
          view.setUint32(28, sr * 2, true);
          view.setUint16(32, 2, true);
          view.setUint16(34, 16, true);
          writeStr(36, 'data');
          view.setUint32(40, totalSamples * 2, true);

          const pcmOut = new Int16Array(wavBuf, 44, totalSamples);
          for (let i = 0; i < totalSamples; i++) {
            const s = Math.tanh(mix[i] * 0.92);
            pcmOut[i] = (s * 32767) | 0;
          }

          return new Blob([wavBuf], { type: 'audio/wav' });
        }

        init() {
          if (!this.ctx) {
            const AudioCtx = window.AudioContext || window.webkitAudioContext;
            if (AudioCtx) {
              this.ctx = new AudioCtx();
              this.distortionCurve = this.makeDistortionCurve(55);
              this.gameBusGain = this.ctx.createGain();
              // 遊戲開始前預設降低整體音效輸出 50%
              this.gameBusGain.gain.setValueAtTime(0.5, this.ctx.currentTime);
              this.gameBusGain.connect(this.ctx.destination);
            }
          }
          if (this.ctx && this.ctx.state === 'suspended') {
            this.ctx.resume().catch(() => {});
          }
        }

        // 啟動背景音樂播放
        tryPlayBgm() {
          if (!this.bgmAudio || this.bgmWaitingReplay) return;
          this.bgmAudio.volume = this.bgmVolumeRatio;
          if (!this.bgmAudio.paused) return;
          const playPromise = this.bgmAudio.play();
          if (playPromise && typeof playPromise.then === 'function') {
            playPromise.catch(() => {});
          }
        }

        // 啟動或確保 MIDI 背景音樂正在播放 (restartFromBeginning = true 時從頭播放)
        startBGM(initialRatio = 0.2, restartFromBeginning = false) {
          if (restartFromBeginning && this.bgmAudio) {
            if (this.bgmReplayTimeoutId) {
              clearTimeout(this.bgmReplayTimeoutId);
              this.bgmReplayTimeoutId = null;
            }
            this.bgmWaitingReplay = false;
            this.bgmAudio.currentTime = 0;
          }
          this.setBgmVolume(initialRatio, true);
          this.tryPlayBgm();
        }

        // 設定背景音樂音量比例 (固定維持 20% / 0.2)
        setBgmVolume(ratio = 0.2, immediate = false, durationMs = 1000) {
          this.bgmVolumeRatio = Math.max(0, Math.min(1, ratio));
          if (!this.bgmAudio) return;

          if (this.bgmFadeTimer) {
            clearInterval(this.bgmFadeTimer);
            this.bgmFadeTimer = null;
          }

          if (immediate || durationMs <= 0) {
            this.bgmAudio.volume = this.bgmVolumeRatio;
            return;
          }

          const startVol = this.bgmAudio.volume;
          const targetVol = this.bgmVolumeRatio;
          if (Math.abs(targetVol - startVol) < 0.005) {
            this.bgmAudio.volume = targetVol;
            return;
          }

          const fadeStartTime = performance.now();
          this.bgmFadeTimer = setInterval(() => {
            if (!this.bgmAudio) {
              clearInterval(this.bgmFadeTimer);
              this.bgmFadeTimer = null;
              return;
            }
            const elapsed = performance.now() - fadeStartTime;
            const t = Math.min(1, elapsed / durationMs);
            // 使用平滑餘弦漸入漸出曲線 (約 1 秒完成檔位切換)
            const eased = 0.5 - 0.5 * Math.cos(t * Math.PI);
            this.bgmAudio.volume = Math.max(0, Math.min(1, startVol + (targetVol - startVol) * eased));
            if (t >= 1) {
              this.bgmAudio.volume = targetVol;
              clearInterval(this.bgmFadeTimer);
              this.bgmFadeTimer = null;
            }
          }, 20);
        }

        // 設定整體遊戲音量倍率 (開始前與結束後為 0.5，正式比賽期間為 1.0)
        setGameVolumeMultiplier(mult = 1.0) {
          this.init();
          if (!this.ctx || !this.gameBusGain) return;
          const now = this.ctx.currentTime;
          this.gameBusGain.gain.cancelScheduledValues(now);
          this.gameBusGain.gain.setValueAtTime(this.gameBusGain.gain.value, now);
          this.gameBusGain.gain.linearRampToValueAtTime(mult, now + 0.12);
        }

        makeDistortionCurve(amount = 50) {
          const nSamples = 44100;
          const curve = new Float32Array(nSamples);
          const deg = Math.PI / 180;
          for (let i = 0; i < nSamples; ++i) {
            const x = (i * 2) / nSamples - 1;
            curve[i] = ((3 + amount) * x * 20 * deg) / (Math.PI + amount * Math.abs(x));
          }
          return curve;
        }

        // 計算每一階速度 (25, 50, 75, 100, 125, 150...) 對應的固定排氣基頻 (速度越快頻率越高)
        getStepFrequency(speed) {
          if (speed <= 0) return 0;
          const stepIndex = Math.max(1, Math.round(speed / 25));
          // 第 1 階 (25 km/h) 為 38Hz 低頻轟隆聲，每升一階 (+25 km/h) 依固定音階比例提升約 7.8%
          return Math.min(38 * Math.pow(1.078, stepIndex - 1), 480);
        }

        // 建立並確保車子持續低頻排氣轟隆聲的合成節點已啟動
        ensureContinuousEngine() {
          if (!this.enabled) return;
          this.init();
          if (!this.ctx || this.engineRunning) return;

          const now = this.ctx.currentTime;

          this.engineMasterGain = this.ctx.createGain();
          this.engineMasterGain.gain.setValueAtTime(0.0001, now);

          // 低頻排氣管消音器濾波 (保留渾厚低頻轟隆感，隨轉速微幅開合)
          this.mufflerFilter = this.ctx.createBiquadFilter();
          this.mufflerFilter.type = 'lowpass';
          this.mufflerFilter.Q.setValueAtTime(2.6, now);
          this.mufflerFilter.frequency.setValueAtTime(240, now);

          // 排氣胸腔共鳴增強 (95Hz 低頻飽滿度)
          const bassBoost = this.ctx.createBiquadFilter();
          bassBoost.type = 'peaking';
          bassBoost.frequency.setValueAtTime(95, now);
          bassBoost.Q.setValueAtTime(1.3, now);
          bassBoost.gain.setValueAtTime(6.0, now);

          // 點火脈衝「轟隆隆」振幅調變節點
          const chugAmpNode = this.ctx.createGain();
          chugAmpNode.gain.setValueAtTime(0.82, now);

          this.chugLfo = this.ctx.createOscillator();
          this.chugLfo.type = 'sine';
          this.chugLfo.frequency.setValueAtTime(16, now);

          const chugAmpDepth = this.ctx.createGain();
          chugAmpDepth.gain.setValueAtTime(0.20, now);
          this.chugLfo.connect(chugAmpDepth);
          chugAmpDepth.connect(chugAmpNode.gain);

          this.chugFilterGain = this.ctx.createGain();
          this.chugFilterGain.gain.setValueAtTime(38, now);
          this.chugLfo.connect(this.chugFilterGain);
          this.chugFilterGain.connect(this.mufflerFilter.frequency);
          this.chugLfo.start(now);

          const shaper = this.ctx.createWaveShaper();
          shaper.curve = this.distortionCurve;
          shaper.oversample = '2x';

          shaper.connect(bassBoost);
          bassBoost.connect(this.mufflerFilter);
          this.mufflerFilter.connect(chugAmpNode);
          chugAmpNode.connect(this.engineMasterGain);
          this.engineMasterGain.connect(this.gameBusGain);

          // 構成低頻排氣轟隆聲的多階諧波振盪器 (0.5x 超低頻、1.0x 基頻、1.5x 排氣共鳴、2.0x 倍頻)
          const harmonicSpecs = [
            { ratio: 0.5, type: 'sawtooth', amp: 0.52 },
            { ratio: 1.0, type: 'sawtooth', amp: 0.68 },
            { ratio: 1.5, type: 'triangle', amp: 0.36 },
            { ratio: 2.0, type: 'sawtooth', amp: 0.25 }
          ];

          this.engineOscs = harmonicSpecs.map((spec) => {
            const osc = this.ctx.createOscillator();
            const g = this.ctx.createGain();
            osc.type = spec.type;
            osc.frequency.setValueAtTime(50 * spec.ratio, now);
            g.gain.setValueAtTime(spec.amp, now);
            osc.connect(g);
            g.connect(shaper);
            osc.start(now);
            return { osc, ratio: spec.ratio };
          });

          // 循環低頻排氣氣流轟隆噪聲 (Brown Noise) + 時速 300 升空時的微弱氣流噴射白噪音源
          const bufLen = this.ctx.sampleRate * 2;
          const noiseBuf = this.ctx.createBuffer(1, bufLen, this.ctx.sampleRate);
          const out = noiseBuf.getChannelData(0);
          const airBuf = this.ctx.createBuffer(1, bufLen, this.ctx.sampleRate);
          const airOut = airBuf.getChannelData(0);
          let lastOut = 0.0;
          for (let i = 0; i < bufLen; i++) {
            const white = Math.random() * 2 - 1;
            out[i] = (lastOut + 0.04 * white) / 1.04;
            lastOut = out[i];
            out[i] *= 2.5;
            // 渾厚低中頻氣團混合氣流噪聲 (營造飽滿的「噗噗」推進氣團質感)
            airOut[i] = out[i] * 0.72 + white * 0.42;
          }
          const noiseSrc = this.ctx.createBufferSource();
          noiseSrc.buffer = noiseBuf;
          noiseSrc.loop = true;

          this.exhaustNoiseFilter = this.ctx.createBiquadFilter();
          this.exhaustNoiseFilter.type = 'bandpass';
          this.exhaustNoiseFilter.Q.setValueAtTime(1.4, now);
          this.exhaustNoiseFilter.frequency.setValueAtTime(160, now);

          const noiseGain = this.ctx.createGain();
          noiseGain.gain.setValueAtTime(0.35, now);

          noiseSrc.connect(this.exhaustNoiseFilter);
          this.exhaustNoiseFilter.connect(noiseGain);
          noiseGain.connect(chugAmpNode);
          noiseSrc.start(now);

          // 建立時速 >= 300 時車底噴射白煙的持續「噗噗」氣流噴射聲 (Continuous "Puff-Puff" Pulse-Jet Thruster)
          const airSrc = this.ctx.createBufferSource();
          airSrc.buffer = airBuf;
          airSrc.loop = true;

          // 1. 「噗 (Puh)」低中頻氣團共鳴主濾波器 (中心約 265Hz，隨每次噴氣脈衝開合)
          this.hoverJetBand = this.ctx.createBiquadFilter();
          this.hoverJetBand.type = 'bandpass';
          this.hoverJetBand.frequency.setValueAtTime(265, now);
          this.hoverJetBand.Q.setValueAtTime(2.1, now);

          // 2. 中頻推進氣柱濾波器 (中心約 760Hz，表現噴射氣流的空氣推力感)
          this.hoverSizzleBand = this.ctx.createBiquadFilter();
          this.hoverSizzleBand.type = 'bandpass';
          this.hoverSizzleBand.frequency.setValueAtTime(760, now);
          this.hoverSizzleBand.Q.setValueAtTime(1.6, now);

          const jetMidGain = this.ctx.createGain();
          jetMidGain.gain.setValueAtTime(0.68, now);

          // 3. 氣動低頻「噗」鼓動振盪器 (疊加微弱 68Hz 氣壓震波，強化「噗、噗、噗」的噴射彈性)
          const puffThumpOsc = this.ctx.createOscillator();
          const puffThumpGain = this.ctx.createGain();
          puffThumpOsc.type = 'triangle';
          puffThumpOsc.frequency.setValueAtTime(68, now);
          puffThumpGain.gain.setValueAtTime(0.26, now);
          puffThumpOsc.connect(puffThumpGain);
          puffThumpOsc.start(now);

          // 溫暖低通修飾 (切除刺耳高頻「ㄘㄘ」聲，保留渾厚紮實的「噗噗」氣流噴射聲)
          const puffLowpass = this.ctx.createBiquadFilter();
          puffLowpass.type = 'lowpass';
          puffLowpass.frequency.setValueAtTime(1380, now);
          puffLowpass.Q.setValueAtTime(0.9, now);

          // 4. 產生連續「噗-噗-噗-噗」噴射律動的深度脈衝調變 (10.5Hz ~ 13.5Hz)
          const puffPulseNode = this.ctx.createGain();
          puffPulseNode.gain.setValueAtTime(0.52, now);

          this.hoverPuffLfo = this.ctx.createOscillator();
          const puffLfoAmp = this.ctx.createGain();
          const puffLfoFreq1 = this.ctx.createGain();
          const puffLfoFreq2 = this.ctx.createGain();
          const puffLfoThump = this.ctx.createGain();

          this.hoverPuffLfo.type = 'sine';
          this.hoverPuffLfo.frequency.setValueAtTime(10.5, now); // 每秒約 10.5 次「噗噗」快速連續脈動

          puffLfoAmp.gain.setValueAtTime(0.46, now);   // 振幅在 0.06 ~ 0.98 間深幅收放，形成明顯「噗噗」感且不中斷
          puffLfoFreq1.gain.setValueAtTime(130, now);  // 隨每一下「噗」同步推高氣團頻率 (135Hz <-> 395Hz)
          puffLfoFreq2.gain.setValueAtTime(280, now);  // 隨每一下「噗」同步推高噴射氣流頻率 (480Hz <-> 1040Hz)
          puffLfoThump.gain.setValueAtTime(22, now);   // 隨每一下「噗」同步產生低頻氣壓彈跳 (46Hz <-> 90Hz)

          this.hoverPuffLfo.connect(puffLfoAmp);
          puffLfoAmp.connect(puffPulseNode.gain);

          this.hoverPuffLfo.connect(puffLfoFreq1);
          puffLfoFreq1.connect(this.hoverJetBand.frequency);

          this.hoverPuffLfo.connect(puffLfoFreq2);
          puffLfoFreq2.connect(this.hoverSizzleBand.frequency);

          this.hoverPuffLfo.connect(puffLfoThump);
          puffLfoThump.connect(puffThumpOsc.frequency);

          this.hoverPuffLfo.start(now);

          this.hoverJetGain = this.ctx.createGain();
          this.hoverJetGain.gain.setValueAtTime(0.0001, now);

          airSrc.connect(this.hoverJetBand);
          this.hoverJetBand.connect(puffLowpass);

          airSrc.connect(this.hoverSizzleBand);
          this.hoverSizzleBand.connect(jetMidGain);
          jetMidGain.connect(puffLowpass);

          puffThumpGain.connect(this.hoverJetBand);

          puffLowpass.connect(puffPulseNode);
          puffPulseNode.connect(this.hoverJetGain);
          this.hoverJetGain.connect(this.gameBusGain);
          airSrc.start(now);

          this.engineRunning = true;
        }

        // 依據目前時速是否 >= 300，平滑啟閉車底「噗噗」氣流噴射聲
        updateHoverJetSound(speed) {
          if (!this.ctx || !this.hoverJetGain || !this.hoverJetBand || !this.hoverSizzleBand || !this.hoverPuffLfo) return;
          const now = this.ctx.currentTime;
          this.hoverJetGain.gain.cancelScheduledValues(now);
          const curVal = Math.max(0.0001, this.hoverJetGain.gain.value);
          this.hoverJetGain.gain.setValueAtTime(curVal, now);

          if (speed >= 300) {
            const speedOver = Math.max(0, speed - 300);
            const puffRate = Math.min(14.5, 10.5 + speedOver * 0.025);
            const bodyPitch = Math.min(360, 265 + speedOver * 0.55);
            const jetPitch = Math.min(1050, 760 + speedOver * 1.6);

            this.hoverPuffLfo.frequency.cancelScheduledValues(now);
            this.hoverPuffLfo.frequency.setTargetAtTime(puffRate, now, 0.12);
            this.hoverJetBand.frequency.cancelScheduledValues(now);
            this.hoverJetBand.frequency.setTargetAtTime(bodyPitch, now, 0.12);
            this.hoverSizzleBand.frequency.cancelScheduledValues(now);
            this.hoverSizzleBand.frequency.setTargetAtTime(jetPitch, now, 0.12);

            // 升空後維持清晰而有彈性的「噗噗」氣流噴射聲 (噴氣聲加大 50%: 0.1645*1.5=0.2468, 0.1316*1.5=0.1974)
            this.hoverJetGain.gain.linearRampToValueAtTime(0.2468, now + 0.08);
            this.hoverJetGain.gain.linearRampToValueAtTime(0.1974, now + 0.28);
          } else {
            this.hoverJetGain.gain.exponentialRampToValueAtTime(0.0001, now + 0.30);
          }
        }

        // 設定持續排氣聲為指定速度對應的固定頻率 (供起跑時以 125 km/h 啟動)
        startEngineAtSpeed(speed = 125) {
          if (!this.enabled) return;
          this.ensureContinuousEngine();
          if (!this.ctx || !this.engineRunning) return;

          const now = this.ctx.currentTime;
          if (speed <= 0) {
            this.engineMasterGain.gain.cancelScheduledValues(now);
            this.engineMasterGain.gain.setTargetAtTime(0.0001, now, 0.08);
            return;
          }

          const baseFreq = this.getStepFrequency(speed);
          this.engineOscs.forEach(({ osc, ratio }) => {
            osc.frequency.cancelScheduledValues(now);
            osc.frequency.setValueAtTime(baseFreq * ratio, now);
          });

          this.chugLfo.frequency.cancelScheduledValues(now);
          this.chugLfo.frequency.setValueAtTime(Math.min(52, baseFreq * 0.32), now);

          this.mufflerFilter.frequency.cancelScheduledValues(now);
          this.mufflerFilter.frequency.setValueAtTime(Math.min(1800, baseFreq * 4.8), now);

          this.exhaustNoiseFilter.frequency.cancelScheduledValues(now);
          this.exhaustNoiseFilter.frequency.setValueAtTime(Math.min(900, baseFreq * 3.2), now);

          // 引擎持續轟隆聲降低 10% (0.2074 * 0.9 = 0.1867)
          this.engineMasterGain.gain.cancelScheduledValues(now);
          this.engineMasterGain.gain.setValueAtTime(Math.max(0.001, this.engineMasterGain.gain.value), now);
          this.engineMasterGain.gain.linearRampToValueAtTime(0.1867, now + 0.15);

          this.updateHoverJetSound(speed);
        }

        // 從時速 0 到 25 km/h：播放汽車啟動馬達與點火發動聲，隨後進入 25 km/h 的持續低頻轟隆聲 (靜止時引擎發動再 +100%)
        playIgnitionFromZeroTo25() {
          if (!this.enabled) return;
          this.ensureContinuousEngine();
          if (!this.ctx || !this.engineRunning) return;

          const now = this.ctx.currentTime;
          const target25Freq = this.getStepFrequency(25); // 38 Hz

          // (A) 0.00s ~ 0.34s：啟動馬達運轉聲 ("啾-啾-啾" 壓縮衝程啟動音，靜止發動音量再 +100%)
          const crankDur = 0.34;
          const starterOsc = this.ctx.createOscillator();
          const starterMod = this.ctx.createOscillator();
          const starterModGain = this.ctx.createGain();
          const starterFilter = this.ctx.createBiquadFilter();
          const starterGain = this.ctx.createGain();

          starterOsc.type = 'sawtooth';
          starterOsc.frequency.setValueAtTime(165, now);
          starterOsc.frequency.linearRampToValueAtTime(215, now + crankDur);

          starterMod.type = 'sine';
          starterMod.frequency.setValueAtTime(10.5, now); // 約 3 次氣缸壓縮脈衝
          starterModGain.gain.setValueAtTime(42, now);
          starterMod.connect(starterModGain);
          starterModGain.connect(starterOsc.frequency);

          starterFilter.type = 'bandpass';
          starterFilter.frequency.setValueAtTime(480, now);
          starterFilter.Q.setValueAtTime(2.5, now);

          starterGain.gain.setValueAtTime(0.01, now);
          starterGain.gain.linearRampToValueAtTime(0.7206, now + 0.03);
          starterGain.gain.setValueAtTime(0.6694, now + crankDur - 0.04);
          starterGain.gain.exponentialRampToValueAtTime(0.001, now + crankDur);

          starterOsc.connect(starterFilter);
          starterFilter.connect(starterGain);
          starterGain.connect(this.gameBusGain);

          starterOsc.start(now);
          starterMod.start(now);
          starterOsc.stop(now + crankDur);
          starterMod.stop(now + crankDur);

          // (B) 0.32s ~ 0.85s：點火成功瞬間的排氣爆發轟鳴 ("轟——！" 拉起後回落至 25 km/h 怠速轟隆頻率)
          const catchTime = now + 0.30;
          const flareFreq = target25Freq * 1.85;

          this.engineOscs.forEach(({ osc, ratio }) => {
            osc.frequency.cancelScheduledValues(now);
            osc.frequency.setValueAtTime(22 * ratio, now);
            osc.frequency.setValueAtTime(26 * ratio, catchTime);
            osc.frequency.exponentialRampToValueAtTime(flareFreq * ratio, catchTime + 0.18);
            osc.frequency.exponentialRampToValueAtTime(target25Freq * ratio, catchTime + 0.55);
          });

          this.chugLfo.frequency.cancelScheduledValues(now);
          this.chugLfo.frequency.setValueAtTime(8, now);
          this.chugLfo.frequency.linearRampToValueAtTime(22, catchTime + 0.18);
          this.chugLfo.frequency.linearRampToValueAtTime(target25Freq * 0.32, catchTime + 0.55);

          this.mufflerFilter.frequency.cancelScheduledValues(now);
          this.mufflerFilter.frequency.setValueAtTime(140, now);
          this.mufflerFilter.frequency.exponentialRampToValueAtTime(460, catchTime + 0.18);
          this.mufflerFilter.frequency.exponentialRampToValueAtTime(target25Freq * 4.8, catchTime + 0.55);

          this.exhaustNoiseFilter.frequency.cancelScheduledValues(now);
          this.exhaustNoiseFilter.frequency.setValueAtTime(target25Freq * 3.2, catchTime);

          // 點火爆發峰值再提升 +100% (0.7362 * 2.0 = 1.4724)，隨後穩定於引擎轟隆聲 0.1867
          this.engineMasterGain.gain.cancelScheduledValues(now);
          this.engineMasterGain.gain.setValueAtTime(0.001, now);
          this.engineMasterGain.gain.setValueAtTime(0.01, catchTime);
          this.engineMasterGain.gain.linearRampToValueAtTime(1.4724, catchTime + 0.14);
          this.engineMasterGain.gain.linearRampToValueAtTime(0.1867, catchTime + 0.55);
        }

        // 1. 答對加速：若從 0->25 播放發動聲；否則將持續排氣轟隆聲升頻至下一階固定頻率並持續聲響
        shiftUpEngine(prevSpeed, newSpeed) {
          if (!this.enabled) return;
          this.ensureContinuousEngine();
          if (!this.ctx || !this.engineRunning) return;

          if (prevSpeed <= 0) {
            this.playIgnitionFromZeroTo25();
            return;
          }

          const now = this.ctx.currentTime;
          const prevFreq = this.getStepFrequency(prevSpeed);
          const newFreq = this.getStepFrequency(newSpeed);
          const flareFreq = newFreq * 1.15; // 換檔補油瞬間微幅拉轉後穩定在下一階固定頻率

          // 持續排氣轟隆聲升頻至下一階固定頻率，並保持持續發聲
          this.engineOscs.forEach(({ osc, ratio }) => {
            osc.frequency.cancelScheduledValues(now);
            osc.frequency.setValueAtTime(prevFreq * ratio, now);
            osc.frequency.exponentialRampToValueAtTime(flareFreq * ratio, now + 0.22);
            osc.frequency.exponentialRampToValueAtTime(newFreq * ratio, now + 0.50);
          });

          this.chugLfo.frequency.cancelScheduledValues(now);
          this.chugLfo.frequency.setValueAtTime(Math.min(52, prevFreq * 0.32), now);
          this.chugLfo.frequency.linearRampToValueAtTime(Math.min(56, newFreq * 0.32), now + 0.45);

          const prevCut = Math.min(1800, prevFreq * 4.8);
          const flareCut = Math.min(2200, flareFreq * 5.6);
          const newCut = Math.min(1800, newFreq * 4.8);

          this.mufflerFilter.frequency.cancelScheduledValues(now);
          this.mufflerFilter.frequency.setValueAtTime(prevCut, now);
          this.mufflerFilter.frequency.exponentialRampToValueAtTime(flareCut, now + 0.22);
          this.mufflerFilter.frequency.exponentialRampToValueAtTime(newCut, now + 0.50);

          this.exhaustNoiseFilter.frequency.cancelScheduledValues(now);
          this.exhaustNoiseFilter.frequency.setValueAtTime(Math.min(900, newFreq * 3.2), now + 0.3);

          // 答對加速聲降低 30% (1.0296 * 0.7 = 0.7207)，隨後維持穩定持續引擎轟隆聲 0.1867
          this.engineMasterGain.gain.cancelScheduledValues(now);
          this.engineMasterGain.gain.setValueAtTime(0.1867, now);
          this.engineMasterGain.gain.linearRampToValueAtTime(0.7207, now + 0.18);
          this.engineMasterGain.gain.linearRampToValueAtTime(0.1867, now + 0.52);

          this.updateHoverJetSound(newSpeed);
        }

        // 2. 答錯或超時減速：伴隨煞車聲播放明顯的引擎降頻聲，並將持續排氣聲降至下一階頻率 (若降至 0 則停止聲音)
        shiftDownEngine(prevSpeed, newSpeed) {
          if (!this.enabled) return;
          this.ensureContinuousEngine();
          if (!this.ctx || !this.engineRunning) return;
          if (prevSpeed <= 0) return;

          const now = this.ctx.currentTime;
          const prevFreq = this.getStepFrequency(prevSpeed);
          this.updateHoverJetSound(newSpeed);

          if (newSpeed <= 0) {
            // 速度由 25 降至 0：播放引擎轉速滑落熄火降頻聲，並將持續排氣聲完全停止
            const stopFreq = 18;
            this.engineOscs.forEach(({ osc, ratio }) => {
              osc.frequency.cancelScheduledValues(now);
              osc.frequency.setValueAtTime(prevFreq * ratio, now);
              osc.frequency.exponentialRampToValueAtTime(stopFreq * ratio, now + 0.55);
            });

            this.chugLfo.frequency.cancelScheduledValues(now);
            this.chugLfo.frequency.setValueAtTime(prevFreq * 0.32, now);
            this.chugLfo.frequency.linearRampToValueAtTime(5, now + 0.55);

            this.mufflerFilter.frequency.cancelScheduledValues(now);
            this.mufflerFilter.frequency.setValueAtTime(prevFreq * 4.8, now);
            this.mufflerFilter.frequency.exponentialRampToValueAtTime(75, now + 0.55);

            this.engineMasterGain.gain.cancelScheduledValues(now);
            this.engineMasterGain.gain.setValueAtTime(0.2746, now);
            this.engineMasterGain.gain.exponentialRampToValueAtTime(0.0001, now + 0.58);

            this.playDownshiftSweep(prevFreq, stopFreq, 0.58);
          } else {
            // 速度降至下一階 (> 0)：播放明顯降頻聲，並讓持續排氣轟隆聲降至新速度的固定頻率持續響起
            const newFreq = this.getStepFrequency(newSpeed);

            this.engineOscs.forEach(({ osc, ratio }) => {
              osc.frequency.cancelScheduledValues(now);
              osc.frequency.setValueAtTime(prevFreq * ratio, now);
              osc.frequency.exponentialRampToValueAtTime(newFreq * 0.92 * ratio, now + 0.36);
              osc.frequency.exponentialRampToValueAtTime(newFreq * ratio, now + 0.58);
            });

            this.chugLfo.frequency.cancelScheduledValues(now);
            this.chugLfo.frequency.setValueAtTime(Math.min(52, prevFreq * 0.32), now);
            this.chugLfo.frequency.linearRampToValueAtTime(Math.min(52, newFreq * 0.32), now + 0.50);

            const prevCut = Math.min(1800, prevFreq * 4.8);
            const newCut = Math.min(1800, newFreq * 4.8);
            this.mufflerFilter.frequency.cancelScheduledValues(now);
            this.mufflerFilter.frequency.setValueAtTime(prevCut, now);
            this.mufflerFilter.frequency.exponentialRampToValueAtTime(newCut, now + 0.50);

            this.exhaustNoiseFilter.frequency.cancelScheduledValues(now);
            this.exhaustNoiseFilter.frequency.setValueAtTime(Math.min(900, newFreq * 3.2), now + 0.3);

            this.engineMasterGain.gain.cancelScheduledValues(now);
            this.engineMasterGain.gain.setValueAtTime(0.2746, now);
            this.engineMasterGain.gain.linearRampToValueAtTime(0.1867, now + 0.55);

            this.playDownshiftSweep(prevFreq, newFreq, 0.55);
          }
        }

        // 輔助：減速時的引擎檔位降頻滑落聲 ("嗚——↘" 低頻收油減速聲浪，答錯音量再 +20%)
        playDownshiftSweep(fromFreq, toFreq, dur = 0.55) {
          if (!this.ctx) return;
          const now = this.ctx.currentTime;

          const osc = this.ctx.createOscillator();
          const subOsc = this.ctx.createOscillator();
          const filter = this.ctx.createBiquadFilter();
          const gain = this.ctx.createGain();

          osc.type = 'sawtooth';
          osc.frequency.setValueAtTime(fromFreq * 2.0, now);
          osc.frequency.exponentialRampToValueAtTime(Math.max(20, toFreq * 1.6), now + dur);

          subOsc.type = 'triangle';
          subOsc.frequency.setValueAtTime(fromFreq, now);
          subOsc.frequency.exponentialRampToValueAtTime(Math.max(15, toFreq * 0.85), now + dur);

          filter.type = 'lowpass';
          filter.Q.setValueAtTime(2.2, now);
          filter.frequency.setValueAtTime(Math.min(1200, fromFreq * 6.5), now);
          filter.frequency.exponentialRampToValueAtTime(Math.max(110, toFreq * 3.8), now + dur);

          gain.gain.setValueAtTime(0.01, now);
          gain.gain.linearRampToValueAtTime(0.1848, now + 0.04);
          gain.gain.exponentialRampToValueAtTime(0.001, now + dur);

          osc.connect(filter);
          subOsc.connect(filter);
          filter.connect(gain);
          gain.connect(this.gameBusGain);

          osc.start(now);
          subOsc.start(now);
          osc.stop(now + dur + 0.02);
          subOsc.stop(now + dur + 0.02);
        }

        playKeyClick(digit = 5) {
          if (!this.enabled) return;
          this.init();
          if (!this.ctx) return;

          const now = this.ctx.currentTime;
          const osc = this.ctx.createOscillator();
          const gain = this.ctx.createGain();
          osc.type = 'triangle';
          osc.frequency.setValueAtTime(520 + Number(digit) * 28, now);
          osc.frequency.exponentialRampToValueAtTime(190, now + 0.045);

          gain.gain.setValueAtTime(0.16, now);
          gain.gain.exponentialRampToValueAtTime(0.001, now + 0.045);

          osc.connect(gain);
          gain.connect(this.gameBusGain);
          osc.start(now);
          osc.stop(now + 0.05);
        }

        // 2. 答錯或超時音效：擬真輪胎摩擦柏油地面的急煞聲 (移除尖銳合成器音，改為厚實橡膠胎塊磨地聲「嚓——嘶——」，煞車音量再 +5%)
        playBrakeWarning() {
          if (!this.enabled) return;
          this.init();
          if (!this.ctx) return;

          const now = this.ctx.currentTime;
          const duration = 0.78;

          const masterBrakeGain = this.ctx.createGain();
          masterBrakeGain.gain.setValueAtTime(0.001, now);
