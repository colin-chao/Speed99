<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>極速九九：海岸夕陽超跑賽 v1.3 (雙車道超車版 Speed 99 v1.3)</title>
  <style>
    :root {
      --cabinet-max-w: 480px;
      --app-height: 100vh;
      --neon-red: #ff1e42;
      --neon-cyan: #00f0ff;
      --neon-amber: #ffaa00;
      --neon-green: #00e676;
      --metal-dark: #141619;
      --metal-mid: #22262c;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
      -webkit-touch-callout: none;
      touch-action: manipulation;
    }

    html, body {
      width: 100%;
      height: 100%;
      height: var(--app-height, 100dvh);
      max-height: var(--app-height, 100dvh);
      overflow: hidden;
      background: radial-gradient(circle at 50% 25%, #2b1d28 0%, #12131a 60%, #07080c 100%);
      font-family: 'Segoe UI', 'Roboto', 'PingFang TC', 'Microsoft JhengHei', sans-serif;
      color: #ffffff;
      display: flex;
      justify-content: center;
      align-items: stretch;
    }

    /* 街機直向容器：全解析度自適應，保證下半部按鍵永遠位於可視畫面內不被網址列切到 */
    .arcade-cabinet {
      position: relative;
      width: 100%;
      max-width: var(--cabinet-max-w, 480px);
      height: 100%;
      height: var(--app-height, 100dvh);
      max-height: var(--app-height, 100dvh);
      display: flex;
      flex-direction: column;
      background: #0a0b0e;
      box-shadow:
        0 0 60px rgba(0, 0, 0, 0.95),
        0 0 25px rgba(255, 110, 40, 0.2),
        inset 0 0 2px rgba(255, 255, 255, 0.18);
      overflow: hidden;
      box-sizing: border-box;
    }

    @media (min-width: 500px) and (min-height: 600px) {
      html, body {
        align-items: center;
      }
      .arcade-cabinet {
        max-width: min(var(--cabinet-max-w), calc(var(--app-height, 94dvh) * 9 / 16));
        height: min(94dvh, var(--app-height, 94dvh));
        max-height: min(94dvh, var(--app-height, 94dvh));
        border-left: 3px solid #282c37;
        border-right: 3px solid #282c37;
        border-radius: 8px;
      }
    }

    /* ================= 上半部：海岸夕陽彎道賽道區 (彈性填滿其餘垂直高度) ================= */
    .viewport-section {
      position: relative;
      width: 100%;
      flex: 1 1 0;
      min-height: 0;
      overflow: hidden;
      background: #e8682a;
    }

    #raceCanvas {
      width: 100%;
      height: 100%;
      display: block;
    }

    /* 答錯或超時紅光閃爍警示遮罩 */
    .damage-flash {
      position: absolute;
      inset: 0;
      pointer-events: none;
      background: radial-gradient(circle, rgba(255, 0, 35, 0) 40%, rgba(255, 0, 45, 0.65) 100%);
      opacity: 0;
      transition: opacity 0.15s ease-out;
      z-index: 6;
    }
    .damage-flash.active {
      opacity: 1;
    }

    /* 答對加速暖金/青光外框 */
    .boost-flash {
      position: absolute;
      inset: 0;
      pointer-events: none;
      background: radial-gradient(circle, rgba(255, 200, 80, 0) 50%, rgba(255, 190, 50, 0.36) 100%);
      opacity: 0;
      transition: opacity 0.2s ease-out;
      z-index: 6;
    }
    .boost-flash.active {
      opacity: 1;
    }

    /* ================= HUD 儀表板：右上角時速表 & 題目左上角剩餘時間 ================= */
    .hud-speedometer {
      position: absolute;
      top: 44px;
      right: 16px;
      z-index: 14;
      pointer-events: none;
      display: flex;
      flex-direction: column;
      align-items: flex-end;
      padding: 6px 12px 4px 36px;
      transition: opacity 0.22s ease, transform 0.22s ease;
    }

    .hud-speedometer.hidden,
    .hud-time-badge.hidden {
      opacity: 0;
      pointer-events: none;
    }

    /* 時速表後方半透明轉速弧線與左側速度線 SVG (隨字體放大並同步向下移，避免頂部邊緣裁切) */
    .speedo-bg-svg {
      position: absolute;
      top: -6px;
      right: -6px;
      width: 280px;
      height: 158px;
      pointer-events: none;
      z-index: 0;
      overflow: visible;
    }

    .speedo-main-row {
      position: relative;
      z-index: 1;
      display: flex;
      align-items: baseline;
      justify-content: flex-end;
    }

    .hud-value.speed-val {
      font-family: 'Consolas', 'Courier New', 'Orbitron', monospace;
      font-size: clamp(81px, 21.5vw, 108px);
      font-weight: 900;
      font-style: italic;
      line-height: 0.9;
      letter-spacing: 2px;
      color: #fde047;
      transform: skewX(-6deg);
      paint-order: stroke fill;
      -webkit-text-stroke: 2px #b91c1c;
      text-shadow:
        0 0 10px #ff2a00,
        0 0 22px #dc2626,
        0 0 36px rgba(220, 38, 38, 0.88),
        0 5px 10px rgba(0, 0, 0, 0.7);
    }

    .speedo-unit {
      position: relative;
      z-index: 1;
      margin-top: 4px;
      margin-right: 4px;
      font-family: 'Consolas', 'Courier New', monospace;
      font-size: clamp(20px, 5.2vw, 27px);
      font-weight: 900;
      font-style: italic;
      letter-spacing: 1.5px;
      color: #fde047;
      transform: skewX(-6deg);
      paint-order: stroke fill;
      -webkit-text-stroke: 1px #b91c1c;
      text-shadow:
        0 0 8px #ff2a00,
        0 0 16px #dc2626,
        0 2px 6px rgba(0, 0, 0, 0.75);
    }

    /* 畫面左上角：剩餘時間膠囊框 (字體放大、清晰易讀且對稱於右上角時速表) */
    .hud-time-badge {
      position: absolute;
      top: max(20px, calc(14px + env(safe-area-inset-top, 0px)));
      left: max(16px, calc(12px + env(safe-area-inset-left, 0px)));
      z-index: 15;
      pointer-events: none;
      background: linear-gradient(180deg, rgba(20, 24, 34, 0.95) 0%, rgba(10, 12, 18, 0.98) 100%);
      border: 2px solid rgba(255, 255, 255, 0.22);
      border-top: 2px solid rgba(255, 255, 255, 0.38);
      border-radius: 12px;
      padding: 6px 14px;
      box-shadow:
        0 8px 22px rgba(0, 0, 0, 0.85),
        0 0 14px rgba(163, 230, 53, 0.25),
        inset 0 1px 2px rgba(255, 255, 255, 0.25);
      display: flex;
      align-items: baseline;
      gap: 7px;
      transition: opacity 0.22s ease, transform 0.22s ease;
    }

    .time-badge-label {
      font-family: 'Segoe UI', 'Arial Narrow', sans-serif;
      font-size: clamp(18px, 4.8vw, 24px);
      font-weight: 900;
      letter-spacing: 1px;
      color: #fde047;
      text-shadow: 0 0 10px rgba(250, 204, 21, 0.55);
    }

    .hud-value.time-val {
      display: inline-block;
      transform-origin: center center;
      font-family: 'Consolas', 'Courier New', monospace;
      font-size: clamp(26px, 6.8vw, 34px);
      font-weight: 900;
      line-height: 1;
      letter-spacing: 1.5px;
      color: #a3e635;
      text-shadow:
        0 0 12px rgba(132, 204, 22, 0.9),
        0 0 24px rgba(101, 163, 13, 0.5);
    }

    .hud-value.time-val.urgent {
      color: #ff3b5c;
      text-shadow: 0 0 16px rgba(255, 30, 66, 0.95);
      animation: pulseText 0.45s infinite alternate;
    }

    /* 最後 3 秒倒數：伴隨 321 音效時間數字瞬間放大 50% (scale 1.5) 再縮回 */
    @keyframes timePopAnim {
      0% {
        transform: scale(1.5);
        color: #ff2a4b;
        text-shadow:
          0 0 22px rgba(255, 42, 75, 1),
          0 0 38px rgba(255, 42, 75, 0.85);
      }
      50% {
        transform: scale(1.15);
      }
      100% {
        transform: scale(1);
      }
    }

    .hud-value.time-val.time-pop,
    .hud-value.time-val.urgent.time-pop {
      animation: timePopAnim 0.45s cubic-bezier(0.18, 0.89, 0.32, 1.28) forwards;
    }

    .hud-unit {
      font-family: 'Consolas', 'Courier New', sans-serif;
      font-size: clamp(18px, 4.8vw, 24px);
      font-weight: 900;
      color: #86efac;
      text-shadow: 0 0 10px rgba(134, 239, 172, 0.7);
    }

    /* 題目與 5 秒倒數動態進度條區：置於畫面中間、緊鄰下方數字鍵盤上方，高對比顯眼 */
    .question-cockpit {
      position: absolute;
      bottom: clamp(4px, 1vh, 8px);
      left: 50%;
      transform: translateX(-50%);
      width: min(calc(100% - 20px), 430px);
      z-index: 14;
      pointer-events: none;
      background: linear-gradient(180deg, rgba(15, 18, 30, 0.92) 0%, rgba(7, 9, 16, 0.96) 100%);
      border: 2px solid rgba(255, 215, 0, 0.82);
      border-radius: 12px;
      padding: clamp(3px, 0.7vh, 6px) 14px clamp(4px, 0.9vh, 7px);
      box-shadow:
        0 8px 24px rgba(0, 0, 0, 0.85),
        0 0 20px rgba(255, 190, 0, 0.35),
        inset 0 1px 2px rgba(255, 255, 255, 0.35);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
      transition: opacity 0.18s ease, transform 0.18s ease;
    }

    .question-cockpit.hidden {
      opacity: 0;
      transform: translateX(-50%) scale(0.92);
      pointer-events: none;
    }

    .question-display {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      font-family: 'Consolas', 'Courier New', monospace;
      font-size: clamp(24px, calc(var(--app-height, 100vh) * 0.05), 38px);
      font-weight: 900;
      letter-spacing: 2px;
      color: #fffbeb;
      text-shadow:
        0 0 16px rgba(255, 210, 60, 0.75),
        0 4px 10px rgba(0, 0, 0, 0.95);
    }

    .question-display .op-sign {
      color: #ffaa00;
    }

    .answer-slot {
      min-width: clamp(66px, 17vw, 82px);
      padding: 1px 12px;
      border-radius: 10px;
      background: rgba(0, 240, 255, 0.18);
      border: 2.5px solid #00f0ff;
      color: #00f0ff;
      text-align: center;
      box-shadow: 0 0 18px rgba(0, 240, 255, 0.45), inset 0 0 10px rgba(0, 240, 255, 0.25);
      transition: transform 0.1s ease, border-color 0.15s ease, color 0.15s ease;
    }

    .answer-slot.correct {
      border-color: #00e676;
      color: #00e676;
      background: rgba(0, 230, 118, 0.18);
      transform: scale(1.08);
    }

    .answer-slot.wrong {
      border-color: #ff1e42;
      color: #ff1e42;
      background: rgba(255, 30, 66, 0.2);
      animation: shakeSlot 0.25s ease;
    }

    /* 5秒變色倒數進度條 (不顯示秒數文字) */
    .q-timer-wrap {
      width: 100%;
      display: flex;
      align-items: center;
    }

    .q-timer-track {
      width: 100%;
      height: 10px;
      background: rgba(255, 255, 255, 0.14);
      border-radius: 999px;
      overflow: hidden;
      box-shadow: inset 0 1px 4px rgba(0, 0, 0, 0.9);
      padding: 1px;
    }

    .q-timer-bar {
      height: 100%;
      width: 100%;
      border-radius: 999px;
      background: linear-gradient(90deg, #00e676 0%, #69f0ae 100%);
      box-shadow: 0 0 12px rgba(0, 230, 118, 0.85);
      transform-origin: left center;
      transition: background 0.15s linear, box-shadow 0.15s linear;
    }

    /* 汽車正上方震撼速度增減提示 (+25 km/h 綠色 / -25 km/h 紅色) */
    .floating-feedback {
      position: absolute;
      left: 50%;
      top: 48%;
      transform: translate(-50%, -50%);
      display: flex;
      align-items: baseline;
      justify-content: center;
      gap: 6px;
      font-family: 'Segoe UI', 'Impact', 'Arial Black', sans-serif;
      font-weight: 900;
      font-style: italic;
      white-space: nowrap;
      pointer-events: none;
      opacity: 0;
      z-index: 18;
    }

    .floating-feedback .fb-num {
      font-size: clamp(46px, 12vw, 64px);
      line-height: 1;
      letter-spacing: 1px;
    }

    .floating-feedback .fb-unit {
      font-size: clamp(16px, 4.2vw, 22px);
      font-weight: 800;
      letter-spacing: 0.5px;
    }

    /* 答對：震撼亮綠色 +25 km/h (顯示時間延長至 1 秒) */
    .floating-feedback.show-boost {
      color: #00ff88;
      -webkit-text-stroke: 2px #004d26;
      text-shadow:
        0 0 18px rgba(0, 230, 118, 0.95),
        0 0 34px rgba(0, 200, 83, 0.75),
        0 6px 14px rgba(0, 0, 0, 0.95);
      animation: impactPop 1.0s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }

    /* 答錯或超時：震撼亮紅色 -25 km/h 或 請加油！ (顯示時間延長至 1 秒) */
    .floating-feedback.show-slow {
      color: #ff2a4b;
      -webkit-text-stroke: 2px #5a000e;
      text-shadow:
        0 0 18px rgba(255, 23, 68, 0.98),
        0 0 36px rgba(255, 0, 43, 0.8),
        0 6px 14px rgba(0, 0, 0, 0.95);
      animation: impactPop 1.0s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }

    /* 「請加油！」三字等距排列樣式（使用與 -25 完全相同粗細的邊框與陰影） */
    .floating-feedback .fb-cheer {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-family: "Arial Black", "Microsoft JhengHei", "PingFang TC", "Noto Sans TC", sans-serif;
      font-size: clamp(44px, 11.5vw, 60px);
      font-weight: 900;
      font-style: normal;
      line-height: 1;
      color: #ff2a4b;
      -webkit-text-stroke: 2px #5a000e;
      text-shadow:
        0 0 18px rgba(255, 23, 68, 0.98),
        0 0 36px rgba(255, 0, 43, 0.8),
        0 6px 14px rgba(0, 0, 0, 0.95);
    }

    .floating-feedback .fb-cheer .cheer-char {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 1.18em;
      text-align: center;
    }

    /* 「請」與「加」距離拉近 5%，並消除首字左側多餘留白以利整體水平置中 */
    .floating-feedback .fb-cheer .cheer-char-first {
      margin-left: -0.09em;
      margin-right: -0.06em;
    }

    .floating-feedback .fb-cheer .cheer-char-mid {
      transform: translateX(0.06em);
    }

    /* 驚嘆號緊貼著「油」字，不佔用多餘寬度，確保「請加油!」整個字串精準水平置中 */
    .floating-feedback .fb-cheer .cheer-excl {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: auto;
      margin-left: -0.08em;
      text-align: center;
    }

    /* ================= 下半部：控制面板區 (精準依據螢幕高度百分比配置，底部留出充足安全防切邊距) ================= */
    .control-section {
      position: relative;
      width: 100%;
      flex: 0 0 auto;
      /* 高度鎖定在可用畫面的 26%~28% 之間，高度限制在 130px 至 210px，在任何矮螢幕與高解析度螢幕均能完美展開 */
      height: clamp(130px, calc(var(--app-height, 100vh) * 0.27), 210px);
      padding: 4px 8px calc(8px + env(safe-area-inset-bottom, 0px)) 8px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      box-sizing: border-box;
      background:
        repeating-linear-gradient(
          45deg,
          #14171f 0px,
          #14171f 6px,
          #10131a 6px,
          #10131a 12px
        );
      box-shadow: inset 0 4px 14px rgba(0, 0, 0, 0.85);
      z-index: 10;
    }

    /* 智慧手寫板面板 (支援一位數與兩位數連續書寫，右上角無清除鈕，右下角提供切換回數字鍵盤按鈕) */
    .handwriting-wrap {
      position: relative;
      width: 100%;
      height: 100%;
      flex: 1 1 0;
      min-height: 0;
      border-radius: 10px;
      background: radial-gradient(circle at 50% 50%, #1c222e 0%, #13161f 100%);
      border: 1.5px solid #333d52;
      box-shadow:
        inset 0 2px 10px rgba(0, 0, 0, 0.8),
        0 2px 8px rgba(0, 0, 0, 0.6);
      overflow: hidden;
      display: flex;
      justify-content: center;
      align-items: center;
      touch-action: none;
      user-select: none;
      -webkit-user-select: none;
      box-sizing: border-box;
      transition: border-color 0.15s ease, box-shadow 0.15s ease;
    }

    .handwriting-wrap.hidden,
    .numpad-grid.hidden {
      display: none !important;
    }

    .handwriting-wrap.active {
      border-color: #00f0ff;
      box-shadow:
        inset 0 2px 10px rgba(0, 0, 0, 0.7),
        0 0 14px rgba(0, 240, 255, 0.45);
    }

    .handwriting-wrap.flash {
      animation: hwFlashEffect 0.3s ease;
    }

    @keyframes hwFlashEffect {
      0% {
        border-color: #00f0ff;
        box-shadow: 0 0 18px rgba(0, 240, 255, 0.85), inset 0 0 12px rgba(0, 240, 255, 0.4);
      }
      100% {
        border-color: #333d52;
        box-shadow: inset 0 2px 10px rgba(0, 0, 0, 0.8), 0 2px 8px rgba(0, 0, 0, 0.6);
      }
    }

    #hwCanvas {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      display: block;
      cursor: crosshair;
      touch-action: none;
      z-index: 2;
    }

    /* 淡淡的半透明「手寫回答」浮水印 */
    .hw-watermark {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      color: rgba(255, 255, 255, 0.22);
      font-family: 'Noto Sans TC', 'Microsoft JhengHei', 'PingFang TC', sans-serif;
      font-size: clamp(20px, calc(var(--app-height, 100vh) * 0.042), 32px);
      font-weight: 800;
      letter-spacing: 6px;
      pointer-events: none;
      z-index: 1;
      transition: opacity 0.2s ease;
      white-space: nowrap;
      user-select: none;
      text-shadow: 0 0 12px rgba(0, 240, 255, 0.12);
    }

    .handwriting-wrap.drawing .hw-watermark {
      opacity: 0.04;
    }

    /* 遊戲畫面右上角：極簡小巧「手寫 / 數字鍵」圖示切換鈕 (置於右上角最頂端，不遮蔽時速表與轉速弧線) */
    .hud-mode-toggle-btn {
      position: absolute;
      top: max(6px, calc(6px + env(safe-area-inset-top, 0px)));
      right: max(8px, calc(8px + env(safe-area-inset-right, 0px)));
      z-index: 25;
      width: 28px;
      height: 28px;
      padding: 0;
      border-radius: 7px;
      background: linear-gradient(180deg, rgba(20, 26, 38, 0.88) 0%, rgba(10, 14, 22, 0.94) 100%);
      border: 1.2px solid rgba(56, 189, 248, 0.55);
      color: #e0f2fe;
      cursor: pointer;
      backdrop-filter: blur(4px);
      -webkit-backdrop-filter: blur(4px);
      box-shadow: 0 2px 6px rgba(0, 0, 0, 0.65), inset 0 1px 1px rgba(255, 255, 255, 0.2);
      transition: transform 0.12s ease, background 0.15s ease, border-color 0.15s ease, box-shadow 0.15s ease;
      outline: none;
      display: flex;
      align-items: center;
      justify-content: center;
      -webkit-tap-highlight-color: transparent;
    }

    .hud-mode-toggle-btn:hover,
    .hud-mode-toggle-btn:active {
      background: rgba(0, 240, 255, 0.24);
      border-color: #00f0ff;
      color: #ffffff;
      box-shadow: 0 0 10px rgba(0, 240, 255, 0.5);
      transform: scale(0.94);
    }

    .hud-mode-toggle-btn .mode-icon {
      pointer-events: none;
      display: block;
    }

    .hud-mode-toggle-btn .mode-icon.hidden {
      display: none;
    }

    /* 機械立體數字鍵盤 (嚴格使用 4 等分 1fr 網格，保證 0 鍵等比滿版呈現) */
    .numpad-grid {
      flex: 1 1 0;
      min-height: 0;
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      grid-template-rows: repeat(4, 1fr);
      gap: 4px;
      width: 100%;
      height: 100%;
      box-sizing: border-box;
    }

    .mech-key {
      position: relative;
      width: 100%;
      height: 100%;
      min-height: 0;
      border: none;
      outline: none;
      border-radius: 7px;
      cursor: pointer;
      background: linear-gradient(180deg, #353c4b 0%, #242934 65%, #1b1f28 100%);
      color: #f1f5f9;
      font-family: 'Segoe UI', 'Roboto', monospace;
      font-size: clamp(15px, calc(var(--app-height, 100vh) * 0.034), 22px);
      line-height: 1;
      font-weight: 900;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      box-shadow:
        0 2px 0 #0d0f14,
        0 3px 5px rgba(0, 0, 0, 0.65),
        inset 0 1px 1px rgba(255, 255, 255, 0.28),
        inset 0 -1.5px 2px rgba(0, 0, 0, 0.4);
      border: 1px solid #434c5e;
      transition: transform 0.05s ease, box-shadow 0.05s ease, background 0.1s ease;
      -webkit-tap-highlight-color: transparent;
      box-sizing: border-box;
    }

    .mech-key::before {
      content: '';
      position: absolute;
      inset: 2px 3px 3px 3px;
      border-radius: 5px;
      background: linear-gradient(180deg, rgba(255, 255, 255, 0.07) 0%, rgba(255, 255, 255, 0) 100%);
      pointer-events: none;
    }

    .mech-key span {
      position: relative;
      z-index: 1;
      text-shadow: 0 1.5px 3px rgba(0, 0, 0, 0.75);
    }

    .mech-key.key-zero {
      grid-column: 1 / -1;
    }

    .mech-key:active,
    .mech-key.pressed {
      transform: translateY(1.5px);
      background: linear-gradient(180deg, #1e2430 0%, #293140 100%);
      border-color: #00f0ff;
      color: #00f0ff;
      box-shadow:
        0 0.5px 0 #0d0f14,
        0 1px 3px rgba(0, 0, 0, 0.6),
        0 0 10px rgba(0, 240, 255, 0.45),
        inset 0 2px 4px rgba(0, 0, 0, 0.75);
    }

    /* ================= 起跑與結算彈窗遮罩 ================= */
    .modal-backdrop {
      position: absolute;
      inset: 0;
      z-index: 30;
      background: radial-gradient(circle at 50% 35%, rgba(16, 20, 32, 0.84) 0%, rgba(6, 8, 12, 0.94) 100%);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      padding: 24px;
      text-align: center;
      transition: opacity 0.3s ease;
    }

    .modal-backdrop.hidden {
      opacity: 0;
      pointer-events: none;
    }

    .race-card {
      width: 100%;
      max-width: 390px;
      background: linear-gradient(165deg, #1b202e 0%, #10131c 100%);
      border: 1px solid rgba(255, 255, 255, 0.16);
      border-top: 2px solid var(--neon-red);
      border-radius: 18px;
      padding: 24px 20px;
      box-shadow:
        0 20px 50px rgba(0, 0, 0, 0.85),
        0 0 30px rgba(255, 30, 66, 0.2);
    }

    .badge-tag {
      display: inline-block;
      padding: 4px 12px;
      font-size: 11px;
      font-weight: 800;
      letter-spacing: 2px;
      text-transform: uppercase;
      color: #ffaa00;
      background: rgba(255, 170, 0, 0.14);
      border: 1px solid rgba(255, 170, 0, 0.4);
      border-radius: 999px;
      margin-bottom: 10px;
    }

    .race-title {
      font-size: 28px;
      font-weight: 900;
      font-style: italic;
      letter-spacing: 1px;
      background: linear-gradient(90deg, #ffffff 0%, #fde047 50%, #fb923c 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-bottom: 10px;
    }

    .race-desc {
      font-size: 13.5px;
      line-height: 1.6;
      color: #cbd5e1;
      margin-bottom: 18px;
      text-align: left;
      background: rgba(0, 0, 0, 0.35);
      padding: 12px 14px;
      border-radius: 10px;
      border-left: 3px solid #f97316;
    }

    .race-desc li {
      margin-left: 16px;
      margin-bottom: 4px;
    }

    .cta-btn {
      width: 100%;
      padding: 13px 20px;
      border: none;
      border-radius: 14px;
      cursor: pointer;
      font-size: clamp(25px, 6.8vw, 30px);
      font-weight: 900;
      font-style: italic;
      letter-spacing: 2px;
      color: #ffffff;
      background: linear-gradient(180deg, #ff5722 0%, #d90429 100%);
      box-shadow:
        0 6px 0 #7a0016,
        0 12px 26px rgba(255, 60, 40, 0.6),
        inset 0 1px 1px rgba(255, 255, 255, 0.45);
      transition: transform 0.08s ease, box-shadow 0.08s ease;
    }

    .cta-btn:active {
      transform: translateY(4px);
      box-shadow: 0 1px 0 #7a0016, 0 4px 10px rgba(255, 30, 66, 0.4);
    }

    /* 起跑號誌燈 3-2-1-GO */
    .traffic-lights {
      display: flex;
      justify-content: center;
      gap: 14px;
      margin: 14px 0 18px;
      padding: 10px 18px;
      background: #090b10;
      border-radius: 999px;
      border: 1px solid #2e3440;
      box-shadow: inset 0 2px 6px rgba(0,0,0,0.9);
    }

    .light-bulb {
      width: 24px;
      height: 24px;
      border-radius: 50%;
      background: #222630;
      border: 2px solid #14171f;
      transition: background 0.15s ease, box-shadow 0.15s ease;
    }
    .light-bulb.red {
      background: #ff1e42;
      box-shadow: 0 0 16px #ff1e42;
    }
    .light-bulb.amber {
      background: #ffaa00;
      box-shadow: 0 0 16px #ffaa00;
    }
    .light-bulb.green {
      background: #00e676;
      box-shadow: 0 0 18px #00e676;
    }

    /* 畫面中央倒數大字 (321 放大 50% 且使用醒目紅色系；START! 放大 30%) */
    .countdown-banner {
      position: absolute;
      inset: 0;
      z-index: 25;
      display: flex;
      justify-content: center;
      align-items: center;
      pointer-events: none;
      font-family: 'Consolas', 'Impact', 'Segoe UI Black', sans-serif;
      font-size: clamp(96px, 26vw, 126px);
      font-weight: 900;
      font-style: italic;
      color: #ff2a4b;
      paint-order: stroke fill;
      -webkit-text-stroke: 3.5px #50000d;
      text-shadow:
        0 0 22px #ff1744,
        0 0 45px rgba(255, 23, 68, 0.95),
        0 0 75px rgba(220, 0, 40, 0.8),
        0 8px 24px rgba(0, 0, 0, 0.95);
      letter-spacing: 2px;
      opacity: 0;
      text-align: center;
    }

    /* 3, 2, 1 倒數大字：醒目紅色系，字體放大 50% (76px * 1.5 = 114px) */
    .countdown-banner.num-countdown {
      font-size: clamp(96px, 26vw, 126px);
      color: #ff2a4b;
      paint-order: stroke fill;
      -webkit-text-stroke: 3.5px #50000d;
      text-shadow:
        0 0 22px #ff1744,
        0 0 45px rgba(255, 23, 68, 0.95),
        0 0 75px rgba(220, 0, 40, 0.8),
        0 8px 24px rgba(0, 0, 0, 0.95);
    }

    /* START! 正式起跑大字：字體放大 30% (76px * 1.3 = 99px) */
    .countdown-banner.start-go {
      font-size: clamp(75px, 20vw, 102px);
      color: #ffffff;
      paint-order: stroke fill;
      -webkit-text-stroke: 3.5px #047857;
      text-shadow:
        0 0 25px #00e676,
        0 0 50px rgba(0, 230, 118, 0.92),
        0 0 75px rgba(0, 200, 83, 0.75),
        0 8px 24px rgba(0, 0, 0, 0.95);
      letter-spacing: 3px;
    }

    .countdown-banner.pop {
      animation: countPop 0.85s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }

    /* 賽後結算排行榜表格 */
    .stats-board {
      display: flex;
      flex-direction: column;
      gap: 10px;
      margin: 16px 0 22px;
    }

    /* 通關結算畫面：移動至汽車前方與地平線之間，徹底杜絕遮蔽夕陽與汽車 (不論貼地或起飛) */
    #resultModal.modal-backdrop {
      position: absolute;
      inset: 0;
      z-index: 30;
      background: none;
      backdrop-filter: none;
      -webkit-backdrop-filter: none;
      pointer-events: none;
      overflow: hidden;
    }

    #resultModal .race-card {
      position: absolute;
      top: 28%;
      left: 50%;
      transform: translateX(-50%);
      width: calc(100% - 16px);
      max-width: 395px;
      background: rgba(36, 44, 58, 0.58);
      border: 1px solid rgba(255, 255, 255, 0.38);
      border-top: 2px solid rgba(255, 255, 255, 0.70);
      box-shadow: 0 10px 28px rgba(0, 0, 0, 0.45);
      border-radius: 14px;
      padding: 9px 10px 10px;
      box-sizing: border-box;
      pointer-events: auto;
    }

    /* 起始畫面：移除後方半透明區塊，標題位於地平線與汽車中間不遮太陽，按鈕稍微上移居中 */
    #startModal.modal-backdrop {
      position: absolute;
      inset: 0;
      background: none;
      backdrop-filter: none;
      -webkit-backdrop-filter: none;
      pointer-events: none;
      overflow: hidden;
      padding: 0;
    }

    #startModal .race-card {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      max-width: 100%;
      background: none;
      border: none;
      box-shadow: none;
      padding: 0;
      pointer-events: none;
    }

    /* 遊戲標題：往上一點，字體剛好貼齊太陽與地平線下方，且與下方汽車保持舒適距離 */
    #startModal .title-logo-wrap {
      position: absolute;
      top: 21%;
      left: 50%;
      transform: translateX(-50%);
      width: 95%;
      max-width: 530px; /* 標題放大 50% */
      margin: 0;
      display: flex;
      justify-content: center;
      align-items: center;
      filter: drop-shadow(0 10px 22px rgba(0, 0, 0, 0.85));
      pointer-events: none;
      z-index: 5;
    }

    #startModal .title-logo-svg {
      width: 100%;
      max-width: 530px;
      height: auto;
      overflow: visible;
      display: block;
    }

    /* 開始競速按鈕：居中於車子與下方數字鍵盤中間，精準自適應各種螢幕高度 */
    #startModal #startRaceBtn {
      position: absolute;
      bottom: clamp(10px, 3.5%, 22px);
      left: 50%;
      transform: translateX(-50%);
      width: calc(100% - 28px);
      max-width: 380px;
      padding: 11px 18px;
      font-size: clamp(20px, 5.5vw, 27px);
      letter-spacing: 2px;
      border-radius: 12px;
      pointer-events: auto;
      z-index: 10;
      box-shadow:
        0 5px 0 #7a0016,
        0 10px 22px rgba(255, 60, 40, 0.6),
        inset 0 1px 1px rgba(255, 255, 255, 0.45);
    }

    #startModal #startRaceBtn:active {
      transform: translate(-50%, 4px);
      box-shadow: 0 1px 0 #7a0016, 0 4px 10px rgba(255, 30, 66, 0.4);
    }

    .title-logo-wrap {
      width: 100%;
      margin: -4px 0 14px;
      display: flex;
      justify-content: center;
      align-items: center;
      filter: drop-shadow(0 8px 16px rgba(0, 0, 0, 0.65));
    }

    .title-logo-svg {
      width: 100%;
      max-width: 370px;
      height: auto;
      overflow: visible;
      display: block;
    }

    #resultModal .stats-board {
      margin: 0 0 8px;
      display: grid;
      grid-template-columns: 1fr 1fr 1.34fr;
      gap: 6px;
    }

    #resultModal .stat-row {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: rgba(22, 28, 38, 0.65);
      border: 1px solid rgba(255, 255, 255, 0.25);
      border-radius: 10px;
      padding: 6px 2px 7px;
      min-height: unset;
      box-sizing: border-box;
    }

    /* 「答對」、「答錯」、「極速」黃字標題 */
    #resultModal .stat-name {
      font-size: clamp(22px, 5.8vw, 26px);
      font-weight: 900;
      color: #ffea00;
      paint-order: stroke fill;
      -webkit-text-stroke: 3.5px #0f172a;
      text-shadow: 0 2px 5px rgba(0, 0, 0, 0.95);
      letter-spacing: 0.5px;
      line-height: 1.05;
      margin-bottom: 2px;
      white-space: nowrap;
    }

    #resultModal .stat-num {
      display: inline-flex;
      align-items: baseline;
      justify-content: center;
      white-space: nowrap;
      line-height: 1;
    }

    /* 數字部分：字體寬度拉寬 50% (由窄體恢復為標準大氣寬度)，維持 1.5px 俐落描邊粗細與 2 倍黃字高度 */
    #resultModal .stat-num .val {
      font-family: 'Bahnschrift', 'Trebuchet MS', 'Segoe UI', 'Arial', sans-serif;
      font-stretch: normal;
      font-size: clamp(40px, 9.8vw, 48px);
      font-weight: 700;
      letter-spacing: 0.5px;
      paint-order: stroke fill;
      line-height: 0.95;
      display: inline-block;
      transform: none;
    }

    /* 答對綠色大字：維持 1.5px 俐落描邊粗細 (不改粗細) 與純淨電光光暈 */
    #resultModal #resCorrect .val {
      color: #00ff88;
      -webkit-text-stroke: 1.5px #012b15;
      text-shadow: 0 0 12px rgba(0, 255, 136, 0.65), 0 2px 4px rgba(0, 0, 0, 0.9);
    }

    /* 答錯紅色大字：維持 1.5px 俐落描邊粗細 (不改粗細) 與純淨電光光暈 */
    #resultModal #resWrong .val {
      color: #ff3355;
      -webkit-text-stroke: 1.5px #35000a;
      text-shadow: 0 0 12px rgba(255, 51, 85, 0.65), 0 2px 4px rgba(0, 0, 0, 0.9);
    }

    /* 極速青藍色大字：維持 1.5px 俐落描邊粗細 (不改粗細) 與純淨電光光暈 */
    #resultModal #resTopSpeed .val {
      color: #00f0ff;
      -webkit-text-stroke: 1.5px #011e2d;
      text-shadow: 0 0 14px rgba(0, 240, 255, 0.75), 0 2px 4px rgba(0, 0, 0, 0.9);
    }

    /* 極速後面的 km/h：小字排在速度後不換行，無描邊以保持清晰銳利，高對比電光青藍提升辨識度 */
    #resultModal .stat-unit-kmh {
      font-family: 'Segoe UI', 'Impact', 'Consolas', sans-serif;
      font-size: clamp(12px, 3.0vw, 15px);
      font-weight: 800;
      font-style: italic;
      color: #38bdf8;
      -webkit-text-stroke: 0 !important;
      text-shadow: 0 1px 4px rgba(0, 0, 0, 0.95);
      margin-left: 2px;
      letter-spacing: 0.5px;
      white-space: nowrap;
      align-self: baseline;
    }

    /* 「題」單位小字：無描邊不模糊，對比鮮明 */
    #resultModal .stat-unit-text {
      font-size: clamp(15px, 3.8vw, 18px);
      font-weight: 900;
      -webkit-text-stroke: 0 !important;
      text-shadow: 0 1px 4px rgba(0, 0, 0, 0.95);
      margin-left: 2px;
      white-space: nowrap;
      align-self: baseline;
    }
    #resultModal #resCorrect .stat-unit-text { color: #00e676; }
    #resultModal #resWrong .stat-unit-text { color: #ff4769; }

    /* 重新開始按鈕：依比例適度放大，維持熱血賽車立體感與按壓反饋 */
    #resultModal #replayBtn {
      font-size: clamp(19px, 5.0vw, 23px);
      font-weight: 900;
      font-style: italic;
      letter-spacing: 2px;
      padding: 8px 18px;
      border-radius: 10px;
      box-shadow:
        0 4px 0 #7a0016,
        0 8px 18px rgba(255, 60, 40, 0.55),
        inset 0 1px 1px rgba(255, 255, 255, 0.45);
    }

    .stat-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.1);
      padding: 12px 16px;
      border-radius: 10px;
    }

    .stat-name {
      font-size: 14px;
      font-weight: 700;
      color: #cbd5e1;
    }

    .stat-num {
      font-family: 'Consolas', monospace;
      font-size: 22px;
      font-weight: 900;
    }

    .stat-num.green { color: #00e676; text-shadow: 0 0 10px rgba(0, 230, 118, 0.4); }
    .stat-num.red   { color: #ff4769; text-shadow: 0 0 10px rgba(255, 71, 105, 0.4); }
    .stat-num.cyan  { color: #00f0ff; text-shadow: 0 0 10px rgba(0, 240, 255, 0.4); }

    @keyframes pulseText {
      from { transform: scale(1); }
      to   { transform: scale(1.1); }
    }

    @keyframes shakeSlot {
      0%, 100% { transform: translateX(0); }
      25% { transform: translateX(-6px); }
      75% { transform: translateX(6px); }
    }

    @keyframes impactPop {
      0%   { opacity: 0; transform: translate(-50%, -40%) scale(2.2); }
      16%  { opacity: 1; transform: translate(-50%, -50%) scale(0.95); }
      28%  { opacity: 1; transform: translate(-50%, -52%) scale(1.08); }
      82%  { opacity: 1; transform: translate(-50%, -60%) scale(1.02); }
      100% { opacity: 0; transform: translate(-50%, -88%) scale(0.92); }
    }

    @keyframes countPop {
      0%   { opacity: 0; transform: scale(2.1); }
      25%  { opacity: 1; transform: scale(1); }
      80%  { opacity: 1; transform: scale(0.96); }
      100% { opacity: 0; transform: scale(0.75); }
    }
  </style>
</head>
<body>
  <main class="arcade-cabinet">
    <!-- ================= 上半部：海岸夕陽彎道賽道區 (佔 60% 高度) ================= -->
    <section class="viewport-section">
      <canvas id="raceCanvas"></canvas>
      <div id="damageFlash" class="damage-flash"></div>
      <div id="boostFlash" class="boost-flash"></div>
      <div id="floatingFeedback" class="floating-feedback"></div>
      <div id="countdownBanner" class="countdown-banner"></div>

      <!-- 遊戲畫面右上角：手寫 / 數字鍵圖示切換按鈕 (縮小無文字，僅顯示手寫筆/按鍵示意圖示，不遮蔽時速) -->
      <button type="button" id="inputModeToggleBtn" class="hud-mode-toggle-btn" title="切換手寫 / 數字鍵輸入" aria-label="切換輸入模式">
        <!-- 手寫筆示意圖示 (於數字鍵模式顯示，點擊切換為手寫) -->
        <svg id="iconModeHw" class="mode-icon icon-hw" viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M16.5 3.5a2.12 2.12 0 0 1 3 3L8 18l-4 1 1-4Z" />
          <path d="M14 6l3 3" />
          <path d="M4 21c3.5 0 6-1.5 9-1.5s4.5 1.5 7 1.5" />
        </svg>
        <!-- 數字按鈕網格示意圖示 (於手寫模式顯示，點擊切換為數字鍵) -->
        <svg id="iconModeKeypad" class="mode-icon icon-keypad hidden" viewBox="0 0 24 24" width="16" height="16" fill="currentColor" aria-hidden="true">
          <rect x="3" y="2.5" width="4.8" height="3.8" rx="1" />
          <rect x="9.6" y="2.5" width="4.8" height="3.8" rx="1" />
          <rect x="16.2" y="2.5" width="4.8" height="3.8" rx="1" />
          <rect x="3" y="7.9" width="4.8" height="3.8" rx="1" />
          <rect x="9.6" y="7.9" width="4.8" height="3.8" rx="1" />
          <rect x="16.2" y="7.9" width="4.8" height="3.8" rx="1" />
          <rect x="3" y="13.3" width="4.8" height="3.8" rx="1" />
          <rect x="9.6" y="13.3" width="4.8" height="3.8" rx="1" />
          <rect x="16.2" y="13.3" width="4.8" height="3.8" rx="1" />
          <rect x="3" y="18.7" width="18" height="3.3" rx="1" />
        </svg>
      </button>

      <!-- 右上角汽車時速表 (起始畫面隱藏，按下開始競速進入倒數時顯示) -->
      <div id="hudSpeedometer" class="hud-speedometer hidden">
        <svg class="speedo-bg-svg" viewBox="0 0 210 115" xmlns="http://www.w3.org/2000/svg">
          <!-- 左側水平速度流線 -->
          <line x1="6" y1="30" x2="78" y2="30" stroke="rgba(255, 235, 180, 0.45)" stroke-width="2" stroke-linecap="round" />
          <line x1="22" y1="42" x2="74" y2="42" stroke="rgba(255, 235, 180, 0.35)" stroke-width="1.6" stroke-linecap="round" />
          <line x1="12" y1="53" x2="70" y2="53" stroke="rgba(255, 235, 180, 0.4)" stroke-width="1.8" stroke-linecap="round" />
          <line x1="34" y1="64" x2="68" y2="64" stroke="rgba(255, 235, 180, 0.3)" stroke-width="1.5" stroke-linecap="round" />
          <!-- 右上外圈半透明轉速錶弧線與刻度 -->
          <path d="M 122 14 A 48 48 0 0 1 196 76" fill="none" stroke="rgba(255, 255, 255, 0.28)" stroke-width="7" stroke-linecap="round" />
          <path d="M 116 8 A 56 56 0 0 1 204 80" fill="none" stroke="rgba(255, 255, 255, 0.38)" stroke-width="2" />
          <line x1="145" y1="15" x2="142" y2="23" stroke="rgba(255, 255, 255, 0.42)" stroke-width="2" />
          <line x1="172" y1="24" x2="166" y2="31" stroke="rgba(255, 255, 255, 0.42)" stroke-width="2" />
          <line x1="191" y1="44" x2="183" y2="48" stroke="rgba(255, 255, 255, 0.42)" stroke-width="2" />
