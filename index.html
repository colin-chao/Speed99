          /* (C) Soft under-diffuser ambient core & rear tire grounding shadow */
          ctx.save();
          const underGrad = ctx.createRadialGradient(w * 0.05, -h * 0.01, w * 0.05, w * 0.05, -h * 0.01, w * 0.44);
          underGrad.addColorStop(0.0, 'rgba(10, 12, 18, 0.36)');
          underGrad.addColorStop(0.65, 'rgba(14, 16, 24, 0.16)');
          underGrad.addColorStop(1.0, 'rgba(14, 16, 24, 0)');
          ctx.fillStyle = underGrad;
          ctx.beginPath();
          ctx.ellipse(w * 0.05, -h * 0.01, w * 0.42, h * 0.09, 0.08, 0, Math.PI * 2);
          ctx.fill();

          ctx.fillStyle = 'rgba(10, 12, 18, 0.45)';
          ctx.beginPath();
          ctx.ellipse(-w * 0.33, -h * 0.05, w * 0.085, 4.0 * s, 0, 0, Math.PI * 2);
          ctx.ellipse(w * 0.33, -h * 0.05, w * 0.085, 4.0 * s, 0, 0, Math.PI * 2);
          ctx.fill();
          ctx.restore();

          ctx.restore();
        }

        function drawFlyingPlayerShadow(hf) {
          ctx.save();

          /* Sleek, flat-proportioned supercar (?像??頞游祝擃?頝? sunset shadow on the road when flying:
           * Wide, low-slung wedge silhouette (aspect ratio ~2.2 : 1 on the foreshortened road) matching
           * the ground shadow's oblique sunset angle, wide rear haunch curve, and flat rear diffuser edge.
           * Identical for left and right lanes.
           */
          const sunShiftX = w * 0.16 * hf;
          const sunShiftY = h * 0.03 * hf;
          ctx.translate(sunShiftX, sunShiftY);

          function traceFlatSupercarFlyingShadowPath(scale) {
            const cx = w * 0.22;
            const cy = -h * 0.10;
            const pt = (px, py) => [cx + (px - cx) * scale, cy + (py - cy) * scale];

            const p0 = pt(-w * 0.18, -h * 0.35);
            const p1 = pt(w * 0.10, -h * 0.38);
            const p2 = pt(w * 0.36, -h * 0.35);
            const p3 = pt(w * 0.80, -h * 0.13);
            const p4 = pt(w * 0.88, -h * 0.04);
            const p5 = pt(w * 0.84, h * 0.13);
            const p6 = pt(w * 0.66, h * 0.16);
            const p7 = pt(w * 0.04, h * 0.16);
            const p8 = pt(-w * 0.05, h * 0.16);
            const p9 = pt(-w * 0.15, h * 0.10);
            const p10 = pt(-w * 0.38, -h * 0.05);
            const p11 = pt(-w * 0.42, -h * 0.12);
            const p12 = pt(-w * 0.32, -h * 0.28);

            ctx.beginPath();
            /* Flat, wide wedge supercar front hood edge */
            ctx.moveTo(p0[0], p0[1]);
            ctx.quadraticCurveTo(p1[0], p1[1], p2[0], p2[1]);
            /* Top-right ~38 deg sunset slant out to wide rear supercar haunch */
            ctx.lineTo(p3[0], p3[1]);
            /* Wide, low-slung rear haunch & diffuser corner */
            ctx.bezierCurveTo(p4[0], p4[1], p5[0], p5[1], p6[0], p6[1]);
            /* Flat, wide horizontal supercar rear diffuser bottom edge */
            ctx.lineTo(p7[0], p7[1]);
            /* Bottom-left parallel ~38 deg sunset slant back to left rear wheel arch */
            ctx.quadraticCurveTo(p8[0], p8[1], p9[0], p9[1]);
            ctx.lineTo(p10[0], p10[1]);
            /* Sleek left supercar waist tapering back to flat wedge front nose */
            ctx.bezierCurveTo(p11[0], p11[1], p12[0], p12[1], p0[0], p0[1]);
            ctx.closePath();
          }

          /* (A) Soft diffused outer aerial penumbra */
          ctx.save();
          ctx.shadowColor = 'rgba(14, 18, 28, 0.32)';
          ctx.shadowBlur = 10 * s;
          const penGrad = ctx.createLinearGradient(-w * 0.34, -h * 0.34, w * 0.84, h * 0.16);
          penGrad.addColorStop(0.0, 'rgba(16, 20, 30, 0.45)');
          penGrad.addColorStop(0.45, 'rgba(20, 24, 36, 0.39)');
          penGrad.addColorStop(0.80, 'rgba(28, 32, 44, 0.29)');
          penGrad.addColorStop(1.0, 'rgba(36, 40, 52, 0.18)');
          ctx.fillStyle = penGrad;
          traceFlatSupercarFlyingShadowPath(1.0);
          ctx.fill();
          ctx.restore();

          /* (B) Inner soft supercar umbra core (same flat wedge supercar shape, no round ellipse) */
          ctx.save();
          ctx.fillStyle = 'rgba(12, 14, 22, 0.15)';
          traceFlatSupercarFlyingShadowPath(0.72);
          ctx.fill();
          ctx.restore();

          ctx.restore();
        }

        ctx.save();
        ctx.translate(x, groundY);

        if (state.hoverFactor <= 0.01) {
          if (isLeftLane) {
            drawLeftLanePlayerShadow();
          } else {
            drawRightLanePlayerShadow();
          }
        } else if (state.hoverFactor >= 0.99) {
          drawFlyingPlayerShadow(1.0);
        } else {
          const hf = state.hoverFactor;
          ctx.save();
          ctx.globalAlpha = 1 - hf;
          if (isLeftLane) {
            drawLeftLanePlayerShadow();
          } else {
            drawRightLanePlayerShadow();
          }
          ctx.restore();

          ctx.save();
          ctx.globalAlpha = hf;
          drawFlyingPlayerShadow(hf);
          ctx.restore();
        }

        ctx.restore();
        ctx.save();
        ctx.translate(x, groundY - hoverLiftY);
        if (state.hoverFactor > 0.01 || state.airLeakTimer > 0.01) {
          drawUnderbodyHoverWhiteSmoke(w, h, s, state.hoverFactor);
        }

        // 一般加速時車尾排氣氮氣藍火/熱流特效 (未進入白煙懸浮模式時顯示)
        if (state.hoverFactor < 0.25 && (state.nitroTimer > 0 || state.currentSpeed >= 165)) {
          const boostPower = state.nitroTimer > 0 ? 1.25 : Math.min(1.0, (state.currentSpeed - 150) / 140);
          const flicker = 0.8 + Math.random() * 0.4;
          const flameLen = (20 + 28 * boostPower) * flicker * s;

          [-w * 0.20, w * 0.20].forEach((ex) => {
            ctx.save();
            ctx.globalCompositeOperation = 'lighter';
            const flameGrad = ctx.createLinearGradient(ex, -h * 0.05, ex, -h * 0.05 + flameLen);
            flameGrad.addColorStop(0.0, 'rgba(255, 255, 255, 0.95)');
            flameGrad.addColorStop(0.3, 'rgba(56, 189, 248, 0.85)');
            flameGrad.addColorStop(1.0, 'rgba(249, 115, 22, 0)');
            ctx.fillStyle = flameGrad;
            ctx.beginPath();
            ctx.moveTo(ex - 5 * s, -h * 0.05);
            ctx.quadraticCurveTo(ex, -h * 0.05 + flameLen, ex + 5 * s, -h * 0.05);
            ctx.closePath();
            ctx.fill();
            ctx.restore();
          });
        }

        // (3) 繪製使用者特調角度之玩家專屬跑車本體模型 (左道/右道雙模型)
        ctx.drawImage(playerImg, -w * 0.5, -h, w, h);

        // (4) 煞車時車尾貫穿式細長紅色 LED 尾燈高亮輝光特效
        if (state.brakeTimer > 0) {
          ctx.save();
          ctx.strokeStyle = '#ff1e38';
          ctx.lineWidth = 3.8 * s;
          ctx.shadowColor = '#ff1e38';
          ctx.shadowBlur = 12 * s;
          ctx.beginPath();
          ctx.moveTo(-w * 0.38, -h * 0.16);
          ctx.quadraticCurveTo(0, -h * 0.135, w * 0.38, -h * 0.16);
          ctx.stroke();
          ctx.restore();
        }

        ctx.restore(); // 結束 translate(x, groundY - hoverLiftY)
      }
      // ======================== HUD 更新與流程控制 ========================
      function updateQuestionTimerUI() {
        const ratio = Math.max(0, Math.min(1, state.questionTimeLeft / QUESTION_DURATION));
        qTimerBar.style.transform = `scaleX(${ratio})`;

        // 隨剩餘時間自動由綠 -> 黃橘 -> 紅變色
        if (ratio > 0.5) {
          qTimerBar.style.background = 'linear-gradient(90deg, #00e676 0%, #69f0ae 100%)';
          qTimerBar.style.boxShadow = '0 0 12px rgba(0, 230, 118, 0.85)';
        } else if (ratio > 0.25) {
          qTimerBar.style.background = 'linear-gradient(90deg, #ffab00 0%, #ffea00 100%)';
          qTimerBar.style.boxShadow = '0 0 12px rgba(255, 214, 0, 0.85)';
        } else {
          qTimerBar.style.background = 'linear-gradient(90deg, #ff1744 0%, #ff5252 100%)';
          qTimerBar.style.boxShadow = '0 0 14px rgba(255, 23, 68, 0.95)';
        }
      }

      function updateHudUI() {
        raceTimeVal.textContent = state.raceTimeLeft.toFixed(1);
        if (state.raceTimeLeft <= 5.0 && state.phase === 'RACING') {
          raceTimeVal.classList.add('urgent');
        } else {
          raceTimeVal.classList.remove('urgent');
        }

        // 到達終點時 (FINISHING / ENDED) 保持顯示衝線時的最後速度，不因終點後減速而歸零
        if (state.phase === 'FINISHING' || state.phase === 'ENDED') {
          speedVal.textContent = state.finalSpeed;
        } else {
          speedVal.textContent = Math.round(state.currentSpeed);
        }
      }

      function showCountdownBanner(text) {
        countdownBanner.className = 'countdown-banner';
        void countdownBanner.offsetWidth;
        countdownBanner.textContent = text;
        if (text === 'START!') {
          countdownBanner.classList.add('start-go');
        } else {
          countdownBanner.classList.add('num-countdown');
        }
        countdownBanner.classList.add('pop');
      }

      // 遊戲結束前最後 3 秒倒數：播放 321 提示音效，且左上方時間數字瞬間放大 50% 再縮回（畫面中間不顯示數字）
      function triggerFinalCountdown(sec) {
        sound.playCountdownBeep(false);
        raceTimeVal.classList.remove('time-pop');
        void raceTimeVal.offsetWidth;
        raceTimeVal.classList.add('time-pop');
      }

      // 起跑倒數 3 -> 2 -> 1 -> START! (每步 1 秒，共 3 秒倒數)
      function runCountdown321() {
        const steps = ['3', '2', '1', 'START!'];
        steps.forEach((label, idx) => {
          const tid = setTimeout(() => {
            showCountdownBanner(label);
            sound.playCountdownBeep(label === 'START!');
            if (label === 'START!') {
              // 倒數完 3 秒（首次開始對應音樂第 6 秒），遊戲正式開始，音樂音量從頭到尾維持 30%
              sound.setGameVolumeMultiplier(1.0);
              state.phase = 'RACING';
              state.currentSpeed = INITIAL_SPEED;
              state.finalSpeed = INITIAL_SPEED;
              generateQuestion();
              questionCockpit.classList.remove('hidden');
            }
          }, idx * 1000);
          countdownTimers.push(tid);
        });
      }

      // 啟動比賽流程：首次開始 (isReplay = false) 先以 50% 音量純開車 3 秒，第 3 秒降為 20% 並倒數 321，第 6 秒開始；
      // 重新開始 (isReplay = true) 不重播音樂、直接將音量調回 20% 並立即倒數 321 開始遊戲
      function startRaceFlow(isReplay = false) {
        sound.init();
        sound.setGameVolumeMultiplier(0.5);
        sound.startEngineAtSpeed(INITIAL_SPEED);
        if (document.activeElement && typeof document.activeElement.blur === 'function') {
          document.activeElement.blur();
        }
        countdownTimers.forEach((tid) => clearTimeout(tid));
        countdownTimers = [];
        if (typeof clearHandwritingCanvas === 'function') {
          clearHandwritingCanvas();
        }
        state.currentInput = '';
        countdownBanner.className = 'countdown-banner';
        raceTimeVal.classList.remove('time-pop');

        startModal.classList.add('hidden');
        resultModal.classList.add('hidden');
        questionCockpit.classList.add('hidden');
        hudSpeedometer.classList.remove('hidden');
        hudTimeBadge.classList.remove('hidden');

        state.phase = 'COUNTDOWN';
        state.raceTimeLeft = GAME_DURATION;
        state.questionTimeLeft = QUESTION_DURATION;
        state.lastCountdownBeepSec = 0;
        initRoadSigns();
        initCyclists();
        initPedestrians();
        state.ditchPuffs = [];
        state.targetSpeed = INITIAL_SPEED;
        state.currentSpeed = INITIAL_SPEED;
        state.finalSpeed = INITIAL_SPEED;
        state.topSpeed = INITIAL_SPEED;
        state.correctCount = 0;
        state.wrongCount = 0;
        state.combo = 0;
        state.finishGateZ = -1;
        state.finishSoundPlayed = false;
        state.airLeakTimer = 0;
        state.hoverFactor = 0;
        state.skidMarks = [];
        state.trafficCars = [];
        state.lastPassedCarIndex = -1;
        state.playerLane = PLAYER_LANE_RIGHT;
        state.playerLaneX = PLAYER_LANE_RIGHT;
        state.lastGroundLane = PLAYER_LANE_RIGHT;
        state.lastTrafficGroundLane = PLAYER_LANE_RIGHT;
        qAnswerSlot.textContent = '?';
        updateHudUI();
        updateQuestionTimerUI();

        if (!isReplay) {
          // 首次按下開始遊戲：從頭播放音樂 (維持 20% 音量)，前 3 秒畫面無題目、無標題、不倒數，單純讓車子往前開
          sound.startBGM(0.2, true);
          const introTid = setTimeout(() => {
            // 音樂播放到 3 秒時，開始倒數 321 (倒數 3 秒後於第 6 秒正式開始)，背景音樂持續維持 20% 音量
            sound.setBgmVolume(0.2, false, 1000);
            runCountdown321();
          }, 3000);
          countdownTimers.push(introTid);
        } else {
          // 遊戲結束後按下重新開始：不重新播放音樂（持續播放），維持 20% 音量，不用等秒數直接倒數 321
          sound.tryPlayBgm();
          sound.setBgmVolume(0.2, false, 1000);
          runCountdown321();
        }
      }

      function showResultScreen() {
        state.phase = 'ENDED';
        if (typeof clearHandwritingCanvas === 'function') {
          clearHandwritingCanvas();
        }
        state.currentInput = '';
        countdownBanner.className = 'countdown-banner';
        raceTimeVal.classList.remove('time-pop');
        // 遊戲結束介面出現時，隱藏 HUD 避免畫面雜亂，降低整體音效輸出 50%，背景音樂持續以 20% 音量播放
        hudSpeedometer.classList.add('hidden');
        hudTimeBadge.classList.add('hidden');
        sound.setGameVolumeMultiplier(0.5);
        sound.setBgmVolume(0.2, false, 1000);
        questionCockpit.classList.add('hidden');
        resCorrect.innerHTML = `<span class="val">${state.correctCount}</span><span class="stat-unit-text">題</span>`;
        resWrong.innerHTML = `<span class="val">${state.wrongCount}</span><span class="stat-unit-text">題</span>`;
        resTopSpeed.innerHTML = `<span class="val">${Math.round(state.topSpeed)}</span><span class="stat-unit-kmh">km/h</span>`;
        resultModal.classList.remove('hidden');
      }

      // ======================== 主遊戲迴圈 (60fps 更新與渲染) ========================
      let lastTime = performance.now();
      let loopErrorCount = 0;

      // 防當機保護：任何單一幀發生例外都不會中斷 requestAnimationFrame 迴圈 (避免「畫面卡住但聲音還在跑」)
      function gameLoop(now) {
        requestAnimationFrame(gameLoop);
        try {
          gameLoopStep(now);
        } catch (err) {
          loopErrorCount++;
          if (loopErrorCount <= 5) {
            console.error('[Speed99] gameLoop error (frame skipped):', err);
          }
          // 復原畫布狀態 (清空可能未配對的 save/clip/transform)，下一幀即可正常繪製
          for (let i = 0; i < 64; i++) ctx.restore();
          ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
          ctx.globalAlpha = 1;
          ctx.globalCompositeOperation = 'source-over';
        }
      }

      function gameLoopStep(now) {
        const dt = Math.max(0, Math.min(0.05, (now - lastTime) / 1000));
        lastTime = now;

        if (state.phase === 'RACING') {
          state.currentSpeed += (state.targetSpeed - state.currentSpeed) * Math.min(1, dt * 7);
          if (state.targetSpeed === 0 && state.currentSpeed < 0.8) {
            state.currentSpeed = 0;
          }
          state.finalSpeed = Math.round(state.targetSpeed);
          state.raceTimeLeft = Math.max(0, state.raceTimeLeft - dt);

          // 遊戲時間剩最後三秒的時候，依序倒數 3、2、1，伴隨音效與時間數字瞬間放大 50% 再縮回
          if (state.raceTimeLeft <= 3.0 && state.raceTimeLeft > 0) {
            const sec = Math.ceil(state.raceTimeLeft);
            if (sec >= 1 && sec <= 3 && state.lastCountdownBeepSec !== sec) {
              state.lastCountdownBeepSec = sec;
              triggerFinalCountdown(sec);
            }
          }

          if (!state.inputLocked) {
            state.questionTimeLeft -= dt;
            if (state.questionTimeLeft <= 0) {
              state.questionTimeLeft = 0;
              handleWrongOrTimeout(true);
            }
            updateQuestionTimerUI();
          }

          if (state.raceTimeLeft <= 0) {
            state.finalSpeed = Math.round(state.targetSpeed);
            state.currentSpeed = state.targetSpeed;
            state.inputLocked = true;
            // 先切換結算畫面，再播放歡呼音效；音效出錯也不影響遊戲流程
            showResultScreen();
            if (!state.finishSoundPlayed) {
              state.finishSoundPlayed = true;
              try {
                sound.playFinishFanfare();
              } catch (err) {
                console.error('[Speed99] playFinishFanfare error:', err);
              }
            }
          }
        } else if (state.phase === 'ENDED') {
          // 通關後遊戲畫面持續進行，維持遊戲結束前的車速與行駛狀態
          state.currentSpeed = state.targetSpeed;
        }

        if (state.nitroTimer > 0) state.nitroTimer = Math.max(0, state.nitroTimer - dt);
        if (state.brakeTimer > 0) state.brakeTimer = Math.max(0, state.brakeTimer - dt);
        if (state.airLeakTimer > 0) state.airLeakTimer = Math.max(0, state.airLeakTimer - dt);

        // 當車子時速 >= 300 時，平滑升空離開路面約 5 米並噴出白煙，且讓車子行駛在兩條車道的正中間；若低於 300 則平滑降回原本貼地車道狀態
        const wantHover = state.targetSpeed >= 300 ? 1.0 : 0.0;
        if (state.targetSpeed >= 300 && state.playerLane !== PLAYER_LANE_CENTER) {
          state.lastGroundLane = state.playerLane;
          state.playerLane = PLAYER_LANE_CENTER;
        } else if (state.targetSpeed < 300 && state.playerLane === PLAYER_LANE_CENTER) {
          const activeCar = state.trafficCars.find(
            (c) => c.mode === 'approach' || c.mode === 'rush_to_3_cars' || c.mode === 'escape_to_horizon'
          );
          state.playerLane =
            activeCar && activeCar.lane !== PLAYER_LANE_CENTER
              ? activeCar.lane
              : (state.lastGroundLane || PLAYER_LANE_RIGHT);
        }
        state.hoverFactor += (wantHover - state.hoverFactor) * Math.min(1, dt * 5.5);
        if (state.hoverFactor < 0.005) state.hoverFactor = 0;
        if (state.hoverFactor > 0.995) state.hoverFactor = 1;
        floatingFeedback.style.top = state.hoverFactor > 0.3 ? '36%' : '48%';

        // 依據目前的速度，維持自然標準行進速度感 (/ 60)
        state.roadScroll += (state.currentSpeed / 60) * dt;

        // 更新馬路右邊腳踏車手 (隨時維持 2-4 台；若被嚇到則跌倒翻進山右邊的溝裡)
        if (state.cyclists && state.cyclists.length > 0) {
          const jerseyStyles = [
            { shirt: '#3b524d', stripe: '#e2a58b' },
            { shirt: '#dc2626', stripe: '#fef08a' },
            { shirt: '#0284c7', stripe: '#ffffff' },
            { shirt: '#d97706', stripe: '#fef08a' }
          ];
          for (let i = 0; i < state.cyclists.length; i++) {
            const bike = state.cyclists[i];
            if (bike.falling) {
              bike.fallTimer += dt;
              // 跌倒掉進山邊水溝過程：約 0.42 秒內向右傾斜滑入邊溝
              const t = Math.min(1, bike.fallTimer / 0.42);
              const wobble = (1 - t) * Math.sin(bike.fallTimer * 45) * 0.05;
              bike.lateralOffset = bike.startOffset + (bike.targetOffset - bike.startOffset) * Math.pow(t, 1.3) + wobble;
              bike.fallAngle = t * (Math.PI * 0.44); // 傾倒約 80 度
              bike.ditchY = t * 14;                  // 沉入邊溝凹處
              if (t >= 0.55 && !bike.hitDitch) {
                bike.hitDitch = true;
                spawnDitchDust(bike.z, bike.lateralOffset);
              }
              // 倒在溝中向前速度大幅減緩，被玩家車子快速掠過
              bike.z += ((state.currentSpeed / 60) * (18 / 64)) * dt;
            } else {
              const roadBackwardZSpeed = (state.currentSpeed / 60) * (18 / 64);
              const bikeForwardSpeed = 0.02 * 1.2 * 1.3;
              bike.z += (roadBackwardZSpeed - bikeForwardSpeed) * dt;
              bike.pedalPhase += (8.5 * 1.2 * 1.3) * dt;
            }

            if (bike.z > 1.02 || bike.z < 0.003) {
              bike.z = bike.z > 1.02 ? (0.004 + Math.random() * 0.012) : (0.98 + Math.random() * 0.02);
              bike.lateralOffset = 0.99 + Math.random() * 0.07;
              bike.falling = false;
              bike.fallTimer = 0;
              bike.fallAngle = 0;
              bike.ditchY = 0;
              bike.hitDitch = false;
              const style = pickRandomCyclistStyle();
              bike.shirt = style.shirt;
              bike.stripe = style.stripe;
              bike.shorts = style.shorts;
              bike.helmet = style.helmet;
            }
          }
        }

        // 更新靠海邊路上的隨機路人 (受驚嚇計時更新)
        if (state.pedestrians && state.pedestrians.length > 0) {
          for (let i = 0; i < state.pedestrians.length; i++) {
            const ped = state.pedestrians[i];
            if (ped.scaredTimer > 0) {
              ped.scaredTimer = Math.max(0, ped.scaredTimer - dt);
            }
            const roadBackwardZSpeed = (state.currentSpeed / 60) * (18 / 64);
            const pedForwardSpeed = 0.01;
            ped.z += (roadBackwardZSpeed - pedForwardSpeed) * dt;
            ped.walkPhase += (ped.type === 'jogger' ? 9.5 : 5.5) * dt;
            if (ped.z > 1.02 || ped.z < 0.003) {
              ped.z = ped.z > 1.02 ? (0.004 + Math.random() * 0.014) : (0.98 + Math.random() * 0.02);
              ped.lateralOffset = -1.20 - Math.random() * 0.14;
              ped.type = Math.random() > 0.45 ? 'jogger' : 'couple';
              ped.scaredTimer = 0;
              const st = pickRandomPedestrianStyle(ped.type);
              if (ped.type === 'jogger') {
                ped.shirt = st.shirt;
                ped.shorts = st.shorts;
              } else {
                ped.mShirt = st.mShirt;
                ped.mPants = st.mPants;
                ped.fDress = st.fDress;
              }
            }
          }
        }

        // 更新水溝塵土顆粒
        if (state.ditchPuffs && state.ditchPuffs.length > 0) {
          for (let i = state.ditchPuffs.length - 1; i >= 0; i--) {
            const p = state.ditchPuffs[i];
            p.life -= dt;
            p.z += (state.currentSpeed / 60) * (18 / 64) * dt;
            p.yOffset += p.vy * dt;
            p.r += 10 * dt;
            if (p.life <= 0 || p.z > 1.15) {
              state.ditchPuffs.splice(i, 1);
            }
          }
        }

        // 隨機在馬路右側生成 1 號公路路牌 (隨機間隔出現)
        if (state.currentSpeed > 0.5) {
          state.distSinceLastSign += (state.currentSpeed / 60) * dt;
          if (state.distSinceLastSign >= state.nextSignDistance) {
            state.distSinceLastSign = 0;
            state.nextSignDistance = 6.90 + Math.random() * 0.45;
            state.roadSigns.push({
              z: 0.004,
              lateralOffset: 1.22 + Math.random() * 0.05,
              number: 1
            });
          }
        }

        // 更新路牌前進位置 (與路面流動速率相同)
        for (let i = state.roadSigns.length - 1; i >= 0; i--) {
          const sign = state.roadSigns[i];
          sign.z += (state.currentSpeed / 60) * (18 / 64) * dt;
          if (sign.z > 1.15) {
            state.roadSigns.splice(i, 1);
          }
        }

        for (let i = state.skidMarks.length - 1; i >= 0; i--) {
          const skid = state.skidMarks[i];
          skid.z += (state.currentSpeed / 60) * dt;
          skid.alpha -= dt * 0.7;
          if (skid.z > 1.15 || skid.alpha <= 0) {
            state.skidMarks.splice(i, 1);
          }
        }

        updateHudUI();

        // 玩家平滑切換車道 + 路人車位置更新
        state.playerLaneX += (state.playerLane - state.playerLaneX) * Math.min(1, dt * 11);
        if (Math.abs(state.playerLane - state.playerLaneX) < 0.002) state.playerLaneX = state.playerLane;
        updateTrafficCars(dt);

        // 畫面渲染
        ctx.clearRect(0, 0, cw, ch);
        drawCoastalSunsetEnvironment(dt);
        drawWindingCoastalRoadAndCliffs();

        // 路人車依遠近排序：比玩家遠的先畫，被超越到玩家後方的車最後畫 (玩家升空時一律畫在玩家下方)
        const sortedTraffic = state.trafficCars.slice().sort((a, b) => a.z - b.z);
        const drawNearAfter = state.hoverFactor < 0.5;
        sortedTraffic.forEach((car) => {
          if (!drawNearAfter || car.z <= PLAYER_Z) drawTrafficCar(car);
        });

        drawPlayerSilverSportsCar();

        if (drawNearAfter) {
          sortedTraffic.forEach((car) => {
            if (car.z > PLAYER_Z) drawTrafficCar(car);
          });
        }
      }

      // ======================== 智慧手寫板引擎與多位數筆跡辨識 (v1.1) ========================
      function clearHandwritingCanvas() {
        if (hwDebounceTimer) {
          clearTimeout(hwDebounceTimer);
          hwDebounceTimer = null;
        }
        hwStrokes = [];
        currentHwStroke = [];
        isHwDrawing = false;
        if (hwCtx && hwCanvas) {
          hwCtx.clearRect(0, 0, hwCanvas.width, hwCanvas.height);
        }
        if (hwWrap) {
          hwWrap.classList.remove('drawing', 'active');
        }
      }

      function redrawHwStrokes() {
        if (!hwCtx || !hwCanvas || !Array.isArray(hwStrokes)) return;
        const curDpr = window.devicePixelRatio || 1;
        hwCtx.save();
        hwCtx.setTransform(1, 0, 0, 1, 0, 0);
        hwCtx.clearRect(0, 0, hwCanvas.width, hwCanvas.height);
        hwCtx.scale(curDpr, curDpr);

        hwCtx.strokeStyle = '#00f0ff';
        hwCtx.lineWidth = 6;
        hwCtx.lineCap = 'round';
        hwCtx.lineJoin = 'round';
        hwCtx.shadowColor = 'rgba(0, 240, 255, 0.75)';
        hwCtx.shadowBlur = 8;

        for (const str of hwStrokes) {
          if (str.length === 0) continue;
          if (str.length === 1) {
            hwCtx.beginPath();
            hwCtx.arc(str[0].x, str[0].y, 3, 0, Math.PI * 2);
            hwCtx.fillStyle = '#00f0ff';
            hwCtx.fill();
            continue;
          }
          hwCtx.beginPath();
          hwCtx.moveTo(str[0].x, str[0].y);
          for (let i = 1; i < str.length - 1; i++) {
            const midX = (str[i].x + str[i + 1].x) / 2;
            const midY = (str[i].y + str[i + 1].y) / 2;
            hwCtx.quadraticCurveTo(str[i].x, str[i].y, midX, midY);
          }
          hwCtx.lineTo(str[str.length - 1].x, str[str.length - 1].y);
          hwCtx.stroke();
        }
        hwCtx.restore();
      }

      function resizeHwCanvas() {
        if (!hwWrap || !hwCanvas) return;
        const rect = hwWrap.getBoundingClientRect();
        if (rect.width <= 0 || rect.height <= 0) return;
        const curDpr = window.devicePixelRatio || 1;
        const targetW = Math.round(rect.width * curDpr);
        const targetH = Math.round(rect.height * curDpr);
        if (hwCanvas.width !== targetW || hwCanvas.height !== targetH) {
          hwCanvas.width = targetW;
          hwCanvas.height = targetH;
          redrawHwStrokes();
        }
      }

      function getHwPointerPos(e) {
        const rect = hwCanvas.getBoundingClientRect();
        return {
          x: e.clientX - rect.left,
          y: e.clientY - rect.top,
          t: Date.now()
        };
      }

      hwCanvas.addEventListener('pointerdown', (e) => {
        if (state.phase !== 'RACING' || state.inputLocked) return;
        e.preventDefault();
        try { hwCanvas.setPointerCapture(e.pointerId); } catch (_) {}
        isHwDrawing = true;
        if (hwDebounceTimer) {
          clearTimeout(hwDebounceTimer);
          hwDebounceTimer = null;
        }
        hwWrap.classList.add('drawing', 'active');

        const pt = getHwPointerPos(e);
        currentHwStroke = [pt];
        hwStrokes.push(currentHwStroke);

        const curDpr = window.devicePixelRatio || 1;
        hwCtx.save();
        hwCtx.setTransform(1, 0, 0, 1, 0, 0);
        hwCtx.scale(curDpr, curDpr);
        hwCtx.strokeStyle = '#00f0ff';
        hwCtx.lineWidth = 6;
        hwCtx.lineCap = 'round';
        hwCtx.lineJoin = 'round';
        hwCtx.shadowColor = 'rgba(0, 240, 255, 0.75)';
        hwCtx.shadowBlur = 8;
        hwCtx.beginPath();
        hwCtx.arc(pt.x, pt.y, 2.5, 0, Math.PI * 2);
        hwCtx.fillStyle = '#00f0ff';
        hwCtx.fill();
        hwCtx.restore();
      });

      hwCanvas.addEventListener('pointermove', (e) => {
        if (!isHwDrawing || state.phase !== 'RACING' || state.inputLocked) return;
        e.preventDefault();
        const pt = getHwPointerPos(e);
        currentHwStroke.push(pt);

        const len = currentHwStroke.length;
        if (len >= 2) {
          const curDpr = window.devicePixelRatio || 1;
          hwCtx.save();
          hwCtx.setTransform(1, 0, 0, 1, 0, 0);
          hwCtx.scale(curDpr, curDpr);
          hwCtx.strokeStyle = '#00f0ff';
          hwCtx.lineWidth = 6;
          hwCtx.lineCap = 'round';
          hwCtx.lineJoin = 'round';
          hwCtx.shadowColor = 'rgba(0, 240, 255, 0.75)';
          hwCtx.shadowBlur = 8;

          hwCtx.beginPath();
          const p1 = currentHwStroke[len - 2];
          const p2 = currentHwStroke[len - 1];
          hwCtx.moveTo(p1.x, p1.y);
          hwCtx.lineTo(p2.x, p2.y);
          hwCtx.stroke();
          hwCtx.restore();
        }
      });

      // 動態智慧防抖延遲：當玩家寫兩位數的第一位，或剛寫完「4 / 5 / 7」的第一筆劃時，給予較充裕的銜接時間，避免半途誤觸發
      function getAdaptiveHwDebounceMs() {
        if (!hwStrokes || hwStrokes.length === 0) return HW_DEBOUNCE_MS;
        if (hwStrokes.length === 1) {
          const s = hwStrokes[0];
          let minX = Infinity, maxX = -Infinity, minY = Infinity, maxY = -Infinity;
          for (const p of s) {
            if (p.x < minX) minX = p.x;
            if (p.x > maxX) maxX = p.x;
            if (p.y < minY) minY = p.y;
            if (p.y > maxY) maxY = p.y;
          }
          const sw = maxX - minX;
          const sh = maxY - minY;
          // 單一橫線 (如 5 或 7 的頂部橫槓) 或 L 型折線 (如雙筆劃 4 的第一筆) 尚未寫第二筆
          if (sw > 18 && sh < sw * 0.35) return 560;
          if (s.length >= 4 && sw > 16 && sh > 16) {
            const pStart = s[0];
            const pEnd = s[s.length - 1];
            const endNormX = (pEnd.x - minX) / Math.max(1, sw);
            const endNormY = (pEnd.y - minY) / Math.max(1, sh);
            const startNormY = (pStart.y - minY) / Math.max(1, sh);
            if (startNormY < 0.35 && endNormX > 0.72 && endNormY > 0.38 && endNormY < 0.82) {
              return 560;
            }
          }
          // 題目為兩位數且目前僅寫了 1 筆時，稍微放寬防抖時間以利連續書寫十位與個位
          if (state.expectedAnswer && state.expectedAnswer.length === 2 && state.currentInput.length === 0) {
            return 480;
          }
        }
        return HW_DEBOUNCE_MS;
      }

      function handleHwPointerEnd(e) {
        if (!isHwDrawing) return;
        isHwDrawing = false;
        try {
          if (hwCanvas.hasPointerCapture(e.pointerId)) {
            hwCanvas.releasePointerCapture(e.pointerId);
          }
        } catch (_) {}

        hwWrap.classList.remove('active');

        if (hwDebounceTimer) clearTimeout(hwDebounceTimer);
        hwDebounceTimer = setTimeout(processHandwritingRecognition, getAdaptiveHwDebounceMs());
      }

      hwCanvas.addEventListener('pointerup', handleHwPointerEnd);
      hwCanvas.addEventListener('pointercancel', handleHwPointerEnd);

      // ======================== 手寫輸入 <-> 數字鍵盤 模式切換控制 ========================
      function setInputMode(mode, force = false) {
        const now = performance.now();
        if (!force && now - lastModeSwitchTime < 150) return;
        lastModeSwitchTime = now;

        inputMode = mode === 'keypad' ? 'keypad' : 'handwriting';
        clearHandwritingCanvas();
        if (inputMode === 'keypad') {
          if (hwWrap) hwWrap.classList.add('hidden');
          if (numpadGrid) numpadGrid.classList.remove('hidden');
          if (iconModeHw) iconModeHw.classList.remove('hidden');
          if (iconModeKeypad) iconModeKeypad.classList.add('hidden');
        } else {
          if (numpadGrid) numpadGrid.classList.add('hidden');
          if (hwWrap) hwWrap.classList.remove('hidden');
          if (iconModeHw) iconModeHw.classList.add('hidden');
          if (iconModeKeypad) iconModeKeypad.classList.remove('hidden');
          resizeHwCanvas();
          requestAnimationFrame(() => resizeHwCanvas());
        }
      }

      if (inputModeToggleBtn) {
        inputModeToggleBtn.addEventListener('pointerdown', (e) => {
          e.stopPropagation();
        });
        inputModeToggleBtn.addEventListener('click', (e) => {
          e.preventDefault();
          e.stopPropagation();
          const nextMode = inputMode === 'keypad' ? 'handwriting' : 'keypad';
          setInputMode(nextMode);
          try {
            sound.init();
            sound.playKeyClick('5');
          } catch (_) {}
        });
      }

      function flashKeyVisual(buttonEl) {
        if (!buttonEl) return;
        buttonEl.classList.add('pressed');
        setTimeout(() => buttonEl.classList.remove('pressed'), 110);
      }

      digitButtons.forEach((btn) => {
        btn.addEventListener('pointerdown', (e) => {
          e.preventDefault();
          const digit = btn.getAttribute('data-digit');
          flashKeyVisual(btn);
          handleDigitInput(digit);
        });
      });

      // ======================== 高準確率混合多原型手寫數字辨識引擎 (v1.3 升級版) ========================
      // 1. 等距重採樣多段線 (消除書寫速度差異與手抖雜訊)
      function resamplePolyline(pts, n = 32) {
        if (!pts || pts.length === 0) return [];
        if (pts.length === 1) return Array.from({ length: n }, () => ({ x: pts[0].x, y: pts[0].y }));
        let totalLen = 0;
        const segLens = [];
        for (let i = 1; i < pts.length; i++) {
          const d = Math.hypot(pts[i].x - pts[i - 1].x, pts[i].y - pts[i - 1].y);
          segLens.push(d);
          totalLen += d;
        }
        if (totalLen < 1e-5) return Array.from({ length: n }, () => ({ x: pts[0].x, y: pts[0].y }));
        const step = totalLen / (n - 1);
        const out = [{ x: pts[0].x, y: pts[0].y }];
        let accum = 0;
        let segIdx = 0;
        for (let k = 1; k < n - 1; k++) {
          const target = k * step;
          while (segIdx < segLens.length - 1 && accum + segLens[segIdx] < target) {
            accum += segLens[segIdx];
            segIdx++;
          }
          const segLen = segLens[segIdx] || 1e-5;
          const t = Math.max(0, Math.min(1, (target - accum) / segLen));
          const p1 = pts[segIdx];
          const p2 = pts[segIdx + 1];
          out.push({
            x: p1.x + (p2.x - p1.x) * t,
            y: p1.y + (p2.y - p1.y) * t
          });
        }
        out.push({ x: pts[pts.length - 1].x, y: pts[pts.length - 1].y });
        return out;
      }

      // 2. 萃取正規化點雲與切線方向向量場 (對筆順、一筆/兩筆寫法具高容錯性)
      function extractPointTangentCloud(strokesList, targetCount = 36) {
        let minX = Infinity, maxX = -Infinity, minY = Infinity, maxY = -Infinity;
        let totalLen = 0;
        for (const s of strokesList) {
          for (let i = 0; i < s.length; i++) {
            const p = s[i];
            if (p.x < minX) minX = p.x;
            if (p.x > maxX) maxX = p.x;
            if (p.y < minY) minY = p.y;
            if (p.y > maxY) maxY = p.y;
            if (i > 0) {
              totalLen += Math.hypot(p.x - s[i - 1].x, p.y - s[i - 1].y);
            }
          }
        }
        const w = Math.max(1e-3, maxX - minX);
        const h = Math.max(1e-3, maxY - minY);
        const aspectRatio = w / h;

        const normW = Math.max(w, h * 0.25);
        const xPad = (normW - w) / 2;

        const cloud = [];
        const normStrokes = [];
        let smoothUpward = 0;
        for (const s of strokesList) {
          if (!s || s.length === 0) continue;
          let sLen = 0;
          for (let i = 1; i < s.length; i++) {
            sLen += Math.hypot(s[i].x - s[i - 1].x, s[i].y - s[i - 1].y);
          }
          const share = totalLen > 0 ? Math.max(4, Math.round((sLen / totalLen) * targetCount)) : targetCount;
          const res = resamplePolyline(
            s.map((p) => ({
              x: (p.x - minX + xPad) / normW,
              y: (p.y - minY) / h
            })),
            share
          );
          normStrokes.push(res);
          for (let i = 0; i < res.length; i++) {
            if (i >= Math.floor(res.length * 0.22)) {
              const dy = res[i].y - res[i - 1].y;
              if (dy < -0.015) smoothUpward += -dy;
            }
            const pPrev = res[Math.max(0, i - 1)];
            const pNext = res[Math.min(res.length - 1, i + 1)];
            let ang = Math.atan2(pNext.y - pPrev.y, pNext.x - pPrev.x);
            if (ang < 0) ang += Math.PI;
            if (ang >= Math.PI) ang -= Math.PI;
            cloud.push({ x: res[i].x, y: res[i].y, ang });
          }
        }

        return { cloud, normStrokes, minX, maxX, minY, maxY, w, h, aspectRatio, totalLen, upwardRatio: smoothUpward };
      }

      // 雙向 Chamfer 點雲 + 切線方向距離 (不依賴筆劃順序與起點)
      function cloudChamferDistance(cloudA, cloudB) {
        if (cloudA.length === 0 || cloudB.length === 0) return Infinity;
        let sumAB = 0;
        for (let i = 0; i < cloudA.length; i++) {
          const a = cloudA[i];
          let minD = Infinity;
          for (let j = 0; j < cloudB.length; j++) {
            const b = cloudB[j];
            const dx = a.x - b.x;
            const dy = a.y - b.y;
            let dAng = Math.abs(a.ang - b.ang);
            if (dAng > Math.PI * 0.5) dAng = Math.PI - dAng;
            const d = Math.hypot(dx, dy) + 0.18 * (dAng / (Math.PI * 0.5));
            if (d < minD) minD = d;
          }
          sumAB += minD;
        }
        let sumBA = 0;
        for (let j = 0; j < cloudB.length; j++) {
          const b = cloudB[j];
          let minD = Infinity;
          for (let i = 0; i < cloudA.length; i++) {
            const a = cloudA[i];
            const dx = a.x - b.x;
            const dy = a.y - b.y;
            let dAng = Math.abs(a.ang - b.ang);
            if (dAng > Math.PI * 0.5) dAng = Math.PI - dAng;
            const d = Math.hypot(dx, dy) + 0.18 * (dAng / (Math.PI * 0.5));
            if (d < minD) minD = d;
          }
          sumBA += minD;
        }
        return (sumAB / cloudA.length + sumBA / cloudB.length) * 0.5;
      }

      // 有向軌跡序列距離 (針對單筆連寫特徵加權)
      function directedTrajectoryDistance(cloudA, cloudB) {
        const n = Math.min(cloudA.length, cloudB.length);
        if (n === 0) return Infinity;
        let sum = 0;
        for (let i = 0; i < n; i++) {
          const ia = Math.min(cloudA.length - 1, Math.floor((i / n) * cloudA.length));
          const ib = Math.min(cloudB.length - 1, Math.floor((i / n) * cloudB.length));
          sum += Math.hypot(cloudA[ia].x - cloudB[ib].x, cloudA[ia].y - cloudB[ib].y);
        }
        return sum / n;
      }

      function makeProtoStrokes(strokeCoordsArray) {
        return strokeCoordsArray.map((coords) => {
          const pts = [];
          for (let i = 0; i < coords.length - 1; i++) {
            const [x1, y1] = coords[i];
            const [x2, y2] = coords[i + 1];
            for (let s = 0; s < 8; s++) {
              const t = s / 8;
              pts.push({ x: x1 + (x2 - x1) * t, y: y1 + (y2 - y1) * t });
            }
          }
          const last = coords[coords.length - 1];
          pts.push({ x: last[0], y: last[1] });
          return pts;
        });
      }

        { digit: '4', dirWeight: 0.30, strokes: [[[0.55, 0.10], [0.10, 0.62], [0.92, 0.62], [0.68, 0.12], [0.68, 0.95]]] },
        // 5
        { digit: '5', dirWeight: 0.15, strokes: [[[0.22, 0.08], [0.18, 0.46], [0.65, 0.44], [0.88, 0.62], [0.82, 0.85], [0.45, 0.95], [0.15, 0.85]], [[0.22, 0.08], [0.88, 0.08]]] },
        { digit: '5', dirWeight: 0.35, strokes: [[[0.86, 0.08], [0.20, 0.08], [0.18, 0.45], [0.68, 0.45], [0.88, 0.65], [0.80, 0.88], [0.42, 0.95], [0.15, 0.85]]] },
        // 6
        { digit: '6', dirWeight: 0.40, strokes: [[[0.72, 0.06], [0.32, 0.28], [0.12, 0.62], [0.22, 0.88], [0.55, 0.95], [0.85, 0.82], [0.85, 0.58], [0.52, 0.48], [0.16, 0.60]]] },
        { digit: '6', dirWeight: 0.40, strokes: [[[0.62, 0.05], [0.24, 0.32], [0.10, 0.65], [0.25, 0.92], [0.62, 0.95], [0.88, 0.78], [0.82, 0.54], [0.46, 0.48], [0.18, 0.62]]] },
        // 7
        { digit: '7', dirWeight: 0.40, strokes: [[[0.10, 0.08], [0.88, 0.08], [0.38, 0.95]]] },
        { digit: '7', dirWeight: 0.40, strokes: [[[0.12, 0.24], [0.12, 0.08], [0.88, 0.08], [0.40, 0.95]]] },
        { digit: '7', dirWeight: 0.35, strokes: [[[0.10, 0.10], [0.88, 0.08], [0.52, 0.95]]] },
        { digit: '7', dirWeight: 0.15, strokes: [[[0.10, 0.08], [0.88, 0.08]], [[0.86, 0.08], [0.38, 0.95]]] },
        { digit: '7', dirWeight: 0.15, strokes: [[[0.10, 0.08], [0.88, 0.08], [0.38, 0.95]], [[0.32, 0.50], [0.78, 0.50]]] },
        // 8
        { digit: '8', dirWeight: 0.20, strokes: [[[0.50, 0.06], [0.18, 0.20], [0.22, 0.38], [0.50, 0.50], [0.82, 0.64], [0.85, 0.84], [0.50, 0.95], [0.15, 0.84], [0.18, 0.64], [0.50, 0.50], [0.80, 0.38], [0.82, 0.20], [0.50, 0.06]]] },
        { digit: '8', dirWeight: 0.20, strokes: [[[0.50, 0.06], [0.82, 0.20], [0.80, 0.38], [0.50, 0.50], [0.18, 0.64], [0.15, 0.84], [0.50, 0.95], [0.85, 0.84], [0.82, 0.64], [0.50, 0.50], [0.22, 0.38], [0.18, 0.20], [0.50, 0.06]]] },
        { digit: '8', dirWeight: 0.10, strokes: [[[0.50, 0.06], [0.18, 0.25], [0.50, 0.48], [0.82, 0.25], [0.50, 0.06]], [[0.50, 0.48], [0.15, 0.72], [0.50, 0.95], [0.85, 0.72], [0.50, 0.48]]] },
        // 9
        { digit: '9', dirWeight: 0.35, strokes: [[[0.82, 0.28], [0.52, 0.06], [0.16, 0.18], [0.16, 0.42], [0.52, 0.48], [0.82, 0.30], [0.78, 0.95]]] },
        { digit: '9', dirWeight: 0.35, strokes: [[[0.80, 0.26], [0.50, 0.06], [0.16, 0.20], [0.18, 0.42], [0.52, 0.48], [0.82, 0.30], [0.80, 0.80], [0.55, 0.95], [0.28, 0.90]]] },
        { digit: '9', dirWeight: 0.20, strokes: [[[0.78, 0.22], [0.46, 0.06], [0.14, 0.22], [0.18, 0.44], [0.56, 0.46], [0.82, 0.28]], [[0.82, 0.18], [0.76, 0.95]]] }
      ];

      const DIGIT_PROTOTYPES = DIGIT_PROTOTYPES_RAW.map((p) => {
        const s = makeProtoStrokes(p.strokes);
        const info = extractPointTangentCloud(s, 36);
        return { digit: p.digit, dirWeight: p.dirWeight, cloud: info.cloud, strokeCount: p.strokes.length };
      });

      // 筆跡向量轉 24x24 網格 (支援微缺口自動閉合以提升 0/6/8/9 拓撲環洞檢出率)
      function rasterizeStrokes(strokesList, size = 24, bridgeGaps = false) {
        let minX = Infinity, maxX = -Infinity, minY = Infinity, maxY = -Infinity;
        for (const s of strokesList) {
          for (const p of s) {
            if (p.x < minX) minX = p.x;
            if (p.x > maxX) maxX = p.x;
            if (p.y < minY) minY = p.y;
            if (p.y > maxY) maxY = p.y;
          }
        }
        const w = Math.max(1, maxX - minX);
        const h = Math.max(1, maxY - minY);
        const pad = 2.5;
        const innerSize = size - pad * 2;
        const scale = Math.min(innerSize / w, innerSize / h);
        const offX = pad + (innerSize - w * scale) / 2;
        const offY = pad + (innerSize - h * scale) / 2;

        const grid = Array.from({ length: size }, () => new Uint8Array(size));
        const radius = 0.95;

        function drawSeg(x1, y1, x2, y2) {
          const dist = Math.hypot(x2 - x1, y2 - y1);
          const steps = Math.max(1, Math.ceil(dist * 3));
          for (let i = 0; i <= steps; i++) {
            const t = i / steps;
            const cx = x1 + (x2 - x1) * t;
            const cy = y1 + (y2 - y1) * t;
            const y0 = Math.max(0, Math.floor(cy - radius));
            const y1i = Math.min(size - 1, Math.ceil(cy + radius));
            const x0 = Math.max(0, Math.floor(cx - radius));
            const x1i = Math.min(size - 1, Math.ceil(cx + radius));
            for (let yy = y0; yy <= y1i; yy++) {
              for (let xx = x0; xx <= x1i; xx++) {
                if (Math.hypot(xx + 0.5 - cx, yy + 0.5 - cy) <= radius) {
                  grid[yy][xx] = 1;
                }
              }
            }
          }
        }

        const resampledStrokes = strokesList.map((s) =>
          resamplePolyline(
            s.map((p) => ({
              x: (p.x - minX) * scale + offX,
              y: (p.y - minY) * scale + offY
            })),
            32
          )
        );

        for (const s of resampledStrokes) {
          for (let i = 1; i < s.length; i++) {
            drawSeg(s[i - 1].x, s[i - 1].y, s[i].x, s[i].y);
          }
        }

        if (bridgeGaps) {
          for (const s of resampledStrokes) {
            if (s.length < 10) continue;
            const pStart = s[0];
            const pEnd = s[s.length - 1];
            if (Math.hypot(pEnd.x - pStart.x, pEnd.y - pStart.y) < 4.5) {
              drawSeg(pStart.x, pStart.y, pEnd.x, pEnd.y);
            }
            for (let i = 10; i < Math.floor(s.length * 0.75); i++) {
              if (Math.hypot(s[i].x - pStart.x, s[i].y - pStart.y) < 3.6) {
                drawSeg(pStart.x, pStart.y, s[i].x, s[i].y);
                break;
              }
            }
            for (let i = Math.floor(s.length * 0.25); i < s.length - 10; i++) {
              if (Math.hypot(s[i].x - pEnd.x, s[i].y - pEnd.y) < 3.6) {
                drawSeg(pEnd.x, pEnd.y, s[i].x, s[i].y);
                break;
              }
            }
          }
        }

        return grid;
      }

      // 拓撲環洞檢測
      function detectHoles(grid, size = 24) {
        const visited = Array.from({ length: size }, () => new Uint8Array(size));
        const queue = [];

        for (let x = 0; x < size; x++) {
          if (grid[0][x] === 0) { visited[0][x] = 1; queue.push([0, x]); }
          if (grid[size - 1][x] === 0 && !visited[size - 1][x]) { visited[size - 1][x] = 1; queue.push([size - 1, x]); }
        }
        for (let y = 0; y < size; y++) {
          if (grid[y][0] === 0 && !visited[y][0]) { visited[y][0] = 1; queue.push([y, 0]); }
          if (grid[y][size - 1] === 0 && !visited[y][size - 1]) { visited[y][size - 1] = 1; queue.push([y, size - 1]); }
        }

        while (queue.length > 0) {
          const [cy, cx] = queue.pop();
          const dirs = [[0, 1], [0, -1], [1, 0], [-1, 0]];
          for (const [dy, dx] of dirs) {
            const ny = cy + dy, nx = cx + dx;
            if (ny >= 0 && ny < size && nx >= 0 && nx < size) {
              if (grid[ny][nx] === 0 && !visited[ny][nx]) {
                visited[ny][nx] = 1;
                queue.push([ny, nx]);
              }
            }
          }
        }

        const holes = [];
        for (let y = 1; y < size - 1; y++) {
          for (let x = 1; x < size - 1; x++) {
            if (grid[y][x] === 0 && !visited[y][x]) {
              const hq = [[y, x]];
              visited[y][x] = 2;
              let area = 0, sumY = 0, sumX = 0;
              let minY = y, maxY = y, minX = x, maxX = x;
              while (hq.length > 0) {
                const [hy, hx] = hq.pop();
                area++; sumY += hy; sumX += hx;
                if (hy < minY) minY = hy;
                if (hy > maxY) maxY = hy;
                if (hx < minX) minX = hx;
                if (hx > maxX) maxX = hx;
                const dirs = [[0, 1], [0, -1], [1, 0], [-1, 0]];
                for (const [dy, dx] of dirs) {
                  const ny = hy + dy, nx = hx + dx;
                  if (ny >= 0 && ny < size && nx >= 0 && nx < size) {
                    if (grid[ny][nx] === 0 && !visited[ny][nx]) {
                      visited[ny][nx] = 2;
                      hq.push([ny, nx]);
                    }
                  }
                }
              }
              if (area >= 4) {
                holes.push({
                  area,
                  centerY: (sumY / area) / size,
                  centerX: (sumX / area) / size,
                  minY: minY / size,
                  maxY: maxY / size
                });
              }
            }
          }
        }
        return holes;
      }

      // 單一位數字辨識器 (0-9，結合多原型切線點雲比對、拓撲環洞與結構不變量特徵)
      function recognizeSingleDigit(strokesList, expectedHintDigit = '') {
        if (!strokesList || strokesList.length === 0) return '';
        const info = extractPointTangentCloud(strokesList, 36);
        const { cloud, normStrokes, aspectRatio, totalLen, upwardRatio } = info;
        if (cloud.length === 0) return '';

        const firstStroke = normStrokes[0];
        const lastStroke = normStrokes[normStrokes.length - 1];
        const startPt = firstStroke[0];
        const endPt = lastStroke[lastStroke.length - 1];

        // 快速判定明確的『1』(極窄比例或單一直線段)
        if (strokesList.length === 1) {
          const rawFirst = strokesList[0];
          const chord = Math.hypot(
            rawFirst[rawFirst.length - 1].x - rawFirst[0].x,
            rawFirst[rawFirst.length - 1].y - rawFirst[0].y
          );
          const straightness = chord / Math.max(1, totalLen);
          if (aspectRatio < 0.30 || (aspectRatio < 0.52 && straightness > 0.87)) {
            return '1';
          }
        }

        // 計算與 0-9 多原型的綜合距離 (距離愈小代表吻合度愈高)
        const bestDist = {
          '0': Infinity, '1': Infinity, '2': Infinity, '3': Infinity, '4': Infinity,
          '5': Infinity, '6': Infinity, '7': Infinity, '8': Infinity, '9': Infinity
        };
        for (const proto of DIGIT_PROTOTYPES) {
          const cDist = cloudChamferDistance(cloud, proto.cloud);
          const dDist =
            strokesList.length === 1 && proto.strokeCount === 1
              ? directedTrajectoryDistance(cloud, proto.cloud)
              : cDist;
          const combined = cDist * (1 - proto.dirWeight) + dDist * proto.dirWeight;
          if (combined < bestDist[proto.digit]) {
            bestDist[proto.digit] = combined;
          }
        }

        const size = 24;
        const rawGrid = rasterizeStrokes(strokesList, size, false);
        const rawHoles = detectHoles(rawGrid, size);
        const bridgedHoles =
          upwardRatio > 0.25 ? detectHoles(rasterizeStrokes(strokesList, size, true), size) : rawHoles;
        const holes = rawHoles.length >= bridgedHoles.length ? rawHoles : bridgedHoles;
        const numHoles = holes.length;

        // 單調向下無回勾的筆劃 (如 2, 3, 7) 不會是閉環類數字 (0, 6, 8, 9)
        if (upwardRatio < 0.16 && strokesList.length === 1) {
          bestDist['0'] += 0.18;
          bestDist['6'] += 0.15;
          bestDist['8'] += 0.18;
          bestDist['9'] += 0.12;
        }

        // 上半部左右側密度不對稱性：區分 3 (右上滿、左上空) 與 5 (左上豎壁滿、右上空)
        let upperMidLeft = 0, upperMidRight = 0, lowerRight = 0;
        for (const p of cloud) {
          if (p.y >= 0.18 && p.y <= 0.42) {
            if (p.x < 0.35) upperMidLeft++;
            if (p.x > 0.55) upperMidRight++;
          }
          if (p.y > 0.55 && p.x > 0.62) lowerRight++;
        }
        if (strokesList.length === 1) {
          if (startPt.x < 0.45 && startPt.y < 0.30 && upperMidRight > upperMidLeft) {
            bestDist['5'] += 0.10;
            if (endPt.x < 0.50) bestDist['3'] -= 0.05;
          }
          if (upperMidLeft > upperMidRight + 2) {
            bestDist['5'] -= 0.06;
            bestDist['3'] += 0.08;
          }
        }

        // 拓撲環洞結構加分
        if (numHoles >= 2 && (upwardRatio > 0.30 || strokesList.length >= 2)) {
          bestDist['8'] -= 0.14;
        } else if (numHoles === 1 && upwardRatio > 0.25) {
          const hole = holes[0];
          if (hole.minY < 0.28 && hole.maxY > 0.72) {
            bestDist['0'] -= 0.12;
          } else if (hole.centerY > 0.54 && startPt.y < 0.30) {
            bestDist['6'] -= 0.10;
          } else if (hole.centerY < 0.46 && endPt.y > 0.75) {
            bestDist['9'] -= 0.08;
          }
        }

        // 多筆劃結構加分 (2 筆劃的 4、5、7)
        if (strokesList.length >= 2) {
          let hasTopBar = false;
          let hasMidBarOrL = false;

          for (const s of normStrokes) {
            let sMinX = 1, sMaxX = 0, sMinY = 1, sMaxY = 0;
            let sTopMinX = 1, sTopMaxX = 0;
            for (const p of s) {
              if (p.x < sMinX) sMinX = p.x;
              if (p.x > sMaxX) sMaxX = p.x;
              if (p.y < sMinY) sMinY = p.y;
              if (p.y > sMaxY) sMaxY = p.y;
              if (p.y < 0.24) {
                if (p.x < sTopMinX) sTopMinX = p.x;
                if (p.x > sTopMaxX) sTopMaxX = p.x;
              }
            }
            if ((sMaxX - sMinX > 0.38 && sMaxY < 0.32) || (sTopMaxX - sTopMinX > 0.48)) hasTopBar = true;
            if (sMaxX - sMinX > 0.42 && sMaxY > 0.42 && sMaxY < 0.80) hasMidBarOrL = true;
          }
          if (hasTopBar) {
            if (lowerRight >= 3 && upperMidLeft >= 2) {
              bestDist['5'] -= 0.12;
            } else if (lowerRight <= 1) {
              bestDist['7'] -= 0.10;
            }
          }
          if (hasMidBarOrL && !hasTopBar) {
            bestDist['4'] -= 0.12;
          }
        }

        // 當玩家快速書寫造成前兩名候選字分數極為接近 (差距 < 0.024) 時，允許參考當前題目合理位數消歧義
        if (expectedHintDigit && bestDist[expectedHintDigit] !== undefined) {
          bestDist[expectedHintDigit] -= 0.022;
        }

        let winner = '3';
        let minScore = Infinity;
        for (const [d, score] of Object.entries(bestDist)) {
          if (score < minScore) {
            minScore = score;
            winner = d;
          }
        }
        return winner;
      }

      // 同一手寫框智慧判斷 1 位數 vs 2 位數並進行筆劃聚類與投影深谷分割辨識
      function segmentAndRecognize(strokesList) {
        if (!strokesList || strokesList.length === 0) return '';
        let minX = Infinity, maxX = -Infinity, minY = Infinity, maxY = -Infinity;
        const strokeBoxes = [];
        for (const str of strokesList) {
          if (!str || str.length === 0) continue;
          let sMinX = Infinity, sMaxX = -Infinity, sMinY = Infinity, sMaxY = -Infinity;
          for (const p of str) {
            if (p.x < minX) minX = p.x;
            if (p.x > maxX) maxX = p.x;
            if (p.y < minY) minY = p.y;
            if (p.y > maxY) maxY = p.y;
            if (p.x < sMinX) sMinX = p.x;
            if (p.x > sMaxX) sMaxX = p.x;
            if (p.y < sMinY) sMinY = p.y;
            if (p.y > sMaxY) sMaxY = p.y;
          }
          strokeBoxes.push({
            stroke: str,
            minX: sMinX,
            maxX: sMaxX,
            minY: sMinY,
            maxY: sMaxY,
            cx: (sMinX + sMaxX) / 2,
            w: sMaxX - sMinX,
            h: sMaxY - sMinY
          });
        }

        const W = maxX - minX;
        const H = maxY - minY;
        if (H > 15 && W <= 8 && strokeBoxes.length === 1) return '1';
        if (H <= 5 || (W <= 5 && H <= 5)) return '';

        const expAns = state.expectedAnswer || '';
        const curLen = (state.currentInput || '').length;
        const singleHint = expAns.length === 1 ? expAns[0] : (curLen === 0 ? expAns[0] : expAns[1]);

        // 方法 1：以筆劃邊界框水平重疊率進行左右兩位數聚類 (不會切斷 4、5、7 等多筆劃單一數字)
        if (strokeBoxes.length >= 2) {
          const sorted = strokeBoxes.slice().sort((a, b) => a.cx - b.cx);
          let bestSplitIdx = -1;
          let bestGapScore = -Infinity;
          for (let i = 0; i < sorted.length - 1; i++) {
            let lMinX = Infinity, lMaxX = -Infinity, lMinY = Infinity, lMaxY = -Infinity;
            for (let j = 0; j <= i; j++) {
              if (sorted[j].minX < lMinX) lMinX = sorted[j].minX;
              if (sorted[j].maxX > lMaxX) lMaxX = sorted[j].maxX;
              if (sorted[j].minY < lMinY) lMinY = sorted[j].minY;
              if (sorted[j].maxY > lMaxY) lMaxY = sorted[j].maxY;
            }
            let rMinX = Infinity, rMaxX = -Infinity, rMinY = Infinity, rMaxY = -Infinity;
            for (let j = i + 1; j < sorted.length; j++) {
              if (sorted[j].minX < rMinX) rMinX = sorted[j].minX;
              if (sorted[j].maxX > rMaxX) rMaxX = sorted[j].maxX;
              if (sorted[j].minY < rMinY) rMinY = sorted[j].minY;
              if (sorted[j].maxY > rMaxY) rMaxY = sorted[j].maxY;
            }
            const lH = lMaxY - lMinY;
            const rH = rMaxY - rMinY;
            if (lH < H * 0.42 || rH < H * 0.42) continue;

            const gap = rMinX - lMaxX;
            const minGroupW = Math.max(8, Math.min(lMaxX - lMinX, rMaxX - rMinX));
            const overlapRatio = -gap / minGroupW;

            if (overlapRatio < 0.22 && gap > bestGapScore) {
              bestGapScore = gap;
              bestSplitIdx = i;
            }
          }

          if (bestSplitIdx !== -1 && (W / H > 0.45 || bestGapScore > H * 0.10)) {
            const leftStrokes = sorted.slice(0, bestSplitIdx + 1).map((b) => b.stroke);
            const rightStrokes = sorted.slice(bestSplitIdx + 1).map((b) => b.stroke);
            const d1 = recognizeSingleDigit(leftStrokes, expAns.length === 2 ? expAns[0] : '');
            const d2 = recognizeSingleDigit(rightStrokes, expAns.length === 2 ? expAns[1] : '');
            if (d1 && d2) return d1 + d2;
          }
        }

        // 方法 2：水平投影直方圖深谷分割 (處理兩位數連筆書寫情況)
        if (W / H > 0.85) {
          const bins = 32;
          const hist = new Float32Array(bins);
          for (const str of strokesList) {
            for (let i = 0; i < str.length - 1; i++) {
              const p1 = str[i], p2 = str[i + 1];
              const steps = Math.max(1, Math.round(Math.hypot(p2.x - p1.x, p2.y - p1.y) / 2.5));
              for (let s = 0; s <= steps; s++) {
                const x = p1.x + (p2.x - p1.x) * (s / steps);
                const bin = Math.min(bins - 1, Math.max(0, Math.floor(((x - minX) / W) * bins)));
                hist[bin]++;
              }
            }
          }

          let minBin = -1, minVal = Infinity;
          let maxLeft = 0, maxRight = 0;
          for (let b = 0; b < 14; b++) if (hist[b] > maxLeft) maxLeft = hist[b];
          for (let b = 18; b < bins; b++) if (hist[b] > maxRight) maxRight = hist[b];

          for (let b = 8; b <= 24; b++) {
            if (hist[b] < minVal) {
              minVal = hist[b];
              minBin = b;
            }
          }

          const isTwoDigits = maxLeft > 3 && maxRight > 3 && minVal <= Math.min(maxLeft, maxRight) * 0.28;
          if (isTwoDigits && minBin !== -1) {
            const splitX = minX + (minBin + 0.5) * (W / bins);
            const leftStrokes = [];
            const rightStrokes = [];
            for (const str of strokesList) {
              const lPts = [], rPts = [];
              for (const p of str) {
                if (p.x < splitX) lPts.push(p);
                else rPts.push(p);
              }
              if (lPts.length > 1) leftStrokes.push(lPts);
              if (rPts.length > 1) rightStrokes.push(rPts);
            }
            if (leftStrokes.length > 0 && rightStrokes.length > 0) {
              const d1 = recognizeSingleDigit(leftStrokes, expAns.length === 2 ? expAns[0] : '');
              const d2 = recognizeSingleDigit(rightStrokes, expAns.length === 2 ? expAns[1] : '');
              return d1 + d2;
            }
          }
        }

        return recognizeSingleDigit(strokesList, singleHint);
      }

      // 手寫辨識觸發流程
      function processHandwritingRecognition() {
        if (state.phase !== 'RACING' || state.inputLocked || hwStrokes.length === 0) return;

        const recognized = segmentAndRecognize(hwStrokes);
        if (!recognized || recognized.length === 0) {
          clearHandwritingCanvas();
          return;
        }

        if (hwWrap) {
          hwWrap.classList.add('flash');
          setTimeout(() => hwWrap.classList.remove('flash'), 220);
        }

        if (recognized.length === 1) {
          // 識別出單一數字：可能是個位數答案，或是兩位數的第一位
          handleDigitInput(recognized);
          clearHandwritingCanvas();
        } else if (recognized.length >= 2) {
          // 一次寫出了兩位數 (如 56, 42 等)
          sound.playKeyClick(recognized);
          state.currentInput = recognized;
          qAnswerSlot.textContent = state.currentInput;

          const requiredDigits = state.expectedAnswer.length;
          if (state.currentInput.length >= requiredDigits) {
            if (state.currentInput === state.expectedAnswer) {
              handleCorrectAnswer();
            } else {
              handleWrongOrTimeout(false);
            }
          }
          clearHandwritingCanvas();
        }
      }

      // ======================== 雙重操作綁定 (觸控/手寫/螢幕鍵盤 + 電腦實體鍵盤 100% 支援) ========================
      window.addEventListener('keydown', (e) => {
        if (e.repeat) return;

        if (e.key >= '0' && e.key <= '9') {
          e.preventDefault();
          const targetBtn = document.querySelector(`.mech-key[data-digit="${e.key}"]`);
          flashKeyVisual(targetBtn);
          if (hwWrap && !hwWrap.classList.contains('hidden')) {
            hwWrap.classList.add('flash');
            setTimeout(() => hwWrap.classList.remove('flash'), 180);
          }
          handleDigitInput(e.key);
        } else if (e.key === 'Backspace' || e.key === 'Delete' || e.key === 'Escape') {
          e.preventDefault();
          clearHandwritingCanvas();
          handleClearInput();
        } else if (e.code === 'Space' || e.key === ' ' || e.key === 'Spacebar' || e.key === 'Enter') {
          if (state.phase === 'IDLE') {
            e.preventDefault();
            startRaceFlow(false);
          } else if (state.phase === 'ENDED' || state.phase === 'FINISHING') {
            e.preventDefault();
            startRaceFlow(true);
          }
        }
      });

      startRaceBtn.addEventListener('click', () => startRaceFlow(false));
      replayBtn.addEventListener('click', () => startRaceFlow(true));

      window.__speed99 = {
        state,
        projectRoad,
        spawnTrafficCar,
        resolveTrafficCar,
        updateTrafficCars,
        generateQuestion,
        startRaceFlow,
        handleWrongOrTimeout,
        handleCorrectAnswer,
        getTraffic3CarLengthsZ,
        getTrafficCloseZ,
        setInputMode,
        segmentAndRecognize,
        recognizeSingleDigit
      };

      initRoadSigns();
      initCyclists();
      initPedestrians();
      requestAnimationFrame(gameLoop);
    })();
  </script>
</body>
