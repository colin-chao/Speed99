  <script>
    (() => {
      'use strict';

      // ======================== Web Audio API 擬真合成音效引擎 + 內嵌 MIDI 自動合成播放器 ========================
      class SoundEngine {
        constructor() {
          this.ctx = null;
          this.enabled = true;
          this.distortionCurve = null;

          // 遊戲整體音量總線 (開始前與結束後降為 50%，倒數完恢復 100%；倒數提示音獨立維持 100%)
          this.gameBusGain = null;

          // 內嵌 MIDI 背景音樂 (BGM) 狀態與元素控制 (從頭到尾維持 20% / 0.2)
          this.bgmAudio = document.getElementById('bgmAudio');
          this.bgmVolumeRatio = 0.2;
          this.bgmFadeTimer = null;
          this.bgmReplayTimeoutId = null;
          this.bgmWaitingReplay = false;
          this.setupMidiBgm();

          // 持續排氣轟隆聲 (Continuous Exhaust Rumble) 狀態與節點
          this.engineRunning = false;
          this.engineMasterGain = null;
          this.mufflerFilter = null;
          this.exhaustNoiseFilter = null;
          this.chugLfo = null;
          this.chugFilterGain = null;
          this.engineOscs = [];

          // 時速 >= 300 升空時的持續「噗噗」氣流噴射聲節點
          this.hoverJetGain = null;
          this.hoverJetBand = null;
          this.hoverSizzleBand = null;
          this.hoverPuffLfo = null;
        }

        // 解析內嵌的 Standard MIDI File (.mid) Base64 資料並即時合成高品質 WAV 音訊供 <audio> 播放
        setupMidiBgm() {
          if (!this.bgmAudio) return;
          this.bgmAudio.loop = false; // 手動控制播完間隔 2 秒後重新播放
          this.bgmAudio.volume = 0.2;

          const midiEl = document.getElementById('bgmMidiBase64');
          if (midiEl && midiEl.textContent) {
            try {
              const wavBlob = this.synthesizeMidiToWavBlob(midiEl.textContent.trim());
              if (wavBlob) {
                this.bgmAudio.src = URL.createObjectURL(wavBlob);
              }
            } catch (err) {
              console.error('MIDI synthesis error:', err);
            }
          }

          this.bgmAudio.addEventListener('ended', () => {
            if (this.bgmReplayTimeoutId) clearTimeout(this.bgmReplayTimeoutId);
            this.bgmWaitingReplay = true;
            // 音樂播完，間隔 2 秒，重新播放
            this.bgmReplayTimeoutId = setTimeout(() => {
              this.bgmWaitingReplay = false;
              if (!this.bgmAudio) return;
              this.bgmAudio.currentTime = 0;
              this.bgmAudio.volume = this.bgmVolumeRatio;
              this.tryPlayBgm();
            }, 2000);
          });
        }

        // 將 Base64 編碼的 .mid 檔案解析為音符事件並高速合成為 PCM WAV Blob
        synthesizeMidiToWavBlob(base64Str) {
          const binStr = atob(base64Str);
          const len = binStr.length;
          const bytes = new Uint8Array(len);
          for (let i = 0; i < len; i++) {
            bytes[i] = binStr.charCodeAt(i);
          }

          // 解析 MIDI Header (MThd)
          const division = (bytes[12] << 8) | bytes[13];
          const secPerTick = 0.625 / division; // 96 BPM (每拍 0.625 秒)
          let pos = 14;
          let trackIdx = 0;
          const allNotes = [];
          let maxEndTime = 0;

          while (pos < len) {
            const chunkLen =
              ((bytes[pos + 4] << 24) >>> 0) +
              (bytes[pos + 5] << 16) +
              (bytes[pos + 6] << 8) +
              bytes[pos + 7];
            const tEnd = pos + 8 + chunkLen;
            let p = pos + 8;
            let runningStatus = 0;
            let ticks = 0;
            const active = new Map();

            while (p < tEnd) {
              let dt = 0;
              while (p < tEnd) {
                const b = bytes[p++];
                dt = (dt << 7) | (b & 0x7f);
                if ((b & 0x80) === 0) break;
              }
              ticks += dt;

              let st = bytes[p];
              if (st >= 0x80) {
                p++;
                if (st < 0xf0) runningStatus = st;
              } else {
                st = runningStatus;
              }

              if (st === 0xff) {
                p++; // meta type
                let mLen = 0;
                while (p < tEnd) {
                  const b = bytes[p++];
                  mLen = (mLen << 7) | (b & 0x7f);
                  if ((b & 0x80) === 0) break;
                }
                p += mLen;
              } else if (st === 0xf0 || st === 0xf7) {
                let sLen = 0;
                while (p < tEnd) {
                  const b = bytes[p++];
                  sLen = (sLen << 7) | (b & 0x7f);
                  if ((b & 0x80) === 0) break;
                }
                p += sLen;
              } else {
                const hi = st & 0xf0;
                if (hi === 0x80 || hi === 0x90 || hi === 0xa0 || hi === 0xb0 || hi === 0xe0) {
                  const d1 = bytes[p++];
                  const d2 = bytes[p++];
                  if (hi === 0x90 && d2 > 0) {
                    if (active.has(d1)) {
                      const prev = active.get(d1);
                      if (ticks > prev.t) {
                        const startSec = prev.t * secPerTick;
                        const durSec = (ticks - prev.t) * secPerTick;
                        allNotes.push({ trk: trackIdx, pitch: d1, vel: prev.v, start: startSec, dur: durSec });
                        if (startSec + durSec > maxEndTime) maxEndTime = startSec + durSec;
                      }
                    }
                    active.set(d1, { t: ticks, v: d2 });
                  } else if (hi === 0x80 || (hi === 0x90 && d2 === 0)) {
                    if (active.has(d1)) {
                      const prev = active.get(d1);
                      active.delete(d1);
                      if (ticks > prev.t) {
                        const startSec = prev.t * secPerTick;
                        const durSec = (ticks - prev.t) * secPerTick;
                        allNotes.push({ trk: trackIdx, pitch: d1, vel: prev.v, start: startSec, dur: durSec });
                        if (startSec + durSec > maxEndTime) maxEndTime = startSec + durSec;
                      }
                    }
                  }
                } else if (hi === 0xc0 || hi === 0xd0) {
                  p++;
                }
              }
            }
            pos = tEnd;
            trackIdx++;
          }

          const sr = 22050;
          const totalSamples = Math.ceil((maxEndTime + 0.6) * sr);
          const mix = new Float32Array(totalSamples);

          // 預先合成鼓組樣本 (Tracks 0~5)
          const drumCache = new Map();
          const getDrumWave = (trk, pitch) => {
            const key = `${trk}_${pitch}`;
            if (drumCache.has(key)) return drumCache.get(key);
            let dur = 0.22;
            if (trk === 1) dur = pitch === 42 ? 0.065 : 0.28;
            else if (trk === 3) dur = 0.28;
            else if (trk === 4) dur = 0.52;
            const n = Math.floor(dur * sr);
            const buf = new Float32Array(n);
            let phase = 0;

            for (let i = 0; i < n; i++) {
              const t = i / sr;
              const noise = Math.random() * 2 - 1;
              if (trk === 2) {
                // Bass Drum (Kick)
                const f = 44 + 115 * Math.exp(-t * 36);
                phase += (2 * Math.PI * f) / sr;
                const click = Math.exp(-t * 140) * 0.45 * noise;
                buf[i] = (Math.sin(phase) * 0.95 + click) * Math.exp(-t * 13);
              } else if (trk === 0) {
                // Snare Drum
                const f = 115 + 95 * Math.exp(-t * 28);
                phase += (2 * Math.PI * f) / sr;
                const body = Math.sin(phase) * 0.55 * Math.exp(-t * 24);
                const snare = noise * 0.75 * Math.exp(-t * 17);
                buf[i] = body + snare;
              } else if (trk === 5) {
                // Toms
                const baseF = pitch === 41 ? 88 : pitch === 45 ? 118 : 155;
                const f = baseF * (1 + 0.55 * Math.exp(-t * 22));
                phase += (2 * Math.PI * f) / sr;
                buf[i] = Math.sin(phase) * 0.85 * Math.exp(-t * 12);
              } else {
                // Hi-Hat / Ride / Crash Cymbal
                const m1 = Math.sin(2 * Math.PI * 820 * t) * Math.sin(2 * Math.PI * 1340 * t);
                const m2 = Math.sin(2 * Math.PI * 2180 * t) * Math.sin(2 * Math.PI * 3410 * t);
                const decay = trk === 1 && pitch === 42 ? 48 : trk === 3 ? 12 : 6.8;
                const level = trk === 4 ? 0.34 : trk === 1 && pitch !== 42 ? 0.32 : 0.38;
                buf[i] = (noise * 0.65 + (m1 + m2) * 0.35) * Math.exp(-t * decay) * level;
              }
            }
            drumCache.set(key, buf);
            return buf;
          };

          // 建立各樂器單週期雙波表 (Attack 亮音波表 + Sustain 延音波表，長度 2048)
          const TABLE_LEN = 2048;
          const TABLE_MASK = TABLE_LEN - 1;
          const buildWave = (amps, clip = 1.0) => {
            const tbl = new Float32Array(TABLE_LEN);
            let maxV = 0.001;
            for (let i = 0; i < TABLE_LEN; i++) {
              const th = (2 * Math.PI * i) / TABLE_LEN;
              let s = 0;
              for (let h = 0; h < amps.length; h++) {
                if (amps[h] !== 0) s += amps[h] * Math.sin((h + 1) * th);
              }
              if (clip > 1.0) s = Math.tanh(s * clip);
              tbl[i] = s;
              if (Math.abs(s) > maxV) maxV = Math.abs(s);
            }
            for (let i = 0; i < TABLE_LEN; i++) tbl[i] /= maxV;
            return tbl;
          };

          const instTables = {
            // Track 6: Saxophone (主唱旋律音色)
            6: {
              atk: buildWave([1.0, 0.72, 0.65, 0.42, 0.28, 0.18, 0.12, 0.06], 1.3),
              sus: buildWave([1.0, 0.60, 0.48, 0.26, 0.14, 0.06], 1.15),
              gain: 0.32
            },
            // Track 7: Flute (和聲旋律音色)
            7: {
              atk: buildWave([1.0, 0.38, 0.16, 0.05], 1.0),
              sus: buildWave([1.0, 0.24, 0.08], 1.0),
              gain: 0.24
            },
            // Track 8: Bass Guitar (Fingered Electric Bass)
            8: {
              atk: buildWave([1.0, 0.88, 0.65, 0.42, 0.25, 0.14, 0.08], 1.45),
              sus: buildWave([1.0, 0.62, 0.28, 0.08], 1.25),
              gain: 0.48
            },
            // Track 9 & 12: Clean/Crunch Electric Guitar (清脆彈撥電吉他與 Solo)
            9: {
              atk: buildWave([1.0, 0.85, 0.78, 0.62, 0.50, 0.38, 0.26, 0.18, 0.12, 0.08], 1.55),
              sus: buildWave([1.0, 0.65, 0.48, 0.25, 0.12, 0.06], 1.25),
              gain: 0.25
            },
            // Track 10 & 11: Distortion Guitar (Overdrive Power Chords)
            10: {
              atk: buildWave([1.0, 0.90, 0.85, 0.72, 0.64, 0.52, 0.40, 0.30, 0.22, 0.15, 0.10], 2.4),
              sus: buildWave([1.0, 0.82, 0.74, 0.56, 0.42, 0.28, 0.18, 0.10], 2.1),
              gain: 0.20
            }
          };
          instTables[11] = instTables[10];
          instTables[12] = instTables[9];

          // 混音所有音符事件
          for (let idx = 0; idx < allNotes.length; idx++) {
            const ev = allNotes[idx];
            const startSample = Math.floor(ev.start * sr);
            if (startSample >= totalSamples) continue;
            const velNorm = Math.min(1.25, ev.vel / 38);

            if (ev.trk <= 5) {
              const dBuf = getDrumWave(ev.trk, ev.pitch);
              const dLen = Math.min(dBuf.length, totalSamples - startSample);
              const amp = velNorm * 0.48;
              for (let i = 0; i < dLen; i++) {
                mix[startSample + i] += dBuf[i] * amp;
              }
            } else {
              const spec = instTables[ev.trk] || instTables[9];
              const freq = 440 * Math.pow(2, (ev.pitch - 69) / 12);
              const releaseSec = ev.trk === 8 ? 0.04 : 0.065;
              const noteSamples = Math.min(
                Math.floor((ev.dur + releaseSec) * sr),
                totalSamples - startSample
              );
              const durSamples = Math.floor(ev.dur * sr);
              const atkSamples = Math.max(1, Math.floor(0.008 * sr));
              const pluckFadeSamples = Math.max(1, Math.floor(0.085 * sr));
              const relSamples = Math.max(1, noteSamples - durSamples);

              const baseStep = (freq * TABLE_LEN) / sr;
              const amp = velNorm * spec.gain;
              const atkTbl = spec.atk;
              const susTbl = spec.sus;
              const isGuitarOrBass = ev.trk === 8 || ev.trk === 9 || ev.trk === 12;
              const useVibrato = ev.trk === 6 || ev.trk === 7;
              let phase = 0;

              for (let i = 0; i < noteSamples; i++) {
                let env = 1.0;
                if (i < atkSamples) {
                  env = i / atkSamples;
                } else if (i > durSamples) {
                  env = 1.0 - (i - durSamples) / relSamples;
                }
                if (isGuitarOrBass) {
                  env *= Math.exp(-i / (sr * (ev.trk === 8 ? 0.95 : 1.15)));
                }

                const pIdx = (phase | 0) & TABLE_MASK;
                let sampleVal;
                if (i < pluckFadeSamples) {
                  const w = i / pluckFadeSamples;
                  sampleVal = atkTbl[pIdx] * (1 - w) + susTbl[pIdx] * w;
                } else {
                  sampleVal = susTbl[pIdx];
                }

                mix[startSample + i] += sampleVal * env * amp;

                if (useVibrato && i > 2600) {
                  phase += baseStep * (1 + 0.0045 * Math.sin(i * 0.00155));
                } else {
                  phase += baseStep;
                }
              }
            }
          }

          // 封裝為標準 16-bit PCM WAV 檔案
          const wavByteLen = 44 + totalSamples * 2;
          const wavBuf = new ArrayBuffer(wavByteLen);
          const view = new DataView(wavBuf);
          const writeStr = (offset, str) => {
            for (let i = 0; i < str.length; i++) view.setUint8(offset + i, str.charCodeAt(i));
          };

          writeStr(0, 'RIFF');
          view.setUint32(4, wavByteLen - 8, true);
          writeStr(8, 'WAVE');
          writeStr(12, 'fmt ');
          view.setUint32(16, 16, true);
          view.setUint16(20, 1, true);
          view.setUint16(22, 1, true);
          view.setUint32(24, sr, true);
          view.setUint32(28, sr * 2, true);
          view.setUint16(32, 2, true);
          view.setUint16(34, 16, true);
          writeStr(36, 'data');
          view.setUint32(40, totalSamples * 2, true);

          const pcmOut = new Int16Array(wavBuf, 44, totalSamples);
          for (let i = 0; i < totalSamples; i++) {
            const s = Math.tanh(mix[i] * 0.92);
            pcmOut[i] = (s * 32767) | 0;
          }

          return new Blob([wavBuf], { type: 'audio/wav' });
        }

        init() {
          if (!this.ctx) {
            const AudioCtx = window.AudioContext || window.webkitAudioContext;
            if (AudioCtx) {
              this.ctx = new AudioCtx();
              this.distortionCurve = this.makeDistortionCurve(55);
              this.gameBusGain = this.ctx.createGain();
              // 遊戲開始前預設降低整體音效輸出 50%
              this.gameBusGain.gain.setValueAtTime(0.5, this.ctx.currentTime);
              this.gameBusGain.connect(this.ctx.destination);
            }
          }
          if (this.ctx && this.ctx.state === 'suspended') {
            this.ctx.resume().catch(() => {});
          }
        }

        // 啟動背景音樂播放
        tryPlayBgm() {
          if (!this.bgmAudio || this.bgmWaitingReplay) return;
          this.bgmAudio.volume = this.bgmVolumeRatio;
          if (!this.bgmAudio.paused) return;
          const playPromise = this.bgmAudio.play();
          if (playPromise && typeof playPromise.then === 'function') {
            playPromise.catch(() => {});
          }
        }

        // 啟動或確保 MIDI 背景音樂正在播放 (restartFromBeginning = true 時從頭播放)
        startBGM(initialRatio = 0.2, restartFromBeginning = false) {
          if (restartFromBeginning && this.bgmAudio) {
            if (this.bgmReplayTimeoutId) {
              clearTimeout(this.bgmReplayTimeoutId);
              this.bgmReplayTimeoutId = null;
            }
            this.bgmWaitingReplay = false;
            this.bgmAudio.currentTime = 0;
          }
          this.setBgmVolume(initialRatio, true);
          this.tryPlayBgm();
        }

        // 設定背景音樂音量比例 (固定維持 20% / 0.2)
        setBgmVolume(ratio = 0.2, immediate = false, durationMs = 1000) {
          this.bgmVolumeRatio = Math.max(0, Math.min(1, ratio));
          if (!this.bgmAudio) return;

          if (this.bgmFadeTimer) {
            clearInterval(this.bgmFadeTimer);
            this.bgmFadeTimer = null;
          }

          if (immediate || durationMs <= 0) {
            this.bgmAudio.volume = this.bgmVolumeRatio;
            return;
          }

          const startVol = this.bgmAudio.volume;
          const targetVol = this.bgmVolumeRatio;
          if (Math.abs(targetVol - startVol) < 0.005) {
            this.bgmAudio.volume = targetVol;
            return;
          }

          const fadeStartTime = performance.now();
          this.bgmFadeTimer = setInterval(() => {
            if (!this.bgmAudio) {
              clearInterval(this.bgmFadeTimer);
              this.bgmFadeTimer = null;
              return;
            }
            const elapsed = performance.now() - fadeStartTime;
            const t = Math.min(1, elapsed / durationMs);
            // 使用平滑餘弦漸入漸出曲線 (約 1 秒完成檔位切換)
            const eased = 0.5 - 0.5 * Math.cos(t * Math.PI);
            this.bgmAudio.volume = Math.max(0, Math.min(1, startVol + (targetVol - startVol) * eased));
            if (t >= 1) {
              this.bgmAudio.volume = targetVol;
              clearInterval(this.bgmFadeTimer);
              this.bgmFadeTimer = null;
            }
          }, 20);
        }

        // 設定整體遊戲音量倍率 (開始前與結束後為 0.5，正式比賽期間為 1.0)
        setGameVolumeMultiplier(mult = 1.0) {
          this.init();
          if (!this.ctx || !this.gameBusGain) return;
          const now = this.ctx.currentTime;
          this.gameBusGain.gain.cancelScheduledValues(now);
          this.gameBusGain.gain.setValueAtTime(this.gameBusGain.gain.value, now);
          this.gameBusGain.gain.linearRampToValueAtTime(mult, now + 0.12);
        }

        makeDistortionCurve(amount = 50) {
          const nSamples = 44100;
          const curve = new Float32Array(nSamples);
          const deg = Math.PI / 180;
          for (let i = 0; i < nSamples; ++i) {
            const x = (i * 2) / nSamples - 1;
            curve[i] = ((3 + amount) * x * 20 * deg) / (Math.PI + amount * Math.abs(x));
          }
          return curve;
        }

        // 計算每一階速度 (25, 50, 75, 100, 125, 150...) 對應的固定排氣基頻 (速度越快頻率越高)
        getStepFrequency(speed) {
          if (speed <= 0) return 0;
          const stepIndex = Math.max(1, Math.round(speed / 25));
          // 第 1 階 (25 km/h) 為 38Hz 低頻轟隆聲，每升一階 (+25 km/h) 依固定音階比例提升約 7.8%
          return Math.min(38 * Math.pow(1.078, stepIndex - 1), 480);
        }

        // 建立並確保車子持續低頻排氣轟隆聲的合成節點已啟動
        ensureContinuousEngine() {
          if (!this.enabled) return;
          this.init();
          if (!this.ctx || this.engineRunning) return;

          const now = this.ctx.currentTime;

          this.engineMasterGain = this.ctx.createGain();
          this.engineMasterGain.gain.setValueAtTime(0.0001, now);

          // 低頻排氣管消音器濾波 (保留渾厚低頻轟隆感，隨轉速微幅開合)
          this.mufflerFilter = this.ctx.createBiquadFilter();
          this.mufflerFilter.type = 'lowpass';
          this.mufflerFilter.Q.setValueAtTime(2.6, now);
          this.mufflerFilter.frequency.setValueAtTime(240, now);

          // 排氣胸腔共鳴增強 (95Hz 低頻飽滿度)
          const bassBoost = this.ctx.createBiquadFilter();
          bassBoost.type = 'peaking';
          bassBoost.frequency.setValueAtTime(95, now);
          bassBoost.Q.setValueAtTime(1.3, now);
          bassBoost.gain.setValueAtTime(6.0, now);

          // 點火脈衝「轟隆隆」振幅調變節點
          const chugAmpNode = this.ctx.createGain();
          chugAmpNode.gain.setValueAtTime(0.82, now);

          this.chugLfo = this.ctx.createOscillator();
          this.chugLfo.type = 'sine';
          this.chugLfo.frequency.setValueAtTime(16, now);

          const chugAmpDepth = this.ctx.createGain();
          chugAmpDepth.gain.setValueAtTime(0.20, now);
          this.chugLfo.connect(chugAmpDepth);
          chugAmpDepth.connect(chugAmpNode.gain);

          this.chugFilterGain = this.ctx.createGain();
          this.chugFilterGain.gain.setValueAtTime(38, now);
          this.chugLfo.connect(this.chugFilterGain);
          this.chugFilterGain.connect(this.mufflerFilter.frequency);
          this.chugLfo.start(now);

          const shaper = this.ctx.createWaveShaper();
          shaper.curve = this.distortionCurve;
          shaper.oversample = '2x';

          shaper.connect(bassBoost);
          bassBoost.connect(this.mufflerFilter);
          this.mufflerFilter.connect(chugAmpNode);
          chugAmpNode.connect(this.engineMasterGain);
          this.engineMasterGain.connect(this.gameBusGain);

          // 構成低頻排氣轟隆聲的多階諧波振盪器 (0.5x 超低頻、1.0x 基頻、1.5x 排氣共鳴、2.0x 倍頻)
          const harmonicSpecs = [
            { ratio: 0.5, type: 'sawtooth', amp: 0.52 },
            { ratio: 1.0, type: 'sawtooth', amp: 0.68 },
            { ratio: 1.5, type: 'triangle', amp: 0.36 },
            { ratio: 2.0, type: 'sawtooth', amp: 0.25 }
          ];

          this.engineOscs = harmonicSpecs.map((spec) => {
            const osc = this.ctx.createOscillator();
            const g = this.ctx.createGain();
            osc.type = spec.type;
            osc.frequency.setValueAtTime(50 * spec.ratio, now);
            g.gain.setValueAtTime(spec.amp, now);
            osc.connect(g);
            g.connect(shaper);
            osc.start(now);
            return { osc, ratio: spec.ratio };
          });

          // 循環低頻排氣氣流轟隆噪聲 (Brown Noise) + 時速 300 升空時的微弱氣流噴射白噪音源
          const bufLen = this.ctx.sampleRate * 2;
          const noiseBuf = this.ctx.createBuffer(1, bufLen, this.ctx.sampleRate);
          const out = noiseBuf.getChannelData(0);
          const airBuf = this.ctx.createBuffer(1, bufLen, this.ctx.sampleRate);
          const airOut = airBuf.getChannelData(0);
          let lastOut = 0.0;
          for (let i = 0; i < bufLen; i++) {
            const white = Math.random() * 2 - 1;
            out[i] = (lastOut + 0.04 * white) / 1.04;
            lastOut = out[i];
            out[i] *= 2.5;
            // 渾厚低中頻氣團混合氣流噪聲 (營造飽滿的「噗噗」推進氣團質感)
            airOut[i] = out[i] * 0.72 + white * 0.42;
          }
          const noiseSrc = this.ctx.createBufferSource();
          noiseSrc.buffer = noiseBuf;
          noiseSrc.loop = true;

          this.exhaustNoiseFilter = this.ctx.createBiquadFilter();
          this.exhaustNoiseFilter.type = 'bandpass';
          this.exhaustNoiseFilter.Q.setValueAtTime(1.4, now);
          this.exhaustNoiseFilter.frequency.setValueAtTime(160, now);

          const noiseGain = this.ctx.createGain();
          noiseGain.gain.setValueAtTime(0.35, now);

          noiseSrc.connect(this.exhaustNoiseFilter);
          this.exhaustNoiseFilter.connect(noiseGain);
          noiseGain.connect(chugAmpNode);
          noiseSrc.start(now);

          // 建立時速 >= 300 時車底噴射白煙的持續「噗噗」氣流噴射聲 (Continuous "Puff-Puff" Pulse-Jet Thruster)
          const airSrc = this.ctx.createBufferSource();
          airSrc.buffer = airBuf;
          airSrc.loop = true;

          // 1. 「噗 (Puh)」低中頻氣團共鳴主濾波器 (中心約 265Hz，隨每次噴氣脈衝開合)
          this.hoverJetBand = this.ctx.createBiquadFilter();
          this.hoverJetBand.type = 'bandpass';
          this.hoverJetBand.frequency.setValueAtTime(265, now);
          this.hoverJetBand.Q.setValueAtTime(2.1, now);

          // 2. 中頻推進氣柱濾波器 (中心約 760Hz，表現噴射氣流的空氣推力感)
          this.hoverSizzleBand = this.ctx.createBiquadFilter();
          this.hoverSizzleBand.type = 'bandpass';
          this.hoverSizzleBand.frequency.setValueAtTime(760, now);
          this.hoverSizzleBand.Q.setValueAtTime(1.6, now);

          const jetMidGain = this.ctx.createGain();
          jetMidGain.gain.setValueAtTime(0.68, now);

          // 3. 氣動低頻「噗」鼓動振盪器 (疊加微弱 68Hz 氣壓震波，強化「噗、噗、噗」的噴射彈性)
          const puffThumpOsc = this.ctx.createOscillator();
          const puffThumpGain = this.ctx.createGain();
          puffThumpOsc.type = 'triangle';
          puffThumpOsc.frequency.setValueAtTime(68, now);
          puffThumpGain.gain.setValueAtTime(0.26, now);
          puffThumpOsc.connect(puffThumpGain);
          puffThumpOsc.start(now);

          // 溫暖低通修飾 (切除刺耳高頻「ㄘㄘ」聲，保留渾厚紮實的「噗噗」氣流噴射聲)
          const puffLowpass = this.ctx.createBiquadFilter();
          puffLowpass.type = 'lowpass';
          puffLowpass.frequency.setValueAtTime(1380, now);
          puffLowpass.Q.setValueAtTime(0.9, now);

          // 4. 產生連續「噗-噗-噗-噗」噴射律動的深度脈衝調變 (10.5Hz ~ 13.5Hz)
          const puffPulseNode = this.ctx.createGain();
          puffPulseNode.gain.setValueAtTime(0.52, now);

          this.hoverPuffLfo = this.ctx.createOscillator();
          const puffLfoAmp = this.ctx.createGain();
          const puffLfoFreq1 = this.ctx.createGain();
          const puffLfoFreq2 = this.ctx.createGain();
          const puffLfoThump = this.ctx.createGain();

          this.hoverPuffLfo.type = 'sine';
          this.hoverPuffLfo.frequency.setValueAtTime(10.5, now); // 每秒約 10.5 次「噗噗」快速連續脈動

          puffLfoAmp.gain.setValueAtTime(0.46, now);   // 振幅在 0.06 ~ 0.98 間深幅收放，形成明顯「噗噗」感且不中斷
          puffLfoFreq1.gain.setValueAtTime(130, now);  // 隨每一下「噗」同步推高氣團頻率 (135Hz <-> 395Hz)
          puffLfoFreq2.gain.setValueAtTime(280, now);  // 隨每一下「噗」同步推高噴射氣流頻率 (480Hz <-> 1040Hz)
          puffLfoThump.gain.setValueAtTime(22, now);   // 隨每一下「噗」同步產生低頻氣壓彈跳 (46Hz <-> 90Hz)

          this.hoverPuffLfo.connect(puffLfoAmp);
          puffLfoAmp.connect(puffPulseNode.gain);

          this.hoverPuffLfo.connect(puffLfoFreq1);
          puffLfoFreq1.connect(this.hoverJetBand.frequency);

          this.hoverPuffLfo.connect(puffLfoFreq2);
          puffLfoFreq2.connect(this.hoverSizzleBand.frequency);

          this.hoverPuffLfo.connect(puffLfoThump);
          puffLfoThump.connect(puffThumpOsc.frequency);

          this.hoverPuffLfo.start(now);

          this.hoverJetGain = this.ctx.createGain();
          this.hoverJetGain.gain.setValueAtTime(0.0001, now);

          airSrc.connect(this.hoverJetBand);
          this.hoverJetBand.connect(puffLowpass);

          airSrc.connect(this.hoverSizzleBand);
          this.hoverSizzleBand.connect(jetMidGain);
          jetMidGain.connect(puffLowpass);

          puffThumpGain.connect(this.hoverJetBand);

          puffLowpass.connect(puffPulseNode);
          puffPulseNode.connect(this.hoverJetGain);
          this.hoverJetGain.connect(this.gameBusGain);
          airSrc.start(now);

          this.engineRunning = true;
        }

        // 依據目前時速是否 >= 300，平滑啟閉車底「噗噗」氣流噴射聲
        updateHoverJetSound(speed) {
          if (!this.ctx || !this.hoverJetGain || !this.hoverJetBand || !this.hoverSizzleBand || !this.hoverPuffLfo) return;
          const now = this.ctx.currentTime;
          this.hoverJetGain.gain.cancelScheduledValues(now);
          const curVal = Math.max(0.0001, this.hoverJetGain.gain.value);
          this.hoverJetGain.gain.setValueAtTime(curVal, now);

          if (speed >= 300) {
            const speedOver = Math.max(0, speed - 300);
            const puffRate = Math.min(14.5, 10.5 + speedOver * 0.025);
            const bodyPitch = Math.min(360, 265 + speedOver * 0.55);
            const jetPitch = Math.min(1050, 760 + speedOver * 1.6);

            this.hoverPuffLfo.frequency.cancelScheduledValues(now);
            this.hoverPuffLfo.frequency.setTargetAtTime(puffRate, now, 0.12);
            this.hoverJetBand.frequency.cancelScheduledValues(now);
            this.hoverJetBand.frequency.setTargetAtTime(bodyPitch, now, 0.12);
            this.hoverSizzleBand.frequency.cancelScheduledValues(now);
            this.hoverSizzleBand.frequency.setTargetAtTime(jetPitch, now, 0.12);

            // 升空後維持清晰而有彈性的「噗噗」氣流噴射聲 (噴氣聲加大 50%: 0.1645*1.5=0.2468, 0.1316*1.5=0.1974)
            this.hoverJetGain.gain.linearRampToValueAtTime(0.2468, now + 0.08);
            this.hoverJetGain.gain.linearRampToValueAtTime(0.1974, now + 0.28);
          } else {
            this.hoverJetGain.gain.exponentialRampToValueAtTime(0.0001, now + 0.30);
          }
        }

        // 設定持續排氣聲為指定速度對應的固定頻率 (供起跑時以 50 km/h 啟動)
        startEngineAtSpeed(speed = 50) {
          if (!this.enabled) return;
          this.ensureContinuousEngine();
          if (!this.ctx || !this.engineRunning) return;

          const now = this.ctx.currentTime;
          if (speed <= 0) {
            this.engineMasterGain.gain.cancelScheduledValues(now);
            this.engineMasterGain.gain.setTargetAtTime(0.0001, now, 0.08);
            return;
          }

          const baseFreq = this.getStepFrequency(speed);
          this.engineOscs.forEach(({ osc, ratio }) => {
            osc.frequency.cancelScheduledValues(now);
            osc.frequency.setValueAtTime(baseFreq * ratio, now);
          });

          this.chugLfo.frequency.cancelScheduledValues(now);
          this.chugLfo.frequency.setValueAtTime(Math.min(52, baseFreq * 0.32), now);

          this.mufflerFilter.frequency.cancelScheduledValues(now);
          this.mufflerFilter.frequency.setValueAtTime(Math.min(1800, baseFreq * 4.8), now);

          this.exhaustNoiseFilter.frequency.cancelScheduledValues(now);
          this.exhaustNoiseFilter.frequency.setValueAtTime(Math.min(900, baseFreq * 3.2), now);

          // 引擎持續轟隆聲降低 10% (0.2074 * 0.9 = 0.1867)
          this.engineMasterGain.gain.cancelScheduledValues(now);
          this.engineMasterGain.gain.setValueAtTime(Math.max(0.001, this.engineMasterGain.gain.value), now);
          this.engineMasterGain.gain.linearRampToValueAtTime(0.1867, now + 0.15);

          this.updateHoverJetSound(speed);
        }

        // 從時速 0 到 25 km/h：播放汽車啟動馬達與點火發動聲，隨後進入 25 km/h 的持續低頻轟隆聲 (靜止時引擎發動再 +100%)
        playIgnitionFromZeroTo25() {
          if (!this.enabled) return;
          this.ensureContinuousEngine();
          if (!this.ctx || !this.engineRunning) return;

          const now = this.ctx.currentTime;
          const target25Freq = this.getStepFrequency(25); // 38 Hz

          // (A) 0.00s ~ 0.34s：啟動馬達運轉聲 ("啾-啾-啾" 壓縮衝程啟動音，靜止發動音量再 +100%)
          const crankDur = 0.34;
          const starterOsc = this.ctx.createOscillator();
          const starterMod = this.ctx.createOscillator();
          const starterModGain = this.ctx.createGain();
          const starterFilter = this.ctx.createBiquadFilter();
          const starterGain = this.ctx.createGain();

          starterOsc.type = 'sawtooth';
          starterOsc.frequency.setValueAtTime(165, now);
          starterOsc.frequency.linearRampToValueAtTime(215, now + crankDur);

          starterMod.type = 'sine';
          starterMod.frequency.setValueAtTime(10.5, now); // 約 3 次氣缸壓縮脈衝
          starterModGain.gain.setValueAtTime(42, now);
          starterMod.connect(starterModGain);
          starterModGain.connect(starterOsc.frequency);

          starterFilter.type = 'bandpass';
          starterFilter.frequency.setValueAtTime(480, now);
          starterFilter.Q.setValueAtTime(2.5, now);

          starterGain.gain.setValueAtTime(0.01, now);
          starterGain.gain.linearRampToValueAtTime(0.7206, now + 0.03);
          starterGain.gain.setValueAtTime(0.6694, now + crankDur - 0.04);
          starterGain.gain.exponentialRampToValueAtTime(0.001, now + crankDur);

          starterOsc.connect(starterFilter);
          starterFilter.connect(starterGain);
          starterGain.connect(this.gameBusGain);

          starterOsc.start(now);
          starterMod.start(now);
          starterOsc.stop(now + crankDur);
          starterMod.stop(now + crankDur);

          // (B) 0.32s ~ 0.85s：點火成功瞬間的排氣爆發轟鳴 ("轟——！" 拉起後回落至 25 km/h 怠速轟隆頻率)
          const catchTime = now + 0.30;
          const flareFreq = target25Freq * 1.85;

          this.engineOscs.forEach(({ osc, ratio }) => {
            osc.frequency.cancelScheduledValues(now);
            osc.frequency.setValueAtTime(22 * ratio, now);
            osc.frequency.setValueAtTime(26 * ratio, catchTime);
            osc.frequency.exponentialRampToValueAtTime(flareFreq * ratio, catchTime + 0.18);
            osc.frequency.exponentialRampToValueAtTime(target25Freq * ratio, catchTime + 0.55);
          });

          this.chugLfo.frequency.cancelScheduledValues(now);
          this.chugLfo.frequency.setValueAtTime(8, now);
          this.chugLfo.frequency.linearRampToValueAtTime(22, catchTime + 0.18);
          this.chugLfo.frequency.linearRampToValueAtTime(target25Freq * 0.32, catchTime + 0.55);

          this.mufflerFilter.frequency.cancelScheduledValues(now);
          this.mufflerFilter.frequency.setValueAtTime(140, now);
          this.mufflerFilter.frequency.exponentialRampToValueAtTime(460, catchTime + 0.18);
          this.mufflerFilter.frequency.exponentialRampToValueAtTime(target25Freq * 4.8, catchTime + 0.55);

          this.exhaustNoiseFilter.frequency.cancelScheduledValues(now);
          this.exhaustNoiseFilter.frequency.setValueAtTime(target25Freq * 3.2, catchTime);

          // 點火爆發峰值再提升 +100% (0.7362 * 2.0 = 1.4724)，隨後穩定於引擎轟隆聲 0.1867
          this.engineMasterGain.gain.cancelScheduledValues(now);
          this.engineMasterGain.gain.setValueAtTime(0.001, now);
          this.engineMasterGain.gain.setValueAtTime(0.01, catchTime);
          this.engineMasterGain.gain.linearRampToValueAtTime(1.4724, catchTime + 0.14);
          this.engineMasterGain.gain.linearRampToValueAtTime(0.1867, catchTime + 0.55);
        }

        // 1. 答對加速：若從 0->25 播放發動聲；否則將持續排氣轟隆聲升頻至下一階固定頻率並持續聲響
        shiftUpEngine(prevSpeed, newSpeed) {
          if (!this.enabled) return;
          this.ensureContinuousEngine();
          if (!this.ctx || !this.engineRunning) return;

          if (prevSpeed <= 0) {
            this.playIgnitionFromZeroTo25();
            return;
          }

          const now = this.ctx.currentTime;
          const prevFreq = this.getStepFrequency(prevSpeed);
          const newFreq = this.getStepFrequency(newSpeed);
          const flareFreq = newFreq * 1.15; // 換檔補油瞬間微幅拉轉後穩定在下一階固定頻率

          // 持續排氣轟隆聲升頻至下一階固定頻率，並保持持續發聲
          this.engineOscs.forEach(({ osc, ratio }) => {
            osc.frequency.cancelScheduledValues(now);
            osc.frequency.setValueAtTime(prevFreq * ratio, now);
            osc.frequency.exponentialRampToValueAtTime(flareFreq * ratio, now + 0.22);
            osc.frequency.exponentialRampToValueAtTime(newFreq * ratio, now + 0.50);
          });

          this.chugLfo.frequency.cancelScheduledValues(now);
          this.chugLfo.frequency.setValueAtTime(Math.min(52, prevFreq * 0.32), now);
          this.chugLfo.frequency.linearRampToValueAtTime(Math.min(56, newFreq * 0.32), now + 0.45);

          const prevCut = Math.min(1800, prevFreq * 4.8);
          const flareCut = Math.min(2200, flareFreq * 5.6);
          const newCut = Math.min(1800, newFreq * 4.8);

          this.mufflerFilter.frequency.cancelScheduledValues(now);
          this.mufflerFilter.frequency.setValueAtTime(prevCut, now);
          this.mufflerFilter.frequency.exponentialRampToValueAtTime(flareCut, now + 0.22);
          this.mufflerFilter.frequency.exponentialRampToValueAtTime(newCut, now + 0.50);

          this.exhaustNoiseFilter.frequency.cancelScheduledValues(now);
          this.exhaustNoiseFilter.frequency.setValueAtTime(Math.min(900, newFreq * 3.2), now + 0.3);

          // 答對加速聲降低 30% (1.0296 * 0.7 = 0.7207)，隨後維持穩定持續引擎轟隆聲 0.1867
          this.engineMasterGain.gain.cancelScheduledValues(now);
          this.engineMasterGain.gain.setValueAtTime(0.1867, now);
          this.engineMasterGain.gain.linearRampToValueAtTime(0.7207, now + 0.18);
          this.engineMasterGain.gain.linearRampToValueAtTime(0.1867, now + 0.52);

          this.updateHoverJetSound(newSpeed);
        }

        // 2. 答錯或超時減速：伴隨煞車聲播放明顯的引擎降頻聲，並將持續排氣聲降至下一階頻率 (若降至 0 則停止聲音)
        shiftDownEngine(prevSpeed, newSpeed) {
          if (!this.enabled) return;
          this.ensureContinuousEngine();
          if (!this.ctx || !this.engineRunning) return;
          if (prevSpeed <= 0) return;

          const now = this.ctx.currentTime;
          const prevFreq = this.getStepFrequency(prevSpeed);
          if (prevSpeed < 300) {
            this.updateHoverJetSound(newSpeed);
          }

          if (newSpeed <= 0) {
            // 速度由 25 降至 0：播放引擎轉速滑落熄火降頻聲，並將持續排氣聲完全停止
            const stopFreq = 18;
            this.engineOscs.forEach(({ osc, ratio }) => {
              osc.frequency.cancelScheduledValues(now);
              osc.frequency.setValueAtTime(prevFreq * ratio, now);
              osc.frequency.exponentialRampToValueAtTime(stopFreq * ratio, now + 0.55);
            });

            this.chugLfo.frequency.cancelScheduledValues(now);
            this.chugLfo.frequency.setValueAtTime(prevFreq * 0.32, now);
            this.chugLfo.frequency.linearRampToValueAtTime(5, now + 0.55);

            this.mufflerFilter.frequency.cancelScheduledValues(now);
            this.mufflerFilter.frequency.setValueAtTime(prevFreq * 4.8, now);
            this.mufflerFilter.frequency.exponentialRampToValueAtTime(75, now + 0.55);

            this.engineMasterGain.gain.cancelScheduledValues(now);
            this.engineMasterGain.gain.setValueAtTime(0.2746, now);
            this.engineMasterGain.gain.exponentialRampToValueAtTime(0.0001, now + 0.58);

            this.playDownshiftSweep(prevFreq, stopFreq, 0.58);
          } else {
            // 速度降至下一階 (> 0)：播放明顯降頻聲，並讓持續排氣轟隆聲降至新速度的固定頻率持續響起
            const newFreq = this.getStepFrequency(newSpeed);

            this.engineOscs.forEach(({ osc, ratio }) => {
              osc.frequency.cancelScheduledValues(now);
              osc.frequency.setValueAtTime(prevFreq * ratio, now);
              osc.frequency.exponentialRampToValueAtTime(newFreq * 0.92 * ratio, now + 0.36);
              osc.frequency.exponentialRampToValueAtTime(newFreq * ratio, now + 0.58);
            });

            this.chugLfo.frequency.cancelScheduledValues(now);
            this.chugLfo.frequency.setValueAtTime(Math.min(52, prevFreq * 0.32), now);
            this.chugLfo.frequency.linearRampToValueAtTime(Math.min(52, newFreq * 0.32), now + 0.50);

            const prevCut = Math.min(1800, prevFreq * 4.8);
            const newCut = Math.min(1800, newFreq * 4.8);
            this.mufflerFilter.frequency.cancelScheduledValues(now);
            this.mufflerFilter.frequency.setValueAtTime(prevCut, now);
            this.mufflerFilter.frequency.exponentialRampToValueAtTime(newCut, now + 0.50);

            this.exhaustNoiseFilter.frequency.cancelScheduledValues(now);
            this.exhaustNoiseFilter.frequency.setValueAtTime(Math.min(900, newFreq * 3.2), now + 0.3);

            this.engineMasterGain.gain.cancelScheduledValues(now);
            this.engineMasterGain.gain.setValueAtTime(0.2746, now);
            this.engineMasterGain.gain.linearRampToValueAtTime(0.1867, now + 0.55);

            this.playDownshiftSweep(prevFreq, newFreq, 0.55);
          }
        }

        // 輔助：減速時的引擎檔位降頻滑落聲 ("嗚——↘" 低頻收油減速聲浪，答錯音量再 +20%)
        playDownshiftSweep(fromFreq, toFreq, dur = 0.55) {
          if (!this.ctx) return;
          const now = this.ctx.currentTime;

          const osc = this.ctx.createOscillator();
          const subOsc = this.ctx.createOscillator();
          const filter = this.ctx.createBiquadFilter();
          const gain = this.ctx.createGain();

          osc.type = 'sawtooth';
          osc.frequency.setValueAtTime(fromFreq * 2.0, now);
          osc.frequency.exponentialRampToValueAtTime(Math.max(20, toFreq * 1.6), now + dur);

          subOsc.type = 'triangle';
          subOsc.frequency.setValueAtTime(fromFreq, now);
          subOsc.frequency.exponentialRampToValueAtTime(Math.max(15, toFreq * 0.85), now + dur);

          filter.type = 'lowpass';
          filter.Q.setValueAtTime(2.2, now);
          filter.frequency.setValueAtTime(Math.min(1200, fromFreq * 6.5), now);
          filter.frequency.exponentialRampToValueAtTime(Math.max(110, toFreq * 3.8), now + dur);

          gain.gain.setValueAtTime(0.01, now);
          gain.gain.linearRampToValueAtTime(0.1848, now + 0.04);
          gain.gain.exponentialRampToValueAtTime(0.001, now + dur);

          osc.connect(filter);
          subOsc.connect(filter);
          filter.connect(gain);
          gain.connect(this.gameBusGain);

          osc.start(now);
          subOsc.start(now);
          osc.stop(now + dur + 0.02);
          subOsc.stop(now + dur + 0.02);
        }

        playKeyClick(digit = 5) {
          if (!this.enabled) return;
          this.init();
          if (!this.ctx) return;

          const now = this.ctx.currentTime;
          const osc = this.ctx.createOscillator();
          const gain = this.ctx.createGain();
          osc.type = 'triangle';
          osc.frequency.setValueAtTime(520 + Number(digit) * 28, now);
          osc.frequency.exponentialRampToValueAtTime(190, now + 0.045);

          gain.gain.setValueAtTime(0.16, now);
          gain.gain.exponentialRampToValueAtTime(0.001, now + 0.045);

          osc.connect(gain);
          gain.connect(this.gameBusGain);
          osc.start(now);
          osc.stop(now + 0.05);
        }

        // 2. 答錯或超時音效：擬真輪胎摩擦柏油地面的急煞聲 (移除尖銳合成器音，改為厚實橡膠胎塊磨地聲「嚓——嘶——」，煞車音量再 +5%)
        playBrakeWarning() {
          if (!this.enabled) return;
          this.init();
          if (!this.ctx) return;

          const now = this.ctx.currentTime;
          const duration = 0.78;

          const masterBrakeGain = this.ctx.createGain();
          masterBrakeGain.gain.setValueAtTime(0.001, now);
          masterBrakeGain.gain.linearRampToValueAtTime(0.3696, now + 0.025);
          masterBrakeGain.gain.setValueAtTime(0.3234, now + 0.46);
          masterBrakeGain.gain.exponentialRampToValueAtTime(0.001, now + duration);
          masterBrakeGain.connect(this.gameBusGain);

          // 產生帶有粗礫顆粒感的柏油路面摩擦噪聲
          const bufSize = Math.floor(this.ctx.sampleRate * duration);
          const noiseBuf = this.ctx.createBuffer(1, bufSize, this.ctx.sampleRate);
          const output = noiseBuf.getChannelData(0);
          let b0 = 0, b1 = 0, b2 = 0;
          for (let i = 0; i < bufSize; i++) {
            const white = Math.random() * 2 - 1;
            b0 = 0.99 * b0 + white * 0.12;
            b1 = 0.92 * b1 + white * 0.25;
            b2 = 0.65 * b2 + white * 0.45;
            // 疊加輪胎胎塊與粗糙柏油路面的顆粒摩擦調變
            const treadGrain = 0.72 + 0.28 * Math.sin(i * 0.0042 + Math.sin(i * 0.0009) * 3.0);
            output[i] = (b0 + b1 + b2 + white * 0.35) * 0.45 * treadGrain;
          }

          // 三段輪胎磨地共振頻帶：
          // 1. 低中頻胎皮重壓地面磨擦聲 (360Hz -> 210Hz)
          // 2. 中頻橡膠胎紋抓地磨擦聲 (780Hz -> 490Hz)
          // 3. 中高頻柏油地面急煞滑行嘶聲 (1580Hz -> 1080Hz)
          const bands = [
            { fStart: 360,  fEnd: 210,  q: 1.6, amp: 0.65 },
            { fStart: 780,  fEnd: 490,  q: 2.2, amp: 0.75 },
            { fStart: 1580, fEnd: 1080, q: 3.0, amp: 0.45 }
          ];

          bands.forEach((b) => {
            const src = this.ctx.createBufferSource();
            src.buffer = noiseBuf;

            const filter = this.ctx.createBiquadFilter();
            filter.type = 'bandpass';
            filter.frequency.setValueAtTime(b.fStart, now);
            filter.frequency.exponentialRampToValueAtTime(b.fEnd, now + duration);
            filter.Q.setValueAtTime(b.q, now);

            const g = this.ctx.createGain();
            g.gain.setValueAtTime(b.amp, now);

            src.connect(filter);
            filter.connect(g);
            g.connect(masterBrakeGain);
            src.start(now);
            src.stop(now + duration);
          });
        }

        // 2b. 300 km/h 起飛狀態下答錯或超時音效：高壓噴氣閥門洩壓漏氣與氣流中斷噗嘶聲 (取代地面輪胎煞車聲)
        playAirLeakSound(newSpeed = 300) {
          if (!this.enabled) return;
          this.init();
          if (!this.ctx) return;

          const now = this.ctx.currentTime;
          const duration = 0.82;

          // (A) 暫停/切斷車底持續「噗噗」噴氣推進聲，營造噴氣中斷漏氣感，若仍 >= 300 則於漏氣結束後平滑恢復
          if (this.hoverJetGain) {
            this.hoverJetGain.gain.cancelScheduledValues(now);
            const curJet = Math.max(0.0001, this.hoverJetGain.gain.value);
            this.hoverJetGain.gain.setValueAtTime(curJet, now);
            this.hoverJetGain.gain.linearRampToValueAtTime(0.002, now + 0.035);
            this.hoverJetGain.gain.setValueAtTime(0.002, now + 0.56);
            if (newSpeed >= 300) {
              this.hoverJetGain.gain.linearRampToValueAtTime(0.1974, now + 0.85);
            } else {
              this.hoverJetGain.gain.exponentialRampToValueAtTime(0.0001, now + 0.75);
            }
          }

          const masterLeakGain = this.ctx.createGain();
          masterLeakGain.gain.setValueAtTime(0.001, now);
          masterLeakGain.gain.linearRampToValueAtTime(0.46, now + 0.02);
          masterLeakGain.gain.setValueAtTime(0.38, now + 0.18);
          masterLeakGain.gain.exponentialRampToValueAtTime(0.001, now + duration);
          masterLeakGain.connect(this.gameBusGain);

          // (B) 產生帶有氣閥洩壓喘息調變的氣流漏氣噪聲 ("噗嘶——咻…噗…噗↘")
          const bufSize = Math.floor(this.ctx.sampleRate * duration);
          const leakBuf = this.ctx.createBuffer(1, bufSize, this.ctx.sampleRate);
          const out = leakBuf.getChannelData(0);
          let lp = 0;
          for (let i = 0; i < bufSize; i++) {
            const t = i / this.ctx.sampleRate;
            const white = Math.random() * 2 - 1;
            lp = 0.82 * lp + 0.18 * white;
            // 前段急促洩壓噴嘶，中後段轉為斷續無力的「噗…噗…」漏氣脈動
            const sputterFreq = 16 - t * 11;
            const sputterEnv = t < 0.16
              ? 1.0
              : 0.35 + 0.65 * Math.pow(0.5 + 0.5 * Math.sin(t * sputterFreq * Math.PI * 2), 1.8);
            out[i] = (white * 0.55 + lp * 0.65) * sputterEnv;
          }

          // 兩組向下滑落的洩壓氣流共鳴頻帶：高壓氣閥嘶聲 (2100Hz -> 280Hz) + 空腔洩氣聲 (780Hz -> 135Hz)
          const leakBands = [
            { fStart: 2100, fEnd: 280, q: 2.0, amp: 0.65 },
            { fStart: 780,  fEnd: 135, q: 1.5, amp: 0.85 }
          ];
          leakBands.forEach((b) => {
            const src = this.ctx.createBufferSource();
            src.buffer = leakBuf;
            const filter = this.ctx.createBiquadFilter();
            filter.type = 'bandpass';
            filter.frequency.setValueAtTime(b.fStart, now);
            filter.frequency.exponentialRampToValueAtTime(b.fEnd, now + duration);
            filter.Q.setValueAtTime(b.q, now);

            const g = this.ctx.createGain();
            g.gain.setValueAtTime(b.amp, now);
            src.connect(filter);
            filter.connect(g);
            g.connect(masterLeakGain);
            src.start(now);
            src.stop(now + duration);
          });

          // (C) 瞬間洩壓氣閥「啵—噗↘」低頻彈性洩氣音
          const valveOsc = this.ctx.createOscillator();
          const valveGain = this.ctx.createGain();
          valveOsc.type = 'sine';
          valveOsc.frequency.setValueAtTime(195, now);
          valveOsc.frequency.exponentialRampToValueAtTime(52, now + 0.32);

          valveGain.gain.setValueAtTime(0.01, now);
          valveGain.gain.linearRampToValueAtTime(0.32, now + 0.018);
          valveGain.gain.exponentialRampToValueAtTime(0.001, now + 0.34);

          valveOsc.connect(valveGain);
          valveGain.connect(this.gameBusGain);
          valveOsc.start(now);
          valveOsc.stop(now + 0.35);
        }

        // 起跑倒數提示音：直接連至 destination，維持原本 100% 音量不受 50% 衰減影響
        playCountdownBeep(isGo = false) {
          if (!this.enabled) return;
          this.init();
          if (!this.ctx) return;

          const now = this.ctx.currentTime;
          const osc = this.ctx.createOscillator();
          const gain = this.ctx.createGain();
          osc.type = 'square';
          osc.frequency.setValueAtTime(isGo ? 880 : 440, now);

          gain.gain.setValueAtTime(0.15, now);
          gain.gain.exponentialRampToValueAtTime(0.001, now + (isGo ? 0.35 : 0.18));

          osc.connect(gain);
          gain.connect(this.ctx.destination);
          osc.start(now);
          osc.stop(now + (isGo ? 0.36 : 0.19));
        }

        // 3. 到達終點衝線音效：熱烈群眾歡呼與掌聲
        playFinishFanfare() {
          if (!this.enabled) return;
          this.init();
          if (!this.ctx) return;

          const now = this.ctx.currentTime;
          const duration = 2.8;
          const sampleRate = this.ctx.sampleRate;
          const bufSize = Math.floor(sampleRate * duration);

          const crowdBuffer = this.ctx.createBuffer(2, bufSize, sampleRate);
          for (let ch = 0; ch < 2; ch++) {
            const output = crowdBuffer.getChannelData(ch);
            let b0 = 0, b1 = 0, b2 = 0, b3 = 0, b4 = 0, b5 = 0, b6 = 0;
            for (let i = 0; i < bufSize; i++) {
              const white = Math.random() * 2 - 1;
              b0 = 0.99886 * b0 + white * 0.0555179;
              b1 = 0.99332 * b1 + white * 0.0750759;
              b2 = 0.96900 * b2 + white * 0.1538520;
              b3 = 0.86650 * b3 + white * 0.3104856;
              b4 = 0.55000 * b4 + white * 0.5329522;
              b5 = -0.7616 * b5 - white * 0.0168980;
              output[i] = (b0 + b1 + b2 + b3 + b4 + b5 + b6 + white * 0.5362) * 0.05;
              b6 = white * 0.115926;
            }
          }

          // 終點熱烈歡呼聲 (音量 +50%)
          const formants = [
            { startF: 420, peakF: 680, endF: 520, q: 3.2, amp: 0.675 },
            { startF: 880, peakF: 1320, endF: 1050, q: 3.8, amp: 0.57 },
            { startF: 1850, peakF: 2450, endF: 2000, q: 4.2, amp: 0.33 }
          ];

          formants.forEach((f) => {
            const src = this.ctx.createBufferSource();
            src.buffer = crowdBuffer;

            const bp = this.ctx.createBiquadFilter();
            bp.type = 'bandpass';
            bp.Q.setValueAtTime(f.q, now);
            bp.frequency.setValueAtTime(f.startF, now);
            bp.frequency.exponentialRampToValueAtTime(f.peakF, now + 0.55);
            bp.frequency.exponentialRampToValueAtTime(f.endF, now + duration);

            const gain = this.ctx.createGain();
            gain.gain.setValueAtTime(0.001, now);
            gain.gain.linearRampToValueAtTime(f.amp, now + 0.28);
            gain.gain.setValueAtTime(f.amp * 0.92, now + 1.45);
            gain.gain.exponentialRampToValueAtTime(0.001, now + duration);

            src.connect(bp);
            bp.connect(gain);
            gain.connect(this.gameBusGain);
            src.start(now);
            src.stop(now + duration);
          });

          const clapCount = 46;
          for (let i = 0; i < clapCount; i++) {
            const clapTime = now + 0.05 + Math.random() * (duration - 0.35);
            const clapDur = 0.028 + Math.random() * 0.025;

            const clapSrc = this.ctx.createBufferSource();
            clapSrc.buffer = crowdBuffer;

            const clapFilter = this.ctx.createBiquadFilter();
            clapFilter.type = 'bandpass';
            clapFilter.frequency.setValueAtTime(1400 + Math.random() * 1600, clapTime);
            clapFilter.Q.setValueAtTime(1.8, clapTime);

            const fadeOutFactor = Math.max(0.15, 1 - (clapTime - now) / duration);
            const clapGain = this.ctx.createGain();
            clapGain.gain.setValueAtTime(0.001, clapTime);
            clapGain.gain.linearRampToValueAtTime(0.24 * fadeOutFactor, clapTime + 0.005);
            clapGain.gain.exponentialRampToValueAtTime(0.001, clapTime + clapDur);

            clapSrc.connect(clapFilter);
            clapFilter.connect(clapGain);
            clapGain.connect(this.gameBusGain);
            clapSrc.start(clapTime, Math.random() * 1.5, clapDur);
          }

          [0.18, 0.62].forEach((offset, idx) => {
            const wOsc = this.ctx.createOscillator();
            const wGain = this.ctx.createGain();
            const t0 = now + offset;
            wOsc.type = 'sine';
            wOsc.frequency.setValueAtTime(idx === 0 ? 2250 : 2550, t0);
            wOsc.frequency.exponentialRampToValueAtTime(idx === 0 ? 2850 : 2980, t0 + 0.22);
            wOsc.frequency.exponentialRampToValueAtTime(idx === 0 ? 2400 : 2650, t0 + 0.42);

            wGain.gain.setValueAtTime(0.001, t0);
            wGain.gain.linearRampToValueAtTime(0.0675, t0 + 0.06);
            wGain.gain.exponentialRampToValueAtTime(0.001, t0 + 0.44);

            wOsc.connect(wGain);
            wGain.connect(this.gameBusGain);
            wOsc.start(t0);
            wOsc.stop(t0 + 0.45);
          });
        }

        // 腳踏車跌倒掉進水溝音效 (單車鈴聲 + 翻倒進溝的喀啦與撲通撞擊聲)
        playBikeDitchCrash() {
          if (!this.enabled || !this.ctx) return;
          const now = this.ctx.currentTime;

          // 驚慌急促的單車鈴聲 (叮-叮！)
          [0, 0.09].forEach(off => {
            const bell = this.ctx.createOscillator();
            const bellGain = this.ctx.createGain();
            bell.type = 'sine';
            bell.frequency.setValueAtTime(2450, now + off);
            bell.frequency.exponentialRampToValueAtTime(2150, now + off + 0.14);
            bellGain.gain.setValueAtTime(0.001, now + off);
            bellGain.gain.linearRampToValueAtTime(0.18, now + off + 0.01);
            bellGain.gain.exponentialRampToValueAtTime(0.001, now + off + 0.16);
            bell.connect(bellGain);
            bellGain.connect(this.gameBusGain);
            bell.start(now + off);
            bell.stop(now + off + 0.17);
          });

          // 翻倒進溝的喀啦與撲通撞擊聲
          const crashOsc = this.ctx.createOscillator();
          const crashFilter = this.ctx.createBiquadFilter();
          const crashGain = this.ctx.createGain();
          crashOsc.type = 'triangle';
          crashOsc.frequency.setValueAtTime(320, now + 0.08);
          crashOsc.frequency.exponentialRampToValueAtTime(75, now + 0.42);
          crashFilter.type = 'lowpass';
          crashFilter.frequency.setValueAtTime(480, now + 0.08);
          crashGain.gain.setValueAtTime(0.001, now + 0.08);
          crashGain.gain.linearRampToValueAtTime(0.24, now + 0.14);
          crashGain.gain.exponentialRampToValueAtTime(0.001, now + 0.45);
          crashOsc.connect(crashFilter);
          crashFilter.connect(crashGain);
          crashGain.connect(this.gameBusGain);
          crashOsc.start(now + 0.08);
          crashOsc.stop(now + 0.48);
        }

          if (!this.enabled || !this.ctx) return;
          const now = this.ctx.currentTime;
          const osc = this.ctx.createOscillator();
          const gain = this.ctx.createGain();
          osc.type = 'sine';
          osc.frequency.setValueAtTime(420, now);
          osc.frequency.exponentialRampToValueAtTime(920, now + 0.10);
          osc.frequency.exponentialRampToValueAtTime(620, now + 0.22);
          gain.gain.setValueAtTime(0.001, now);
          gain.gain.linearRampToValueAtTime(0.15, now + 0.03);
          gain.gain.exponentialRampToValueAtTime(0.001, now + 0.24);
          osc.connect(gain);
          gain.connect(this.gameBusGain);
          osc.start(now);
          osc.stop(now + 0.25);
        }

      if (typeof ctx.roundRect !== 'function') {

          const rr = Math.max(0, Math.min(Math.abs(Number(Array.isArray(r) ? r[0] : r) || 0), Math.abs(w) / 2, Math.abs(h) / 2));
          this.moveTo(x + rr, y);
          this.arcTo(x + w, y, x + w, y + h, rr);

        raceTimeLeft: GAME_DURATION,
        questionTimeLeft: QUESTION_DURATION,
        lastCountdownBeepSec: 0,
        roadSigns: [],
        cyclists: [],
        pedestrians: [],
        ditchPuffs: [],
        distSinceLastSign: 0,
        nextSignDistance: 4,

        targetSpeed: INITIAL_SPEED,
        currentSpeed: INITIAL_SPEED,
        finalSpeed: INITIAL_SPEED,
        topSpeed: INITIAL_SPEED,

        factorA: 7,
        factorB: 8,
        expectedAnswer: '56',
        currentInput: '',
        inputLocked: false,

        correctCount: 0,
        wrongCount: 0,
        combo: 0,

        roadScroll: 0,
        nitroTimer: 0,
        brakeTimer: 0,
        airLeakTimer: 0, // 時速 >= 300 升空狀態下答錯/超時時，噴氣暫停與漏氣動畫計時器
        hoverFactor: 0, // 時速 >= 300 時平滑升空懸浮比例 (0 = 貼地, 1 = 離地約5米並噴射白煙)

        skidMarks: [],
        trafficCars: [],               // 路人車 (approach 接近中 / passed 被超越 / escape 加速遠離)
        lastPassedCarIndex: -1,        // 上一台被超越的路人車索引 (新產生的車需與其不同)
        playerLane: PLAYER_LANE_RIGHT, // 玩家目標車道
        playerLaneX: PLAYER_LANE_RIGHT, // 玩家目前實際橫向位置 (平滑切換車道用)
        finishGateZ: -1,
        finishSoundPlayed: false
      };

      // ======================== 全解析度螢幕可視區域與畫布尺寸同步 ========================
      let cw = 480;
      let ch = 500;
      let dpr = 1;

      function syncAppHeight() {
        // 精準取得扣除手機瀏覽器底部網址列/工具列後的真實可視高度
        let vh = window.innerHeight;
        let vw = window.innerWidth;
        if (window.visualViewport) {
          vh = Math.round(window.visualViewport.height);
          vw = Math.round(window.visualViewport.width);
        }
        document.documentElement.style.setProperty('--app-height', `${vh}px`);
        document.documentElement.style.setProperty('--app-width', `${vw}px`);

        dpr = Math.min(window.devicePixelRatio || 1, 2);
        if (canvas && canvas.parentElement) {
          const rect = canvas.parentElement.getBoundingClientRect();
          cw = rect.width;
          ch = rect.height;
          canvas.width = cw * dpr;
          canvas.height = ch * dpr;
          ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
        }
        if (typeof resizeHwCanvas === 'function') {
          resizeHwCanvas();
        }
      }

      function resizeCanvas() {
        syncAppHeight();
      }

      window.addEventListener('resize', syncAppHeight);
      window.addEventListener('orientationchange', () => {
        setTimeout(syncAppHeight, 50);
        setTimeout(syncAppHeight, 180);
      });
      if (window.visualViewport) {
        window.visualViewport.addEventListener('resize', syncAppHeight);
        window.visualViewport.addEventListener('scroll', syncAppHeight);
      }
      syncAppHeight();

      // ======================== 直線雙車道海岸公路 3D 透視投影 ========================
      // z: 0 (遠方地平線中央盡頭) -> 1 (畫面最底端)
      function projectRoad(z, lateralOffset = 0) {
        const horizonY = ch * 0.255;
        const bottomY = ch * 1.03;

        const clampedZ = Math.max(0.001, z);
        const perspectiveZ = Math.pow(clampedZ, 1.48);
        const y = horizonY + (bottomY - horizonY) * perspectiveZ;

        // 直線向上無彎曲公路：道路中央軸線筆直指向畫面正中央 (50% cw)
        const centerX = cw * 0.50;

        // 雙車道 (底端雙車道總寬度 72.8% cw，遠方依透視收縮至地平線中央)
        const roadTopWidth = cw * 0.028;
        const roadBottomWidth = cw * 0.728;
        const roadWidth = roadTopWidth + (roadBottomWidth - roadTopWidth) * perspectiveZ;

        const x = centerX + lateralOffset * (roadWidth * 0.5);
        const scale = 0.10 + 0.90 * perspectiveZ;

        return { x, y, centerX, roadWidth, scale, perspectiveZ, horizonY };
      }

      // 道路特定 y 深度處的路面寬度 (與 projectRoad 嚴格一致)
      function getRoadWidthAtY(y) {
        const horizonY = ch * 0.255;
        const bottomY = ch * 1.03;
        const perspectiveZ = Math.max(0, (y - horizonY) / (bottomY - horizonY));
        const roadTopWidth = cw * 0.028;
        const roadBottomWidth = cw * 0.728;
        return roadTopWidth + (roadBottomWidth - roadTopWidth) * perspectiveZ;
      }

      // 道路特定 y 深度與 lateralOffset 的水平 x 座標 (與 projectRoad 嚴格一致)
      function getRoadXAtY(y, lateralOffset) {
        const centerX = cw * 0.50;
        const rw = getRoadWidthAtY(y);
        return centerX + lateralOffset * (rw * 0.5);
      }

      // 透視梯形切片渲染器：
      // 車頭朝向正上方，車身橫向對稱切片，每一切片寬度依所在路面寬度等比例縮放
      // 車頭寬度依所在道路比例小於車尾 (taperRatio = rwFront / rwRear)，
      // 左右兩側對稱朝道路地平線消失點收斂，與路面透視完全平行
      function drawPerspectiveTrapezoid(ctx, source, xCenter, yRear, h, wRear, srcX, srcY, srcW, srcH) {
        const numSlices = 36;
        const sliceH = h / numSlices;
        const yFront = yRear - h;
        const rwRear = getRoadWidthAtY(yRear);
        const rwFront = getRoadWidthAtY(yFront);
        const taperRatio = rwRear > 0 ? Math.max(0.65, Math.min(0.98, rwFront / rwRear)) : 0.82;

        const sw = srcW !== undefined ? srcW : (source.naturalWidth || source.width);
        const sh = srcH !== undefined ? srcH : (source.naturalHeight || source.height);
        const sx = srcX || 0;
        const sy = srcY || 0;
        const srcSliceH = sh / numSlices;

        for (let i = 0; i < numSlices; i++) {
          // i = 0 為車頭最前端 (yFront)；i = numSlices - 1 為車尾最底端 (yRear)
          const yTop = yFront + i * sliceH;
          const t = (i + 0.5) / numSlices; // 0 = 車頭, 1 = 車尾
          const sliceWidth = wRear * (taperRatio + (1 - taperRatio) * t);
          const destX = xCenter - sliceWidth * 0.5;

          // destH 增加微量 0.65px 重疊，消除高解析度/次像素下的水平切片微小接縫
          const destH = sliceH + 0.65;
          const currSrcY = sy + i * srcSliceH;

          ctx.drawImage(
            source,
            sx, currSrcY, sw, srcSliceH,
            destX, yTop, sliceWidth, destH
          );
        }
      }

      // ======================== 路人車：生成 / 結算 / 更新 / 繪製 ========================
      // 依螢幕 y 座標反推道路深度 z (projectRoad 的反函數)
      function zForScreenY(y) {
        const horizonY = ch * 0.255;
        const bottomY = ch * 1.03;
        const pz = Math.max(0.0001, Math.min(1, (y - horizonY) / (bottomY - horizonY)));
        return Math.pow(pz, 1 / 1.48);
      }

      // 倒數結束時路人車最靠近玩家的位置 (車尾緊貼在玩家車頭正前方；升空時對齊空中車頭前方，超車時直接由下方飛越)
      function getTrafficCloseZ() {
        const p = projectRoad(PLAYER_Z, 0);
        const s = p.scale * 1.12;
        const hoverLiftY = 72 * s * (state.hoverFactor || 0);
        const playerNoseY = p.y - hoverLiftY - 122 * s;
        return Math.max(TRAFFIC_START_Z + 0.1, zForScreenY(playerNoseY - 4));
      }

      // 取得路人車生成車道：貼地時與玩家同車道；玩家升空行駛於雙車道正中央時，路人車於左右車道交替行駛供玩家由上空飛越
      function getTrafficSpawnLane() {
        if (state.targetSpeed >= 300 || state.playerLane === PLAYER_LANE_CENTER) {
          state.lastTrafficGroundLane =
            state.lastTrafficGroundLane === PLAYER_LANE_LEFT ? PLAYER_LANE_RIGHT : PLAYER_LANE_LEFT;
          return state.lastTrafficGroundLane;
        }
        state.lastTrafficGroundLane = state.playerLane;
        return state.playerLane;
      }

      // 答錯後路人車往前衝到的位置 (離玩家約 3 個車身距離)
      function getTraffic3CarLengthsZ() {
        const closeZ = getTrafficCloseZ();
        return Math.max(TRAFFIC_START_Z + 0.12, closeZ - 0.18);
      }

      // 每題出現時：隨機挑一台路人車，出現在道路遠方的盡頭、與玩家同一車道
      // (除了答錯的車保持原款不變外，其他新產生的路人車，必定和上一台被超越的車型不同)
      function spawnTrafficCar() {
        // (1) 車速靜止 (targetSpeed < 25) 時，路面不出現路人車，直到車速 >= 25 才有路人車
        if (state.targetSpeed < 25) return;

        // (2) 答錯後路人車往前衝到 3 個車身處，直接當作下一題的新路人車，不重新產生，避免畫面重疊
        const existingEscaping = state.trafficCars.find(
          (c) => c.mode === 'rush_to_3_cars' || c.mode === 'escape_to_horizon'
        );
        if (existingEscaping) {
          return;
        }

        // (3) 若已有正在接近中的車輛，不再重複生成
        const existingApproach = state.trafficCars.find((c) => c.mode === 'approach');
        if (existingApproach) {
          return;
        }

        // 挑選車款：新產生的路人車，必定與上一台被超越的車款 (lastPassedCarIndex) 不同
        const candidates = [];
        for (let idx = 0; idx < trafficImages.length; idx++) {
          if (idx !== state.lastPassedCarIndex) {
            candidates.push(idx);
          }
        }
        const pool = candidates.length > 0 ? candidates : [0];
        const chosenIndex = pool[Math.floor(Math.random() * pool.length)];
        const img = trafficImages[chosenIndex];

        state.trafficCars.push({
          img,
          carIndex: chosenIndex,
          lane: getTrafficSpawnLane(),
          z: TRAFFIC_START_Z,
          fromZ: TRAFFIC_START_Z,
          startZ: TRAFFIC_START_Z,
          mode: 'approach',
          t: 0,
          vz: 0,
          alpha: 1,
          vis: 1
        });
      }

      // 作答結算：
      // 答對 → 玩家換道超車 (路人車由慢漸快往後方消失)
      // 答錯/超時 →
      //   若車速降至 0 (靜止)：路人車往前衝走後直接消失，不再出現路人車
      //   若車速仍 >= 25：路人車不要衝到道路盡頭，只要往前衝到離玩家 3 個車身的地方，保持同一車款當作下一輪新路人車
      function resolveTrafficCar(isCorrect) {
        let car = state.trafficCars.find((c) => c.mode === 'approach');
        if (!car) {
          car = state.trafficCars.find((c) => c.mode === 'rush_to_3_cars');
        }
        if (!car) {
          car = state.trafficCars.find((c) => c.mode === 'escape_to_horizon');
        }
        if (!car) return;

        car.t = 0;
        car.fromZ = car.z;

        if (isCorrect) {
          car.mode = 'passed';
          // 記錄此台被超越的路人車車型索引，確保下一台新產生的車型與其不同
          if (car.carIndex !== undefined) {
            state.lastPassedCarIndex = car.carIndex;
          }
          const speedFactor = Math.max(0.8, state.currentSpeed / 120);
          car.vz = 0.14 * speedFactor; // 由慢漸快向後退去 (相對速度隨車速提升)
        } else {
          // 答錯或超時：若車速降至 0，路人車往前衝走後消失；若 >= 25，則衝到離玩家 3 個車身處作為下一題新路人車
          if (state.targetSpeed <= 0) {
            car.mode = 'escape_and_disappear';
            const escapeDist = Math.max(0.01, car.fromZ - TRAFFIC_START_Z);
            car.escapeDuration = Math.max(0.4, Math.min(0.85, escapeDist / 0.55));
          } else {
            car.mode = 'rush_to_3_cars';
            const threeCarZ = getTraffic3CarLengthsZ();
            // 目標為 3 個車身處；若當前已比 3 個車身更遠，仍往前衝一段距離
            car.targetZ = Math.max(TRAFFIC_START_Z + 0.08, Math.min(car.fromZ - 0.08, threeCarZ));
            const dist = Math.max(0.05, Math.abs(car.fromZ - car.targetZ));
            car.rushDuration = Math.max(0.35, Math.min(0.65, dist / 0.5));
          }
        }
      }

      function updateTrafficCars(dt) {
        const closeZ = getTrafficCloseZ();
        for (let i = state.trafficCars.length - 1; i >= 0; i--) {
          const car = state.trafficCars[i];
          car.t += dt;

          if (car.mode === 'approach') {
            if (state.phase !== 'RACING' || state.targetSpeed <= 0) {
              // 比賽結束或車速降為 0 時，路人車往前衝走消失
              car.mode = 'escape_and_disappear';
              car.t = 0;
              car.fromZ = car.z;
              car.escapeDuration = 0.7;
            } else {
              // 依題目剩餘時間由遠而近：5 秒倒數結束時，貼近玩家車頭前方
              // 起點若為上一題衝出的 3 個車身處 (startZ)，則從該處順暢逼近
              const startZ = car.startZ !== undefined ? car.startZ : TRAFFIC_START_Z;
              const p = Math.max(0, Math.min(1, 1 - state.questionTimeLeft / QUESTION_DURATION));
              const targetZ = startZ + (closeZ - startZ) * Math.pow(p, 1.2);
              car.z += (targetZ - car.z) * Math.min(1, dt * 10);
              car.alpha = 1;
            }
          } else if (car.mode === 'passed') {
            // 玩家超車：路人車相對玩家由慢漸快向後退，越過玩家後消失在畫面下方
            const speedFactor = Math.max(0.8, state.currentSpeed / 120);
            car.vz += 2.8 * speedFactor * dt;
            car.z += car.vz * dt;
            car.alpha = 1;
            if (car.z > 1.4) {
              state.trafficCars.splice(i, 1);
              continue;
            }
          } else if (car.mode === 'rush_to_3_cars') {
            // 答錯後路人車往前衝到離玩家 3 個車身的地方，保持同一車款，直接作為下一輪的新路人車
            const dur = car.rushDuration || 0.45;
            const u = Math.min(1, car.t / dur);
            const ease = 1 - Math.pow(1 - u, 2.2);
            car.z = car.fromZ + (car.targetZ - car.fromZ) * ease;
            car.alpha = 1;
            if (u >= 1) {
              // 若此時車速已降為 0 或比賽已結束，直接移除
              if (state.targetSpeed <= 0 || state.phase !== 'RACING') {
                car.mode = 'escape_and_disappear';
                car.t = 0;
                car.fromZ = car.z;
                car.escapeDuration = 0.6;
                continue;
              }
              // 到達 3 個車身處，轉為接近模式 (同一車款、同一車道)，從 3 個車身處隨題目倒數再度逼近玩家
              car.mode = 'approach';
              car.z = car.targetZ;
              car.startZ = car.targetZ;
              car.lane = state.playerLane === PLAYER_LANE_CENTER ? car.lane : state.playerLane;
              car.t = 0;
              car.vz = 0;
              car.alpha = 1;
              car.vis = 1;
            }
          } else if (car.mode === 'escape_to_horizon') {
            // 答錯後路人車往前衝走，到前方盡頭就當作下一題的新路人車
            const dur = car.escapeDuration || 0.85;
            const u = Math.min(1, car.t / dur);
            const ease = 1 - Math.pow(1 - u, 2.2);
            car.z = car.fromZ + (TRAFFIC_START_Z - car.fromZ) * ease;
            car.alpha = 1;
            if (u >= 1) {
              // 到達前方盡頭！
              // 若此時車速已降為 0 或比賽已結束，直接移除
              if (state.targetSpeed <= 0 || state.phase !== 'RACING') {
                state.trafficCars.splice(i, 1);
                continue;
              }
              // 否則直接轉為當前/下一題的新路人車，開始接近玩家 (保持根本來一樣的車款，不變換造型)
              car.mode = 'approach';
              car.z = TRAFFIC_START_Z;
              car.startZ = TRAFFIC_START_Z;
              car.fromZ = TRAFFIC_START_Z;
              car.lane = state.playerLane === PLAYER_LANE_CENTER ? car.lane : state.playerLane;
              car.t = 0;
              car.vz = 0;
              car.alpha = 1;
              car.vis = 1;
            }
          } else if (car.mode === 'escape_and_disappear') {
            // 車速降為 0 或遊戲結束：路人車往前衝走並在地平線消失
            const dur = car.escapeDuration || 0.85;
            const u = Math.min(1, car.t / dur);
            const ease = 1 - Math.pow(1 - u, 2.2);
            car.z = car.fromZ + (0.004 - car.fromZ) * ease;
            car.alpha = u < 0.7 ? 1 : Math.max(0, 1 - (u - 0.7) / 0.3);
            if (u >= 1) {
              state.trafficCars.splice(i, 1);
              continue;
            }
          }
        }
      }

      function drawTrafficCar(car) {
        const a = car.alpha * car.vis;
        if (a <= 0.01) return;

        const isLeftLane = car.lane < 0;
        const model = (car.img && car.img.leftImg) ? car.img : (trafficImages[car.carIndex] || trafficImages[0]);
        const carImg = isLeftLane ? model.leftImg : model.rightImg;
        if (!carImg || !carImg.complete || !carImg.naturalWidth) return;

        const proj = projectRoad(car.z, car.lane);
        /* Scale car size strictly proportional to road width at car.z so far/near perspective is 100% proportional */
        const w = proj.roadWidth * 0.268;
        const s = w / 70;
        const h = w * (carImg.naturalHeight / carImg.naturalWidth);
        if (w < 1.5 || h < 1.5) return;

        ctx.save();
        ctx.globalAlpha = a;
        ctx.translate(proj.x, proj.y);

        /* (1) Subtle warm sunset rim reflection on the left road surface facing the setting sun */
        ctx.save();
        const glowX = -w * 0.36;
        const glowY = -h * 0.48;
        const glowR = w * 0.44;
        const warmGrad = ctx.createRadialGradient(glowX, glowY, glowR * 0.12, glowX, glowY, glowR);
        warmGrad.addColorStop(0.0, 'rgba(251, 146, 60, 0.22)');
        warmGrad.addColorStop(0.55, 'rgba(251, 146, 60, 0.10)');
        warmGrad.addColorStop(1.0, 'rgba(251, 146, 60, 0)');
        ctx.fillStyle = warmGrad;
        ctx.beginPath();
        ctx.ellipse(glowX, glowY, glowR * 0.85, h * 0.44, 0, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();

        /* (2) Natural sunset ground shadow tailored to each of the 3 traffic cars and left/right lane */
        ctx.save();
        ctx.shadowColor = 'rgba(14, 16, 24, 0.34)';
        ctx.shadowBlur = Math.max(1.2, 5.5 * s);
        const maxShadowX = isLeftLane ? w * 1.24 : w * 1.14;
        const castGrad = ctx.createLinearGradient(-w * 0.20, -h * 0.32, maxShadowX, h * 0.26);
        castGrad.addColorStop(0.0, 'rgba(14, 16, 24, 0.60)');
        castGrad.addColorStop(0.42, 'rgba(20, 24, 34, 0.48)');
        castGrad.addColorStop(0.78, 'rgba(28, 32, 44, 0.38)');
        castGrad.addColorStop(1.0, 'rgba(36, 40, 52, 0.22)');
        ctx.fillStyle = castGrad;

        ctx.beginPath();
        if (car.carIndex === 0) {
          /* Car 1: Silver Hatchback (long sunset shadow with side-mirror projection tab) */
          if (isLeftLane) {
            ctx.moveTo(w * 0.35, -h * 0.72);
            ctx.lineTo(w * 0.94, -h * 0.35);
            ctx.lineTo(w * 1.12, -h * 0.26);
            ctx.quadraticCurveTo(w * 1.16, -h * 0.22, w * 1.04, -h * 0.18);
            ctx.lineTo(w * 1.24, h * 0.16);
            ctx.quadraticCurveTo(w * 1.26, h * 0.30, w * 1.08, h * 0.30);
            ctx.lineTo(w * 0.08, h * 0.28);
            ctx.quadraticCurveTo(-w * 0.04, h * 0.27, -w * 0.14, h * 0.19);
            ctx.lineTo(-w * 0.41, -h * 0.04);
            ctx.lineTo(-w * 0.28, -h * 0.70);
          } else {
            ctx.moveTo(w * 0.34, -h * 0.72);
            ctx.lineTo(w * 0.86, -h * 0.36);
            ctx.lineTo(w * 1.03, -h * 0.27);
            ctx.quadraticCurveTo(w * 1.07, -h * 0.23, w * 0.96, -h * 0.19);
            ctx.lineTo(w * 1.15, h * 0.16);
            ctx.quadraticCurveTo(w * 1.17, h * 0.29, w * 1.00, h * 0.29);
            ctx.lineTo(w * 0.05, h * 0.27);
            ctx.quadraticCurveTo(-w * 0.06, h * 0.26, -w * 0.15, h * 0.18);
            ctx.lineTo(-w * 0.41, -h * 0.04);
            ctx.lineTo(-w * 0.28, -h * 0.70);
          }
        } else if (car.carIndex === 1) {
          /* Car 2: Red Sports Coupe (compact, sleek low-slung sunset shadow) */
          if (isLeftLane) {
            ctx.moveTo(w * 0.35, -h * 0.73);
            ctx.lineTo(w * 0.85, -h * 0.12);
            ctx.quadraticCurveTo(w * 0.94, h * 0.08, w * 0.74, h * 0.27);
            ctx.quadraticCurveTo(w * 0.62, h * 0.31, w * 0.06, h * 0.29);
            ctx.quadraticCurveTo(-w * 0.05, h * 0.28, -w * 0.15, h * 0.19);
            ctx.lineTo(-w * 0.42, -h * 0.05);
            ctx.lineTo(-w * 0.28, -h * 0.70);
          } else {
            ctx.moveTo(w * 0.34, -h * 0.73);
            ctx.lineTo(w * 0.82, -h * 0.12);
            ctx.quadraticCurveTo(w * 0.90, h * 0.08, w * 0.72, h * 0.26);
            ctx.quadraticCurveTo(w * 0.60, h * 0.30, w * 0.04, h * 0.28);
            ctx.quadraticCurveTo(-w * 0.06, h * 0.27, -w * 0.16, h * 0.18);
            ctx.lineTo(-w * 0.42, -h * 0.05);
            ctx.lineTo(-w * 0.28, -h * 0.70);
          }
        } else {
          /* Car 3: Blue SUV / Minivan (full-bodied SUV sunset shadow) */
          if (isLeftLane) {
            ctx.moveTo(w * 0.35, -h * 0.74);
            ctx.lineTo(w * 0.86, -h * 0.34);
            ctx.lineTo(w * 0.96, -h * 0.28);
            ctx.quadraticCurveTo(w * 0.99, -h * 0.24, w * 0.90, -h * 0.21);
            ctx.lineTo(w * 1.12, h * 0.14);
            ctx.quadraticCurveTo(w * 1.14, h * 0.30, w * 0.92, h * 0.31);
            ctx.lineTo(w * 0.06, h * 0.29);
            ctx.quadraticCurveTo(-w * 0.05, h * 0.28, -w * 0.15, h * 0.19);
            ctx.lineTo(-w * 0.42, -h * 0.04);
            ctx.lineTo(-w * 0.28, -h * 0.72);
          } else {
            ctx.moveTo(w * 0.34, -h * 0.74);
            ctx.lineTo(w * 0.82, -h * 0.34);
            ctx.lineTo(w * 0.92, -h * 0.28);
            ctx.quadraticCurveTo(w * 0.95, -h * 0.24, w * 0.86, -h * 0.21);
            ctx.lineTo(w * 1.06, h * 0.14);
            ctx.quadraticCurveTo(w * 1.08, h * 0.29, w * 0.88, h * 0.30);
            ctx.lineTo(w * 0.04, h * 0.28);
            ctx.quadraticCurveTo(-w * 0.06, h * 0.27, -w * 0.16, h * 0.18);
            ctx.lineTo(-w * 0.42, -h * 0.04);
            ctx.lineTo(-w * 0.28, -h * 0.72);
          }
        }
        ctx.closePath();
        ctx.fill();
        ctx.restore();

        /* (3) Subtle rear tire contact grounding shadow (no unnatural dark oval under bumper) */
        ctx.save();
        ctx.fillStyle = 'rgba(10, 12, 18, 0.42)';
        ctx.beginPath();
        ctx.ellipse(-w * 0.34, -h * 0.04, w * 0.08, Math.max(1, 3.5 * s), 0, 0, Math.PI * 2);
        ctx.ellipse(w * 0.34, -h * 0.04, w * 0.08, Math.max(1, 3.5 * s), 0, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();

        /* (4) Draw lane-specific traffic car model (Left Lane -5 deg / Right Lane +5 deg) */
        ctx.drawImage(carImg, -w * 0.5, -h, w, h);

        ctx.restore();
      }


      // ======================== 題目生成與作答判定邏輯 ========================
      function generateQuestion() {
        if (typeof clearHandwritingCanvas === 'function') {
          clearHandwritingCanvas();
        }
        let a = Math.floor(Math.random() * 8) + 2;
        let b = Math.floor(Math.random() * 8) + 2;
        if (a === state.factorA && b === state.factorB) {
          b = ((b - 1) % 8) + 2;
        }
        state.factorA = a;
        state.factorB = b;
        state.expectedAnswer = String(a * b);
        state.currentInput = '';
        state.questionTimeLeft = QUESTION_DURATION;
        state.inputLocked = false;

        qFactorA.textContent = a;
        qFactorB.textContent = b;
        qAnswerSlot.textContent = '?';
        qAnswerSlot.classList.remove('correct', 'wrong');
        updateQuestionTimerUI();

        // 每當題目出現：隨機一台路人車出現在道路遠方盡頭，與玩家同一車道
        if (state.phase === 'RACING') {
          spawnTrafficCar();
        }
      }

      // 在汽車正上方顯示震撼醒目的 +25 km/h (綠) 或 -25 km/h (紅)
      function showSpeedDeltaFeedback(isPositive) {
        floatingFeedback.className = 'floating-feedback';
        void floatingFeedback.offsetWidth;
        const sign = isPositive ? '+' : '-';
        floatingFeedback.innerHTML = `<span class="fb-num">${sign}${SPEED_STEP}</span><span class="fb-unit">km/h</span>`;
        floatingFeedback.classList.add(isPositive ? 'show-boost' : 'show-slow');
      }

      // 速度降至 0 之後，答錯或超時顯示震撼醒目且三字等距、驚嘆號緊貼並整體水平置中的「請加油!」
      function showCheerFeedback() {
        floatingFeedback.className = 'floating-feedback';
        void floatingFeedback.offsetWidth;
        floatingFeedback.innerHTML =
          `<span class="fb-cheer">` +
          `<span class="cheer-char cheer-char-first">請</span>` +
          `<span class="cheer-char cheer-char-mid">加</span>` +
          `<span class="cheer-char">油</span>` +
          `<span class="cheer-excl">!</span>` +
          `</span>`;
        floatingFeedback.classList.add('show-slow');
      }

      function triggerBoostVisual() {
        boostFlash.classList.add('active');
        setTimeout(() => boostFlash.classList.remove('active'), 220);
      }

      function triggerDamageVisual() {
        damageFlash.classList.add('active');
        setTimeout(() => damageFlash.classList.remove('active'), 260);
      }

      function spawnSkidMarks() {
        // 若車輛已升空懸浮離開路面，輪胎不接觸柏油路，不產生路面煞車痕
        if (state.hoverFactor > 0.35) return;
        state.skidMarks.push({
          z: PLAYER_Z + 0.02,
          lane: state.playerLaneX,
          length: 0.11,
          alpha: 0.82
        });
      }

      function handleCorrectAnswer() {
        if (typeof clearHandwritingCanvas === 'function') {
          clearHandwritingCanvas();
        }
        state.inputLocked = true;
        state.correctCount++;
        state.combo++;
        const prevSpeed = state.targetSpeed;
        state.targetSpeed += SPEED_STEP;
        if (state.targetSpeed > state.topSpeed) {
          state.topSpeed = state.targetSpeed;
        }
        state.nitroTimer = 0.85;

        // 答對：
        // 若時速達 300 以上 (起飛狀態)，車子行駛在兩條車道正中間，直接飛越路人車上空，不再變換車道；
        // 若未達 300 且原先為行駛狀態 (prevSpeed > 0)，切換到另一個車道並超越路人車；
        // 若原先為靜止狀態 (prevSpeed <= 0)，發動出發時保持原車道，不變換車道
        if (state.targetSpeed >= 300) {
          if (state.playerLane !== PLAYER_LANE_CENTER) {
