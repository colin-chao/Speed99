          masterBrakeGain.gain.linearRampToValueAtTime(0.3696, now + 0.025);
          masterBrakeGain.gain.setValueAtTime(0.3234, now + 0.46);
          masterBrakeGain.gain.exponentialRampToValueAtTime(0.001, now + duration);
          masterBrakeGain.connect(this.gameBusGain);

          // 產生帶有粗礫顆粒感的柏油路面摩擦噪聲
          const bufSize = Math.floor(this.ctx.sampleRate * duration);
          const noiseBuf = this.ctx.createBuffer(1, bufSize, this.ctx.sampleRate);
          const output = noiseBuf.getChannelData(0);
          let b0 = 0, b1 = 0, b2 = 0;
          for (let i = 0; i < bufSize; i++) {
            const white = Math.random() * 2 - 1;
            b0 = 0.99 * b0 + white * 0.12;
            b1 = 0.92 * b1 + white * 0.25;
            b2 = 0.65 * b2 + white * 0.45;
            // 疊加輪胎胎塊與粗糙柏油路面的顆粒摩擦調變
            const treadGrain = 0.72 + 0.28 * Math.sin(i * 0.0042 + Math.sin(i * 0.0009) * 3.0);
            output[i] = (b0 + b1 + b2 + white * 0.35) * 0.45 * treadGrain;
          }

          // 三段輪胎磨地共振頻帶：
          // 1. 低中頻胎皮重壓地面磨擦聲 (360Hz -> 210Hz)
          // 2. 中頻橡膠胎紋抓地磨擦聲 (780Hz -> 490Hz)
          // 3. 中高頻柏油地面急煞滑行嘶聲 (1580Hz -> 1080Hz)
          const bands = [
            { fStart: 360,  fEnd: 210,  q: 1.6, amp: 0.65 },
            { fStart: 780,  fEnd: 490,  q: 2.2, amp: 0.75 },
            { fStart: 1580, fEnd: 1080, q: 3.0, amp: 0.45 }
          ];

          bands.forEach((b) => {
            const src = this.ctx.createBufferSource();
            src.buffer = noiseBuf;

            const filter = this.ctx.createBiquadFilter();
            filter.type = 'bandpass';
            filter.frequency.setValueAtTime(b.fStart, now);
            filter.frequency.exponentialRampToValueAtTime(b.fEnd, now + duration);
            filter.Q.setValueAtTime(b.q, now);

            const g = this.ctx.createGain();
            g.gain.setValueAtTime(b.amp, now);

            src.connect(filter);
            filter.connect(g);
            g.connect(masterBrakeGain);
            src.start(now);
            src.stop(now + duration);
          });
        }

        // 起跑倒數提示音：直接連至 destination，維持原本 100% 音量不受 50% 衰減影響
        playCountdownBeep(isGo = false) {
          if (!this.enabled) return;
          this.init();
          if (!this.ctx) return;

          const now = this.ctx.currentTime;
          const osc = this.ctx.createOscillator();
          const gain = this.ctx.createGain();
          osc.type = 'square';
          osc.frequency.setValueAtTime(isGo ? 880 : 440, now);

          gain.gain.setValueAtTime(0.15, now);
          gain.gain.exponentialRampToValueAtTime(0.001, now + (isGo ? 0.35 : 0.18));

          osc.connect(gain);
          gain.connect(this.ctx.destination);
          osc.start(now);
          osc.stop(now + (isGo ? 0.36 : 0.19));
        }

        // 3. 到達終點衝線音效：熱烈群眾歡呼與掌聲
        playFinishFanfare() {
          if (!this.enabled) return;
          this.init();
          if (!this.ctx) return;

          const now = this.ctx.currentTime;
          const duration = 2.8;
          const sampleRate = this.ctx.sampleRate;
          const bufSize = Math.floor(sampleRate * duration);

          const crowdBuffer = this.ctx.createBuffer(2, bufSize, sampleRate);
          for (let ch = 0; ch < 2; ch++) {
            const output = crowdBuffer.getChannelData(ch);
            let b0 = 0, b1 = 0, b2 = 0, b3 = 0, b4 = 0, b5 = 0, b6 = 0;
            for (let i = 0; i < bufSize; i++) {
              const white = Math.random() * 2 - 1;
              b0 = 0.99886 * b0 + white * 0.0555179;
              b1 = 0.99332 * b1 + white * 0.0750759;
              b2 = 0.96900 * b2 + white * 0.1538520;
              b3 = 0.86650 * b3 + white * 0.3104856;
              b4 = 0.55000 * b4 + white * 0.5329522;
              b5 = -0.7616 * b5 - white * 0.0168980;
              output[i] = (b0 + b1 + b2 + b3 + b4 + b5 + b6 + white * 0.5362) * 0.05;
              b6 = white * 0.115926;
            }
          }

          // 終點熱烈歡呼聲 (音量 +50%)
          const formants = [
            { startF: 420, peakF: 680, endF: 520, q: 3.2, amp: 0.675 },
            { startF: 880, peakF: 1320, endF: 1050, q: 3.8, amp: 0.57 },
            { startF: 1850, peakF: 2450, endF: 2000, q: 4.2, amp: 0.33 }
          ];

          formants.forEach((f) => {
            const src = this.ctx.createBufferSource();
            src.buffer = crowdBuffer;

            const bp = this.ctx.createBiquadFilter();
            bp.type = 'bandpass';
            bp.Q.setValueAtTime(f.q, now);
            bp.frequency.setValueAtTime(f.startF, now);
            bp.frequency.exponentialRampToValueAtTime(f.peakF, now + 0.55);
            bp.frequency.exponentialRampToValueAtTime(f.endF, now + duration);

            const gain = this.ctx.createGain();
            gain.gain.setValueAtTime(0.001, now);
            gain.gain.linearRampToValueAtTime(f.amp, now + 0.28);
            gain.gain.setValueAtTime(f.amp * 0.92, now + 1.45);
            gain.gain.exponentialRampToValueAtTime(0.001, now + duration);

            src.connect(bp);
            bp.connect(gain);
            gain.connect(this.gameBusGain);
            src.start(now);
            src.stop(now + duration);
          });

          const clapCount = 46;
          for (let i = 0; i < clapCount; i++) {
            const clapTime = now + 0.05 + Math.random() * (duration - 0.35);
            const clapDur = 0.028 + Math.random() * 0.025;

            const clapSrc = this.ctx.createBufferSource();
            clapSrc.buffer = crowdBuffer;

            const clapFilter = this.ctx.createBiquadFilter();
            clapFilter.type = 'bandpass';
            clapFilter.frequency.setValueAtTime(1400 + Math.random() * 1600, clapTime);
            clapFilter.Q.setValueAtTime(1.8, clapTime);

            const fadeOutFactor = Math.max(0.15, 1 - (clapTime - now) / duration);
            const clapGain = this.ctx.createGain();
            clapGain.gain.setValueAtTime(0.001, clapTime);
            clapGain.gain.linearRampToValueAtTime(0.24 * fadeOutFactor, clapTime + 0.005);
            clapGain.gain.exponentialRampToValueAtTime(0.001, clapTime + clapDur);

            clapSrc.connect(clapFilter);
            clapFilter.connect(clapGain);
            clapGain.connect(this.gameBusGain);
            clapSrc.start(clapTime, Math.random() * 1.5, clapDur);
          }

          [0.18, 0.62].forEach((offset, idx) => {
            const wOsc = this.ctx.createOscillator();
            const wGain = this.ctx.createGain();
            const t0 = now + offset;
            wOsc.type = 'sine';
            wOsc.frequency.setValueAtTime(idx === 0 ? 2250 : 2550, t0);
            wOsc.frequency.exponentialRampToValueAtTime(idx === 0 ? 2850 : 2980, t0 + 0.22);
            wOsc.frequency.exponentialRampToValueAtTime(idx === 0 ? 2400 : 2650, t0 + 0.42);

            wGain.gain.setValueAtTime(0.001, t0);
            wGain.gain.linearRampToValueAtTime(0.0675, t0 + 0.06);
            wGain.gain.exponentialRampToValueAtTime(0.001, t0 + 0.44);

            wOsc.connect(wGain);
            wGain.connect(this.gameBusGain);
            wOsc.start(t0);
            wOsc.stop(t0 + 0.45);
          });
        }
      }

      const sound = new SoundEngine();

      // ======================== DOM 元素綁定 ========================
      const canvas = document.getElementById('raceCanvas');
      const ctx = canvas.getContext('2d');

      // 舊版手機瀏覽器 (iOS Safari 15 以下等) 不支援 roundRect，提供簡易後備實作避免繪圖拋出例外
      if (typeof ctx.roundRect !== 'function') {
        CanvasRenderingContext2D.prototype.roundRect = function (x, y, w, h, r) {
          const rr = Math.max(0, Math.min(Math.abs(Number(Array.isArray(r) ? r[0] : r) || 0), Math.abs(w) / 2, Math.abs(h) / 2));
          this.moveTo(x + rr, y);
          this.arcTo(x + w, y, x + w, y + h, rr);
          this.arcTo(x + w, y + h, x, y + h, rr);
          this.arcTo(x, y + h, x, y, rr);
          this.arcTo(x, y, x + w, y, rr);
          this.closePath();
        };
      }

      const hudSpeedometer = document.getElementById('hudSpeedometer');
      const hudTimeBadge = document.getElementById('hudTimeBadge');
      const raceTimeVal = document.getElementById('raceTimeVal');
      const speedVal = document.getElementById('speedVal');
      const questionCockpit = document.getElementById('questionCockpit');
      const qFactorA = document.getElementById('qFactorA');
      const qFactorB = document.getElementById('qFactorB');
      const qAnswerSlot = document.getElementById('qAnswerSlot');
      const qTimerBar = document.getElementById('qTimerBar');

      const damageFlash = document.getElementById('damageFlash');
      const boostFlash = document.getElementById('boostFlash');
      const floatingFeedback = document.getElementById('floatingFeedback');
      const countdownBanner = document.getElementById('countdownBanner');

      const startModal = document.getElementById('startModal');
      const resultModal = document.getElementById('resultModal');
      const startRaceBtn = document.getElementById('startRaceBtn');
      const replayBtn = document.getElementById('replayBtn');

      const resCorrect = document.getElementById('resCorrect');
      const resWrong = document.getElementById('resWrong');
      const resTopSpeed = document.getElementById('resTopSpeed');

      const digitButtons = Array.from(document.querySelectorAll('.mech-key[data-digit]'));

      // ======================== 遊戲參數與狀態 ========================
      const GAME_DURATION = 30.0;       // 關卡總時間 30 秒
      const QUESTION_DURATION = 5.0;    // 每題限時 5 秒
      const BASE_MIN_SPEED = 0;         // 最低速度為 0 km/h (車子完全靜止)
      const INITIAL_SPEED = 125;        // 起跑初始時速 (km/h)
      const SPEED_STEP = 25;            // 答對 +25 km/h / 答錯或超時 -25 km/h
      const PLAYER_Z = 0.72;            // 玩家銀白跑車位於畫面最下方馬路上（緊鄰題目框正上方）

      let countdownTimers = [];

      const state = {
        phase: 'IDLE', // IDLE | COUNTDOWN | RACING | FINISHING | ENDED
        raceTimeLeft: GAME_DURATION,
        questionTimeLeft: QUESTION_DURATION,
        lastCountdownBeepSec: 0,

        targetSpeed: INITIAL_SPEED,
        currentSpeed: INITIAL_SPEED,
        finalSpeed: INITIAL_SPEED,
        topSpeed: INITIAL_SPEED,

        factorA: 7,
        factorB: 8,
        expectedAnswer: '56',
        currentInput: '',
        inputLocked: false,

        correctCount: 0,
        wrongCount: 0,
        combo: 0,

        roadScroll: 0,
        nitroTimer: 0,
        brakeTimer: 0,
        hoverFactor: 0, // 時速 >= 300 時平滑升空懸浮比例 (0 = 貼地, 1 = 離地約5米並噴射白煙)

        skidMarks: [],
        finishGateZ: -1,
        finishSoundPlayed: false
      };

      // ======================== 畫布響應式尺寸調整 ========================
      let cw = 480;
      let ch = 500;
      let dpr = 1;

      function resizeCanvas() {
        dpr = Math.min(window.devicePixelRatio || 1, 2);
        const rect = canvas.parentElement.getBoundingClientRect();
        cw = rect.width;
        ch = rect.height;
        canvas.width = cw * dpr;
        canvas.height = ch * dpr;
        ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      }

      window.addEventListener('resize', resizeCanvas);
      resizeCanvas();

      // ======================== 彎曲單車道海岸公路 3D 透視投影 ========================
      // z: 0 (遠方海岸岬角盡頭) -> 1 (畫面最底端)
      function projectRoad(z, lateralOffset = 0) {
        const horizonY = ch * 0.255;
        const bottomY = ch * 1.03;

        const clampedZ = Math.max(0.001, z);
        const perspectiveZ = Math.pow(clampedZ, 1.48);
        const y = horizonY + (bottomY - horizonY) * perspectiveZ;

        // 重現圖片中的優美 S 型海岸公路曲線：
        // 遠處從海岬 (x ~ 0.47*cw) 向右彎繞山壁 (x ~ 0.62*cw)，再順暢延伸回底部正中央 (x = 0.50*cw)
        // 讓最下方馬路位於題目框正上方且筆直朝向正前方
        const sCurve =
          0.50 +
          0.12 * Math.sin(Math.pow(1 - clampedZ, 0.85) * Math.PI * 1.35) * (1 - Math.pow(clampedZ, 2.2));

        // 隨車速向後流動的微幅動態感 (減號代表由遠方往畫面下方後退)
        const dynamicSway =
          Math.sin(clampedZ * 3.2 - state.roadScroll * 1.4) *
          0.004 *
          (1 - perspectiveZ) *
          Math.min(1.8, state.currentSpeed / 120);

        const centerX = cw * (sCurve + dynamicSway);

        // 單車道寬度 (近大遠小透視)
        const roadTopWidth = cw * 0.022;
        const roadBottomWidth = cw * 0.56;
        const roadWidth = roadTopWidth + (roadBottomWidth - roadTopWidth) * perspectiveZ;

        const x = centerX + lateralOffset * (roadWidth * 0.5);
        const scale = 0.10 + 0.90 * perspectiveZ;

        return { x, y, centerX, roadWidth, scale, perspectiveZ, horizonY };
      }

      // ======================== 題目生成與作答判定邏輯 ========================
      function generateQuestion() {
        let a = Math.floor(Math.random() * 8) + 2;
        let b = Math.floor(Math.random() * 8) + 2;
        if (a === state.factorA && b === state.factorB) {
          b = ((b - 1) % 8) + 2;
        }
        state.factorA = a;
        state.factorB = b;
        state.expectedAnswer = String(a * b);
        state.currentInput = '';
        state.questionTimeLeft = QUESTION_DURATION;
        state.inputLocked = false;

        qFactorA.textContent = a;
        qFactorB.textContent = b;
        qAnswerSlot.textContent = '?';
        qAnswerSlot.classList.remove('correct', 'wrong');
        updateQuestionTimerUI();
      }

      // 在汽車正上方顯示震撼醒目的 +25 km/h (綠) 或 -25 km/h (紅)
      function showSpeedDeltaFeedback(isPositive) {
        floatingFeedback.className = 'floating-feedback';
        void floatingFeedback.offsetWidth;
        const sign = isPositive ? '+' : '-';
        floatingFeedback.innerHTML = `<span class="fb-num">${sign}${SPEED_STEP}</span><span class="fb-unit">km/h</span>`;
        floatingFeedback.classList.add(isPositive ? 'show-boost' : 'show-slow');
      }

      // 速度降至 0 之後，答錯或超時顯示震撼醒目且三字等距、驚嘆號緊貼並整體水平置中的「請加油!」
      function showCheerFeedback() {
        floatingFeedback.className = 'floating-feedback';
        void floatingFeedback.offsetWidth;
        floatingFeedback.innerHTML =
          `<span class="fb-cheer">` +
          `<span class="cheer-char cheer-char-first">請</span>` +
          `<span class="cheer-char cheer-char-mid">加</span>` +
          `<span class="cheer-char">油</span>` +
          `<span class="cheer-excl">!</span>` +
          `</span>`;
        floatingFeedback.classList.add('show-slow');
      }

      function triggerBoostVisual() {
        boostFlash.classList.add('active');
        setTimeout(() => boostFlash.classList.remove('active'), 220);
      }

      function triggerDamageVisual() {
        damageFlash.classList.add('active');
        setTimeout(() => damageFlash.classList.remove('active'), 260);
      }

      function spawnSkidMarks() {
        // 若車輛已升空懸浮離開路面，輪胎不接觸柏油路，不產生路面煞車痕
        if (state.hoverFactor > 0.35) return;
        state.skidMarks.push({
          z: PLAYER_Z + 0.02,
          length: 0.11,
          alpha: 0.82
        });
      }

      function handleCorrectAnswer() {
        state.inputLocked = true;
        state.correctCount++;
        state.combo++;
        const prevSpeed = state.targetSpeed;
        state.targetSpeed += SPEED_STEP;
        if (state.targetSpeed > state.topSpeed) {
          state.topSpeed = state.targetSpeed;
        }
        state.nitroTimer = 0.85;

        qAnswerSlot.classList.add('correct');
        showSpeedDeltaFeedback(true);
        triggerBoostVisual();
        // 答對時：若由 0->25 播放發動聲；否則升頻至下一階固定頻率並持續發出排氣轟隆聲
        try {
          sound.shiftUpEngine(prevSpeed, state.targetSpeed);
        } catch (err) {
          console.error('[Speed99] shiftUp sound error:', err);
        }

        setTimeout(() => {
          if (state.phase === 'RACING') {
            generateQuestion();
          }
        }, 120);
      }

      function handleWrongOrTimeout(isTimeout = false) {
        state.inputLocked = true;
        state.wrongCount++;
        state.combo = 0;

        const prevSpeed = state.targetSpeed;
        const isAlreadyAtZero = prevSpeed <= 0;
        state.targetSpeed = Math.max(BASE_MIN_SPEED, prevSpeed - SPEED_STEP);
        state.brakeTimer = 0.65;
        state.nitroTimer = 0;

        // 超時字樣不出現在題目欄位裡；僅在答錯時顯示玩家輸入的錯誤數字
        if (!isTimeout) {
          qAnswerSlot.textContent = state.currentInput;
        }
        qAnswerSlot.classList.add('wrong');

        if (isAlreadyAtZero) {
          // 速度降至 0 之後，答錯或超時不再顯示煞車痕、不顯示 -25 字樣、也不播放煞車音與引擎音，改顯示「請加油！」
          showCheerFeedback();
        } else {
          // 尚有車速時，答錯與超時皆在車子正上方顯示紅色震撼 -25 km/h、留下煞車痕、播放煞車音並伴隨引擎降頻聲 (降至 0 時停止排氣聲)
          showSpeedDeltaFeedback(false);
          spawnSkidMarks();
          try {
            sound.playBrakeWarning();
            sound.shiftDownEngine(prevSpeed, state.targetSpeed);
          } catch (err) {
            console.error('[Speed99] brake/downshift sound error:', err);
          }
        }

        triggerDamageVisual();

        setTimeout(() => {
          if (state.phase === 'RACING') {
            generateQuestion();
          }
        }, 190);
      }

      function handleDigitInput(digitStr) {
        if (state.phase !== 'RACING' || state.inputLocked) return;

        sound.playKeyClick(digitStr);
        state.currentInput += digitStr;
        qAnswerSlot.textContent = state.currentInput;

        const requiredDigits = state.expectedAnswer.length;
        if (state.currentInput.length >= requiredDigits) {
          if (state.currentInput === state.expectedAnswer) {
            handleCorrectAnswer();
          } else {
            handleWrongOrTimeout(false);
          }
        }
      }

      function handleClearInput() {
        if (state.phase !== 'RACING' || state.inputLocked) return;
        sound.playKeyClick(0);
        state.currentInput = '';
        qAnswerSlot.textContent = '?';
      }

      // ======================== 繪圖引擎 (100% 還原參考圖片之海岸夕陽與彎曲單車道) ========================

      // 1. 繪製夕陽天空、左側落日、海面波光倒影與右側翠綠立體海岸山脈
      function drawCoastalSunsetEnvironment() {
        const horizonY = ch * 0.255;

        // (A) 夕陽暖橘紅至金黃漸層天空
        const skyGrad = ctx.createLinearGradient(0, 0, 0, horizonY);
        skyGrad.addColorStop(0.00, '#e35526');
        skyGrad.addColorStop(0.38, '#f07428');
        skyGrad.addColorStop(0.72, '#f79c34');
        skyGrad.addColorStop(1.00, '#fcc949');
        ctx.fillStyle = skyGrad;
        ctx.fillRect(0, 0, cw, horizonY + 2);

        // 水平幾何晚霞雲帶 (如參考圖)
        ctx.fillStyle = 'rgba(214, 75, 42, 0.65)';
        ctx.beginPath();
        ctx.moveTo(0, horizonY * 0.36);
        ctx.lineTo(cw * 0.16, horizonY * 0.39);
        ctx.lineTo(0, horizonY * 0.42);
        ctx.closePath();
        ctx.fill();

        ctx.fillStyle = 'rgba(222, 85, 45, 0.55)';
        ctx.beginPath();
        ctx.moveTo(cw * 0.40, horizonY * 0.48);
        ctx.lineTo(cw * 0.78, horizonY * 0.42);
        ctx.lineTo(cw * 0.78, horizonY * 0.52);
        ctx.closePath();
        ctx.fill();

        ctx.fillStyle = 'rgba(244, 145, 50, 0.55)';
        ctx.beginPath();
        ctx.moveTo(0, horizonY * 0.62);
        ctx.lineTo(cw * 0.15, horizonY * 0.65);
        ctx.lineTo(0, horizonY * 0.68);
        ctx.closePath();
        ctx.fill();

        ctx.beginPath();
        ctx.moveTo(cw * 0.38, horizonY * 0.60);
        ctx.lineTo(cw * 0.72, horizonY * 0.57);
        ctx.lineTo(cw * 0.72, horizonY * 0.63);
        ctx.closePath();
        ctx.fill();

        // (B) 左側海平線巨大橘紅落日半圓
        const sunX = cw * 0.215;
        const sunY = horizonY;
        const sunRadius = cw * 0.105;

        ctx.save();
        ctx.beginPath();
        ctx.rect(0, 0, cw, horizonY);
        ctx.clip();

        const sunGrad = ctx.createLinearGradient(sunX, sunY - sunRadius, sunX, sunY);
        sunGrad.addColorStop(0.0, '#f05a22');
        sunGrad.addColorStop(0.6, '#f57629');
        sunGrad.addColorStop(1.0, '#f99536');
        ctx.fillStyle = sunGrad;
        ctx.beginPath();
        ctx.arc(sunX, sunY, sunRadius, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();

        // (C) 左側深藍海洋與金色夕陽波光倒影
        const seaGrad = ctx.createLinearGradient(0, horizonY, cw * 0.55, ch);
        seaGrad.addColorStop(0.0, '#446380');
        seaGrad.addColorStop(0.45, '#3b5a78');
        seaGrad.addColorStop(1.0, '#2e4963');
        ctx.fillStyle = seaGrad;
        ctx.fillRect(0, horizonY, cw, ch - horizonY);

        // 海面金色鋸齒波光倒影 (隨時間微幅波光粼粼)
        const shimmerWave = Math.sin(performance.now() * 0.003) * 2.5;
        const reflectGrad = ctx.createLinearGradient(sunX, horizonY, sunX, horizonY + ch * 0.14);
        reflectGrad.addColorStop(0.0, '#fbbd47');
        reflectGrad.addColorStop(0.6, '#f69e3c');
        reflectGrad.addColorStop(1.0, 'rgba(246, 158, 60, 0)');
        ctx.fillStyle = reflectGrad;

        ctx.beginPath();
        const rTopY = horizonY + 1;
        ctx.moveTo(sunX - sunRadius * 0.95, rTopY);
        ctx.lineTo(sunX + sunRadius * 0.95, rTopY);
        ctx.lineTo(sunX + sunRadius * 0.55 + shimmerWave, rTopY + ch * 0.018);
        ctx.lineTo(sunX + sunRadius * 0.88 - shimmerWave, rTopY + ch * 0.032);
        ctx.lineTo(sunX + sunRadius * 0.42 + shimmerWave, rTopY + ch * 0.048);
        ctx.lineTo(sunX + sunRadius * 0.92 - shimmerWave, rTopY + ch * 0.064);
        ctx.lineTo(sunX + sunRadius * 0.18 + shimmerWave, rTopY + ch * 0.082);
        ctx.lineTo(sunX + sunRadius * 0.48, rTopY + ch * 0.098);
        ctx.lineTo(sunX - sunRadius * 0.25, rTopY + ch * 0.112);
        ctx.lineTo(sunX - sunRadius * 0.05, rTopY + ch * 0.085);
        ctx.lineTo(sunX - sunRadius * 0.82 - shimmerWave, rTopY + ch * 0.068);
        ctx.lineTo(sunX - sunRadius * 0.35 + shimmerWave, rTopY + ch * 0.050);
        ctx.lineTo(sunX - sunRadius * 0.92 + shimmerWave, rTopY + ch * 0.034);
        ctx.lineTo(sunX - sunRadius * 0.48 - shimmerWave, rTopY + ch * 0.018);
        ctx.closePath();
        ctx.fill();

        // 海面微細白色波浪線條
        ctx.strokeStyle = 'rgba(215, 232, 248, 0.38)';
        ctx.lineWidth = 1.3;
        const seaLines = [
          { x: 0.05, y: 0.37, len: 0.08 },
          { x: 0.02, y: 0.46, len: 0.11 },
          { x: 0.04, y: 0.58, len: 0.07 },
          { x: 0.18, y: 0.42, len: 0.06 }
        ];
        seaLines.forEach((wl) => {
          ctx.beginPath();
          ctx.moveTo(wl.x * cw, wl.y * ch);
          ctx.quadraticCurveTo((wl.x + wl.len * 0.5) * cw, (wl.y - 0.008) * ch, (wl.x + wl.len) * cw, wl.y * ch);
          ctx.stroke();
        });
      }

      // 2. 繪製海岸岩石、白色浪花、翠綠山坡與彎曲單車道公路
      function drawWindingCoastalRoadAndCliffs() {
        const horizonY = ch * 0.255;
        const steps = 64;
        const leftPoints = [];
        const rightPoints = [];
        const centerPoints = [];

        for (let i = 0; i <= steps; i++) {
          const z = i / steps;
          const pLeft = projectRoad(z, -1);
          const pRight = projectRoad(z, 1);
          const pCenter = projectRoad(z, 0);
          leftPoints.push(pLeft);
          rightPoints.push(pRight);
          centerPoints.push(pCenter);
        }

        // (A) 公路左側：金黃色陽光沙灘與草坡路肩
        // 外側受夕陽照耀的亮金黃色沙灘灣岸 (隨車子前進而向後退)
        const outerBeachGrad = ctx.createLinearGradient(cw * 0.15, horizonY, cw * 0.48, ch);
        outerBeachGrad.addColorStop(0.0, '#fde078');
        outerBeachGrad.addColorStop(0.5, '#f6c453');
        outerBeachGrad.addColorStop(1.0, '#eab042');
        ctx.fillStyle = outerBeachGrad;
        ctx.beginPath();
        ctx.moveTo(cw * 0.34, horizonY);
        for (let i = 0; i <= steps; i++) {
          const z = i / steps;
          const p = leftPoints[i];
          const waveJut = Math.sin(z * 19 - state.roadScroll * 2.2) * (8 * p.scale);
          const cliffWidth = (18 + 68 * Math.pow(z, 1.1)) + waveJut;
          ctx.lineTo(p.x - cliffWidth - 5 * p.scale, p.y);
        }
        ctx.lineTo(cw * 0.5, ch + 10);
        ctx.lineTo(cw * 0.47, horizonY);
        ctx.closePath();
        ctx.fill();

        // 內側暖金黃色沙灘坡面 (與外側亮金沙灘交織出自然海岸沙灘層次)
        const innerBeachGrad = ctx.createLinearGradient(cw * 0.22, horizonY, cw * 0.50, ch);
        innerBeachGrad.addColorStop(0.0, '#f4be52');
        innerBeachGrad.addColorStop(0.5, '#e8a93f');
        innerBeachGrad.addColorStop(1.0, '#d89632');
        ctx.fillStyle = innerBeachGrad;
        ctx.beginPath();
        ctx.moveTo(cw * 0.36, horizonY);
        for (let i = 0; i <= steps; i++) {
          const z = i / steps;
          const p = leftPoints[i];
          const rockJut = Math.sin(z * 15) * (10 * p.scale);
          const cliffWidth = (14 + 58 * Math.pow(z, 1.1)) + rockJut;
          ctx.lineTo(p.x - cliffWidth, p.y);
        }
        ctx.lineTo(leftPoints[steps].x, ch + 10);
        ctx.lineTo(leftPoints[0].x, horizonY);
        ctx.closePath();
        ctx.fill();

        // 左側翠綠草坡路肩 (貼合彎道左緣)
        ctx.fillStyle = '#569434';
        ctx.beginPath();
        ctx.moveTo(leftPoints[0].x - 6, horizonY);
        for (let i = 0; i <= steps; i++) {
          const z = i / steps;
          const p = leftPoints[i];
          const grassW = 8 + 26 * Math.pow(z, 1.2);
          ctx.lineTo(p.x - grassW, p.y);
        }
        for (let i = steps; i >= 0; i--) {
          ctx.lineTo(leftPoints[i].x, leftPoints[i].y);
        }
        ctx.closePath();
        ctx.fill();

        // (B) 公路右側：高聳翠綠立體多邊形海岸山脈與陡峭山壁 (如參考圖右上至右下)
        // 遠方海岬延伸至右上角山峰背景
        ctx.fillStyle = '#3d7927';
        ctx.beginPath();
        ctx.moveTo(cw * 0.33, horizonY);
        ctx.lineTo(cw * 0.46, horizonY * 0.76);
        ctx.lineTo(cw * 0.62, horizonY * 0.56);
        ctx.lineTo(cw * 0.80, horizonY * 0.28);
        ctx.lineTo(cw * 0.96, 0);
        ctx.lineTo(cw, 0);
        ctx.lineTo(cw, ch);
        ctx.lineTo(rightPoints[steps].x, ch);
        for (let i = steps; i >= 0; i--) {
          ctx.lineTo(rightPoints[i].x, rightPoints[i].y);
        }
        ctx.closePath();
        ctx.fill();

        // 山脈受光亮綠坡面與深綠背光稜線多邊形 (重現參考圖的立體塊面感)
        const ridgeFacets = [
          // 遠處海岬亮面
          {
            color: '#5ca138',
            pts: [[0.34, 0.255], [0.46, 0.195], [0.53, 0.22], [0.45, 0.255]]
          },
          // 中景山脊亮面
          {
            color: '#4e8f30',
            pts: [[0.52, 0.22], [0.64, 0.14], [0.76, 0.19], [0.61, 0.29]]
          },
          // 右上主峰深綠背光陡坡
          {
            color: '#2a5a1a',
            pts: [[0.64, 0.14], [0.96, 0.0], [1.0, 0.0], [1.0, 0.42], [0.74, 0.33]]
          },
          // 右側中段受光亮綠山脊
          {
            color: '#529632',
            pts: [[0.72, 0.31], [1.0, 0.15], [1.0, 0.56], [0.80, 0.49]]
          },
          // 右側近景深綠峽谷陰影面
          {
            color: '#234c15',
            pts: [[0.74, 0.44], [1.0, 0.36], [1.0, 0.78], [0.85, 0.72]]
          },
          // 右下近景亮綠斜坡
          {
            color: '#4b8c2e',
            pts: [[0.82, 0.65], [1.0, 0.52], [1.0, 0.95], [0.91, 0.92]]
          }
        ];

        ridgeFacets.forEach((facet) => {
          ctx.fillStyle = facet.color;
          ctx.beginPath();
          facet.pts.forEach(([px, py], idx) => {
            if (idx === 0) ctx.moveTo(px * cw, py * ch);
            else ctx.lineTo(px * cw, py * ch);
          });
          ctx.closePath();
          ctx.fill();
        });

        // 右側緊貼公路的翠綠草坡路肩
        ctx.fillStyle = '#5ca138';
        ctx.beginPath();
        for (let i = 0; i <= steps; i++) {
          const p = rightPoints[i];
          if (i === 0) ctx.moveTo(p.x, p.y);
          else ctx.lineTo(p.x, p.y);
        }
        for (let i = steps; i >= 0; i--) {
          const z = i / steps;
          const p = rightPoints[i];
          const grassW = 6 + 22 * Math.pow(z, 1.2);
          ctx.lineTo(p.x + grassW, p.y);
        }
        ctx.closePath();
        ctx.fill();

        // (C) 繪製彎曲單車道柏油路面主體
        ctx.beginPath();
        for (let i = 0; i <= steps; i++) {
          const p = leftPoints[i];
          if (i === 0) ctx.moveTo(p.x, p.y);
          else ctx.lineTo(p.x, p.y);
        }
        for (let i = steps; i >= 0; i--) {
          const p = rightPoints[i];
          ctx.lineTo(p.x, p.y);
        }
        ctx.closePath();

        // 夕陽映照下的暖灰柏油路漸層 (左側受夕陽暖光，右側偏冷灰)
        const roadGrad = ctx.createLinearGradient(cw * 0.25, horizonY, cw * 0.85, ch);
        roadGrad.addColorStop(0.0, '#9e8d88');
        roadGrad.addColorStop(0.45, '#8a8589');
        roadGrad.addColorStop(1.0, '#757880');
        ctx.fillStyle = roadGrad;
        ctx.fill();

        // (D) 隨車速向後流動 (由遠方往畫面下方移動) 的路面橫向明暗速度帶與路肩反光柱
        for (let i = 0; i < steps; i++) {
          // 使用 i - state.roadScroll，使條紋隨 roadScroll 增加而往 i 變大處 (畫面下方) 移動，呈現馬路往後跑、車子往前衝的正確視覺！
          const scrollOffset = state.roadScroll * 18;
          const phase = Math.floor(((i - scrollOffset) % 2 + 2) % 2);

          if (phase === 0) {
            ctx.fillStyle = 'rgba(255, 245, 235, 0.055)';
            ctx.beginPath();
            ctx.moveTo(leftPoints[i].x, leftPoints[i].y);
            ctx.lineTo(rightPoints[i].x, rightPoints[i].y);
            ctx.lineTo(rightPoints[i + 1].x, rightPoints[i + 1].y);
            ctx.lineTo(leftPoints[i + 1].x, leftPoints[i + 1].y);
            ctx.closePath();
            ctx.fill();
          }

          // 路肩滾動反光柱 (同樣由遠方往畫面下方後退)
          const postPhase = Math.floor(((i - scrollOffset) % 4 + 4) % 4);
          if (postPhase === 0 && i > 4) {
            const s = leftPoints[i].scale;
            const postW = Math.max(1.5, 4.5 * s);
            const postH = Math.max(3, 11 * s);
            ctx.fillStyle = '#f8fafc';
            ctx.fillRect(leftPoints[i].x - postW * 2.2, leftPoints[i].y - postH, postW, postH);
            ctx.fillRect(rightPoints[i].x + postW * 1.2, rightPoints[i].y - postH, postW, postH);
            ctx.fillStyle = '#fb923c';
            ctx.fillRect(leftPoints[i].x - postW * 2.2, leftPoints[i].y - postH, postW, postH * 0.35);
            ctx.fillRect(rightPoints[i].x + postW * 1.2, rightPoints[i].y - postH, postW, postH * 0.35);
          }
        }

        // 單車道左右兩側清晰白色邊線 (如參考圖)
        [-0.88, 0.88].forEach((edgeOffset) => {
          ctx.beginPath();
          for (let i = 0; i <= steps; i++) {
            const z = i / steps;
            const p = projectRoad(z, edgeOffset);
            if (i === 0) ctx.moveTo(p.x, p.y);
            else ctx.lineTo(p.x, p.y);
          }
          ctx.strokeStyle = 'rgba(241, 245, 249, 0.9)';
          ctx.lineWidth = 2.4;
          ctx.stroke();
        });

        // (E) 繪製緊急煞車時的黑色輪胎煞車痕 (貼合彎道中心)
        for (const skid of state.skidMarks) {
          const pStart = projectRoad(Math.max(0.02, skid.z - skid.length), 0);
          const pEnd = projectRoad(Math.min(1.0, skid.z), 0);
          const tireOffset1 = pStart.roadWidth * 0.16;
          const tireOffset2 = pEnd.roadWidth * 0.16;
          const tireW = Math.max(2, 6 * pEnd.scale);

          ctx.strokeStyle = `rgba(20, 22, 26, ${skid.alpha})`;
          ctx.lineWidth = tireW;
          [-1, 1].forEach((side) => {
            ctx.beginPath();
            ctx.moveTo(pStart.x + side * tireOffset1, pStart.y);
            ctx.lineTo(pEnd.x + side * tireOffset2, pEnd.y);
            ctx.stroke();
          });
        }

        // (F) 在靠海岸的路邊（左側草坡路肩），間隔固定距離繪製隨車速往後移動的棕櫚樹
        drawCoastalPalmTrees();
      }

      // 繪製靠海岸路邊的棕櫚樹列（由遠至近排列，與路面滾動完全同步）
      function drawCoastalPalmTrees() {
        const treeCount = 4; // 沿海岸路邊等距分布 4 棵棕櫚樹
        const scrollZ = state.roadScroll * (18 / 64); // 與路面條紋及反光柱完全相同的推進速率
        const treeZList = [];

        for (let k = 0; k < treeCount; k++) {
          const rawZ = ((k / treeCount + scrollZ) % 1 + 1) % 1;
          // 映射至 z: 0.05 (遠方海岬起點) ~ 0.98 (畫面最下方)
          const z = 0.05 + rawZ * 0.93;
          treeZList.push({ z, seed: k });
        }

        // 由遠到近排序，確保近處的棕櫚樹自然覆蓋遠處
        treeZList.sort((a, b) => a.z - b.z);

        for (const item of treeZList) {
          drawSinglePalmTree(item.z, item.seed);
        }
      }

      function drawSinglePalmTree(z, seed) {
        const pLeft = projectRoad(z, -1);
        const s = pLeft.scale;
        if (s < 0.11) return;

        // 樹根立於靠海岸（左側）的草坡路肩上
        const baseX = pLeft.x - (10 + 16 * s);
        const baseY = pLeft.y + 2 * s;

        const trunkH = 118 * s;
        const trunkBaseW = 9.5 * s;
        const trunkTopW = 4.2 * s;

        // 樹幹自然向海風微彎的頂點座標
        const leanX = -14 * s + Math.sin(seed * 2.1) * 4 * s;
        const crownX = baseX + leanX;
        const crownY = baseY - trunkH;
        const ctrlX = baseX + leanX * 0.35;
        const ctrlY = baseY - trunkH * 0.52;

        ctx.save();

        // 1. 夕陽照射在路肩草坡上的棕櫚樹斜長暗影
        ctx.fillStyle = 'rgba(28, 48, 18, 0.38)';
        ctx.beginPath();
        ctx.ellipse(baseX + 12 * s, baseY + 2 * s, 16 * s, 4.5 * s, 0.15, 0, Math.PI * 2);
        ctx.fill();

        // 2. 彎曲棕櫚樹幹 (左側帶夕陽暖金亮邊，右側深棕立體陰影)
        ctx.beginPath();
        ctx.moveTo(baseX - trunkBaseW * 0.5, baseY);
        ctx.quadraticCurveTo(ctrlX - trunkTopW * 0.7, ctrlY, crownX - trunkTopW * 0.5, crownY);
        ctx.lineTo(crownX + trunkTopW * 0.5, crownY);
        ctx.quadraticCurveTo(ctrlX + trunkTopW * 0.7, ctrlY, baseX + trunkBaseW * 0.5, baseY);
        ctx.closePath();

        const trunkGrad = ctx.createLinearGradient(baseX - trunkBaseW, crownY, baseX + trunkBaseW, baseY);
        trunkGrad.addColorStop(0, '#d98a4e'); // 左側夕陽金棕受光面
        trunkGrad.addColorStop(0.45, '#8c5332');
        trunkGrad.addColorStop(1, '#4a2a18'); // 右側背光深褐
        ctx.fillStyle = trunkGrad;
        ctx.fill();

        // 樹幹環狀紋理節點
        ctx.strokeStyle = 'rgba(42, 22, 10, 0.45)';
        ctx.lineWidth = Math.max(0.8, 1.4 * s);
        for (let t = 0.15; t <= 0.88; t += 0.14) {
          const mt = 1 - t;
          const tx = mt * mt * baseX + 2 * mt * t * ctrlX + t * t * crownX;
          const ty = mt * mt * baseY + 2 * mt * t * ctrlY + t * t * crownY;
          const tw = (trunkBaseW * mt + trunkTopW * t) * 0.52;
          ctx.beginPath();
          ctx.moveTo(tx - tw, ty);
          ctx.lineTo(tx + tw, ty + 1.2 * s);
          ctx.stroke();
        }

        // 3. 樹冠頂部椰子果實
        ctx.fillStyle = '#4e2e16';
        [-3.2 * s, 2.5 * s, 0].forEach((ox, idx) => {
          ctx.beginPath();
          ctx.arc(crownX + ox, crownY + (2 + idx * 1.2) * s, 3.2 * s, 0, Math.PI * 2);
          ctx.fill();
        });

        // 4. 放射狀熱帶羽狀棕櫚葉 (7 片展開的弧形大葉片，受夕陽暖綠光澤映照)
        const fronds = [
          { angle: -2.65, len: 52, drop: 18, color: '#4d9129' },
          { angle: -2.15, len: 58, drop: 14, color: '#68ab38' },
          { angle: -1.55, len: 48, drop: 10, color: '#7bc043' },
          { angle: -0.85, len: 54, drop: 13, color: '#589c2f' },
          { angle: -0.25, len: 58, drop: 17, color: '#3b7520' },
          { angle:  0.28, len: 46, drop: 22, color: '#2d5e17' },
          { angle: -3.05, len: 44, drop: 24, color: '#3f7c22' }
        ];

        fronds.forEach((f) => {
          const rad = f.angle;
          const endX = crownX + Math.cos(rad) * f.len * s;
          const endY = crownY + Math.sin(rad) * f.len * 0.65 * s + f.drop * s;
          const midX = crownX + Math.cos(rad) * f.len * 0.52 * s;
          const midY = crownY + Math.sin(rad) * f.len * 0.42 * s - 9 * s;

          // 棕櫚葉受光羽片面
          ctx.fillStyle = f.color;
          ctx.beginPath();
          ctx.moveTo(crownX, crownY);
          ctx.quadraticCurveTo(midX, midY - 7 * s, endX, endY);
          ctx.quadraticCurveTo(midX, midY + 6 * s, crownX, crownY + 2 * s);
          ctx.closePath();
          ctx.fill();

          // 葉脈亮邊
          ctx.strokeStyle = 'rgba(210, 235, 130, 0.45)';
          ctx.lineWidth = Math.max(0.7, 1.3 * s);
          ctx.beginPath();
          ctx.moveTo(crownX, crownY);
          ctx.quadraticCurveTo(midX, midY - 1 * s, endX, endY);
          ctx.stroke();
        });

        ctx.restore();
      }

      // 繪製時速 >= 300 時車底 6 處噴射出的高壓濃密白煙（完全還原參考圖片：車身中段左右斜噴、後輪拱左右斜噴、車尾底部雙管直噴）
      function drawUnderbodyHoverWhiteSmoke(w, h, s, hoverAlpha) {
        if (hoverAlpha <= 0.01) return;
        const nowSec = performance.now() * 0.001;

        // 定義與參考圖片完全對應的 6 組車底白煙噴嘴
        const nozzles = [
          // 1. 左、右車身中段側向斜噴白煙 (由前葉子板後方車底斜向後外方噴射)
          { x0: -w * 0.42, y0: -h * 0.56, dx: -w * 0.64, dy: h * 0.54, baseR: 7 * s, endR: 24 * s, coreLen: 0.38 },
          { x0:  w * 0.42, y0: -h * 0.56, dx:  w * 0.64, dy: h * 0.54, baseR: 7 * s, endR: 24 * s, coreLen: 0.38 },
          // 2. 左、右後輪拱側向斜噴白煙 (由後葉子板下方斜向外後方噴射)
          { x0: -w * 0.45, y0: -h * 0.27, dx: -w * 0.62, dy: h * 0.36, baseR: 8 * s, endR: 25 * s, coreLen: 0.40 },
          { x0:  w * 0.45, y0: -h * 0.27, dx:  w * 0.62, dy: h * 0.36, baseR: 8 * s, endR: 25 * s, coreLen: 0.40 },
          // 3. 車尾底部擴散器左右雙管向下直噴濃烈白煙
          { x0: -w * 0.23, y0: -h * 0.05, dx: -w * 0.05, dy: h * 0.62, baseR: 8.5 * s, endR: 22 * s, coreLen: 0.45 },
          { x0:  w * 0.23, y0: -h * 0.05, dx:  w * 0.05, dy: h * 0.62, baseR: 8.5 * s, endR: 22 * s, coreLen: 0.45 }
        ];

        ctx.save();

        nozzles.forEach((nz, idx) => {
          const len = Math.hypot(nz.dx, nz.dy);
          const ux = nz.dx / len;
          const uy = nz.dy / len;
          // 法向量 (垂直於噴射方向)
          const nx = -uy;
          const ny = ux;

          const x1 = nz.x0 + nz.dx;
          const y1 = nz.y0 + nz.dy;

          // (A) 外層柔和擴散白霧錐體
          const plumeGrad = ctx.createLinearGradient(nz.x0, nz.y0, x1, y1);
          plumeGrad.addColorStop(0.00, `rgba(255, 255, 255, ${0.92 * hoverAlpha})`);
          plumeGrad.addColorStop(0.32, `rgba(236, 243, 252, ${0.68 * hoverAlpha})`);
          plumeGrad.addColorStop(0.70, `rgba(210, 222, 238, ${0.32 * hoverAlpha})`);
          plumeGrad.addColorStop(1.00, 'rgba(195, 210, 230, 0)');

          const flutter = Math.sin(nowSec * 22 + idx * 1.7) * 2.5 * s;
          ctx.fillStyle = plumeGrad;
          ctx.beginPath();
          ctx.moveTo(nz.x0 - nx * nz.baseR * 0.6, nz.y0 - ny * nz.baseR * 0.6);
          ctx.quadraticCurveTo(
            nz.x0 + nz.dx * 0.5 - nx * (nz.endR * 0.65) + flutter,
            nz.y0 + nz.dy * 0.5 - ny * (nz.endR * 0.65),
            x1 - nx * nz.endR + flutter,
            y1 - ny * nz.endR
          );
          ctx.lineTo(x1 + nx * nz.endR + flutter, y1 + ny * nz.endR);
          ctx.quadraticCurveTo(
            nz.x0 + nz.dx * 0.5 + nx * (nz.endR * 0.65) + flutter,
            nz.y0 + nz.dy * 0.5 + ny * (nz.endR * 0.65),
            nz.x0 + nx * nz.baseR * 0.6,
            nz.y0 + ny * nz.baseR * 0.6
          );
          ctx.closePath();
          ctx.fill();

          // (B) 高速流動的翻騰白煙雲團粒子 (營造真實噴射氣流白煙質感)
          const puffCount = 6;
          for (let p = 0; p < puffCount; p++) {
            const prog = ((nowSec * 3.8 + p / puffCount + idx * 0.19) % 1);
            const px = nz.x0 + nz.dx * prog + nx * Math.sin(prog * 9 + nowSec * 14 + idx) * (3.5 * s * prog);
            const py = nz.y0 + nz.dy * prog + ny * Math.cos(prog * 8 + nowSec * 12) * (2.0 * s * prog);
            const pr = nz.baseR * (1 - prog * 0.2) + nz.endR * prog * 0.95;
            const pAlpha = (1 - prog) * (0.58 * hoverAlpha);

            const puffGrad = ctx.createRadialGradient(px, py, pr * 0.1, px, py, pr);
            puffGrad.addColorStop(0.0, `rgba(255, 255, 255, ${pAlpha})`);
            puffGrad.addColorStop(0.55, `rgba(232, 240, 250, ${pAlpha * 0.55})`);
            puffGrad.addColorStop(1.0, 'rgba(210, 224, 240, 0)');

            ctx.fillStyle = puffGrad;
            ctx.beginPath();
            ctx.arc(px, py, pr, 0, Math.PI * 2);
            ctx.fill();
          }

          // (C) 噴嘴出口處的高亮度純白高壓氣柱核心 (如圖片噴口處刺眼白光核心)
          const coreEndX = nz.x0 + nz.dx * nz.coreLen;
          const coreEndY = nz.y0 + nz.dy * nz.coreLen;
          const coreGrad = ctx.createLinearGradient(nz.x0, nz.y0, coreEndX, coreEndY);
          coreGrad.addColorStop(0.0, `rgba(255, 255, 255, ${0.98 * hoverAlpha})`);
          coreGrad.addColorStop(0.6, `rgba(248, 252, 255, ${0.75 * hoverAlpha})`);
          coreGrad.addColorStop(1.0, 'rgba(255, 255, 255, 0)');

          ctx.fillStyle = coreGrad;
          ctx.beginPath();
          ctx.moveTo(nz.x0 - nx * nz.baseR * 0.48, nz.y0 - ny * nz.baseR * 0.48);
          ctx.lineTo(coreEndX - nx * nz.baseR * 0.95, coreEndY - ny * nz.baseR * 0.95);
          ctx.lineTo(coreEndX + nx * nz.baseR * 0.95, coreEndY + ny * nz.baseR * 0.95);
          ctx.lineTo(nz.x0 + nx * nz.baseR * 0.48, nz.y0 + ny * nz.baseR * 0.48);
          ctx.closePath();
          ctx.fill();
        });

        ctx.restore();
      }

      // 3. 繪製與參考圖片完全一致的玩家座駕：
      // 銀白色流線現代跑車 (當車速 >= 300 時，車底噴出白煙並升空離開路面約 5 米)
      function drawPlayerSilverSportsCar() {
        const proj = projectRoad(PLAYER_Z, 0);
        const s = proj.scale * 1.12;
        const w = 88 * s;
        const h = 122 * s;

        // 當車速為 0 時完全靜止，不產生引擎晃動
        const engineVibe =
          state.currentSpeed <= 0.5
            ? 0
            : Math.sin(performance.now() * 0.045) * (state.currentSpeed > 180 ? 1.2 : 0.45);

        // 當 hoverFactor > 0 (車速 >= 300) 時，車體向上抬升離開路面約 5 米 (視覺高度約 72*s 並帶輕微氣流懸浮浮動)
        const hoverBob = Math.sin(performance.now() * 0.0065) * 4.5 * s * state.hoverFactor;
        const hoverLiftY = 72 * s * state.hoverFactor + hoverBob;

        const x = proj.x;
        const groundY = proj.y + engineVibe * (1 - state.hoverFactor * 0.5);

        // 先在原本的馬路表面 (groundY) 繪製車影，讓車子升空時與地面陰影分離，清楚呈現「離開路面約 5 米」的立體騰空感！
        ctx.save();
        ctx.translate(x, groundY);

        // (1) 左側夕陽照射產生的右後方長斜向地面投影 (隨升空高度略微柔化偏移)
        ctx.save();
        const castShadowAlpha = 0.55 - 0.25 * state.hoverFactor;
        const shadowOffsetX = 16 * s * state.hoverFactor;
        ctx.translate(shadowOffsetX, 0);
        ctx.fillStyle = `rgba(64, 70, 82, ${castShadowAlpha})`;
        ctx.beginPath();
        ctx.moveTo(-w * 0.36, -h * 0.10);
        ctx.lineTo(w * 0.46, -h * 0.68);
        ctx.lineTo(w * 1.18, h * 0.36);
        ctx.quadraticCurveTo(w * 0.72, h * 0.52, w * 0.28, h * 0.42);
        ctx.closePath();
        ctx.fill();
        ctx.restore();

        // 路面正下方的車底暗影 (升空時留在路面上並略微縮小柔化)
        const groundShadowAlpha = 0.82 - 0.44 * state.hoverFactor;
        const groundShadowScale = 1 - 0.18 * state.hoverFactor;
        ctx.fillStyle = `rgba(15, 18, 24, ${groundShadowAlpha})`;
        ctx.beginPath();
        ctx.ellipse(0, -h * 0.42, w * 0.49 * groundShadowScale, h * 0.46 * groundShadowScale, 0, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();

        // 接著將畫布座標向上平移 hoverLiftY，繪製騰空或貼地的跑車本體與車底噴射白煙
        ctx.save();
        ctx.translate(x, groundY - hoverLiftY);
        // 車頭筆直朝向正上方 (不旋轉歪斜)

        // 當車速 >= 300 時，於車底繪製如參考圖片般的 6 道高壓濃烈白煙
        if (state.hoverFactor > 0.01) {
          drawUnderbodyHoverWhiteSmoke(w, h, s, state.hoverFactor);
        }

        // (2) 一般加速時車尾排氣氮氣藍火/熱流特效 (未進入白煙懸浮模式時顯示)
        if (state.hoverFactor < 0.25 && (state.nitroTimer > 0 || state.currentSpeed >= 165)) {
          const boostPower = state.nitroTimer > 0 ? 1.25 : Math.min(1.0, (state.currentSpeed - 150) / 140);
          const flicker = 0.8 + Math.random() * 0.4;
          const flameLen = (20 + 28 * boostPower) * flicker * s;

          [-w * 0.20, w * 0.20].forEach((ex) => {
            ctx.save();
            ctx.globalCompositeOperation = 'lighter';
            const flameGrad = ctx.createLinearGradient(ex, -h * 0.05, ex, -h * 0.05 + flameLen);
            flameGrad.addColorStop(0.0, 'rgba(255, 255, 255, 0.95)');
            flameGrad.addColorStop(0.3, 'rgba(56, 189, 248, 0.85)');
            flameGrad.addColorStop(1.0, 'rgba(249, 115, 22, 0)');
            ctx.fillStyle = flameGrad;
            ctx.beginPath();
            ctx.moveTo(ex - 5 * s, -h * 0.05);
            ctx.quadraticCurveTo(ex, -h * 0.05 + flameLen, ex + 5 * s, -h * 0.05);
            ctx.closePath();
            ctx.fill();
            ctx.restore();
          });
        }

        // (3) 四輪深黑性能胎
        ctx.fillStyle = '#12151a';
        // 左前輪與右前輪
        ctx.beginPath();
        ctx.roundRect(-w * 0.49, -h * 0.82, 10 * s, 24 * s, 3 * s);
        ctx.roundRect( w * 0.39, -h * 0.82, 10 * s, 24 * s, 3 * s);
        // 左後輪與右後輪
        ctx.roundRect(-w * 0.50, -h * 0.28, 12 * s, 26 * s, 3 * s);
        ctx.roundRect( w * 0.38, -h * 0.28, 12 * s, 26 * s, 3 * s);
        ctx.fill();

        // (4) 銀白色流線跑車主車身 (左側帶夕陽橘金暖光反射，右側為冷銀灰立體陰影，與圖片一致)
        const bodyGrad = ctx.createLinearGradient(-w * 0.52, -h * 0.6, w * 0.52, -h * 0.3);
        bodyGrad.addColorStop(0.00, '#f3a66f'); // 左側夕陽金橘反光邊
        bodyGrad.addColorStop(0.22, '#e5cfc2'); // 暖銀白過渡
        bodyGrad.addColorStop(0.50, '#d5dae0'); // 珍珠銀白主色
        bodyGrad.addColorStop(0.78, '#adb4be'); // 右側冷銀灰
        bodyGrad.addColorStop(1.00, '#7c8490'); // 右側背光深銀灰

        ctx.fillStyle = bodyGrad;
        ctx.beginPath();
        // 圓潤流線車頭前緣
        ctx.moveTo(-w * 0.34, -h * 0.94);
        ctx.quadraticCurveTo(0, -h * 0.99, w * 0.34, -h * 0.94);
        // 右側前葉子板與收腰車門
        ctx.bezierCurveTo(w * 0.48, -h * 0.86, w * 0.45, -h * 0.62, w * 0.43, -h * 0.48);
        // 右後寬體輪拱與車尾收束
        ctx.bezierCurveTo(w * 0.52, -h * 0.34, w * 0.50, -h * 0.14, w * 0.42, -h * 0.06);
        // 車尾平緩弧線
        ctx.quadraticCurveTo(0, -h * 0.02, -w * 0.42, -h * 0.06);
        // 左後寬體輪拱與收腰車門
        ctx.bezierCurveTo(-w * 0.50, -h * 0.14, -w * 0.52, -h * 0.34, -w * 0.43, -h * 0.48);
        ctx.bezierCurveTo(-w * 0.45, -h * 0.62, -w * 0.48, -h * 0.86, -w * 0.34, -h * 0.94);
        ctx.closePath();
        ctx.fill();

        // 左後葉子板夕陽強烈暖橘金受光塊面 (完全還原圖片車身左側橘金反光)
        const leftSunsetPatch = ctx.createLinearGradient(-w * 0.48, -h * 0.55, -w * 0.18, -h * 0.25);
        leftSunsetPatch.addColorStop(0, 'rgba(244, 150, 90, 0.85)');
        leftSunsetPatch.addColorStop(0.6, 'rgba(244, 165, 110, 0.35)');
        leftSunsetPatch.addColorStop(1, 'rgba(255, 255, 255, 0)');
        ctx.fillStyle = leftSunsetPatch;
        ctx.beginPath();
        ctx.moveTo(-w * 0.44, -h * 0.62);
        ctx.quadraticCurveTo(-w * 0.24, -h * 0.48, -w * 0.26, -h * 0.18);
        ctx.lineTo(-w * 0.45, -h * 0.16);
        ctx.quadraticCurveTo(-w * 0.50, -h * 0.38, -w * 0.44, -h * 0.62);
        ctx.closePath();
        ctx.fill();

        // 右後葉子板立體折線陰影面 (還原圖片車尾右側深灰折線)
        ctx.fillStyle = 'rgba(105, 113, 126, 0.68)';
        ctx.beginPath();
        ctx.moveTo(w * 0.28, -h * 0.44);
        ctx.quadraticCurveTo(w * 0.48, -h * 0.32, w * 0.44, -h * 0.14);
        ctx.lineTo(w * 0.24, -h * 0.16);
        ctx.closePath();
        ctx.fill();

        // (5) 水滴型全黑全景玻璃車頂與後擋風玻璃 (Teardrop Black Glass Canopy，圖片核心特徵)
        const canopyGrad = ctx.createLinearGradient(-w * 0.28, -h * 0.88, w * 0.25, -h * 0.28);
        canopyGrad.addColorStop(0.00, '#4a3531'); // 左緣微映夕陽暖色
        canopyGrad.addColorStop(0.28, '#181a20');
        canopyGrad.addColorStop(0.65, '#0b0d11');
        canopyGrad.addColorStop(1.00, '#07080b');

        ctx.fillStyle = canopyGrad;
        ctx.beginPath();
        // 前擋上緣寬弧
        ctx.moveTo(-w * 0.26, -h * 0.86);
        ctx.quadraticCurveTo(0, -h * 0.91, w * 0.26, -h * 0.86);
        // 向車尾優雅收窄成水滴梯形
        ctx.bezierCurveTo(w * 0.27, -h * 0.64, w * 0.20, -h * 0.42, w * 0.15, -h * 0.29);
        ctx.quadraticCurveTo(0, -h * 0.27, -w * 0.15, -h * 0.29);
        ctx.bezierCurveTo(-w * 0.20, -h * 0.42, -w * 0.27, -h * 0.64, -w * 0.26, -h * 0.86);
        ctx.closePath();
        ctx.fill();

        // 左右兩側深色狹長側窗 (Side Windows)
        ctx.fillStyle = '#14171d';
        // 左側窗
        ctx.beginPath();
        ctx.moveTo(-w * 0.31, -h * 0.78);
        ctx.lineTo(-w * 0.27, -h * 0.50);
        ctx.lineTo(-w * 0.35, -h * 0.46);
        ctx.quadraticCurveTo(-w * 0.38, -h * 0.64, -w * 0.31, -h * 0.78);
        ctx.closePath();
        ctx.fill();

        // 右側窗
        ctx.beginPath();
        ctx.moveTo(w * 0.31, -h * 0.78);
        ctx.lineTo(w * 0.27, -h * 0.50);
        ctx.lineTo(w * 0.35, -h * 0.46);
        ctx.quadraticCurveTo(w * 0.38, -h * 0.64, w * 0.31, -h * 0.78);
        ctx.closePath();
        ctx.fill();

        // 車頂玻璃中央縱向微高光分線 (如圖片車頂細節)
        ctx.strokeStyle = 'rgba(255, 255, 255, 0.14)';
        ctx.lineWidth = 1.2 * s;
        ctx.beginPath();
        ctx.moveTo(0, -h * 0.88);
        ctx.lineTo(0, -h * 0.30);
        ctx.stroke();

        // (6) 車尾深炭灰下擾流保險桿 (Dark Rear Diffuser Bumper)
        ctx.fillStyle = '#25282e';
        ctx.beginPath();
        ctx.moveTo(-w * 0.43, -h * 0.14);
        ctx.quadraticCurveTo(0, -h * 0.11, w * 0.43, -h * 0.14);
        ctx.lineTo(w * 0.40, -h * 0.05);
        ctx.quadraticCurveTo(0, -h * 0.01, -w * 0.40, -h * 0.05);
        ctx.closePath();
        ctx.fill();

        // 下擾流底部黑色擴散器與雙分流鰭片
        ctx.fillStyle = '#111317';
        ctx.beginPath();
        ctx.roundRect(-w * 0.32, -h * 0.08, w * 0.64, 6.5 * s, 2 * s);
        ctx.fill();
        ctx.fillRect(-w * 0.22, -h * 0.03, 3.5 * s, 5 * s);
        ctx.fillRect( w * 0.19, -h * 0.03, 3.5 * s, 5 * s);

        // (7) 貫穿式細長紅色 LED 尾燈條 (Continuous Horizontal Red Taillight Bar，如圖片車尾)
        const isBraking = state.brakeTimer > 0;
        ctx.strokeStyle = isBraking ? '#ff1e38' : '#b92b2b';
        ctx.lineWidth = (isBraking ? 4.2 : 3.0) * s;
        if (isBraking) {
          ctx.shadowColor = '#ff1e38';
          ctx.shadowBlur = 14 * s;
        }
        ctx.beginPath();
        ctx.moveTo(-w * 0.38, -h * 0.17);
        ctx.quadraticCurveTo(0, -h * 0.145, w * 0.38, -h * 0.17);
        ctx.stroke();
        ctx.shadowBlur = 0;

        ctx.restore();
      }

      // ======================== HUD 更新與流程控制 ========================
      function updateQuestionTimerUI() {
        const ratio = Math.max(0, Math.min(1, state.questionTimeLeft / QUESTION_DURATION));
        qTimerBar.style.transform = `scaleX(${ratio})`;

        // 隨剩餘時間自動由綠 -> 黃橘 -> 紅變色
        if (ratio > 0.5) {
          qTimerBar.style.background = 'linear-gradient(90deg, #00e676 0%, #69f0ae 100%)';
          qTimerBar.style.boxShadow = '0 0 12px rgba(0, 230, 118, 0.85)';
        } else if (ratio > 0.25) {
          qTimerBar.style.background = 'linear-gradient(90deg, #ffab00 0%, #ffea00 100%)';
          qTimerBar.style.boxShadow = '0 0 12px rgba(255, 214, 0, 0.85)';
        } else {
          qTimerBar.style.background = 'linear-gradient(90deg, #ff1744 0%, #ff5252 100%)';
          qTimerBar.style.boxShadow = '0 0 14px rgba(255, 23, 68, 0.95)';
        }
      }

      function updateHudUI() {
        raceTimeVal.textContent = state.raceTimeLeft.toFixed(1);
        if (state.raceTimeLeft <= 5.0 && state.phase === 'RACING') {
          raceTimeVal.classList.add('urgent');
        } else {
          raceTimeVal.classList.remove('urgent');
        }

        // 到達終點時 (FINISHING / ENDED) 保持顯示衝線時的最後速度，不因終點後減速而歸零
        if (state.phase === 'FINISHING' || state.phase === 'ENDED') {
          speedVal.textContent = state.finalSpeed;
        } else {
          speedVal.textContent = Math.round(state.currentSpeed);
        }
      }

      function showCountdownBanner(text) {
        countdownBanner.className = 'countdown-banner';
        void countdownBanner.offsetWidth;
        countdownBanner.textContent = text;
        if (text === 'START!') {
          countdownBanner.classList.add('start-go');
        } else {
          countdownBanner.classList.add('num-countdown');
        }
        countdownBanner.classList.add('pop');
      }

      // 遊戲結束前最後 3 秒倒數：播放 321 提示音效，且左上方時間數字瞬間放大 50% 再縮回（畫面中間不顯示數字）
      function triggerFinalCountdown(sec) {
        sound.playCountdownBeep(false);
        raceTimeVal.classList.remove('time-pop');
        void raceTimeVal.offsetWidth;
        raceTimeVal.classList.add('time-pop');
      }

      // 起跑倒數 3 -> 2 -> 1 -> START! (每步 1 秒，共 3 秒倒數)
      function runCountdown321() {
        const steps = ['3', '2', '1', 'START!'];
        steps.forEach((label, idx) => {
          const tid = setTimeout(() => {
            showCountdownBanner(label);
            sound.playCountdownBeep(label === 'START!');
            if (label === 'START!') {
              // 倒數完 3 秒（首次開始對應音樂第 6 秒），遊戲正式開始，音樂音量從頭到尾維持 30%
              sound.setGameVolumeMultiplier(1.0);
              state.phase = 'RACING';
              state.currentSpeed = INITIAL_SPEED;
              state.finalSpeed = INITIAL_SPEED;
              generateQuestion();
              questionCockpit.classList.remove('hidden');
            }
          }, idx * 1000);
          countdownTimers.push(tid);
        });
      }

      // 啟動比賽流程：首次開始 (isReplay = false) 先以 50% 音量純開車 3 秒，第 3 秒降為 20% 並倒數 321，第 6 秒開始；
      // 重新開始 (isReplay = true) 不重播音樂、直接將音量調回 20% 並立即倒數 321 開始遊戲
      function startRaceFlow(isReplay = false) {
        sound.init();
        sound.setGameVolumeMultiplier(0.5);
        sound.startEngineAtSpeed(INITIAL_SPEED);
        if (document.activeElement && typeof document.activeElement.blur === 'function') {
          document.activeElement.blur();
        }
        countdownTimers.forEach((tid) => clearTimeout(tid));
        countdownTimers = [];
        countdownBanner.className = 'countdown-banner';
        raceTimeVal.classList.remove('time-pop');

        startModal.classList.add('hidden');
        resultModal.classList.add('hidden');
        questionCockpit.classList.add('hidden');
        hudSpeedometer.classList.remove('hidden');
        hudTimeBadge.classList.remove('hidden');

        state.phase = 'COUNTDOWN';
        state.raceTimeLeft = GAME_DURATION;
        state.questionTimeLeft = QUESTION_DURATION;
        state.lastCountdownBeepSec = 0;
        state.targetSpeed = INITIAL_SPEED;
        state.currentSpeed = INITIAL_SPEED;
        state.finalSpeed = INITIAL_SPEED;
        state.topSpeed = INITIAL_SPEED;
        state.correctCount = 0;
        state.wrongCount = 0;
        state.combo = 0;
        state.finishGateZ = -1;
        state.finishSoundPlayed = false;
        state.hoverFactor = 0;
        state.skidMarks = [];
        qAnswerSlot.textContent = '?';
        updateHudUI();
        updateQuestionTimerUI();

        if (!isReplay) {
          // 首次按下開始遊戲：從頭播放音樂 (維持 20% 音量)，前 3 秒畫面無題目、無標題、不倒數，單純讓車子往前開
          sound.startBGM(0.2, true);
          const introTid = setTimeout(() => {
            // 音樂播放到 3 秒時，開始倒數 321 (倒數 3 秒後於第 6 秒正式開始)，背景音樂持續維持 20% 音量
            sound.setBgmVolume(0.2, false, 1000);
            runCountdown321();
          }, 3000);
          countdownTimers.push(introTid);
        } else {
          // 遊戲結束後按下重新開始：不重新播放音樂（持續播放），維持 20% 音量，不用等秒數直接倒數 321
          sound.tryPlayBgm();
          sound.setBgmVolume(0.2, false, 1000);
          runCountdown321();
        }
      }

      function showResultScreen() {
        state.phase = 'ENDED';
        countdownBanner.className = 'countdown-banner';
        raceTimeVal.classList.remove('time-pop');
        // 遊戲結束介面出現時，降低整體音效輸出 50%，背景音樂持續以 20% 音量播放
        sound.setGameVolumeMultiplier(0.5);
        sound.setBgmVolume(0.2, false, 1000);
        questionCockpit.classList.add('hidden');
        resCorrect.textContent = `${state.correctCount} 題`;
        resWrong.textContent = `${state.wrongCount} 題`;
        resTopSpeed.textContent = `${Math.round(state.topSpeed)} km/h`;
        resultModal.classList.remove('hidden');
      }

      // ======================== 主遊戲迴圈 (60fps 更新與渲染) ========================
      let lastTime = performance.now();
      let loopErrorCount = 0;

      // 防當機保護：任何單一幀發生例外都不會中斷 requestAnimationFrame 迴圈 (避免「畫面卡住但聲音還在跑」)
      function gameLoop(now) {
        requestAnimationFrame(gameLoop);
        try {
          gameLoopStep(now);
        } catch (err) {
          loopErrorCount++;
          if (loopErrorCount <= 5) {
            console.error('[Speed99] gameLoop error (frame skipped):', err);
          }
          // 復原畫布狀態 (清空可能未配對的 save/clip/transform)，下一幀即可正常繪製
          for (let i = 0; i < 64; i++) ctx.restore();
          ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
          ctx.globalAlpha = 1;
          ctx.globalCompositeOperation = 'source-over';
        }
      }

      function gameLoopStep(now) {
        const dt = Math.max(0, Math.min(0.05, (now - lastTime) / 1000));
        lastTime = now;

        if (state.phase === 'RACING') {
          state.currentSpeed += (state.targetSpeed - state.currentSpeed) * Math.min(1, dt * 7);
          if (state.targetSpeed === 0 && state.currentSpeed < 0.8) {
            state.currentSpeed = 0;
          }
          state.finalSpeed = Math.round(state.targetSpeed);
          state.raceTimeLeft = Math.max(0, state.raceTimeLeft - dt);

          // 遊戲時間剩最後三秒的時候，依序倒數 3、2、1，伴隨音效與時間數字瞬間放大 50% 再縮回
          if (state.raceTimeLeft <= 3.0 && state.raceTimeLeft > 0) {
            const sec = Math.ceil(state.raceTimeLeft);
            if (sec >= 1 && sec <= 3 && state.lastCountdownBeepSec !== sec) {
              state.lastCountdownBeepSec = sec;
              triggerFinalCountdown(sec);
            }
          }

          if (!state.inputLocked) {
            state.questionTimeLeft -= dt;
            if (state.questionTimeLeft <= 0) {
              state.questionTimeLeft = 0;
              handleWrongOrTimeout(true);
            }
            updateQuestionTimerUI();
          }

          if (state.raceTimeLeft <= 0) {
            state.finalSpeed = Math.round(state.targetSpeed);
            state.currentSpeed = state.targetSpeed;
            state.inputLocked = true;
            // 先切換結算畫面，再播放歡呼音效；音效出錯也不影響遊戲流程
            showResultScreen();
            if (!state.finishSoundPlayed) {
              state.finishSoundPlayed = true;
              try {
                sound.playFinishFanfare();
              } catch (err) {
                console.error('[Speed99] playFinishFanfare error:', err);
              }
            }
          }
        } else if (state.phase === 'ENDED') {
          // 通關後遊戲畫面持續進行，維持遊戲結束前的車速與行駛狀態
          state.currentSpeed = state.targetSpeed;
        }

        if (state.nitroTimer > 0) state.nitroTimer = Math.max(0, state.nitroTimer - dt);
        if (state.brakeTimer > 0) state.brakeTimer = Math.max(0, state.brakeTimer - dt);

        // 當車子時速 >= 300 時，平滑升空離開路面約 5 米並噴出白煙；若低於 300 則平滑降回原本貼地狀態
        const wantHover = state.targetSpeed >= 300 ? 1.0 : 0.0;
        state.hoverFactor += (wantHover - state.hoverFactor) * Math.min(1, dt * 5.5);
        if (state.hoverFactor < 0.005) state.hoverFactor = 0;
        if (state.hoverFactor > 0.995) state.hoverFactor = 1;
        floatingFeedback.style.top = state.hoverFactor > 0.3 ? '30%' : '42%';

        // 依據目前的速度，再將畫面行進的速度感提升兩倍 (由 / 60 提升為 / 30)
        state.roadScroll += (state.currentSpeed / 30) * dt;

        for (let i = state.skidMarks.length - 1; i >= 0; i--) {
          const skid = state.skidMarks[i];
          skid.z += (state.currentSpeed / 60) * dt;
          skid.alpha -= dt * 0.7;
          if (skid.z > 1.15 || skid.alpha <= 0) {
            state.skidMarks.splice(i, 1);
          }
        }

        updateHudUI();

        // 畫面渲染
        ctx.clearRect(0, 0, cw, ch);
        drawCoastalSunsetEnvironment();
        drawWindingCoastalRoadAndCliffs();

        // 路上只剩玩家的銀白色跑車
        drawPlayerSilverSportsCar();
      }

      // ======================== 雙重操作綁定 (觸控/滑鼠 + 電腦實體鍵盤) ========================
      function flashKeyVisual(buttonEl) {
        if (!buttonEl) return;
        buttonEl.classList.add('pressed');
        setTimeout(() => buttonEl.classList.remove('pressed'), 110);
      }

      digitButtons.forEach((btn) => {
        btn.addEventListener('pointerdown', (e) => {
          e.preventDefault();
          const digit = btn.getAttribute('data-digit');
          flashKeyVisual(btn);
          handleDigitInput(digit);
        });
      });

      window.addEventListener('keydown', (e) => {
        if (e.repeat) return;

        if (e.key >= '0' && e.key <= '9') {
          e.preventDefault();
          const targetBtn = document.querySelector(`.mech-key[data-digit="${e.key}"]`);
          flashKeyVisual(targetBtn);
          handleDigitInput(e.key);
        } else if (e.key === 'Backspace' || e.key === 'Delete' || e.key === 'Escape') {
          e.preventDefault();
          handleClearInput();
        } else if (e.code === 'Space' || e.key === ' ' || e.key === 'Spacebar' || e.key === 'Enter') {
          if (state.phase === 'IDLE') {
            e.preventDefault();
            startRaceFlow(false);
          } else if (state.phase === 'ENDED' || state.phase === 'FINISHING') {
            e.preventDefault();
            startRaceFlow(true);
          }
        }
      });

      startRaceBtn.addEventListener('click', () => startRaceFlow(false));
      replayBtn.addEventListener('click', () => startRaceFlow(true));

      requestAnimationFrame(gameLoop);
    })();
  </script>
</body>
</html>
