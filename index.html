          { x0:  w * 0.23, y0: -h * 0.05, dx:  w * 0.05, dy: h * 0.62, baseR: 8.5 * s, endR: 22 * s, coreLen: 0.45 }
        ];

        ctx.save();

        nozzles.forEach((nz, idx) => {
          const len = Math.hypot(nz.dx, nz.dy);
          const ux = nz.dx / len;
          const uy = nz.dy / len;
          // 法向量 (垂直於噴射方向)
          const nx = -uy;
          const ny = ux;

          const x1 = nz.x0 + nz.dx;
          const y1 = nz.y0 + nz.dy;

          // (A) 外層柔和擴散白霧錐體
          const plumeGrad = ctx.createLinearGradient(nz.x0, nz.y0, x1, y1);
          plumeGrad.addColorStop(0.00, `rgba(255, 255, 255, ${0.92 * hoverAlpha})`);
          plumeGrad.addColorStop(0.32, `rgba(236, 243, 252, ${0.68 * hoverAlpha})`);
          plumeGrad.addColorStop(0.70, `rgba(210, 222, 238, ${0.32 * hoverAlpha})`);
          plumeGrad.addColorStop(1.00, 'rgba(195, 210, 230, 0)');

          const flutter = Math.sin(nowSec * 22 + idx * 1.7) * 2.5 * s;
          ctx.fillStyle = plumeGrad;
          ctx.beginPath();
          ctx.moveTo(nz.x0 - nx * nz.baseR * 0.6, nz.y0 - ny * nz.baseR * 0.6);
          ctx.quadraticCurveTo(
            nz.x0 + nz.dx * 0.5 - nx * (nz.endR * 0.65) + flutter,
            nz.y0 + nz.dy * 0.5 - ny * (nz.endR * 0.65),
            x1 - nx * nz.endR + flutter,
            y1 - ny * nz.endR
          );
          ctx.lineTo(x1 + nx * nz.endR + flutter, y1 + ny * nz.endR);
          ctx.quadraticCurveTo(
            nz.x0 + nz.dx * 0.5 + nx * (nz.endR * 0.65) + flutter,
            nz.y0 + nz.dy * 0.5 + ny * (nz.endR * 0.65),
            nz.x0 + nx * nz.baseR * 0.6,
            nz.y0 + ny * nz.baseR * 0.6
          );
          ctx.closePath();
          ctx.fill();

          // (B) 高速流動的翻騰白煙雲團粒子 (營造真實噴射氣流白煙質感)
          const puffCount = 6;
          for (let p = 0; p < puffCount; p++) {
            const prog = ((nowSec * 3.8 + p / puffCount + idx * 0.19) % 1);
            const px = nz.x0 + nz.dx * prog + nx * Math.sin(prog * 9 + nowSec * 14 + idx) * (3.5 * s * prog);
            const py = nz.y0 + nz.dy * prog + ny * Math.cos(prog * 8 + nowSec * 12) * (2.0 * s * prog);
            const pr = nz.baseR * (1 - prog * 0.2) + nz.endR * prog * 0.95;
            const pAlpha = (1 - prog) * (0.58 * hoverAlpha);

            const puffGrad = ctx.createRadialGradient(px, py, pr * 0.1, px, py, pr);
            puffGrad.addColorStop(0.0, `rgba(255, 255, 255, ${pAlpha})`);
            puffGrad.addColorStop(0.55, `rgba(232, 240, 250, ${pAlpha * 0.55})`);
            puffGrad.addColorStop(1.0, 'rgba(210, 224, 240, 0)');

            ctx.fillStyle = puffGrad;
            ctx.beginPath();
            ctx.arc(px, py, pr, 0, Math.PI * 2);
            ctx.fill();
          }

          // (C) 噴嘴出口處的高亮度純白高壓氣柱核心 (如圖片噴口處刺眼白光核心)
          const coreEndX = nz.x0 + nz.dx * nz.coreLen;
          const coreEndY = nz.y0 + nz.dy * nz.coreLen;
          const coreGrad = ctx.createLinearGradient(nz.x0, nz.y0, coreEndX, coreEndY);
          coreGrad.addColorStop(0.0, `rgba(255, 255, 255, ${0.98 * hoverAlpha})`);
          coreGrad.addColorStop(0.6, `rgba(248, 252, 255, ${0.75 * hoverAlpha})`);
          coreGrad.addColorStop(1.0, 'rgba(255, 255, 255, 0)');

          ctx.fillStyle = coreGrad;
          ctx.beginPath();
          ctx.moveTo(nz.x0 - nx * nz.baseR * 0.48, nz.y0 - ny * nz.baseR * 0.48);
          ctx.lineTo(coreEndX - nx * nz.baseR * 0.95, coreEndY - ny * nz.baseR * 0.95);
          ctx.lineTo(coreEndX + nx * nz.baseR * 0.95, coreEndY + ny * nz.baseR * 0.95);
          ctx.lineTo(nz.x0 + nx * nz.baseR * 0.48, nz.y0 + ny * nz.baseR * 0.48);
          ctx.closePath();
          ctx.fill();
        });

        ctx.restore();
      }

      // 3. 繪製與參考圖片完全一致的玩家座駕：
      // 銀白色流線現代跑車 (當車速 >= 300 時，車底噴出白煙並升空離開路面約 5 米)
      function drawPlayerSilverSportsCar() {
        const proj = projectRoad(PLAYER_Z, 0);
        const s = proj.scale * 1.12;
        const w = 88 * s;
        const h = 122 * s;

        // 當車速為 0 時完全靜止，不產生引擎晃動
        const engineVibe =
          state.currentSpeed <= 0.5
            ? 0
            : Math.sin(performance.now() * 0.045) * (state.currentSpeed > 180 ? 1.2 : 0.45);

        // 當 hoverFactor > 0 (車速 >= 300) 時，車體向上抬升離開路面約 5 米 (視覺高度約 72*s 並帶輕微氣流懸浮浮動)
        const hoverBob = Math.sin(performance.now() * 0.0065) * 4.5 * s * state.hoverFactor;
        const hoverLiftY = 72 * s * state.hoverFactor + hoverBob;

        const x = proj.x;
        const groundY = proj.y + engineVibe * (1 - state.hoverFactor * 0.5);

        // 先在原本的馬路表面 (groundY) 繪製車影，讓車子升空時與地面陰影分離，清楚呈現「離開路面約 5 米」的立體騰空感！
        ctx.save();
        ctx.translate(x, groundY);

        // (1) 左側夕陽照射產生的右後方長斜向地面投影 (隨升空高度略微柔化偏移)
        ctx.save();
        const castShadowAlpha = 0.55 - 0.25 * state.hoverFactor;
        const shadowOffsetX = 16 * s * state.hoverFactor;
        ctx.translate(shadowOffsetX, 0);
        ctx.fillStyle = `rgba(64, 70, 82, ${castShadowAlpha})`;
        ctx.beginPath();
        ctx.moveTo(-w * 0.36, -h * 0.10);
        ctx.lineTo(w * 0.46, -h * 0.68);
        ctx.lineTo(w * 1.18, h * 0.36);
        ctx.quadraticCurveTo(w * 0.72, h * 0.52, w * 0.28, h * 0.42);
        ctx.closePath();
        ctx.fill();
        ctx.restore();

        // 路面正下方的車底暗影 (升空時留在路面上並略微縮小柔化)
        const groundShadowAlpha = 0.82 - 0.44 * state.hoverFactor;
        const groundShadowScale = 1 - 0.18 * state.hoverFactor;
        ctx.fillStyle = `rgba(15, 18, 24, ${groundShadowAlpha})`;
        ctx.beginPath();
        ctx.ellipse(0, -h * 0.42, w * 0.49 * groundShadowScale, h * 0.46 * groundShadowScale, 0, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();

        // 接著將畫布座標向上平移 hoverLiftY，繪製騰空或貼地的跑車本體與車底噴射白煙
        ctx.save();
        ctx.translate(x, groundY - hoverLiftY);
        // 車頭筆直朝向正上方 (不旋轉歪斜)

        // 當車速 >= 300 時，於車底繪製如參考圖片般的 6 道高壓濃烈白煙
        if (state.hoverFactor > 0.01) {
          drawUnderbodyHoverWhiteSmoke(w, h, s, state.hoverFactor);
        }

        // (2) 一般加速時車尾排氣氮氣藍火/熱流特效 (未進入白煙懸浮模式時顯示)
        if (state.hoverFactor < 0.25 && (state.nitroTimer > 0 || state.currentSpeed >= 165)) {
          const boostPower = state.nitroTimer > 0 ? 1.25 : Math.min(1.0, (state.currentSpeed - 150) / 140);
          const flicker = 0.8 + Math.random() * 0.4;
          const flameLen = (20 + 28 * boostPower) * flicker * s;

          [-w * 0.20, w * 0.20].forEach((ex) => {
            ctx.save();
            ctx.globalCompositeOperation = 'lighter';
            const flameGrad = ctx.createLinearGradient(ex, -h * 0.05, ex, -h * 0.05 + flameLen);
            flameGrad.addColorStop(0.0, 'rgba(255, 255, 255, 0.95)');
            flameGrad.addColorStop(0.3, 'rgba(56, 189, 248, 0.85)');
            flameGrad.addColorStop(1.0, 'rgba(249, 115, 22, 0)');
            ctx.fillStyle = flameGrad;
            ctx.beginPath();
            ctx.moveTo(ex - 5 * s, -h * 0.05);
            ctx.quadraticCurveTo(ex, -h * 0.05 + flameLen, ex + 5 * s, -h * 0.05);
            ctx.closePath();
            ctx.fill();
            ctx.restore();
          });
        }

        // (3) 四輪深黑性能胎
        ctx.fillStyle = '#12151a';
        // 左前輪與右前輪
        ctx.beginPath();
        ctx.roundRect(-w * 0.49, -h * 0.82, 10 * s, 24 * s, 3 * s);
        ctx.roundRect( w * 0.39, -h * 0.82, 10 * s, 24 * s, 3 * s);
        // 左後輪與右後輪
        ctx.roundRect(-w * 0.50, -h * 0.28, 12 * s, 26 * s, 3 * s);
        ctx.roundRect( w * 0.38, -h * 0.28, 12 * s, 26 * s, 3 * s);
        ctx.fill();

        // (4) 銀白色流線跑車主車身 (左側帶夕陽橘金暖光反射，右側為冷銀灰立體陰影，與圖片一致)
        const bodyGrad = ctx.createLinearGradient(-w * 0.52, -h * 0.6, w * 0.52, -h * 0.3);
        bodyGrad.addColorStop(0.00, '#f3a66f'); // 左側夕陽金橘反光邊
        bodyGrad.addColorStop(0.22, '#e5cfc2'); // 暖銀白過渡
        bodyGrad.addColorStop(0.50, '#d5dae0'); // 珍珠銀白主色
        bodyGrad.addColorStop(0.78, '#adb4be'); // 右側冷銀灰
        bodyGrad.addColorStop(1.00, '#7c8490'); // 右側背光深銀灰

        ctx.fillStyle = bodyGrad;
        ctx.beginPath();
        // 圓潤流線車頭前緣
        ctx.moveTo(-w * 0.34, -h * 0.94);
        ctx.quadraticCurveTo(0, -h * 0.99, w * 0.34, -h * 0.94);
        // 右側前葉子板與收腰車門
        ctx.bezierCurveTo(w * 0.48, -h * 0.86, w * 0.45, -h * 0.62, w * 0.43, -h * 0.48);
        // 右後寬體輪拱與車尾收束
        ctx.bezierCurveTo(w * 0.52, -h * 0.34, w * 0.50, -h * 0.14, w * 0.42, -h * 0.06);
        // 車尾平緩弧線
        ctx.quadraticCurveTo(0, -h * 0.02, -w * 0.42, -h * 0.06);
        // 左後寬體輪拱與收腰車門
        ctx.bezierCurveTo(-w * 0.50, -h * 0.14, -w * 0.52, -h * 0.34, -w * 0.43, -h * 0.48);
        ctx.bezierCurveTo(-w * 0.45, -h * 0.62, -w * 0.48, -h * 0.86, -w * 0.34, -h * 0.94);
        ctx.closePath();
        ctx.fill();

        // 左後葉子板夕陽強烈暖橘金受光塊面 (完全還原圖片車身左側橘金反光)
        const leftSunsetPatch = ctx.createLinearGradient(-w * 0.48, -h * 0.55, -w * 0.18, -h * 0.25);
        leftSunsetPatch.addColorStop(0, 'rgba(244, 150, 90, 0.85)');
        leftSunsetPatch.addColorStop(0.6, 'rgba(244, 165, 110, 0.35)');
        leftSunsetPatch.addColorStop(1, 'rgba(255, 255, 255, 0)');
        ctx.fillStyle = leftSunsetPatch;
        ctx.beginPath();
        ctx.moveTo(-w * 0.44, -h * 0.62);
        ctx.quadraticCurveTo(-w * 0.24, -h * 0.48, -w * 0.26, -h * 0.18);
        ctx.lineTo(-w * 0.45, -h * 0.16);
        ctx.quadraticCurveTo(-w * 0.50, -h * 0.38, -w * 0.44, -h * 0.62);
        ctx.closePath();
        ctx.fill();

        // 右後葉子板立體折線陰影面 (還原圖片車尾右側深灰折線)
        ctx.fillStyle = 'rgba(105, 113, 126, 0.68)';
        ctx.beginPath();
        ctx.moveTo(w * 0.28, -h * 0.44);
        ctx.quadraticCurveTo(w * 0.48, -h * 0.32, w * 0.44, -h * 0.14);
        ctx.lineTo(w * 0.24, -h * 0.16);
        ctx.closePath();
        ctx.fill();

        // (5) 水滴型全黑全景玻璃車頂與後擋風玻璃 (Teardrop Black Glass Canopy，圖片核心特徵)
        const canopyGrad = ctx.createLinearGradient(-w * 0.28, -h * 0.88, w * 0.25, -h * 0.28);
        canopyGrad.addColorStop(0.00, '#4a3531'); // 左緣微映夕陽暖色
        canopyGrad.addColorStop(0.28, '#181a20');
        canopyGrad.addColorStop(0.65, '#0b0d11');
        canopyGrad.addColorStop(1.00, '#07080b');

        ctx.fillStyle = canopyGrad;
        ctx.beginPath();
        // 前擋上緣寬弧
        ctx.moveTo(-w * 0.26, -h * 0.86);
        ctx.quadraticCurveTo(0, -h * 0.91, w * 0.26, -h * 0.86);
        // 向車尾優雅收窄成水滴梯形
        ctx.bezierCurveTo(w * 0.27, -h * 0.64, w * 0.20, -h * 0.42, w * 0.15, -h * 0.29);
        ctx.quadraticCurveTo(0, -h * 0.27, -w * 0.15, -h * 0.29);
        ctx.bezierCurveTo(-w * 0.20, -h * 0.42, -w * 0.27, -h * 0.64, -w * 0.26, -h * 0.86);
        ctx.closePath();
        ctx.fill();

        // 左右兩側深色狹長側窗 (Side Windows)
        ctx.fillStyle = '#14171d';
        // 左側窗
        ctx.beginPath();
        ctx.moveTo(-w * 0.31, -h * 0.78);
        ctx.lineTo(-w * 0.27, -h * 0.50);
        ctx.lineTo(-w * 0.35, -h * 0.46);
        ctx.quadraticCurveTo(-w * 0.38, -h * 0.64, -w * 0.31, -h * 0.78);
        ctx.closePath();
        ctx.fill();

        // 右側窗
        ctx.beginPath();
        ctx.moveTo(w * 0.31, -h * 0.78);
        ctx.lineTo(w * 0.27, -h * 0.50);
        ctx.lineTo(w * 0.35, -h * 0.46);
        ctx.quadraticCurveTo(w * 0.38, -h * 0.64, w * 0.31, -h * 0.78);
        ctx.closePath();
        ctx.fill();

        // 車頂玻璃中央縱向微高光分線 (如圖片車頂細節)
        ctx.strokeStyle = 'rgba(255, 255, 255, 0.14)';
        ctx.lineWidth = 1.2 * s;
        ctx.beginPath();
        ctx.moveTo(0, -h * 0.88);
        ctx.lineTo(0, -h * 0.30);
        ctx.stroke();

        // (6) 車尾深炭灰下擾流保險桿 (Dark Rear Diffuser Bumper)
        ctx.fillStyle = '#25282e';
        ctx.beginPath();
        ctx.moveTo(-w * 0.43, -h * 0.14);
        ctx.quadraticCurveTo(0, -h * 0.11, w * 0.43, -h * 0.14);
        ctx.lineTo(w * 0.40, -h * 0.05);
        ctx.quadraticCurveTo(0, -h * 0.01, -w * 0.40, -h * 0.05);
        ctx.closePath();
        ctx.fill();

        // 下擾流底部黑色擴散器與雙分流鰭片
        ctx.fillStyle = '#111317';
        ctx.beginPath();
        ctx.roundRect(-w * 0.32, -h * 0.08, w * 0.64, 6.5 * s, 2 * s);
        ctx.fill();
        ctx.fillRect(-w * 0.22, -h * 0.03, 3.5 * s, 5 * s);
        ctx.fillRect( w * 0.19, -h * 0.03, 3.5 * s, 5 * s);

        // (7) 貫穿式細長紅色 LED 尾燈條 (Continuous Horizontal Red Taillight Bar，如圖片車尾)
        const isBraking = state.brakeTimer > 0;
        ctx.strokeStyle = isBraking ? '#ff1e38' : '#b92b2b';
        ctx.lineWidth = (isBraking ? 4.2 : 3.0) * s;
        if (isBraking) {
          ctx.shadowColor = '#ff1e38';
          ctx.shadowBlur = 14 * s;
        }
        ctx.beginPath();
        ctx.moveTo(-w * 0.38, -h * 0.17);
        ctx.quadraticCurveTo(0, -h * 0.145, w * 0.38, -h * 0.17);
        ctx.stroke();
        ctx.shadowBlur = 0;

        ctx.restore();
      }

      // ======================== HUD 更新與流程控制 ========================
      function updateQuestionTimerUI() {
        const ratio = Math.max(0, Math.min(1, state.questionTimeLeft / QUESTION_DURATION));
        qTimerBar.style.transform = `scaleX(${ratio})`;

        // 隨剩餘時間自動由綠 -> 黃橘 -> 紅變色
        if (ratio > 0.5) {
          qTimerBar.style.background = 'linear-gradient(90deg, #00e676 0%, #69f0ae 100%)';
          qTimerBar.style.boxShadow = '0 0 12px rgba(0, 230, 118, 0.85)';
        } else if (ratio > 0.25) {
          qTimerBar.style.background = 'linear-gradient(90deg, #ffab00 0%, #ffea00 100%)';
          qTimerBar.style.boxShadow = '0 0 12px rgba(255, 214, 0, 0.85)';
        } else {
          qTimerBar.style.background = 'linear-gradient(90deg, #ff1744 0%, #ff5252 100%)';
          qTimerBar.style.boxShadow = '0 0 14px rgba(255, 23, 68, 0.95)';
        }
      }

      function updateHudUI() {
        raceTimeVal.textContent = state.raceTimeLeft.toFixed(1);
        if (state.raceTimeLeft <= 5.0 && state.phase === 'RACING') {
          raceTimeVal.classList.add('urgent');
        } else {
          raceTimeVal.classList.remove('urgent');
        }

        // 到達終點時 (FINISHING / ENDED) 保持顯示衝線時的最後速度，不因終點後減速而歸零
        if (state.phase === 'FINISHING' || state.phase === 'ENDED') {
          speedVal.textContent = state.finalSpeed;
        } else {
          speedVal.textContent = Math.round(state.currentSpeed);
        }
      }

      function showCountdownBanner(text) {
        countdownBanner.className = 'countdown-banner';
        void countdownBanner.offsetWidth;
        countdownBanner.textContent = text;
        countdownBanner.classList.add('pop');
      }

      // 起跑倒數 3 -> 2 -> 1 -> START!
      function startRaceFlow() {
        sound.init();
        // 遊戲開始前（倒數期間）整體遊戲音量降低 50%，倒數提示音維持原音量
        sound.setGameVolumeMultiplier(0.5);
        sound.startEngineAtSpeed(INITIAL_SPEED);
        if (document.activeElement && typeof document.activeElement.blur === 'function') {
          document.activeElement.blur();
        }
        countdownTimers.forEach((tid) => clearTimeout(tid));
        countdownTimers = [];

        startModal.classList.add('hidden');
        resultModal.classList.add('hidden');
        questionCockpit.classList.add('hidden');
        hudSpeedometer.classList.remove('hidden');
        hudTimeBadge.classList.remove('hidden');

        state.phase = 'COUNTDOWN';
        state.raceTimeLeft = GAME_DURATION;
        state.questionTimeLeft = QUESTION_DURATION;
        state.targetSpeed = INITIAL_SPEED;
        state.currentSpeed = INITIAL_SPEED;
        state.finalSpeed = INITIAL_SPEED;
        state.topSpeed = INITIAL_SPEED;
        state.correctCount = 0;
        state.wrongCount = 0;
        state.combo = 0;
        state.finishGateZ = -1;
        state.finishSoundPlayed = false;
        state.hoverFactor = 0;
        state.skidMarks = [];
        qAnswerSlot.textContent = '?';
        updateHudUI();
        updateQuestionTimerUI();

        const steps = ['3', '2', '1', 'START!'];
        steps.forEach((label, idx) => {
          const tid = setTimeout(() => {
            showCountdownBanner(label);
            sound.playCountdownBeep(label === 'START!');
            if (label === 'START!') {
              // 倒數完畢正式起跑，將遊戲整體音量調整回 100% 原本大小
              sound.setGameVolumeMultiplier(1.0);
              state.phase = 'RACING';
              state.currentSpeed = INITIAL_SPEED;
              state.finalSpeed = INITIAL_SPEED;
              generateQuestion();
              questionCockpit.classList.remove('hidden');
            }
          }, idx * 700);
          countdownTimers.push(tid);
        });
      }

      function showResultScreen() {
        state.phase = 'ENDED';
        // 遊戲結束後，降低整體音量輸出 50%
        sound.setGameVolumeMultiplier(0.5);
        questionCockpit.classList.add('hidden');
        resCorrect.textContent = `${state.correctCount} 題`;
        resWrong.textContent = `${state.wrongCount} 題`;
        resTopSpeed.textContent = `${Math.round(state.topSpeed)} km/h`;
        resultModal.classList.remove('hidden');
      }

      // ======================== 主遊戲迴圈 (60fps 更新與渲染) ========================
      let lastTime = performance.now();

      function gameLoop(now) {
        const dt = Math.min(0.05, (now - lastTime) / 1000);
        lastTime = now;

        if (state.phase === 'RACING') {
          state.currentSpeed += (state.targetSpeed - state.currentSpeed) * Math.min(1, dt * 7);
          if (state.targetSpeed === 0 && state.currentSpeed < 0.8) {
            state.currentSpeed = 0;
          }
          state.finalSpeed = Math.round(state.targetSpeed);
          state.raceTimeLeft = Math.max(0, state.raceTimeLeft - dt);

          if (!state.inputLocked) {
            state.questionTimeLeft -= dt;
            if (state.questionTimeLeft <= 0) {
              state.questionTimeLeft = 0;
              handleWrongOrTimeout(true);
            }
            updateQuestionTimerUI();
          }

          if (state.raceTimeLeft <= 0) {
            state.finalSpeed = Math.round(state.targetSpeed);
            state.currentSpeed = state.targetSpeed;
            state.inputLocked = true;
            state.finishSoundPlayed = true;
            sound.playFinishFanfare();
            showResultScreen();
          }
        } else if (state.phase === 'ENDED') {
          // 通關後遊戲畫面持續進行，維持遊戲結束前的車速與行駛狀態
          state.currentSpeed = state.targetSpeed;
        }

        if (state.nitroTimer > 0) state.nitroTimer = Math.max(0, state.nitroTimer - dt);
        if (state.brakeTimer > 0) state.brakeTimer = Math.max(0, state.brakeTimer - dt);

        // 當車子時速 >= 300 時，平滑升空離開路面約 5 米並噴出白煙；若低於 300 則平滑降回原本貼地狀態
        const wantHover = state.targetSpeed >= 300 ? 1.0 : 0.0;
        state.hoverFactor += (wantHover - state.hoverFactor) * Math.min(1, dt * 5.5);
        if (state.hoverFactor < 0.005) state.hoverFactor = 0;
        if (state.hoverFactor > 0.995) state.hoverFactor = 1;
        floatingFeedback.style.top = state.hoverFactor > 0.3 ? '25%' : '40%';

        // 依據目前的速度，再將畫面行進的速度感提升兩倍 (由 / 60 提升為 / 30)
        state.roadScroll += (state.currentSpeed / 30) * dt;

        for (let i = state.skidMarks.length - 1; i >= 0; i--) {
          const skid = state.skidMarks[i];
          skid.z += (state.currentSpeed / 60) * dt;
          skid.alpha -= dt * 0.7;
          if (skid.z > 1.15 || skid.alpha <= 0) {
            state.skidMarks.splice(i, 1);
          }
        }

        updateHudUI();

        // 畫面渲染
        ctx.clearRect(0, 0, cw, ch);
        drawCoastalSunsetEnvironment();
        drawWindingCoastalRoadAndCliffs();

        // 路上只剩玩家的銀白色跑車
        drawPlayerSilverSportsCar();

        requestAnimationFrame(gameLoop);
      }

      // ======================== 雙重操作綁定 (觸控/滑鼠 + 電腦實體鍵盤) ========================
      function flashKeyVisual(buttonEl) {
        if (!buttonEl) return;
        buttonEl.classList.add('pressed');
        setTimeout(() => buttonEl.classList.remove('pressed'), 110);
      }

      digitButtons.forEach((btn) => {
        btn.addEventListener('pointerdown', (e) => {
          e.preventDefault();
          const digit = btn.getAttribute('data-digit');
          flashKeyVisual(btn);
          handleDigitInput(digit);
        });
      });

      window.addEventListener('keydown', (e) => {
        if (e.repeat) return;

        if (e.key >= '0' && e.key <= '9') {
          e.preventDefault();
          const targetBtn = document.querySelector(`.mech-key[data-digit="${e.key}"]`);
          flashKeyVisual(targetBtn);
          handleDigitInput(e.key);
        } else if (e.key === 'Backspace' || e.key === 'Delete' || e.key === 'Escape') {
          e.preventDefault();
          handleClearInput();
        } else if (e.code === 'Space' || e.key === ' ' || e.key === 'Spacebar' || e.key === 'Enter') {
          if (state.phase === 'IDLE' || state.phase === 'ENDED' || state.phase === 'FINISHING') {
            e.preventDefault();
            startRaceFlow();
          }
        }
      });

      startRaceBtn.addEventListener('click', startRaceFlow);
      replayBtn.addEventListener('click', startRaceFlow);

      requestAnimationFrame(gameLoop);
    })();
  </script>
</body>
</html>
