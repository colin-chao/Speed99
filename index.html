<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>極速九九：海岸夕陽超跑賽 (Sunset Coastal 9x9 Racing)</title>
  <style>
    :root {
      --cabinet-max-w: 480px;
      --neon-red: #ff1e42;
      --neon-cyan: #00f0ff;
      --neon-amber: #ffaa00;
      --neon-green: #00e676;
      --metal-dark: #141619;
      --metal-mid: #22262c;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
      -webkit-touch-callout: none;
      touch-action: manipulation;
    }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: radial-gradient(circle at 50% 25%, #2b1d28 0%, #12131a 60%, #07080c 100%);
      font-family: 'Segoe UI', 'Roboto', 'PingFang TC', 'Microsoft JhengHei', sans-serif;
      color: #ffffff;
      display: flex;
      justify-content: center;
      align-items: flex-start;
    }

    /* 街機直向容器：設定為 9:16.5 長寬比、高度 97.5dvh 置頂對齊，讓遊戲畫面放大 10% 且鍵盤下方留有安全邊距不碰觸網址列 */
    .arcade-cabinet {
      position: relative;
      width: 100%;
      max-width: min(var(--cabinet-max-w), calc(97.5dvh * 9 / 16.5));
      aspect-ratio: 9 / 16.5;
      height: 97.5dvh;
      max-height: 97.5dvh;
      display: flex;
      flex-direction: column;
      background: #0a0b0e;
      box-shadow:
        0 0 60px rgba(0, 0, 0, 0.95),
        0 0 25px rgba(255, 110, 40, 0.2),
        inset 0 0 2px rgba(255, 255, 255, 0.18);
      overflow: hidden;
    }

    @media (min-width: 500px) {
      html, body {
        align-items: center;
      }
      .arcade-cabinet {
        max-width: min(var(--cabinet-max-w), calc(97.5dvh * 9 / 16.5));
        max-height: 97.5dvh;
        border-left: 3px solid #282c37;
        border-right: 3px solid #282c37;
      }
    }

    /* ================= 上半部：海岸夕陽彎道賽道區 (放大 10% 遊戲畫面高度) ================= */
    .viewport-section {
      position: relative;
      width: 100%;
      height: 62.5%;
      flex-shrink: 0;
      overflow: hidden;
      background: #e8682a;
    }

    #raceCanvas {
      width: 100%;
      height: 100%;
      display: block;
    }

    /* 答錯或超時紅光閃爍警示遮罩 */
    .damage-flash {
      position: absolute;
      inset: 0;
      pointer-events: none;
      background: radial-gradient(circle, rgba(255, 0, 35, 0) 40%, rgba(255, 0, 45, 0.65) 100%);
      opacity: 0;
      transition: opacity 0.15s ease-out;
      z-index: 6;
    }
    .damage-flash.active {
      opacity: 1;
    }

    /* 答對加速暖金/青光外框 */
    .boost-flash {
      position: absolute;
      inset: 0;
      pointer-events: none;
      background: radial-gradient(circle, rgba(255, 200, 80, 0) 50%, rgba(255, 190, 50, 0.36) 100%);
      opacity: 0;
      transition: opacity 0.2s ease-out;
      z-index: 6;
    }
    .boost-flash.active {
      opacity: 1;
    }

    /* ================= HUD 儀表板：右上角時速表 & 題目左上角剩餘時間 ================= */
    .hud-speedometer {
      position: absolute;
      top: 26px;
      right: 16px;
      z-index: 14;
      pointer-events: none;
      display: flex;
      flex-direction: column;
      align-items: flex-end;
      padding: 14px 12px 4px 36px;
      transition: opacity 0.22s ease, transform 0.22s ease;
    }

    .hud-speedometer.hidden,
    .hud-time-badge.hidden {
      opacity: 0;
      pointer-events: none;
    }

    /* 時速表後方半透明轉速弧線與左側速度線 SVG (隨字體放大並同步向下移，避免頂部邊緣裁切) */
    .speedo-bg-svg {
      position: absolute;
      top: -6px;
      right: -6px;
      width: 280px;
      height: 158px;
      pointer-events: none;
      z-index: 0;
      overflow: visible;
    }

    .speedo-main-row {
      position: relative;
      z-index: 1;
      display: flex;
      align-items: baseline;
      justify-content: flex-end;
    }

    .hud-value.speed-val {
      font-family: 'Consolas', 'Courier New', 'Orbitron', monospace;
      font-size: clamp(81px, 21.5vw, 108px);
      font-weight: 900;
      font-style: italic;
      line-height: 0.9;
      letter-spacing: 2px;
      color: #fde047;
      transform: skewX(-6deg);
      paint-order: stroke fill;
      -webkit-text-stroke: 2px #b91c1c;
      text-shadow:
        0 0 10px #ff2a00,
        0 0 22px #dc2626,
        0 0 36px rgba(220, 38, 38, 0.88),
        0 5px 10px rgba(0, 0, 0, 0.7);
    }

    .speedo-unit {
      position: relative;
      z-index: 1;
      margin-top: 4px;
      margin-right: 4px;
      font-family: 'Consolas', 'Courier New', monospace;
      font-size: clamp(20px, 5.2vw, 27px);
      font-weight: 900;
      font-style: italic;
      letter-spacing: 1.5px;
      color: #fde047;
      transform: skewX(-6deg);
      paint-order: stroke fill;
      -webkit-text-stroke: 1px #b91c1c;
      text-shadow:
        0 0 8px #ff2a00,
        0 0 16px #dc2626,
        0 2px 6px rgba(0, 0, 0, 0.75);
    }

    /* 題目欄位左上方的剩餘時間膠囊框 (向上拉開與題目欄的距離，確保不壓到題目欄) */
    .hud-time-badge {
      position: absolute;
      bottom: 104px;
      left: max(12px, calc(50% - 215px));
      z-index: 15;
      pointer-events: none;
      background: linear-gradient(180deg, rgba(22, 26, 34, 0.94) 0%, rgba(10, 12, 17, 0.98) 100%);
      border: 1.5px solid rgba(255, 255, 255, 0.16);
      border-top: 1.5px solid rgba(255, 255, 255, 0.28);
      border-radius: 10px;
      padding: 5px 12px;
      box-shadow:
        0 6px 16px rgba(0, 0, 0, 0.78),
        inset 0 1px 1px rgba(255, 255, 255, 0.15);
      display: flex;
      align-items: baseline;
      gap: 6px;
      transition: opacity 0.22s ease, transform 0.22s ease;
    }

    .time-badge-label {
      font-family: 'Segoe UI', 'Arial Narrow', sans-serif;
      font-size: clamp(15px, 4vw, 19px);
      font-weight: 800;
      letter-spacing: 0.8px;
      color: #fde047;
      text-shadow: 0 0 8px rgba(250, 204, 21, 0.45);
    }

    .hud-value.time-val {
      font-family: 'Consolas', 'Courier New', monospace;
      font-size: clamp(20px, 5.4vw, 25px);
      font-weight: 900;
      line-height: 1;
      letter-spacing: 1px;
      color: #a3e635;
      text-shadow:
        0 0 10px rgba(132, 204, 22, 0.85),
        0 0 20px rgba(101, 163, 13, 0.45);
    }

    .hud-value.time-val.urgent {
      color: #ff3b5c;
      text-shadow: 0 0 14px rgba(255, 30, 66, 0.9);
      animation: pulseText 0.45s infinite alternate;
    }

    .hud-unit {
      font-family: 'Consolas', 'Courier New', sans-serif;
      font-size: clamp(15px, 4vw, 19px);
      font-weight: 800;
      color: #86efac;
      text-shadow: 0 0 8px rgba(134, 239, 172, 0.65);
    }

    /* 題目與 5 秒倒數動態進度條區：置於畫面中間、緊鄰下方數字鍵盤上方，放大且高對比顯眼 */
    .question-cockpit {
      position: absolute;
      bottom: 6px;
      left: 50%;
      transform: translateX(-50%);
      width: calc(100% - 24px);
      max-width: 430px;
      z-index: 14;
      pointer-events: none;
      background: linear-gradient(180deg, rgba(15, 18, 30, 0.92) 0%, rgba(7, 9, 16, 0.96) 100%);
      border: 2px solid rgba(255, 215, 0, 0.82);
      border-radius: 14px;
      padding: 6px 16px 8px;
      box-shadow:
        0 10px 28px rgba(0, 0, 0, 0.85),
        0 0 22px rgba(255, 190, 0, 0.35),
        inset 0 1px 2px rgba(255, 255, 255, 0.35);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 5px;
      transition: opacity 0.18s ease, transform 0.18s ease;
    }

    .question-cockpit.hidden {
      opacity: 0;
      transform: translateX(-50%) scale(0.92);
      pointer-events: none;
    }

    .question-display {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      font-family: 'Consolas', 'Courier New', monospace;
      font-size: clamp(32px, 8.5vw, 44px);
      font-weight: 900;
      letter-spacing: 2px;
      color: #fffbeb;
      text-shadow:
        0 0 16px rgba(255, 210, 60, 0.75),
        0 4px 10px rgba(0, 0, 0, 0.95);
    }

    .question-display .op-sign {
      color: #ffaa00;
    }

    .answer-slot {
      min-width: 82px;
      padding: 1px 14px;
      border-radius: 10px;
      background: rgba(0, 240, 255, 0.18);
      border: 2.5px solid #00f0ff;
      color: #00f0ff;
      text-align: center;
      box-shadow: 0 0 18px rgba(0, 240, 255, 0.45), inset 0 0 10px rgba(0, 240, 255, 0.25);
      transition: transform 0.1s ease, border-color 0.15s ease, color 0.15s ease;
    }

    .answer-slot.correct {
      border-color: #00e676;
      color: #00e676;
      background: rgba(0, 230, 118, 0.18);
      transform: scale(1.08);
    }

    .answer-slot.wrong {
      border-color: #ff1e42;
      color: #ff1e42;
      background: rgba(255, 30, 66, 0.2);
      animation: shakeSlot 0.25s ease;
    }

    /* 5秒變色倒數進度條 (不顯示秒數文字) */
    .q-timer-wrap {
      width: 100%;
      display: flex;
      align-items: center;
    }

    .q-timer-track {
      width: 100%;
      height: 10px;
      background: rgba(255, 255, 255, 0.14);
      border-radius: 999px;
      overflow: hidden;
      box-shadow: inset 0 1px 4px rgba(0, 0, 0, 0.9);
      padding: 1px;
    }

    .q-timer-bar {
      height: 100%;
      width: 100%;
      border-radius: 999px;
      background: linear-gradient(90deg, #00e676 0%, #69f0ae 100%);
      box-shadow: 0 0 12px rgba(0, 230, 118, 0.85);
      transform-origin: left center;
      transition: background 0.15s linear, box-shadow 0.15s linear;
    }

    /* 汽車正上方震撼速度增減提示 (+25 km/h 綠色 / -25 km/h 紅色) */
    .floating-feedback {
      position: absolute;
      left: 50%;
      top: 40%;
      transform: translate(-50%, -50%);
      display: flex;
      align-items: baseline;
      justify-content: center;
      gap: 6px;
      font-family: 'Segoe UI', 'Impact', 'Arial Black', sans-serif;
      font-weight: 900;
      font-style: italic;
      white-space: nowrap;
      pointer-events: none;
      opacity: 0;
      z-index: 18;
    }

    .floating-feedback .fb-num {
      font-size: clamp(46px, 12vw, 64px);
      line-height: 1;
      letter-spacing: 1px;
    }

    .floating-feedback .fb-unit {
      font-size: clamp(16px, 4.2vw, 22px);
      font-weight: 800;
      letter-spacing: 0.5px;
    }

    /* 答對：震撼亮綠色 +25 km/h (顯示時間延長至 1 秒) */
    .floating-feedback.show-boost {
      color: #00ff88;
      -webkit-text-stroke: 2px #004d26;
      text-shadow:
        0 0 18px rgba(0, 230, 118, 0.95),
        0 0 34px rgba(0, 200, 83, 0.75),
        0 6px 14px rgba(0, 0, 0, 0.95);
      animation: impactPop 1.0s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }

    /* 答錯或超時：震撼亮紅色 -25 km/h 或 請加油！ (顯示時間延長至 1 秒) */
    .floating-feedback.show-slow {
      color: #ff2a4b;
      -webkit-text-stroke: 2px #5a000e;
      text-shadow:
        0 0 18px rgba(255, 23, 68, 0.98),
        0 0 36px rgba(255, 0, 43, 0.8),
        0 6px 14px rgba(0, 0, 0, 0.95);
      animation: impactPop 1.0s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }

    /* 「請加油！」三字等距排列樣式（使用與 -25 完全相同粗細的邊框與陰影） */
    .floating-feedback .fb-cheer {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-family: "Arial Black", "Microsoft JhengHei", "PingFang TC", "Noto Sans TC", sans-serif;
      font-size: clamp(44px, 11.5vw, 60px);
      font-weight: 900;
      font-style: normal;
      line-height: 1;
      color: #ff2a4b;
      -webkit-text-stroke: 2px #5a000e;
      text-shadow:
        0 0 18px rgba(255, 23, 68, 0.98),
        0 0 36px rgba(255, 0, 43, 0.8),
        0 6px 14px rgba(0, 0, 0, 0.95);
    }

    .floating-feedback .fb-cheer .cheer-char {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 1.18em;
      text-align: center;
    }

    /* 「請」與「加」距離拉近 5%，並消除首字左側多餘留白以利整體水平置中 */
    .floating-feedback .fb-cheer .cheer-char-first {
      margin-left: -0.09em;
      margin-right: -0.06em;
    }

    .floating-feedback .fb-cheer .cheer-char-mid {
      transform: translateX(0.06em);
    }

    /* 驚嘆號緊貼著「油」字，不佔用多餘寬度，確保「請加油!」整個字串精準水平置中 */
    .floating-feedback .fb-cheer .cheer-excl {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: auto;
      margin-left: -0.08em;
      text-align: center;
    }

    /* ================= 下半部：控制面板區 (佔容器 37.5% 高度，放大按鍵與鍵盤間距，且底部不碰觸網址列) ================= */
    .control-section {
      position: relative;
      width: 100%;
      height: 37.5%;
      min-height: 0;
      background:
        repeating-linear-gradient(
          45deg,
          #14171f 0px,
          #14171f 6px,
          #10131a 6px,
          #10131a 12px
        );
      padding: 10px 12px 10px;
      display: flex;
      flex-direction: column;
      justify-content: flex-start;
      box-shadow: inset 0 6px 16px rgba(0, 0, 0, 0.85);
      z-index: 10;
    }

    /* 機械立體數字鍵盤 (稍微放大按鍵並加大按鍵間隔，下方保留安全距離不碰觸網址列) */
    .numpad-grid {
      flex: 1;
      min-height: 0;
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      grid-template-rows: repeat(4, minmax(0, 1fr));
      gap: 10px;
      width: 100%;
    }

    .mech-key {
      position: relative;
      min-height: 0;
      border: none;
      outline: none;
      border-radius: 12px;
      cursor: pointer;
      background: linear-gradient(180deg, #353c4b 0%, #242934 65%, #1b1f28 100%);
      color: #f1f5f9;
      font-family: 'Segoe UI', 'Roboto', monospace;
      font-size: clamp(25px, 6.8vw, 35px);
      line-height: 1;
      font-weight: 900;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      box-shadow:
        0 5px 0 #0d0f14,
        0 7px 12px rgba(0, 0, 0, 0.7),
        inset 0 1px 1px rgba(255, 255, 255, 0.28),
        inset 0 -2px 4px rgba(0, 0, 0, 0.45);
      border: 1px solid #434c5e;
      transition: transform 0.05s ease, box-shadow 0.05s ease, background 0.1s ease;
      -webkit-tap-highlight-color: transparent;
    }

    /* 機械鍵帽頂部金屬高光面 */
    .mech-key::before {
      content: '';
      position: absolute;
      inset: 3px 5px 6px 5px;
      border-radius: 8px;
      background: linear-gradient(180deg, rgba(255, 255, 255, 0.07) 0%, rgba(255, 255, 255, 0) 100%);
      pointer-events: none;
    }

    .mech-key span {
      position: relative;
      z-index: 1;
      text-shadow: 0 2px 4px rgba(0, 0, 0, 0.75);
    }

    .mech-key.key-zero {
      grid-column: 1 / -1;
    }

    /* 按下狀態 (滑鼠點擊、觸控、或實體鍵盤觸發) */
    .mech-key:active,
    .mech-key.pressed {
      transform: translateY(4px);
      background: linear-gradient(180deg, #1e2430 0%, #293140 100%);
      border-color: #00f0ff;
      color: #00f0ff;
      box-shadow:
        0 1px 0 #0d0f14,
        0 2px 5px rgba(0, 0, 0, 0.6),
        0 0 15px rgba(0, 240, 255, 0.45),
        inset 0 2px 6px rgba(0, 0, 0, 0.75);
    }

    /* ================= 起跑與結算彈窗遮罩 ================= */
    .modal-backdrop {
      position: absolute;
      inset: 0;
      z-index: 30;
      background: radial-gradient(circle at 50% 35%, rgba(16, 20, 32, 0.84) 0%, rgba(6, 8, 12, 0.94) 100%);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      padding: 24px;
      text-align: center;
      transition: opacity 0.3s ease;
    }

    .modal-backdrop.hidden {
      opacity: 0;
      pointer-events: none;
    }

    .race-card {
      width: 100%;
      max-width: 390px;
      background: linear-gradient(165deg, #1b202e 0%, #10131c 100%);
      border: 1px solid rgba(255, 255, 255, 0.16);
      border-top: 2px solid var(--neon-red);
      border-radius: 18px;
      padding: 24px 20px;
      box-shadow:
        0 20px 50px rgba(0, 0, 0, 0.85),
        0 0 30px rgba(255, 30, 66, 0.2);
    }

    .badge-tag {
      display: inline-block;
      padding: 4px 12px;
      font-size: 11px;
      font-weight: 800;
      letter-spacing: 2px;
      text-transform: uppercase;
      color: #ffaa00;
      background: rgba(255, 170, 0, 0.14);
      border: 1px solid rgba(255, 170, 0, 0.4);
      border-radius: 999px;
      margin-bottom: 10px;
    }

    .race-title {
      font-size: 28px;
      font-weight: 900;
      font-style: italic;
      letter-spacing: 1px;
      background: linear-gradient(90deg, #ffffff 0%, #fde047 50%, #fb923c 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-bottom: 10px;
    }

    .race-desc {
      font-size: 13.5px;
      line-height: 1.6;
      color: #cbd5e1;
      margin-bottom: 18px;
      text-align: left;
      background: rgba(0, 0, 0, 0.35);
      padding: 12px 14px;
      border-radius: 10px;
      border-left: 3px solid #f97316;
    }

    .race-desc li {
      margin-left: 16px;
      margin-bottom: 4px;
    }

    .cta-btn {
      width: 100%;
      padding: 14px 20px;
      border: none;
      border-radius: 12px;
      cursor: pointer;
      font-size: 18px;
      font-weight: 900;
      font-style: italic;
      letter-spacing: 1.5px;
      color: #ffffff;
      background: linear-gradient(180deg, #ff5722 0%, #d90429 100%);
      box-shadow:
        0 5px 0 #7a0016,
        0 10px 22px rgba(255, 60, 40, 0.5),
        inset 0 1px 1px rgba(255, 255, 255, 0.4);
      transition: transform 0.08s ease, box-shadow 0.08s ease;
    }

    .cta-btn:active {
      transform: translateY(4px);
      box-shadow: 0 1px 0 #7a0016, 0 4px 10px rgba(255, 30, 66, 0.4);
    }

    /* 起跑號誌燈 3-2-1-GO */
    .traffic-lights {
      display: flex;
      justify-content: center;
      gap: 14px;
      margin: 14px 0 18px;
      padding: 10px 18px;
      background: #090b10;
      border-radius: 999px;
      border: 1px solid #2e3440;
      box-shadow: inset 0 2px 6px rgba(0,0,0,0.9);
    }

    .light-bulb {
      width: 24px;
      height: 24px;
      border-radius: 50%;
      background: #222630;
      border: 2px solid #14171f;
      transition: background 0.15s ease, box-shadow 0.15s ease;
    }
    .light-bulb.red {
      background: #ff1e42;
      box-shadow: 0 0 16px #ff1e42;
    }
    .light-bulb.amber {
      background: #ffaa00;
      box-shadow: 0 0 16px #ffaa00;
    }
    .light-bulb.green {
      background: #00e676;
      box-shadow: 0 0 18px #00e676;
    }

    /* 畫面中央倒數大字 */
    .countdown-banner {
      position: absolute;
      inset: 0;
      z-index: 25;
      display: flex;
      justify-content: center;
      align-items: center;
      pointer-events: none;
      font-size: 76px;
      font-weight: 900;
      font-style: italic;
      color: #ffffff;
      text-shadow:
        0 0 25px rgba(255, 90, 30, 0.95),
        0 8px 20px rgba(0, 0, 0, 0.9);
      opacity: 0;
    }

  <script>
    (() => {
      'use strict';

      // ======================== Web Audio API 擬真合成音效引擎 ========================
      class SoundEngine {
        constructor() {
          this.ctx = null;
          this.enabled = true;
          this.distortionCurve = null;

          // 遊戲整體音量總線 (開始前與結束後降為 50%，倒數完恢復 100%；倒數提示音獨立維持 100%)
          this.gameBusGain = null;

          // 持續排氣轟隆聲 (Continuous Exhaust Rumble) 狀態與節點
          this.engineRunning = false;
          this.engineMasterGain = null;
          this.mufflerFilter = null;
          this.exhaustNoiseFilter = null;
          this.chugLfo = null;
          this.chugFilterGain = null;
          this.engineOscs = [];

          // 時速 >= 300 升空時的持續「噗噗」氣流噴射聲節點
          this.hoverJetGain = null;
          this.hoverJetBand = null;
          this.hoverSizzleBand = null;
          this.hoverPuffLfo = null;
        }

        init() {
          if (!this.ctx) {
            const AudioCtx = window.AudioContext || window.webkitAudioContext;
            if (AudioCtx) {
              this.ctx = new AudioCtx();
              this.distortionCurve = this.makeDistortionCurve(55);
              this.gameBusGain = this.ctx.createGain();
              // 遊戲開始前預設降低整體音量輸出 50%
              this.gameBusGain.gain.setValueAtTime(0.5, this.ctx.currentTime);
              this.gameBusGain.connect(this.ctx.destination);
            }
          }
          if (this.ctx && this.ctx.state === 'suspended') {
            this.ctx.resume();
          }
        }

        // 設定整體遊戲音量倍率 (開始前與結束後為 0.5，正式比賽期間為 1.0)
        setGameVolumeMultiplier(mult = 1.0) {
          this.init();
          if (!this.ctx || !this.gameBusGain) return;
          const now = this.ctx.currentTime;
          this.gameBusGain.gain.cancelScheduledValues(now);
          this.gameBusGain.gain.setValueAtTime(this.gameBusGain.gain.value, now);
          this.gameBusGain.gain.linearRampToValueAtTime(mult, now + 0.12);
        }

        makeDistortionCurve(amount = 50) {
          const nSamples = 44100;
          const curve = new Float32Array(nSamples);
          const deg = Math.PI / 180;
          for (let i = 0; i < nSamples; ++i) {
            const x = (i * 2) / nSamples - 1;
            curve[i] = ((3 + amount) * x * 20 * deg) / (Math.PI + amount * Math.abs(x));
          }
          return curve;
        }

        // 計算每一階速度 (25, 50, 75, 100, 125, 150...) 對應的固定排氣基頻 (速度越快頻率越高)
        getStepFrequency(speed) {
          if (speed <= 0) return 0;
          const stepIndex = Math.max(1, Math.round(speed / 25));
          // 第 1 階 (25 km/h) 為 38Hz 低頻轟隆聲，每升一階 (+25 km/h) 依固定音階比例提升約 7.8%
          return Math.min(38 * Math.pow(1.078, stepIndex - 1), 480);
        }

        // 建立並確保車子持續低頻排氣轟隆聲的合成節點已啟動
        ensureContinuousEngine() {
          if (!this.enabled) return;
          this.init();
          if (!this.ctx || this.engineRunning) return;

          const now = this.ctx.currentTime;

          this.engineMasterGain = this.ctx.createGain();
          this.engineMasterGain.gain.setValueAtTime(0.0001, now);

          // 低頻排氣管消音器濾波 (保留渾厚低頻轟隆感，隨轉速微幅開合)
          this.mufflerFilter = this.ctx.createBiquadFilter();
          this.mufflerFilter.type = 'lowpass';
          this.mufflerFilter.Q.setValueAtTime(2.6, now);
          this.mufflerFilter.frequency.setValueAtTime(240, now);

          // 排氣胸腔共鳴增強 (95Hz 低頻飽滿度)
          const bassBoost = this.ctx.createBiquadFilter();
          bassBoost.type = 'peaking';
          bassBoost.frequency.setValueAtTime(95, now);
          bassBoost.Q.setValueAtTime(1.3, now);
          bassBoost.gain.setValueAtTime(6.0, now);

          // 點火脈衝「轟隆隆」振幅調變節點
          const chugAmpNode = this.ctx.createGain();
          chugAmpNode.gain.setValueAtTime(0.82, now);

          this.chugLfo = this.ctx.createOscillator();
          this.chugLfo.type = 'sine';
          this.chugLfo.frequency.setValueAtTime(16, now);

          const chugAmpDepth = this.ctx.createGain();
          chugAmpDepth.gain.setValueAtTime(0.20, now);
          this.chugLfo.connect(chugAmpDepth);
          chugAmpDepth.connect(chugAmpNode.gain);

          this.chugFilterGain = this.ctx.createGain();
          this.chugFilterGain.gain.setValueAtTime(38, now);
          this.chugLfo.connect(this.chugFilterGain);
          this.chugFilterGain.connect(this.mufflerFilter.frequency);
          this.chugLfo.start(now);

          const shaper = this.ctx.createWaveShaper();
          shaper.curve = this.distortionCurve;
          shaper.oversample = '2x';

          shaper.connect(bassBoost);
          bassBoost.connect(this.mufflerFilter);
          this.mufflerFilter.connect(chugAmpNode);
          chugAmpNode.connect(this.engineMasterGain);
          this.engineMasterGain.connect(this.gameBusGain);

          // 構成低頻排氣轟隆聲的多階諧波振盪器 (0.5x 超低頻、1.0x 基頻、1.5x 排氣共鳴、2.0x 倍頻)
          const harmonicSpecs = [
            { ratio: 0.5, type: 'sawtooth', amp: 0.52 },
            { ratio: 1.0, type: 'sawtooth', amp: 0.68 },
            { ratio: 1.5, type: 'triangle', amp: 0.36 },
            { ratio: 2.0, type: 'sawtooth', amp: 0.25 }
          ];

          this.engineOscs = harmonicSpecs.map((spec) => {
            const osc = this.ctx.createOscillator();
            const g = this.ctx.createGain();
            osc.type = spec.type;
            osc.frequency.setValueAtTime(50 * spec.ratio, now);
            g.gain.setValueAtTime(spec.amp, now);
            osc.connect(g);
            g.connect(shaper);
            osc.start(now);
            return { osc, ratio: spec.ratio };
          });

          // 循環低頻排氣氣流轟隆噪聲 (Brown Noise) + 時速 300 升空時的微弱氣流噴射白噪音源
          const bufLen = this.ctx.sampleRate * 2;
          const noiseBuf = this.ctx.createBuffer(1, bufLen, this.ctx.sampleRate);
          const out = noiseBuf.getChannelData(0);
          const airBuf = this.ctx.createBuffer(1, bufLen, this.ctx.sampleRate);
          const airOut = airBuf.getChannelData(0);
          let lastOut = 0.0;
          for (let i = 0; i < bufLen; i++) {
            const white = Math.random() * 2 - 1;
            out[i] = (lastOut + 0.04 * white) / 1.04;
            lastOut = out[i];
            out[i] *= 2.5;
            // 渾厚低中頻氣團混合氣流噪聲 (營造飽滿的「噗噗」推進氣團質感)
            airOut[i] = out[i] * 0.72 + white * 0.42;
          }
          const noiseSrc = this.ctx.createBufferSource();
          noiseSrc.buffer = noiseBuf;
          noiseSrc.loop = true;

          this.exhaustNoiseFilter = this.ctx.createBiquadFilter();
          this.exhaustNoiseFilter.type = 'bandpass';
          this.exhaustNoiseFilter.Q.setValueAtTime(1.4, now);
          this.exhaustNoiseFilter.frequency.setValueAtTime(160, now);

          const noiseGain = this.ctx.createGain();
          noiseGain.gain.setValueAtTime(0.35, now);

          noiseSrc.connect(this.exhaustNoiseFilter);
          this.exhaustNoiseFilter.connect(noiseGain);
          noiseGain.connect(chugAmpNode);
          noiseSrc.start(now);

          // 建立時速 >= 300 時車底噴射白煙的持續「噗噗」氣流噴射聲 (Continuous "Puff-Puff" Pulse-Jet Thruster)
          const airSrc = this.ctx.createBufferSource();
          airSrc.buffer = airBuf;
          airSrc.loop = true;

          // 1. 「噗 (Puh)」低中頻氣團共鳴主濾波器 (中心約 265Hz，隨每次噴氣脈衝開合)
          this.hoverJetBand = this.ctx.createBiquadFilter();
          this.hoverJetBand.type = 'bandpass';
          this.hoverJetBand.frequency.setValueAtTime(265, now);
          this.hoverJetBand.Q.setValueAtTime(2.1, now);

          // 2. 中頻推進氣柱濾波器 (中心約 760Hz，表現噴射氣流的空氣推力感)
          this.hoverSizzleBand = this.ctx.createBiquadFilter();
          this.hoverSizzleBand.type = 'bandpass';
          this.hoverSizzleBand.frequency.setValueAtTime(760, now);
          this.hoverSizzleBand.Q.setValueAtTime(1.6, now);

          const jetMidGain = this.ctx.createGain();
          jetMidGain.gain.setValueAtTime(0.68, now);

          // 3. 氣動低頻「噗」鼓動振盪器 (疊加微弱 68Hz 氣壓震波，強化「噗、噗、噗」的噴射彈性)
          const puffThumpOsc = this.ctx.createOscillator();
          const puffThumpGain = this.ctx.createGain();
          puffThumpOsc.type = 'triangle';
          puffThumpOsc.frequency.setValueAtTime(68, now);
          puffThumpGain.gain.setValueAtTime(0.26, now);
          puffThumpOsc.connect(puffThumpGain);
          puffThumpOsc.start(now);

          // 溫暖低通修飾 (切除刺耳高頻「ㄘㄘ」聲，保留渾厚紮實的「噗噗」氣流噴射聲)
          const puffLowpass = this.ctx.createBiquadFilter();
          puffLowpass.type = 'lowpass';
          puffLowpass.frequency.setValueAtTime(1380, now);
          puffLowpass.Q.setValueAtTime(0.9, now);

          // 4. 產生連續「噗-噗-噗-噗」噴射律動的深度脈衝調變 (10.5Hz ~ 13.5Hz)
          const puffPulseNode = this.ctx.createGain();
          puffPulseNode.gain.setValueAtTime(0.52, now);

          this.hoverPuffLfo = this.ctx.createOscillator();
          const puffLfoAmp = this.ctx.createGain();
          const puffLfoFreq1 = this.ctx.createGain();
          const puffLfoFreq2 = this.ctx.createGain();
          const puffLfoThump = this.ctx.createGain();

          this.hoverPuffLfo.type = 'sine';
          this.hoverPuffLfo.frequency.setValueAtTime(10.5, now); // 每秒約 10.5 次「噗噗」快速連續脈動

          puffLfoAmp.gain.setValueAtTime(0.46, now);   // 振幅在 0.06 ~ 0.98 間深幅收放，形成明顯「噗噗」感且不中斷
          puffLfoFreq1.gain.setValueAtTime(130, now);  // 隨每一下「噗」同步推高氣團頻率 (135Hz <-> 395Hz)
          puffLfoFreq2.gain.setValueAtTime(280, now);  // 隨每一下「噗」同步推高噴射氣流頻率 (480Hz <-> 1040Hz)
          puffLfoThump.gain.setValueAtTime(22, now);   // 隨每一下「噗」同步產生低頻氣壓彈跳 (46Hz <-> 90Hz)

          this.hoverPuffLfo.connect(puffLfoAmp);
          puffLfoAmp.connect(puffPulseNode.gain);

          this.hoverPuffLfo.connect(puffLfoFreq1);
          puffLfoFreq1.connect(this.hoverJetBand.frequency);

          this.hoverPuffLfo.connect(puffLfoFreq2);
          puffLfoFreq2.connect(this.hoverSizzleBand.frequency);

          this.hoverPuffLfo.connect(puffLfoThump);
          puffLfoThump.connect(puffThumpOsc.frequency);

          this.hoverPuffLfo.start(now);

          this.hoverJetGain = this.ctx.createGain();
          this.hoverJetGain.gain.setValueAtTime(0.0001, now);

          airSrc.connect(this.hoverJetBand);
          this.hoverJetBand.connect(puffLowpass);

          airSrc.connect(this.hoverSizzleBand);
          this.hoverSizzleBand.connect(jetMidGain);
          jetMidGain.connect(puffLowpass);

          puffThumpGain.connect(this.hoverJetBand);

          puffLowpass.connect(puffPulseNode);
          puffPulseNode.connect(this.hoverJetGain);
          this.hoverJetGain.connect(this.gameBusGain);
          airSrc.start(now);

          this.engineRunning = true;
        }

        // 依據目前時速是否 >= 300，平滑啟閉車底「噗噗」氣流噴射聲
        updateHoverJetSound(speed) {
          if (!this.ctx || !this.hoverJetGain || !this.hoverJetBand || !this.hoverSizzleBand || !this.hoverPuffLfo) return;
          const now = this.ctx.currentTime;
          this.hoverJetGain.gain.cancelScheduledValues(now);
          const curVal = Math.max(0.0001, this.hoverJetGain.gain.value);
          this.hoverJetGain.gain.setValueAtTime(curVal, now);

          if (speed >= 300) {
            const speedOver = Math.max(0, speed - 300);
            const puffRate = Math.min(14.5, 10.5 + speedOver * 0.025);
            const bodyPitch = Math.min(360, 265 + speedOver * 0.55);
            const jetPitch = Math.min(1050, 760 + speedOver * 1.6);

            this.hoverPuffLfo.frequency.cancelScheduledValues(now);
            this.hoverPuffLfo.frequency.setTargetAtTime(puffRate, now, 0.12);
            this.hoverJetBand.frequency.cancelScheduledValues(now);
            this.hoverJetBand.frequency.setTargetAtTime(bodyPitch, now, 0.12);
            this.hoverSizzleBand.frequency.cancelScheduledValues(now);
            this.hoverSizzleBand.frequency.setTargetAtTime(jetPitch, now, 0.12);

            // 升空後維持清晰而有彈性的「噗噗」氣流噴射聲
            this.hoverJetGain.gain.linearRampToValueAtTime(0.115, now + 0.08);
            this.hoverJetGain.gain.linearRampToValueAtTime(0.092, now + 0.28);
          } else {
            this.hoverJetGain.gain.exponentialRampToValueAtTime(0.0001, now + 0.30);
          }
        }

        // 設定持續排氣聲為指定速度對應的固定頻率 (供起跑時以 125 km/h 啟動)
        startEngineAtSpeed(speed = 125) {
          if (!this.enabled) return;
          this.ensureContinuousEngine();
          if (!this.ctx || !this.engineRunning) return;

          const now = this.ctx.currentTime;
          if (speed <= 0) {
            this.engineMasterGain.gain.cancelScheduledValues(now);
            this.engineMasterGain.gain.setTargetAtTime(0.0001, now, 0.08);
            return;
          }

          const baseFreq = this.getStepFrequency(speed);
          this.engineOscs.forEach(({ osc, ratio }) => {
            osc.frequency.cancelScheduledValues(now);
            osc.frequency.setValueAtTime(baseFreq * ratio, now);
          });

          this.chugLfo.frequency.cancelScheduledValues(now);
          this.chugLfo.frequency.setValueAtTime(Math.min(52, baseFreq * 0.32), now);

          this.mufflerFilter.frequency.cancelScheduledValues(now);
          this.mufflerFilter.frequency.setValueAtTime(Math.min(1800, baseFreq * 4.8), now);

          this.exhaustNoiseFilter.frequency.cancelScheduledValues(now);
          this.exhaustNoiseFilter.frequency.setValueAtTime(Math.min(900, baseFreq * 3.2), now);

          this.engineMasterGain.gain.cancelScheduledValues(now);
          this.engineMasterGain.gain.setValueAtTime(Math.max(0.001, this.engineMasterGain.gain.value), now);
          this.engineMasterGain.gain.linearRampToValueAtTime(0.145, now + 0.15);

          this.updateHoverJetSound(speed);
        }

        // 從時速 0 到 25 km/h：播放汽車啟動馬達與點火發動聲，隨後進入 25 km/h 的持續低頻轟隆聲
        playIgnitionFromZeroTo25() {
          if (!this.enabled) return;
          this.ensureContinuousEngine();
          if (!this.ctx || !this.engineRunning) return;

          const now = this.ctx.currentTime;
          const target25Freq = this.getStepFrequency(25); // 38 Hz

          // (A) 0.00s ~ 0.34s：啟動馬達運轉聲 ("啾-啾-啾" 壓縮衝程啟動音)
          const crankDur = 0.34;
          const starterOsc = this.ctx.createOscillator();
          const starterMod = this.ctx.createOscillator();
          const starterModGain = this.ctx.createGain();
          const starterFilter = this.ctx.createBiquadFilter();
          const starterGain = this.ctx.createGain();

          starterOsc.type = 'sawtooth';
          starterOsc.frequency.setValueAtTime(165, now);
          starterOsc.frequency.linearRampToValueAtTime(215, now + crankDur);

          starterMod.type = 'sine';
          starterMod.frequency.setValueAtTime(10.5, now); // 約 3 次氣缸壓縮脈衝
          starterModGain.gain.setValueAtTime(42, now);
          starterMod.connect(starterModGain);
          starterModGain.connect(starterOsc.frequency);

          starterFilter.type = 'bandpass';
          starterFilter.frequency.setValueAtTime(480, now);
          starterFilter.Q.setValueAtTime(2.5, now);

          starterGain.gain.setValueAtTime(0.01, now);
          starterGain.gain.linearRampToValueAtTime(0.14, now + 0.03);
          starterGain.gain.setValueAtTime(0.13, now + crankDur - 0.04);
          starterGain.gain.exponentialRampToValueAtTime(0.001, now + crankDur);

          starterOsc.connect(starterFilter);
          starterFilter.connect(starterGain);
          starterGain.connect(this.gameBusGain);

          starterOsc.start(now);
          starterMod.start(now);
          starterOsc.stop(now + crankDur);
          starterMod.stop(now + crankDur);

          // (B) 0.32s ~ 0.85s：點火成功瞬間的排氣爆發轟鳴 ("轟——！" 拉起後回落至 25 km/h 怠速轟隆頻率)
          const catchTime = now + 0.30;
          const flareFreq = target25Freq * 1.85;

          this.engineOscs.forEach(({ osc, ratio }) => {
            osc.frequency.cancelScheduledValues(now);
            osc.frequency.setValueAtTime(22 * ratio, now);
            osc.frequency.setValueAtTime(26 * ratio, catchTime);
            osc.frequency.exponentialRampToValueAtTime(flareFreq * ratio, catchTime + 0.18);
            osc.frequency.exponentialRampToValueAtTime(target25Freq * ratio, catchTime + 0.55);
          });

          this.chugLfo.frequency.cancelScheduledValues(now);
          this.chugLfo.frequency.setValueAtTime(8, now);
          this.chugLfo.frequency.linearRampToValueAtTime(22, catchTime + 0.18);
          this.chugLfo.frequency.linearRampToValueAtTime(target25Freq * 0.32, catchTime + 0.55);

          this.mufflerFilter.frequency.cancelScheduledValues(now);
          this.mufflerFilter.frequency.setValueAtTime(140, now);
          this.mufflerFilter.frequency.exponentialRampToValueAtTime(460, catchTime + 0.18);
          this.mufflerFilter.frequency.exponentialRampToValueAtTime(target25Freq * 4.8, catchTime + 0.55);

          this.exhaustNoiseFilter.frequency.cancelScheduledValues(now);
          this.exhaustNoiseFilter.frequency.setValueAtTime(target25Freq * 3.2, catchTime);

          this.engineMasterGain.gain.cancelScheduledValues(now);
          this.engineMasterGain.gain.setValueAtTime(0.001, now);
          this.engineMasterGain.gain.setValueAtTime(0.01, catchTime);
          this.engineMasterGain.gain.linearRampToValueAtTime(0.22, catchTime + 0.14);
          this.engineMasterGain.gain.linearRampToValueAtTime(0.145, catchTime + 0.55);
        }

        // 1. 答對加速：若從 0->25 播放發動聲；否則將持續排氣轟隆聲升頻至下一階固定頻率並持續聲響
        shiftUpEngine(prevSpeed, newSpeed) {
          if (!this.enabled) return;
          this.ensureContinuousEngine();
          if (!this.ctx || !this.engineRunning) return;

          if (prevSpeed <= 0) {
            this.playIgnitionFromZeroTo25();
            return;
          }

          const now = this.ctx.currentTime;
          const prevFreq = this.getStepFrequency(prevSpeed);
          const newFreq = this.getStepFrequency(newSpeed);
          const flareFreq = newFreq * 1.15; // 換檔補油瞬間微幅拉轉後穩定在下一階固定頻率

          // 持續排氣轟隆聲升頻至下一階固定頻率，並保持持續發聲
          this.engineOscs.forEach(({ osc, ratio }) => {
            osc.frequency.cancelScheduledValues(now);
            osc.frequency.setValueAtTime(prevFreq * ratio, now);
            osc.frequency.exponentialRampToValueAtTime(flareFreq * ratio, now + 0.22);
            osc.frequency.exponentialRampToValueAtTime(newFreq * ratio, now + 0.50);
          });

          this.chugLfo.frequency.cancelScheduledValues(now);
          this.chugLfo.frequency.setValueAtTime(Math.min(52, prevFreq * 0.32), now);
          this.chugLfo.frequency.linearRampToValueAtTime(Math.min(56, newFreq * 0.32), now + 0.45);

          const prevCut = Math.min(1800, prevFreq * 4.8);
          const flareCut = Math.min(2200, flareFreq * 5.6);
          const newCut = Math.min(1800, newFreq * 4.8);

          this.mufflerFilter.frequency.cancelScheduledValues(now);
          this.mufflerFilter.frequency.setValueAtTime(prevCut, now);
          this.mufflerFilter.frequency.exponentialRampToValueAtTime(flareCut, now + 0.22);
          this.mufflerFilter.frequency.exponentialRampToValueAtTime(newCut, now + 0.50);

          this.exhaustNoiseFilter.frequency.cancelScheduledValues(now);
          this.exhaustNoiseFilter.frequency.setValueAtTime(Math.min(900, newFreq * 3.2), now + 0.3);

          // 升頻瞬間排氣聲浪微幅澎湃後維持穩定持續音量
          this.engineMasterGain.gain.cancelScheduledValues(now);
          this.engineMasterGain.gain.setValueAtTime(0.145, now);
          this.engineMasterGain.gain.linearRampToValueAtTime(0.20, now + 0.18);
          this.engineMasterGain.gain.linearRampToValueAtTime(0.145, now + 0.52);

          this.updateHoverJetSound(newSpeed);
        }

        // 2. 答錯或超時減速：伴隨煞車聲播放明顯的引擎降頻聲，並將持續排氣聲降至下一階頻率 (若降至 0 則停止聲音)
        shiftDownEngine(prevSpeed, newSpeed) {
          if (!this.enabled) return;
          this.ensureContinuousEngine();
          if (!this.ctx || !this.engineRunning) return;
          if (prevSpeed <= 0) return;

          const now = this.ctx.currentTime;
          const prevFreq = this.getStepFrequency(prevSpeed);
          this.updateHoverJetSound(newSpeed);

          if (newSpeed <= 0) {
            // 速度由 25 降至 0：播放引擎轉速滑落熄火降頻聲，並將持續排氣聲完全停止
            const stopFreq = 18;
            this.engineOscs.forEach(({ osc, ratio }) => {
              osc.frequency.cancelScheduledValues(now);
              osc.frequency.setValueAtTime(prevFreq * ratio, now);
              osc.frequency.exponentialRampToValueAtTime(stopFreq * ratio, now + 0.55);
            });

            this.chugLfo.frequency.cancelScheduledValues(now);
            this.chugLfo.frequency.setValueAtTime(prevFreq * 0.32, now);
            this.chugLfo.frequency.linearRampToValueAtTime(5, now + 0.55);

            this.mufflerFilter.frequency.cancelScheduledValues(now);
            this.mufflerFilter.frequency.setValueAtTime(prevFreq * 4.8, now);
            this.mufflerFilter.frequency.exponentialRampToValueAtTime(75, now + 0.55);

            this.engineMasterGain.gain.cancelScheduledValues(now);
            this.engineMasterGain.gain.setValueAtTime(0.16, now);
            this.engineMasterGain.gain.exponentialRampToValueAtTime(0.0001, now + 0.58);

            this.playDownshiftSweep(prevFreq, stopFreq, 0.58);
          } else {
            // 速度降至下一階 (> 0)：播放明顯降頻聲，並讓持續排氣轟隆聲降至新速度的固定頻率持續響起
            const newFreq = this.getStepFrequency(newSpeed);

            this.engineOscs.forEach(({ osc, ratio }) => {
              osc.frequency.cancelScheduledValues(now);
              osc.frequency.setValueAtTime(prevFreq * ratio, now);
              osc.frequency.exponentialRampToValueAtTime(newFreq * 0.92 * ratio, now + 0.36);
              osc.frequency.exponentialRampToValueAtTime(newFreq * ratio, now + 0.58);
            });

            this.chugLfo.frequency.cancelScheduledValues(now);
            this.chugLfo.frequency.setValueAtTime(Math.min(52, prevFreq * 0.32), now);
            this.chugLfo.frequency.linearRampToValueAtTime(Math.min(52, newFreq * 0.32), now + 0.50);

            const prevCut = Math.min(1800, prevFreq * 4.8);
            const newCut = Math.min(1800, newFreq * 4.8);
            this.mufflerFilter.frequency.cancelScheduledValues(now);
            this.mufflerFilter.frequency.setValueAtTime(prevCut, now);
            this.mufflerFilter.frequency.exponentialRampToValueAtTime(newCut, now + 0.50);

            this.exhaustNoiseFilter.frequency.cancelScheduledValues(now);
            this.exhaustNoiseFilter.frequency.setValueAtTime(Math.min(900, newFreq * 3.2), now + 0.3);

            this.engineMasterGain.gain.cancelScheduledValues(now);
            this.engineMasterGain.gain.setValueAtTime(0.16, now);
            this.engineMasterGain.gain.linearRampToValueAtTime(0.145, now + 0.55);

            this.playDownshiftSweep(prevFreq, newFreq, 0.55);
          }
        }

        // 輔助：減速時的引擎檔位降頻滑落聲 ("嗚——↘" 低頻收油減速聲浪)
        playDownshiftSweep(fromFreq, toFreq, dur = 0.55) {
          if (!this.ctx) return;
          const now = this.ctx.currentTime;

          const osc = this.ctx.createOscillator();
          const subOsc = this.ctx.createOscillator();
          const filter = this.ctx.createBiquadFilter();
          const gain = this.ctx.createGain();

          osc.type = 'sawtooth';
          osc.frequency.setValueAtTime(fromFreq * 2.0, now);
          osc.frequency.exponentialRampToValueAtTime(Math.max(20, toFreq * 1.6), now + dur);

          subOsc.type = 'triangle';
          subOsc.frequency.setValueAtTime(fromFreq, now);
          subOsc.frequency.exponentialRampToValueAtTime(Math.max(15, toFreq * 0.85), now + dur);

          filter.type = 'lowpass';
          filter.Q.setValueAtTime(2.2, now);
          filter.frequency.setValueAtTime(Math.min(1200, fromFreq * 6.5), now);
          filter.frequency.exponentialRampToValueAtTime(Math.max(110, toFreq * 3.8), now + dur);

          gain.gain.setValueAtTime(0.01, now);
          gain.gain.linearRampToValueAtTime(0.14, now + 0.04);
          gain.gain.exponentialRampToValueAtTime(0.001, now + dur);

          osc.connect(filter);
          subOsc.connect(filter);
          filter.connect(gain);
          gain.connect(this.gameBusGain);

          osc.start(now);
          subOsc.start(now);
          osc.stop(now + dur + 0.02);
          subOsc.stop(now + dur + 0.02);
        }

        playKeyClick(digit = 5) {
          if (!this.enabled) return;
          this.init();
          if (!this.ctx) return;

          const now = this.ctx.currentTime;
          const osc = this.ctx.createOscillator();
          const gain = this.ctx.createGain();
          osc.type = 'triangle';
          osc.frequency.setValueAtTime(520 + Number(digit) * 28, now);
          osc.frequency.exponentialRampToValueAtTime(190, now + 0.045);

          gain.gain.setValueAtTime(0.16, now);
          gain.gain.exponentialRampToValueAtTime(0.001, now + 0.045);

          osc.connect(gain);
          gain.connect(this.gameBusGain);
          osc.start(now);
          osc.stop(now + 0.05);
        }

        // 2. 答錯或超時音效：擬真輪胎摩擦柏油地面的急煞聲 (移除尖銳合成器音，改為厚實橡膠胎塊磨地聲「嚓——嘶——」)
        playBrakeWarning() {
          if (!this.enabled) return;
          this.init();
          if (!this.ctx) return;

          const now = this.ctx.currentTime;
          const duration = 0.78;

          const masterBrakeGain = this.ctx.createGain();
          masterBrakeGain.gain.setValueAtTime(0.001, now);
          masterBrakeGain.gain.linearRampToValueAtTime(0.32, now + 0.025);
          masterBrakeGain.gain.setValueAtTime(0.28, now + 0.46);
          masterBrakeGain.gain.exponentialRampToValueAtTime(0.001, now + duration);
          masterBrakeGain.connect(this.gameBusGain);

          // 產生帶有粗礫顆粒感的柏油路面摩擦噪聲
          const bufSize = Math.floor(this.ctx.sampleRate * duration);
          const noiseBuf = this.ctx.createBuffer(1, bufSize, this.ctx.sampleRate);
          const output = noiseBuf.getChannelData(0);
          let b0 = 0, b1 = 0, b2 = 0;
          for (let i = 0; i < bufSize; i++) {
            const white = Math.random() * 2 - 1;
            b0 = 0.99 * b0 + white * 0.12;
            b1 = 0.92 * b1 + white * 0.25;
            b2 = 0.65 * b2 + white * 0.45;
            // 疊加輪胎胎塊與粗糙柏油路面的顆粒摩擦調變
            const treadGrain = 0.72 + 0.28 * Math.sin(i * 0.0042 + Math.sin(i * 0.0009) * 3.0);
            output[i] = (b0 + b1 + b2 + white * 0.35) * 0.45 * treadGrain;
          }

          // 三段輪胎磨地共振頻帶：
          // 1. 低中頻胎皮重壓地面磨擦聲 (360Hz -> 210Hz)
          // 2. 中頻橡膠胎紋抓地磨擦聲 (780Hz -> 490Hz)
          // 3. 中高頻柏油地面急煞滑行嘶聲 (1580Hz -> 1080Hz)
          const bands = [
            { fStart: 360,  fEnd: 210,  q: 1.6, amp: 0.65 },
            { fStart: 780,  fEnd: 490,  q: 2.2, amp: 0.75 },
            { fStart: 1580, fEnd: 1080, q: 3.0, amp: 0.45 }
          ];

          bands.forEach((b) => {
            const src = this.ctx.createBufferSource();
            src.buffer = noiseBuf;

            const filter = this.ctx.createBiquadFilter();
            filter.type = 'bandpass';
            filter.frequency.setValueAtTime(b.fStart, now);
            filter.frequency.exponentialRampToValueAtTime(b.fEnd, now + duration);
            filter.Q.setValueAtTime(b.q, now);

            const g = this.ctx.createGain();
            g.gain.setValueAtTime(b.amp, now);

            src.connect(filter);
            filter.connect(g);
            g.connect(masterBrakeGain);
            src.start(now);
            src.stop(now + duration);
          });
        }

        // 起跑倒數提示音：直接連至 destination，維持原本 100% 音量不受 50% 衰減影響
        playCountdownBeep(isGo = false) {
          if (!this.enabled) return;
          this.init();
          if (!this.ctx) return;

          const now = this.ctx.currentTime;
          const osc = this.ctx.createOscillator();
          const gain = this.ctx.createGain();
          osc.type = 'square';
          osc.frequency.setValueAtTime(isGo ? 880 : 440, now);

          gain.gain.setValueAtTime(0.15, now);
          gain.gain.exponentialRampToValueAtTime(0.001, now + (isGo ? 0.35 : 0.18));

          osc.connect(gain);
          gain.connect(this.ctx.destination);
          osc.start(now);
          osc.stop(now + (isGo ? 0.36 : 0.19));
        }

        // 3. 到達終點衝線音效：熱烈群眾歡呼與掌聲
        playFinishFanfare() {
          if (!this.enabled) return;
          this.init();
          if (!this.ctx) return;

          const now = this.ctx.currentTime;
          const duration = 2.8;
          const sampleRate = this.ctx.sampleRate;
          const bufSize = Math.floor(sampleRate * duration);

          const crowdBuffer = this.ctx.createBuffer(2, bufSize, sampleRate);
          for (let ch = 0; ch < 2; ch++) {
            const output = crowdBuffer.getChannelData(ch);
            let b0 = 0, b1 = 0, b2 = 0, b3 = 0, b4 = 0, b5 = 0, b6 = 0;
            for (let i = 0; i < bufSize; i++) {
              const white = Math.random() * 2 - 1;
              b0 = 0.99886 * b0 + white * 0.0555179;
              b1 = 0.99332 * b1 + white * 0.0750759;
              b2 = 0.96900 * b2 + white * 0.1538520;
              b3 = 0.86650 * b3 + white * 0.3104856;
              b4 = 0.55000 * b4 + white * 0.5329522;
              b5 = -0.7616 * b5 - white * 0.0168980;
              output[i] = (b0 + b1 + b2 + b3 + b4 + b5 + b6 + white * 0.5362) * 0.05;
              b6 = white * 0.115926;
            }
          }

          const formants = [
            { startF: 420, peakF: 680, endF: 520, q: 3.2, amp: 0.45 },
            { startF: 880, peakF: 1320, endF: 1050, q: 3.8, amp: 0.38 },
            { startF: 1850, peakF: 2450, endF: 2000, q: 4.2, amp: 0.22 }
          ];

          formants.forEach((f) => {
            const src = this.ctx.createBufferSource();
            src.buffer = crowdBuffer;

            const bp = this.ctx.createBiquadFilter();
            bp.type = 'bandpass';
            bp.Q.setValueAtTime(f.q, now);
            bp.frequency.setValueAtTime(f.startF, now);
            bp.frequency.exponentialRampToValueAtTime(f.peakF, now + 0.55);
            bp.frequency.exponentialRampToValueAtTime(f.endF, now + duration);

            const gain = this.ctx.createGain();
            gain.gain.setValueAtTime(0.001, now);
            gain.gain.linearRampToValueAtTime(f.amp, now + 0.28);
            gain.gain.setValueAtTime(f.amp * 0.92, now + 1.45);
            gain.gain.exponentialRampToValueAtTime(0.001, now + duration);

            src.connect(bp);
            bp.connect(gain);
            gain.connect(this.gameBusGain);
            src.start(now);
            src.stop(now + duration);
          });

          const clapCount = 46;
          for (let i = 0; i < clapCount; i++) {
            const clapTime = now + 0.05 + Math.random() * (duration - 0.35);
            const clapDur = 0.028 + Math.random() * 0.025;

            const clapSrc = this.ctx.createBufferSource();
            clapSrc.buffer = crowdBuffer;

            const clapFilter = this.ctx.createBiquadFilter();
            clapFilter.type = 'bandpass';
            clapFilter.frequency.setValueAtTime(1400 + Math.random() * 1600, clapTime);
            clapFilter.Q.setValueAtTime(1.8, clapTime);

            const fadeOutFactor = Math.max(0.15, 1 - (clapTime - now) / duration);
            const clapGain = this.ctx.createGain();
            clapGain.gain.setValueAtTime(0.001, clapTime);
            clapGain.gain.linearRampToValueAtTime(0.16 * fadeOutFactor, clapTime + 0.005);
            clapGain.gain.exponentialRampToValueAtTime(0.001, clapTime + clapDur);

            clapSrc.connect(clapFilter);
            clapFilter.connect(clapGain);
            clapGain.connect(this.gameBusGain);
            clapSrc.start(clapTime, Math.random() * 1.5, clapDur);
          }

          [0.18, 0.62].forEach((offset, idx) => {
            const wOsc = this.ctx.createOscillator();
            const wGain = this.ctx.createGain();
            const t0 = now + offset;
            wOsc.type = 'sine';
            wOsc.frequency.setValueAtTime(idx === 0 ? 2250 : 2550, t0);
            wOsc.frequency.exponentialRampToValueAtTime(idx === 0 ? 2850 : 2980, t0 + 0.22);
            wOsc.frequency.exponentialRampToValueAtTime(idx === 0 ? 2400 : 2650, t0 + 0.42);

            wGain.gain.setValueAtTime(0.001, t0);
            wGain.gain.linearRampToValueAtTime(0.045, t0 + 0.06);
            wGain.gain.exponentialRampToValueAtTime(0.001, t0 + 0.44);

            wOsc.connect(wGain);
            wGain.connect(this.gameBusGain);
            wOsc.start(t0);
            wOsc.stop(t0 + 0.45);
          });
        }
      }

      const sound = new SoundEngine();

      // ======================== DOM 元素綁定 ========================
      const canvas = document.getElementById('raceCanvas');
      const ctx = canvas.getContext('2d');

      const hudSpeedometer = document.getElementById('hudSpeedometer');
      const hudTimeBadge = document.getElementById('hudTimeBadge');
      const raceTimeVal = document.getElementById('raceTimeVal');
      const speedVal = document.getElementById('speedVal');
      const questionCockpit = document.getElementById('questionCockpit');
      const qFactorA = document.getElementById('qFactorA');
      const qFactorB = document.getElementById('qFactorB');
      const qAnswerSlot = document.getElementById('qAnswerSlot');
      const qTimerBar = document.getElementById('qTimerBar');

      const damageFlash = document.getElementById('damageFlash');
      const boostFlash = document.getElementById('boostFlash');
      const floatingFeedback = document.getElementById('floatingFeedback');
      const countdownBanner = document.getElementById('countdownBanner');

      const startModal = document.getElementById('startModal');
      const resultModal = document.getElementById('resultModal');
      const startRaceBtn = document.getElementById('startRaceBtn');
      const replayBtn = document.getElementById('replayBtn');

      const resCorrect = document.getElementById('resCorrect');
      const resWrong = document.getElementById('resWrong');
      const resTopSpeed = document.getElementById('resTopSpeed');

      const digitButtons = Array.from(document.querySelectorAll('.mech-key[data-digit]'));

      // ======================== 遊戲參數與狀態 ========================
      const GAME_DURATION = 30.0;       // 關卡總時間 30 秒
      const QUESTION_DURATION = 5.0;    // 每題限時 5 秒
      const BASE_MIN_SPEED = 0;         // 最低速度為 0 km/h (車子完全靜止)
      const INITIAL_SPEED = 125;        // 起跑初始時速 (km/h)
      const SPEED_STEP = 25;            // 答對 +25 km/h / 答錯或超時 -25 km/h
      const PLAYER_Z = 0.72;            // 玩家銀白跑車位於畫面最下方馬路上（緊鄰題目框正上方）

      let countdownTimers = [];

      const state = {
        phase: 'IDLE', // IDLE | COUNTDOWN | RACING | FINISHING | ENDED
        raceTimeLeft: GAME_DURATION,
        questionTimeLeft: QUESTION_DURATION,

        targetSpeed: INITIAL_SPEED,
        currentSpeed: INITIAL_SPEED,
        finalSpeed: INITIAL_SPEED,
        topSpeed: INITIAL_SPEED,

        factorA: 7,
        factorB: 8,
        expectedAnswer: '56',
        currentInput: '',
        inputLocked: false,

        correctCount: 0,
        wrongCount: 0,
        combo: 0,

        roadScroll: 0,
        nitroTimer: 0,
        brakeTimer: 0,
        hoverFactor: 0, // 時速 >= 300 時平滑升空懸浮比例 (0 = 貼地, 1 = 離地約5米並噴射白煙)

        skidMarks: [],
        finishGateZ: -1,
        finishSoundPlayed: false
      };

      // ======================== 畫布響應式尺寸調整 ========================
      let cw = 480;
      let ch = 500;
      let dpr = 1;

      function resizeCanvas() {
        dpr = Math.min(window.devicePixelRatio || 1, 2);
        const rect = canvas.parentElement.getBoundingClientRect();
        cw = rect.width;
        ch = rect.height;
        canvas.width = cw * dpr;
        canvas.height = ch * dpr;
        ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      }

      window.addEventListener('resize', resizeCanvas);
      resizeCanvas();

      // ======================== 彎曲單車道海岸公路 3D 透視投影 ========================
      // z: 0 (遠方海岸岬角盡頭) -> 1 (畫面最底端)
      function projectRoad(z, lateralOffset = 0) {
        const horizonY = ch * 0.255;
        const bottomY = ch * 1.03;

        const clampedZ = Math.max(0.001, z);
        const perspectiveZ = Math.pow(clampedZ, 1.48);
        const y = horizonY + (bottomY - horizonY) * perspectiveZ;

        // 重現圖片中的優美 S 型海岸公路曲線：
        // 遠處從海岬 (x ~ 0.47*cw) 向右彎繞山壁 (x ~ 0.62*cw)，再順暢延伸回底部正中央 (x = 0.50*cw)
        // 讓最下方馬路位於題目框正上方且筆直朝向正前方
        const sCurve =
          0.50 +
          0.12 * Math.sin(Math.pow(1 - clampedZ, 0.85) * Math.PI * 1.35) * (1 - Math.pow(clampedZ, 2.2));

        // 隨車速向後流動的微幅動態感 (減號代表由遠方往畫面下方後退)
        const dynamicSway =
          Math.sin(clampedZ * 3.2 - state.roadScroll * 1.4) *
          0.004 *
          (1 - perspectiveZ) *
          Math.min(1.8, state.currentSpeed / 120);

        const centerX = cw * (sCurve + dynamicSway);

        // 單車道寬度 (近大遠小透視)
        const roadTopWidth = cw * 0.022;
        const roadBottomWidth = cw * 0.56;
        const roadWidth = roadTopWidth + (roadBottomWidth - roadTopWidth) * perspectiveZ;

        const x = centerX + lateralOffset * (roadWidth * 0.5);
        const scale = 0.10 + 0.90 * perspectiveZ;

        return { x, y, centerX, roadWidth, scale, perspectiveZ, horizonY };
      }

      // ======================== 題目生成與作答判定邏輯 ========================
      function generateQuestion() {
        let a = Math.floor(Math.random() * 8) + 2;
        let b = Math.floor(Math.random() * 8) + 2;
        if (a === state.factorA && b === state.factorB) {
          b = ((b - 1) % 8) + 2;
        }
        state.factorA = a;
        state.factorB = b;
        state.expectedAnswer = String(a * b);
        state.currentInput = '';
        state.questionTimeLeft = QUESTION_DURATION;
        state.inputLocked = false;

        qFactorA.textContent = a;
        qFactorB.textContent = b;
        qAnswerSlot.textContent = '?';
        qAnswerSlot.classList.remove('correct', 'wrong');
        updateQuestionTimerUI();
      }

      // 在汽車正上方顯示震撼醒目的 +25 km/h (綠) 或 -25 km/h (紅)
      function showSpeedDeltaFeedback(isPositive) {
        floatingFeedback.className = 'floating-feedback';
        void floatingFeedback.offsetWidth;
        const sign = isPositive ? '+' : '-';
        floatingFeedback.innerHTML = `<span class="fb-num">${sign}${SPEED_STEP}</span><span class="fb-unit">km/h</span>`;
        floatingFeedback.classList.add(isPositive ? 'show-boost' : 'show-slow');
      }

      // 速度降至 0 之後，答錯或超時顯示震撼醒目且三字等距、驚嘆號緊貼並整體水平置中的「請加油!」
      function showCheerFeedback() {
        floatingFeedback.className = 'floating-feedback';
        void floatingFeedback.offsetWidth;
        floatingFeedback.innerHTML =
          `<span class="fb-cheer">` +
          `<span class="cheer-char cheer-char-first">請</span>` +
          `<span class="cheer-char cheer-char-mid">加</span>` +
          `<span class="cheer-char">油</span>` +
          `<span class="cheer-excl">!</span>` +
          `</span>`;
        floatingFeedback.classList.add('show-slow');
      }

      function triggerBoostVisual() {
        boostFlash.classList.add('active');
        setTimeout(() => boostFlash.classList.remove('active'), 220);
      }

      function triggerDamageVisual() {
        damageFlash.classList.add('active');
        setTimeout(() => damageFlash.classList.remove('active'), 260);
      }

      function spawnSkidMarks() {
        // 若車輛已升空懸浮離開路面，輪胎不接觸柏油路，不產生路面煞車痕
        if (state.hoverFactor > 0.35) return;
        state.skidMarks.push({
          z: PLAYER_Z + 0.02,
          length: 0.11,
          alpha: 0.82
        });
      }

      function handleCorrectAnswer() {
        state.inputLocked = true;
        state.correctCount++;
        state.combo++;
        const prevSpeed = state.targetSpeed;
        state.targetSpeed += SPEED_STEP;
        if (state.targetSpeed > state.topSpeed) {
          state.topSpeed = state.targetSpeed;
        }
        state.nitroTimer = 0.85;

        qAnswerSlot.classList.add('correct');
        showSpeedDeltaFeedback(true);
        triggerBoostVisual();
        // 答對時：若由 0->25 播放發動聲；否則升頻至下一階固定頻率並持續發出排氣轟隆聲
        sound.shiftUpEngine(prevSpeed, state.targetSpeed);

        setTimeout(() => {
          if (state.phase === 'RACING') {
            generateQuestion();
          }
        }, 120);
      }

      function handleWrongOrTimeout(isTimeout = false) {
        state.inputLocked = true;
        state.wrongCount++;
        state.combo = 0;

        const prevSpeed = state.targetSpeed;
        const isAlreadyAtZero = prevSpeed <= 0;
        state.targetSpeed = Math.max(BASE_MIN_SPEED, prevSpeed - SPEED_STEP);
        state.brakeTimer = 0.65;
        state.nitroTimer = 0;

        // 超時字樣不出現在題目欄位裡；僅在答錯時顯示玩家輸入的錯誤數字
        if (!isTimeout) {
          qAnswerSlot.textContent = state.currentInput;
        }
        qAnswerSlot.classList.add('wrong');

        if (isAlreadyAtZero) {
          // 速度降至 0 之後，答錯或超時不再顯示煞車痕、不顯示 -25 字樣、也不播放煞車音與引擎音，改顯示「請加油！」
          showCheerFeedback();
        } else {
          // 尚有車速時，答錯與超時皆在車子正上方顯示紅色震撼 -25 km/h、留下煞車痕、播放煞車音並伴隨引擎降頻聲 (降至 0 時停止排氣聲)
          showSpeedDeltaFeedback(false);
          spawnSkidMarks();
          sound.playBrakeWarning();
          sound.shiftDownEngine(prevSpeed, state.targetSpeed);
        }

        triggerDamageVisual();

        setTimeout(() => {
          if (state.phase === 'RACING') {
            generateQuestion();
          }
        }, 190);
      }

      function handleDigitInput(digitStr) {
        if (state.phase !== 'RACING' || state.inputLocked) return;

        sound.playKeyClick(digitStr);
        state.currentInput += digitStr;
        qAnswerSlot.textContent = state.currentInput;

        const requiredDigits = state.expectedAnswer.length;
        if (state.currentInput.length >= requiredDigits) {
          if (state.currentInput === state.expectedAnswer) {
            handleCorrectAnswer();
          } else {
            handleWrongOrTimeout(false);
          }
        }
      }

      function handleClearInput() {
        if (state.phase !== 'RACING' || state.inputLocked) return;
        sound.playKeyClick(0);
        state.currentInput = '';
        qAnswerSlot.textContent = '?';
      }

      // ======================== 繪圖引擎 (100% 還原參考圖片之海岸夕陽與彎曲單車道) ========================

      // 1. 繪製夕陽天空、左側落日、海面波光倒影與右側翠綠立體海岸山脈
      function drawCoastalSunsetEnvironment() {
        const horizonY = ch * 0.255;

        // (A) 夕陽暖橘紅至金黃漸層天空
        const skyGrad = ctx.createLinearGradient(0, 0, 0, horizonY);
        skyGrad.addColorStop(0.00, '#e35526');
        skyGrad.addColorStop(0.38, '#f07428');
        skyGrad.addColorStop(0.72, '#f79c34');
        skyGrad.addColorStop(1.00, '#fcc949');
        ctx.fillStyle = skyGrad;
        ctx.fillRect(0, 0, cw, horizonY + 2);

        // 水平幾何晚霞雲帶 (如參考圖)
        ctx.fillStyle = 'rgba(214, 75, 42, 0.65)';
        ctx.beginPath();
        ctx.moveTo(0, horizonY * 0.36);
        ctx.lineTo(cw * 0.16, horizonY * 0.39);
        ctx.lineTo(0, horizonY * 0.42);
        ctx.closePath();
        ctx.fill();

        ctx.fillStyle = 'rgba(222, 85, 45, 0.55)';
        ctx.beginPath();
        ctx.moveTo(cw * 0.40, horizonY * 0.48);
        ctx.lineTo(cw * 0.78, horizonY * 0.42);
        ctx.lineTo(cw * 0.78, horizonY * 0.52);
        ctx.closePath();
        ctx.fill();

        ctx.fillStyle = 'rgba(244, 145, 50, 0.55)';
        ctx.beginPath();
        ctx.moveTo(0, horizonY * 0.62);
        ctx.lineTo(cw * 0.15, horizonY * 0.65);
        ctx.lineTo(0, horizonY * 0.68);
        ctx.closePath();
        ctx.fill();

        ctx.beginPath();
        ctx.moveTo(cw * 0.38, horizonY * 0.60);
        ctx.lineTo(cw * 0.72, horizonY * 0.57);
        ctx.lineTo(cw * 0.72, horizonY * 0.63);
        ctx.closePath();
        ctx.fill();

        // (B) 左側海平線巨大橘紅落日半圓
        const sunX = cw * 0.215;
        const sunY = horizonY;
        const sunRadius = cw * 0.105;

        ctx.save();
        ctx.beginPath();
        ctx.rect(0, 0, cw, horizonY);
        ctx.clip();

        const sunGrad = ctx.createLinearGradient(sunX, sunY - sunRadius, sunX, sunY);
        sunGrad.addColorStop(0.0, '#f05a22');
        sunGrad.addColorStop(0.6, '#f57629');
        sunGrad.addColorStop(1.0, '#f99536');
        ctx.fillStyle = sunGrad;
        ctx.beginPath();
        ctx.arc(sunX, sunY, sunRadius, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();

        // (C) 左側深藍海洋與金色夕陽波光倒影
        const seaGrad = ctx.createLinearGradient(0, horizonY, cw * 0.55, ch);
        seaGrad.addColorStop(0.0, '#446380');
        seaGrad.addColorStop(0.45, '#3b5a78');
        seaGrad.addColorStop(1.0, '#2e4963');
        ctx.fillStyle = seaGrad;
        ctx.fillRect(0, horizonY, cw, ch - horizonY);

        // 海面金色鋸齒波光倒影 (隨時間微幅波光粼粼)
        const shimmerWave = Math.sin(performance.now() * 0.003) * 2.5;
        const reflectGrad = ctx.createLinearGradient(sunX, horizonY, sunX, horizonY + ch * 0.14);
        reflectGrad.addColorStop(0.0, '#fbbd47');
        reflectGrad.addColorStop(0.6, '#f69e3c');
        reflectGrad.addColorStop(1.0, 'rgba(246, 158, 60, 0)');
        ctx.fillStyle = reflectGrad;

        ctx.beginPath();
        const rTopY = horizonY + 1;
        ctx.moveTo(sunX - sunRadius * 0.95, rTopY);
        ctx.lineTo(sunX + sunRadius * 0.95, rTopY);
        ctx.lineTo(sunX + sunRadius * 0.55 + shimmerWave, rTopY + ch * 0.018);
        ctx.lineTo(sunX + sunRadius * 0.88 - shimmerWave, rTopY + ch * 0.032);
        ctx.lineTo(sunX + sunRadius * 0.42 + shimmerWave, rTopY + ch * 0.048);
        ctx.lineTo(sunX + sunRadius * 0.92 - shimmerWave, rTopY + ch * 0.064);
        ctx.lineTo(sunX + sunRadius * 0.18 + shimmerWave, rTopY + ch * 0.082);
        ctx.lineTo(sunX + sunRadius * 0.48, rTopY + ch * 0.098);
        ctx.lineTo(sunX - sunRadius * 0.25, rTopY + ch * 0.112);
        ctx.lineTo(sunX - sunRadius * 0.05, rTopY + ch * 0.085);
        ctx.lineTo(sunX - sunRadius * 0.82 - shimmerWave, rTopY + ch * 0.068);
        ctx.lineTo(sunX - sunRadius * 0.35 + shimmerWave, rTopY + ch * 0.050);
        ctx.lineTo(sunX - sunRadius * 0.92 + shimmerWave, rTopY + ch * 0.034);
        ctx.lineTo(sunX - sunRadius * 0.48 - shimmerWave, rTopY + ch * 0.018);
        ctx.closePath();
        ctx.fill();

        // 海面微細白色波浪線條
        ctx.strokeStyle = 'rgba(215, 232, 248, 0.38)';
        ctx.lineWidth = 1.3;
        const seaLines = [
          { x: 0.05, y: 0.37, len: 0.08 },
          { x: 0.02, y: 0.46, len: 0.11 },
          { x: 0.04, y: 0.58, len: 0.07 },
          { x: 0.18, y: 0.42, len: 0.06 }
        ];
        seaLines.forEach((wl) => {
          ctx.beginPath();
          ctx.moveTo(wl.x * cw, wl.y * ch);
          ctx.quadraticCurveTo((wl.x + wl.len * 0.5) * cw, (wl.y - 0.008) * ch, (wl.x + wl.len) * cw, wl.y * ch);
          ctx.stroke();
        });
      }

      // 2. 繪製海岸岩石、白色浪花、翠綠山坡與彎曲單車道公路
      function drawWindingCoastalRoadAndCliffs() {
        const horizonY = ch * 0.255;
        const steps = 64;
        const leftPoints = [];
        const rightPoints = [];
        const centerPoints = [];

        for (let i = 0; i <= steps; i++) {
          const z = i / steps;
          const pLeft = projectRoad(z, -1);
          const pRight = projectRoad(z, 1);
          const pCenter = projectRoad(z, 0);
          leftPoints.push(pLeft);
          rightPoints.push(pRight);
          centerPoints.push(pCenter);
        }

        // (A) 公路左側：金黃色陽光沙灘與草坡路肩
        // 外側受夕陽照耀的亮金黃色沙灘灣岸 (隨車子前進而向後退)
        const outerBeachGrad = ctx.createLinearGradient(cw * 0.15, horizonY, cw * 0.48, ch);
        outerBeachGrad.addColorStop(0.0, '#fde078');
        outerBeachGrad.addColorStop(0.5, '#f6c453');
        outerBeachGrad.addColorStop(1.0, '#eab042');
        ctx.fillStyle = outerBeachGrad;
        ctx.beginPath();
        ctx.moveTo(cw * 0.34, horizonY);
        for (let i = 0; i <= steps; i++) {
          const z = i / steps;
          const p = leftPoints[i];
          const waveJut = Math.sin(z * 19 - state.roadScroll * 2.2) * (8 * p.scale);
          const cliffWidth = (18 + 68 * Math.pow(z, 1.1)) + waveJut;
          ctx.lineTo(p.x - cliffWidth - 5 * p.scale, p.y);
        }
        ctx.lineTo(cw * 0.5, ch + 10);
        ctx.lineTo(cw * 0.47, horizonY);
        ctx.closePath();
        ctx.fill();

        // 內側暖金黃色沙灘坡面 (與外側亮金沙灘交織出自然海岸沙灘層次)
        const innerBeachGrad = ctx.createLinearGradient(cw * 0.22, horizonY, cw * 0.50, ch);
        innerBeachGrad.addColorStop(0.0, '#f4be52');
        innerBeachGrad.addColorStop(0.5, '#e8a93f');
        innerBeachGrad.addColorStop(1.0, '#d89632');
        ctx.fillStyle = innerBeachGrad;
        ctx.beginPath();
        ctx.moveTo(cw * 0.36, horizonY);
        for (let i = 0; i <= steps; i++) {
          const z = i / steps;
          const p = leftPoints[i];
          const rockJut = Math.sin(z * 15) * (10 * p.scale);
          const cliffWidth = (14 + 58 * Math.pow(z, 1.1)) + rockJut;
          ctx.lineTo(p.x - cliffWidth, p.y);
        }
        ctx.lineTo(leftPoints[steps].x, ch + 10);
        ctx.lineTo(leftPoints[0].x, horizonY);
        ctx.closePath();
        ctx.fill();

        // 左側翠綠草坡路肩 (貼合彎道左緣)
        ctx.fillStyle = '#569434';
        ctx.beginPath();
        ctx.moveTo(leftPoints[0].x - 6, horizonY);
        for (let i = 0; i <= steps; i++) {
          const z = i / steps;
          const p = leftPoints[i];
          const grassW = 8 + 26 * Math.pow(z, 1.2);
          ctx.lineTo(p.x - grassW, p.y);
        }
        for (let i = steps; i >= 0; i--) {
          ctx.lineTo(leftPoints[i].x, leftPoints[i].y);
        }
        ctx.closePath();
        ctx.fill();

        // (B) 公路右側：高聳翠綠立體多邊形海岸山脈與陡峭山壁 (如參考圖右上至右下)
        // 遠方海岬延伸至右上角山峰背景
        ctx.fillStyle = '#3d7927';
        ctx.beginPath();
        ctx.moveTo(cw * 0.33, horizonY);
        ctx.lineTo(cw * 0.46, horizonY * 0.76);
        ctx.lineTo(cw * 0.62, horizonY * 0.56);
        ctx.lineTo(cw * 0.80, horizonY * 0.28);
        ctx.lineTo(cw * 0.96, 0);
        ctx.lineTo(cw, 0);
        ctx.lineTo(cw, ch);
        ctx.lineTo(rightPoints[steps].x, ch);
        for (let i = steps; i >= 0; i--) {
          ctx.lineTo(rightPoints[i].x, rightPoints[i].y);
        }
        ctx.closePath();
        ctx.fill();

        // 山脈受光亮綠坡面與深綠背光稜線多邊形 (重現參考圖的立體塊面感)
        const ridgeFacets = [
          // 遠處海岬亮面
          {
            color: '#5ca138',
            pts: [[0.34, 0.255], [0.46, 0.195], [0.53, 0.22], [0.45, 0.255]]
          },
          // 中景山脊亮面
          {
            color: '#4e8f30',
            pts: [[0.52, 0.22], [0.64, 0.14], [0.76, 0.19], [0.61, 0.29]]
          },
          // 右上主峰深綠背光陡坡
          {
            color: '#2a5a1a',
            pts: [[0.64, 0.14], [0.96, 0.0], [1.0, 0.0], [1.0, 0.42], [0.74, 0.33]]
          },
          // 右側中段受光亮綠山脊
          {
            color: '#529632',
            pts: [[0.72, 0.31], [1.0, 0.15], [1.0, 0.56], [0.80, 0.49]]
          },
          // 右側近景深綠峽谷陰影面
          {
            color: '#234c15',
            pts: [[0.74, 0.44], [1.0, 0.36], [1.0, 0.78], [0.85, 0.72]]
          },
          // 右下近景亮綠斜坡
          {
            color: '#4b8c2e',
            pts: [[0.82, 0.65], [1.0, 0.52], [1.0, 0.95], [0.91, 0.92]]
          }
        ];

        ridgeFacets.forEach((facet) => {
          ctx.fillStyle = facet.color;
          ctx.beginPath();
          facet.pts.forEach(([px, py], idx) => {
            if (idx === 0) ctx.moveTo(px * cw, py * ch);
            else ctx.lineTo(px * cw, py * ch);
          });
          ctx.closePath();
          ctx.fill();
        });

        // 右側緊貼公路的翠綠草坡路肩
        ctx.fillStyle = '#5ca138';
        ctx.beginPath();
        for (let i = 0; i <= steps; i++) {
          const p = rightPoints[i];
          if (i === 0) ctx.moveTo(p.x, p.y);
          else ctx.lineTo(p.x, p.y);
        }
        for (let i = steps; i >= 0; i--) {
          const z = i / steps;
          const p = rightPoints[i];
          const grassW = 6 + 22 * Math.pow(z, 1.2);
          ctx.lineTo(p.x + grassW, p.y);
        }
        ctx.closePath();
        ctx.fill();

        // (C) 繪製彎曲單車道柏油路面主體
        ctx.beginPath();
        for (let i = 0; i <= steps; i++) {
          const p = leftPoints[i];
          if (i === 0) ctx.moveTo(p.x, p.y);
          else ctx.lineTo(p.x, p.y);
        }
        for (let i = steps; i >= 0; i--) {
          const p = rightPoints[i];
          ctx.lineTo(p.x, p.y);
        }
        ctx.closePath();

        // 夕陽映照下的暖灰柏油路漸層 (左側受夕陽暖光，右側偏冷灰)
        const roadGrad = ctx.createLinearGradient(cw * 0.25, horizonY, cw * 0.85, ch);
        roadGrad.addColorStop(0.0, '#9e8d88');
        roadGrad.addColorStop(0.45, '#8a8589');
        roadGrad.addColorStop(1.0, '#757880');
        ctx.fillStyle = roadGrad;
        ctx.fill();

        // (D) 隨車速向後流動 (由遠方往畫面下方移動) 的路面橫向明暗速度帶與路肩反光柱
        for (let i = 0; i < steps; i++) {
          // 使用 i - state.roadScroll，使條紋隨 roadScroll 增加而往 i 變大處 (畫面下方) 移動，呈現馬路往後跑、車子往前衝的正確視覺！
          const scrollOffset = state.roadScroll * 18;
          const phase = Math.floor(((i - scrollOffset) % 2 + 2) % 2);

          if (phase === 0) {
            ctx.fillStyle = 'rgba(255, 245, 235, 0.055)';
            ctx.beginPath();
            ctx.moveTo(leftPoints[i].x, leftPoints[i].y);
            ctx.lineTo(rightPoints[i].x, rightPoints[i].y);
            ctx.lineTo(rightPoints[i + 1].x, rightPoints[i + 1].y);
            ctx.lineTo(leftPoints[i + 1].x, leftPoints[i + 1].y);
            ctx.closePath();
            ctx.fill();
          }

          // 路肩滾動反光柱 (同樣由遠方往畫面下方後退)
          const postPhase = Math.floor(((i - scrollOffset) % 4 + 4) % 4);
          if (postPhase === 0 && i > 4) {
            const s = leftPoints[i].scale;
            const postW = Math.max(1.5, 4.5 * s);
            const postH = Math.max(3, 11 * s);
            ctx.fillStyle = '#f8fafc';
            ctx.fillRect(leftPoints[i].x - postW * 2.2, leftPoints[i].y - postH, postW, postH);
            ctx.fillRect(rightPoints[i].x + postW * 1.2, rightPoints[i].y - postH, postW, postH);
            ctx.fillStyle = '#fb923c';
            ctx.fillRect(leftPoints[i].x - postW * 2.2, leftPoints[i].y - postH, postW, postH * 0.35);
            ctx.fillRect(rightPoints[i].x + postW * 1.2, rightPoints[i].y - postH, postW, postH * 0.35);
          }
        }

        // 單車道左右兩側清晰白色邊線 (如參考圖)
        [-0.88, 0.88].forEach((edgeOffset) => {
          ctx.beginPath();
          for (let i = 0; i <= steps; i++) {
            const z = i / steps;
            const p = projectRoad(z, edgeOffset);
            if (i === 0) ctx.moveTo(p.x, p.y);
            else ctx.lineTo(p.x, p.y);
          }
          ctx.strokeStyle = 'rgba(241, 245, 249, 0.9)';
          ctx.lineWidth = 2.4;
          ctx.stroke();
        });

        // (E) 繪製緊急煞車時的黑色輪胎煞車痕 (貼合彎道中心)
        for (const skid of state.skidMarks) {
          const pStart = projectRoad(Math.max(0.02, skid.z - skid.length), 0);
          const pEnd = projectRoad(Math.min(1.0, skid.z), 0);
          const tireOffset1 = pStart.roadWidth * 0.16;
          const tireOffset2 = pEnd.roadWidth * 0.16;
          const tireW = Math.max(2, 6 * pEnd.scale);

          ctx.strokeStyle = `rgba(20, 22, 26, ${skid.alpha})`;
          ctx.lineWidth = tireW;
          [-1, 1].forEach((side) => {
            ctx.beginPath();
            ctx.moveTo(pStart.x + side * tireOffset1, pStart.y);
            ctx.lineTo(pEnd.x + side * tireOffset2, pEnd.y);
            ctx.stroke();
          });
        }

        // (F) 在靠海岸的路邊（左側草坡路肩），間隔固定距離繪製隨車速往後移動的棕櫚樹
        drawCoastalPalmTrees();
      }

      // 繪製靠海岸路邊的棕櫚樹列（由遠至近排列，與路面滾動完全同步）
      function drawCoastalPalmTrees() {
        const treeCount = 4; // 沿海岸路邊等距分布 4 棵棕櫚樹
        const scrollZ = state.roadScroll * (18 / 64); // 與路面條紋及反光柱完全相同的推進速率
        const treeZList = [];

        for (let k = 0; k < treeCount; k++) {
          const rawZ = ((k / treeCount + scrollZ) % 1 + 1) % 1;
          // 映射至 z: 0.05 (遠方海岬起點) ~ 0.98 (畫面最下方)
          const z = 0.05 + rawZ * 0.93;
          treeZList.push({ z, seed: k });
        }

        // 由遠到近排序，確保近處的棕櫚樹自然覆蓋遠處
        treeZList.sort((a, b) => a.z - b.z);

        for (const item of treeZList) {
          drawSinglePalmTree(item.z, item.seed);
        }
      }

      function drawSinglePalmTree(z, seed) {
        const pLeft = projectRoad(z, -1);
        const s = pLeft.scale;
        if (s < 0.11) return;

        // 樹根立於靠海岸（左側）的草坡路肩上
        const baseX = pLeft.x - (10 + 16 * s);
        const baseY = pLeft.y + 2 * s;

        const trunkH = 118 * s;
        const trunkBaseW = 9.5 * s;
        const trunkTopW = 4.2 * s;

        // 樹幹自然向海風微彎的頂點座標
        const leanX = -14 * s + Math.sin(seed * 2.1) * 4 * s;
        const crownX = baseX + leanX;
        const crownY = baseY - trunkH;
        const ctrlX = baseX + leanX * 0.35;
        const ctrlY = baseY - trunkH * 0.52;

        ctx.save();

        // 1. 夕陽照射在路肩草坡上的棕櫚樹斜長暗影
        ctx.fillStyle = 'rgba(28, 48, 18, 0.38)';
        ctx.beginPath();
        ctx.ellipse(baseX + 12 * s, baseY + 2 * s, 16 * s, 4.5 * s, 0.15, 0, Math.PI * 2);
        ctx.fill();

        // 2. 彎曲棕櫚樹幹 (左側帶夕陽暖金亮邊，右側深棕立體陰影)
        ctx.beginPath();
        ctx.moveTo(baseX - trunkBaseW * 0.5, baseY);
        ctx.quadraticCurveTo(ctrlX - trunkTopW * 0.7, ctrlY, crownX - trunkTopW * 0.5, crownY);
        ctx.lineTo(crownX + trunkTopW * 0.5, crownY);
        ctx.quadraticCurveTo(ctrlX + trunkTopW * 0.7, ctrlY, baseX + trunkBaseW * 0.5, baseY);
        ctx.closePath();

        const trunkGrad = ctx.createLinearGradient(baseX - trunkBaseW, crownY, baseX + trunkBaseW, baseY);
        trunkGrad.addColorStop(0, '#d98a4e'); // 左側夕陽金棕受光面
        trunkGrad.addColorStop(0.45, '#8c5332');
        trunkGrad.addColorStop(1, '#4a2a18'); // 右側背光深褐
        ctx.fillStyle = trunkGrad;
        ctx.fill();

        // 樹幹環狀紋理節點
        ctx.strokeStyle = 'rgba(42, 22, 10, 0.45)';
        ctx.lineWidth = Math.max(0.8, 1.4 * s);
        for (let t = 0.15; t <= 0.88; t += 0.14) {
          const mt = 1 - t;
          const tx = mt * mt * baseX + 2 * mt * t * ctrlX + t * t * crownX;
          const ty = mt * mt * baseY + 2 * mt * t * ctrlY + t * t * crownY;
          const tw = (trunkBaseW * mt + trunkTopW * t) * 0.52;
          ctx.beginPath();
          ctx.moveTo(tx - tw, ty);
          ctx.lineTo(tx + tw, ty + 1.2 * s);
          ctx.stroke();
        }

        // 3. 樹冠頂部椰子果實
        ctx.fillStyle = '#4e2e16';
        [-3.2 * s, 2.5 * s, 0].forEach((ox, idx) => {
          ctx.beginPath();
          ctx.arc(crownX + ox, crownY + (2 + idx * 1.2) * s, 3.2 * s, 0, Math.PI * 2);
          ctx.fill();
        });

        // 4. 放射狀熱帶羽狀棕櫚葉 (7 片展開的弧形大葉片，受夕陽暖綠光澤映照)
        const fronds = [
          { angle: -2.65, len: 52, drop: 18, color: '#4d9129' },
          { angle: -2.15, len: 58, drop: 14, color: '#68ab38' },
          { angle: -1.55, len: 48, drop: 10, color: '#7bc043' },
          { angle: -0.85, len: 54, drop: 13, color: '#589c2f' },
          { angle: -0.25, len: 58, drop: 17, color: '#3b7520' },
          { angle:  0.28, len: 46, drop: 22, color: '#2d5e17' },
          { angle: -3.05, len: 44, drop: 24, color: '#3f7c22' }
        ];

        fronds.forEach((f) => {
          const rad = f.angle;
          const endX = crownX + Math.cos(rad) * f.len * s;
          const endY = crownY + Math.sin(rad) * f.len * 0.65 * s + f.drop * s;
          const midX = crownX + Math.cos(rad) * f.len * 0.52 * s;
          const midY = crownY + Math.sin(rad) * f.len * 0.42 * s - 9 * s;

          // 棕櫚葉受光羽片面
          ctx.fillStyle = f.color;
          ctx.beginPath();
          ctx.moveTo(crownX, crownY);
          ctx.quadraticCurveTo(midX, midY - 7 * s, endX, endY);
          ctx.quadraticCurveTo(midX, midY + 6 * s, crownX, crownY + 2 * s);
          ctx.closePath();
          ctx.fill();

          // 葉脈亮邊
          ctx.strokeStyle = 'rgba(210, 235, 130, 0.45)';
          ctx.lineWidth = Math.max(0.7, 1.3 * s);
          ctx.beginPath();
          ctx.moveTo(crownX, crownY);
          ctx.quadraticCurveTo(midX, midY - 1 * s, endX, endY);
          ctx.stroke();
        });

        ctx.restore();
      }

      // 繪製時速 >= 300 時車底 6 處噴射出的高壓濃密白煙（完全還原參考圖片：車身中段左右斜噴、後輪拱左右斜噴、車尾底部雙管直噴）
      function drawUnderbodyHoverWhiteSmoke(w, h, s, hoverAlpha) {
        if (hoverAlpha <= 0.01) return;
        const nowSec = performance.now() * 0.001;

        // 定義與參考圖片完全對應的 6 組車底白煙噴嘴
        const nozzles = [
          // 1. 左、右車身中段側向斜噴白煙 (由前葉子板後方車底斜向後外方噴射)
          { x0: -w * 0.42, y0: -h * 0.56, dx: -w * 0.64, dy: h * 0.54, baseR: 7 * s, endR: 24 * s, coreLen: 0.38 },
          { x0:  w * 0.42, y0: -h * 0.56, dx:  w * 0.64, dy: h * 0.54, baseR: 7 * s, endR: 24 * s, coreLen: 0.38 },
          // 2. 左、右後輪拱側向斜噴白煙 (由後葉子板下方斜向外後方噴射)
          { x0: -w * 0.45, y0: -h * 0.27, dx: -w * 0.62, dy: h * 0.36, baseR: 8 * s, endR: 25 * s, coreLen: 0.40 },
          { x0:  w * 0.45, y0: -h * 0.27, dx:  w * 0.62, dy: h * 0.36, baseR: 8 * s, endR: 25 * s, coreLen: 0.40 },
          // 3. 車尾底部擴散器左右雙管向下直噴濃烈白煙
          { x0: -w * 0.23, y0: -h * 0.05, dx: -w * 0.05, dy: h * 0.62, baseR: 8.5 * s, endR: 22 * s, coreLen: 0.45 },
